<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Maison Lonvière — salon de coiffure, barbier et beauté à Luxembourg">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c2b39"/>
      <stop offset="46%" stop-color="#7e4c50"/>
      <stop offset="100%" stop-color="#c4614c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c4614c" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#c4614c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#f6f1ea"/>
  <circle cx="1010" cy="150" r="330" fill="url(#glow)"/>
  <rect x="742" y="96" width="330" height="404" fill="url(#art)"/>
  <rect x="700" y="360" width="196" height="174" fill="#dfd0be"/>

  <text x="96" y="150" font-family="Manrope,Helvetica,Arial,sans-serif" font-size="21" font-weight="700"
        letter-spacing="5" fill="#c4614c">COIFFURE · BARBIER · BEAUTÉ · TOILETTAGE</text>

  <text x="96" y="272" font-family="Bodoni Moda,Didot,Georgia,serif" font-size="86" font-weight="600" fill="#2a1d28">Votre place</text>
  <text x="96" y="372" font-family="Bodoni Moda,Didot,Georgia,serif" font-size="86" font-weight="600" font-style="italic" fill="#c4614c">est réservée.</text>

  <text x="96" y="440" font-family="Manrope,Helvetica,Arial,sans-serif" font-size="25" fill="#6b5a66">Rendez-vous en ligne en trente secondes, 7j/7.</text>

  <rect x="96" y="486" width="4" height="52" fill="#2a1d28"/>
  <text x="122" y="512" font-family="Bodoni Moda,Didot,Georgia,serif" font-size="34" font-weight="700" fill="#2a1d28">Maison Lonvière</text>
  <text x="122" y="536" font-family="Manrope,Helvetica,Arial,sans-serif" font-size="16" font-weight="600"
        letter-spacing="3" fill="#6b5a66">LUXEMBOURG · DÉMONSTRATION NS DEVELOPMENT</text>
</svg>
