<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1184" width="860" height="1184"><rect width="860" height="1184" fill="#ffffff"/><text x="60" y="150" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#0b0d0f" text-anchor="start" letter-spacing="0">UN ATELIER,</text><text x="60" y="220" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#0b0d0f" text-anchor="start" letter-spacing="0">TOUTES VOS IMPRESSIONS</text><rect x="60" y="250" width="120" height="8" fill="#e4007c"/><text x="60" y="320.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">Chez KORVEL, un projet ne change pas de main :</text><text x="60" y="351.9" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">le même atelier conseille, prépare vos fichiers,</text><text x="60" y="383.8" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">imprime, contrôle et livre. Des cartes de visite</text><text x="60" y="415.7" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">au covering d'un utilitaire, tout passe</text><text x="60" y="447.6" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">par la même équipe.</text><rect x="60" y="560" width="360" height="200" fill="#009ad8" fill-opacity=".1"/><text x="80" y="610" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#0b0d0f" text-anchor="start" letter-spacing="0">LE CONSEIL</text><text x="80" y="650.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">Le bon papier, le bon format,</text><text x="80" y="674.65" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">avant d'imprimer.</text><rect x="440" y="560" width="360" height="200" fill="#e4007c" fill-opacity=".1"/><text x="460" y="610" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#0b0d0f" text-anchor="start" letter-spacing="0">LA PRÉCISION</text><text x="460" y="650.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">Chaque tirage est contrôlé</text><text x="460" y="674.65" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">à la sortie de presse.</text><rect x="60" y="790" width="360" height="200" fill="#ffe100" fill-opacity=".1"/><text x="80" y="840" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#0b0d0f" text-anchor="start" letter-spacing="0">LA RÉACTIVITÉ</text><text x="80" y="880.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">Un interlocuteur unique,</text><text x="80" y="904.65" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">des délais tenus.</text><rect x="440" y="790" width="360" height="200" fill="#0b0d0f" fill-opacity=".1"/><text x="460" y="840" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#0b0d0f" text-anchor="start" letter-spacing="0">L'ENVIRONNEMENT</text><text x="460" y="880.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">Papiers recyclés et encres</text><text x="460" y="904.65" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#2a3035" text-anchor="start" letter-spacing="0">adaptées sur demande.</text><text x="40" y="1150" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#6b7479">2  ·  KORVEL  ·  Catalogue print</text></svg>