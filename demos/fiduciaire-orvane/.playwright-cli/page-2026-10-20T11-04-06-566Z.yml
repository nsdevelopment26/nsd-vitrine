  - generic [ref=e188]:
    - generic [ref=e189]:
      - paragraph [ref=e190]: Ablauf
      - heading "Drei Schritte, nicht mehr" [level=2] [ref=e441]
      - paragraph [ref=e192]: Ein Wechsel der Treuhandgesellschaft schreckt ab, weil man monatelanges Chaos befürchtet. So läuft es bei uns genau ab.
    - generic [ref=e193]:
      - generic [ref=e194]:
        - generic [ref=e195]: "01"
        - heading "Erstgespräch" [level=3] [ref=e442]
        - paragraph [ref=e197]: Fünfundvierzig Minuten, kostenlos. Sie zeigen Ihre aktuelle Lage und Ihre Unterlagen. Wir sagen, was passt, was fehlt und was es kostet. Kein endloses Angebot.
      - generic [ref=e198]:
        - generic [ref=e199]: "02"
        - heading "Übernahme der Akte" [level=3] [ref=e443]
        - paragraph [ref=e201]: Wir holen Ihre Unterlagen bei Ihrem bisherigen Dienstleister ab, bringen die Buchhaltung auf Stand und legen den Fristenkalender für das Jahr fest.
      - generic [ref=e202]:
        - generic [ref=e203]: "03"
        - heading "Monatliche Betreuung" [level=3] [ref=e444]
        - paragraph [ref=e205]: Sie reichen Ihre Belege ein, wir buchen. Jeden Monat ein klarer Überblick und ein Ansprechpartner, der am selben Tag antwortet.
