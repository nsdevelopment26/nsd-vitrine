function jourLong(j) {
  const [a, m, d] = j.split('-').map(Number); const dt = new Date(a, m - 1, d);
  return JOURS_LONG[dt.getDay()] + ' ' + d + ' ' + MOIS[m - 1] + (a !== new Date().getFullYear() ? ' ' + a : '');
}
function decalerJour(j, n) { const [a, m, d] = j.split('-').map(Number); const dt = new Date(a, m - 1, d + n); return fmt(dt).slice(0, 10); }

// ---------------------------------------------------------------------------
// Relances des devis (26/10/2026, demandé par Nelson). Chaque événement d'un devis vit dans
// l'onglet « Relances devis » du Sheets : Envoi, Relance (canal), Réponse, Pause (motif + reprise).
// Prochaine relance : 3 jours après le dernier contact (envoi, relance ou réponse), sauf une pause
// motivée posée depuis, qui la repousse à sa date de reprise. Seul un devis « envoyé » se relance.
// ---------------------------------------------------------------------------
const RELANCE_JOURS = 3;
function suiviDevis(d) {
  const ev = (S.data.relancesDevis || []).filter(r => r.devis === d.id).sort((a, b) => a.date.localeCompare(b.date));
  const envoi = ev.find(r => r.type === 'Envoi');
  const debut = envoi ? envoi.date : String(d.date_emission || '').slice(0, 10) + ' 09:00';
  const contacts = ev.filter(r => r.type === 'Relance' || r.type === 'Réponse');
  const dernier = contacts.length ? contacts[contacts.length - 1].date : debut;
  const pauses = ev.filter(r => r.type === 'Pause' && r.date >= dernier);
  const pause = pauses.length ? pauses[pauses.length - 1] : null;
  const prochaine = pause ? pause.reprise : decalerJour(dernier.slice(0, 10), RELANCE_JOURS);
  const auj = aujourdhui();
  const ouvert = d.statut === 'envoyé';
  const etat = !ouvert ? 'clos' : prochaine <= auj ? (pause ? 'reprise' : 'retard') : pause ? 'pause' : 'prevu';
  const jours = Math.round((new Date(auj) - new Date(prochaine)) / 864e5);
  return { ev, debut, dernier, pause, prochaine, etat, jours, relances: ev.filter(r => r.type === 'Relance').length };
}
const jourCourt = j => { const d = new Date(j + 'T12:00'); return JOURS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
function etatRelance(sv) {
  if (sv.etat === 'retard') return { cls: 'retard', txt: sv.jours > 0 ? 'À relancer, en retard de ' + sv.jours + ' j' : 'À relancer aujourd’hui' };
  if (sv.etat === 'reprise') return { cls: 'retard', txt: 'Pause finie : à relancer' };
  if (sv.etat === 'pause') return { cls: 'pause', txt: 'En pause jusqu’au ' + jourCourt(sv.prochaine) };
  if (sv.etat === 'prevu') return { cls: 'prevu', txt: 'Relance le ' + jourCourt(sv.prochaine) };
  return { cls: 'clos', txt: 'Plus de relance' };
}
function devisARelancer() {
  const F = typeof Factu !== 'undefined' && Factu.donnees ? Factu.donnees() : null;
  if (!F || !F.session || !F.pret) return [];
  return F.devis.filter(d => d.statut === 'envoyé').map(d => ({ d, sv: suiviDevis(d) }))
    .filter(x => x.sv.etat === 'retard' || x.sv.etat === 'reprise').sort((a, b) => a.sv.prochaine.localeCompare(b.sv.prochaine));
}
function barreJour() {
  const auj = aujourdhui(), j = S.jour;
  const ecart = Math.round((new Date(j) - new Date(auj)) / 864e5);
  const rel = ecart === 0 ? 'Aujourd’hui' : ecart === -1 ? 'Hier' : ecart === 1 ? 'Demain' : ecart < 0 ? 'Il y a ' + (-ecart) + ' jours' : 'Dans ' + ecart + ' jours';
  return `<div class="jourbar">
    <button class="fleche" data-action="jour" data-n="-1" aria-label="Jour précédent">‹</button>
    <label class="jour-choix"><b>${esc(jourLong(j))}</b><small>${rel} · changer de date</small>
      <input type="date" id="jour-date" value="${j}" aria-label="Choisir une date"></label>
    <button class="fleche" data-action="jour" data-n="1" aria-label="Jour suivant">›</button>
  </div>
  ${ecart !== 0 ? '<button class="retour-auj" data-action="jour-auj">Revenir à aujourd’hui</button>' : ''}`;
}
// Le journal d'un jour : en mémoire (120 derniers jours), sinon demandé au Sheets.
function journalDe(j) {
  if (S.journeesChargees[j]) return S.journeesChargees[j];
  const limite = S.data.journal.reduce((m, e) => e.date < m ? e.date : m, aujourdhui());
  if (j >= limite.slice(0, 10)) return S.data.journal.filter(e => e.date.startsWith(j) || String(e.rappel).startsWith(j));
  appel('api_journee', S.pin, j).then(r => { S.journeesChargees[j] = r; if (S.vue === 'jour' && S.jour === j) rendre(); })
    .catch(e => toast(e.message || String(e), true));
  return null;
}
function bilanJour(entrees) {
  const appels = RES_APPEL();
  const faits = entrees.filter(e => appels.includes(e.resultat));
  const n = f => faits.filter(f).length;
  return `<div class="bilan"><div><b>${faits.length}</b><span>appels</span></div>
    <div><b>${n(e => e.resultat !== 'Pas de réponse')}</b><span>décrochés</span></div>
    <div><b>${n(e => e.resultat === 'Lien envoyé')}</b><span>liens</span></div>
    <div><b>${n(e => e.resultat === 'RDV obtenu')}</b><span>RDV</span></div></div>`;
}
// Les appels passés un jour donné, dans l'ordre de la journée.
function sectionAppelsDuJour(j, entrees) {
  const faits = entrees.filter(e => e.date.startsWith(j) && e.id && e.resultat !== 'Import' && entreeVisible(e))
    .sort((a, b) => a.date.localeCompare(b.date));
  const cartes = faits.map(e => {
    const p = trouver(e.id) || { id: e.id, entreprise: e.entreprise, statut: e.statut };
    return carteRiche(p, droite(heure(e.date)), e);
  });
  return section('Appels passés', faits.length ? faits.length + ' contacts' : '',
    faits.length ? grille(cartes.join('')) : '<div class="vide">Aucun contact enregistré ce jour-là.</div>');
}

function vueJour() {
  if (!S.jour) S.jour = aujourdhui();
  const j = S.jour, auj = aujourdhui();
  if (j !== auj) return barreJour() + (j < auj ? vueJourPasse(j) : vueJourAVenir(j));
  const entrees = journalDe(j) || [];
  const duJour = entrees.filter(e => e.date.startsWith(j) && entreeVisible(e));
  return barreJour() + carteSession(duJour) + bilanJour(duJour) + vueAujourdhui() + sectionAppelsDuJour(j, entrees);
}

function vueJourPasse(j) {
  const entrees = journalDe(j);
  if (!entrees) return '<div class="chargement">Lecture du journal de ce jour-là…</div>';
  const duJour = entrees.filter(e => e.date.startsWith(j));
  // Ce qui était prévu pour ce jour-là (rappels et RDV posés avant), dans cet espace.
  // « Fait » compte l'appel de n'importe qui : un rappel repris par l'autre est fait.
  const prevus = entrees.filter(e => String(e.rappel).startsWith(j) && !e.date.startsWith(j)
    && (trouver(e.id) ? aLui(trouver(e.id)) : entreeVisible(e)));
  const vus = new Set();
  const cartesPrevus = prevus.sort((a, b) => a.rappel.localeCompare(b.rappel)).filter(e => !vus.has(e.id) && vus.add(e.id)).map(e => {
    const p = trouver(e.id) || { id: e.id, entreprise: e.entreprise, statut: e.statut };
    const fait = duJour.some(x => x.id === e.id);
    return carteRiche(p, droite(heure(e.rappel), fait ? 'fait' : 'pas rappelé', !fait));
  });
  return bilanJour(duJour.filter(entreeVisible)) + sectionAppelsDuJour(j, entrees)
    + (cartesPrevus.length ? section('Ce qui était prévu', cartesPrevus.length + ' rappels ou RDV', grille(cartesPrevus.join(''))) : '');
}

function vueJourAVenir(j) {
  const prevus = S.data.prospects.filter(p => String(p.rappel).startsWith(j) && !['perdu', 'signe'].includes(cle(p)) && aLui(p))
    .sort((a, b) => a.rappel.localeCompare(b.rappel));
  return section('Rappels et RDV prévus', prevus.length ? prevus.length + ' prévus' : '',
    prevus.length ? grille(prevus.map(p => carteRiche(p, droite((cle(p) === 'rdv' ? 'RDV ' : '') + heure(p.rappel)))).join(''))
      : '<div class="vide">Rien de prévu ce jour-là pour l’instant. Les rappels posés depuis la fiche d’un prospect apparaîtront ici.</div>');
}

// Les listes de la journée, dans l'ordre où on les traite. La session d'appels lit les mêmes.
function listesJour() {
  const now = maintenant(), jour = aujourdhui();
  // Son espace : ses prospects, plus les « À appeler » libres (après les siens).
  const actifs = S.data.prospects.filter(p => !['perdu', 'signe'].includes(cle(p)) && visible(p));
  const avecRappel = actifs.filter(p => p.rappel);
  const retard = avecRappel.filter(p => p.rappel < now).sort((a, b) => a.rappel.localeCompare(b.rappel));
  const duJour = avecRappel.filter(p => p.rappel.slice(0, 10) === jour && p.rappel >= now).sort((a, b) => a.rappel.localeCompare(b.rappel));
  const aDater = actifs.filter(p => cle(p) === 'rappel' && !p.rappel);
  // Devis et négociations sans prochain point (posés avant le 17/10/2026, quand la date était facultative).
  const negoSansDate = actifs.filter(p => cle(p) === 'negociation' && !p.rappel).sort((a, b) => String(a.dernier).localeCompare(String(b.dernier)));
  const froids = actifs.filter(p => ['a_appeler', 'sans_reponse'].includes(cle(p)) && !p.rappel && !String(p.dernier).startsWith(jour) && p.telephone);
  const libre = p => respDe(p) ? 0 : 1;
  const ordre = (a, b) => (vueEquipe() ? 0 : libre(a) - libre(b)) || (cle(a) === 'a_appeler' ? 0 : 1) - (cle(b) === 'a_appeler' ? 0 : 1) || String(a.dernier).localeCompare(String(b.dernier)) || a.id.localeCompare(b.id);
  const maintenantOk = froids.filter(p => dansCreneau(p)).sort(ordre);
  const plusTard = froids.filter(p => !dansCreneau(p) && prochainCreneau(p)).sort((a, b) => prochainCreneau(a).localeCompare(prochainCreneau(b)) || ordre(a, b));
  const il2j = new Date(); il2j.setDate(il2j.getDate() - 2);
  const relances = actifs.filter(p => cle(p) === 'lien' && !p.rappel && String(p.dernier || '') < fmt(il2j))
    .sort((a, b) => String(a.dernier).localeCompare(String(b.dernier)));
  const vusDemo = S.data.prospects.filter(p => visible(p) && chaud(p))
    .sort((a, b) => vuesDe(b).derniere.localeCompare(vuesDe(a).derniere));
  // Un prospect qui vient d'ouvrir sa démo n'apparaît plus aussi dans les listes froides.
  const chauds = new Set(vusDemo.map(p => p.id)), froid = l => l.filter(p => !chauds.has(p.id));
  return { now, jour, negoSansDate, retard, duJour, aDater, maintenantOk: froid(maintenantOk), plusTard: froid(plusTard), relances: froid(relances), vusDemo };
}

function vueAujourdhui() {
  const { negoSansDate, retard, duJour, aDater, maintenantOk, plusTard, relances, vusDemo } = listesJour();
  const rdvOuRappel = p => (cle(p) === 'rdv' ? 'RDV ' : '') + dateCourte(p.rappel);

  let h = '';
  // Ils ont ouvert la démo et personne ne les a rappelés depuis : c'est maintenant qu'ils l'ont en tête.
  if (vusDemo.length) h += section('Ont ouvert la démo', vusDemo.length + ' à rappeler maintenant',
    grille(vusDemo.map(p => carteRiche(p, `<div class="lp-droite chaud">${esc(ilYa(vuesDe(p).derniere))}<small>${esc(vuesDe(p).n + '× · ' + dureeTxt(vuesDe(p).s))}</small></div>`)).join('')));
  // Devis envoyés à relancer (3 jours sans contact, ou pause finie) : Sam les voit dans sa journée.
  const aRelancer = devisARelancer();
  if (aRelancer.length) h += section('Devis à relancer', aRelancer.length + ' en attente de réponse',
    grille(aRelancer.map(({ d, sv }) => { const pr = S.data.prospects.find(x => x.client === d.client_id); const tel = pr && lienTel(pr.telephone);
      const e = etatRelance(sv);
      return `<div class="lp" data-id="${esc(pr ? pr.id : '')}" style="--statut:#ffd966"><div class="lp-tete"><div><div class="lp-nom">${esc(d.clients ? d.clients.nom_etablissement : '?')}</div>
        <div class="lp-sous">${esc(d.numero || '')} · ${eur2(d.total_ttc)} TTC · ${sv.relances ? sv.relances + ' relance' + (sv.relances > 1 ? 's' : '') : 'jamais relancé'}</div></div>
        <div class="lp-droite retard">${esc(e.txt)}</div></div>
        <dl class="lp-grille"><dt>Dernier</dt><dd>${esc(dateCourte(sv.dernier))}</dd>${pr && pr.gerant ? `<dt>Gérant</dt><dd>${esc(pr.gerant)}</dd>` : ''}${pr && pr.telephone ? `<dt>Tél.</dt><dd>${esc(pr.telephone)}</dd>` : ''}</dl>
        <div class="lp-actions" style="grid-template-columns:1fr 1.3fr"><a class="appeler ${tel ? '' : 'inactif'}" href="${tel || '#'}" data-stop="1">☎︎ Appeler</a>
        <button data-action="ouvrir-devis" data-id="${esc(d.id)}">Noter la relance</button></div></div>`; }).join('')));
  if (negoSansDate.length) h += section('Devis en cours sans prochain point', negoSansDate.length + ' à relancer',
    grille(negoSansDate.map(p => carteRiche(p, droite('à relancer', p.dernier ? 'vu ' + dateCourte(p.dernier) : '', true))).join('')));
  if (retard.length) h += section('En retard', retard.length + ' à replacer', grille(retard.map(p => carteRiche(p, droite(rdvOuRappel(p), 'en retard', true))).join('')));
  h += section('Rappels et RDV du jour', duJour.length ? duJour.length + ' prévus' : '',
    duJour.length ? grille(duJour.map(p => carteRiche(p, droite((cle(p) === 'rdv' ? 'RDV ' : '') + heure(p.rappel)))).join(''))
      : '<div class="vide">Aucun rappel prévu pour le reste de la journée.</div>');
  if (aDater.length) h += section('Rappels sans date', 'à dater', grille(aDater.map(p => carteRiche(p, droite('à dater'))).join('')));
  h += section('À appeler maintenant', maintenantOk.length + ' dans leur créneau',
    maintenantOk.length ? grille(maintenantOk.slice(0, S.plusJour).map(p => carteRiche(p, cle(p) === 'sans_reponse' ? droite(p.nb + '×', 'sans réponse') : '')).join(''))
      + (maintenantOk.length > S.plusJour ? '<button class="plus" data-action="plus">Afficher plus</button>' : '')
      : '<div class="vide">Personne dans son créneau d’appel à cette heure. Regarde « Plus tard ».</div>');
  if (relances.length) h += section('Liens envoyés à relancer', relances.length + ' sans relance prévue',
    grille(relances.map(p => carteRiche(p, droite('à relancer', p.dernier ? 'lien ' + dateCourte(p.dernier) : ''))).join('')));
  if (plusTard.length) h += section('Plus tard aujourd’hui', plusTard.length + ' prospects',
    grille(plusTard.slice(0, 15).map(p => carteRiche(p, droite('à ' + prochainCreneau(p).replace(':', ' h ')))).join('')));
  return h;
}

// ---------------------------------------------------------------------------
// Session d'appels (20/10/2026, demandé par Nelson)
// ---------------------------------------------------------------------------
// « Lancer ma session » ouvre le prochain prospect ; dès que l'appel est noté, le suivant
// s'ouvre tout seul. La file se recalcule à chaque fois, dans l'ordre de la Journée : une
// démo qui vient d'être ouverte ou un rappel qui arrive à son heure passe devant.
// Objectif du jour : la grille de Sam, un créneau toutes les 10 minutes (règle du 28/09/2026,
// rappels compris). Nelson prospecte par WhatsApp sans grille fixe : pas d'objectif chiffré.
const OBJECTIF_JOUR = { Sam: { 0: 16, 1: 12, 2: 33, 3: 33, 4: 12, 5: 33, 6: 12 } };
const SESSION = lireSession();
function lireSession() {
  try { const x = JSON.parse(lire('session') || 'null'); if (x && x.jour === aujourdhui()) return x; } catch (e) {}
  return { actif: false, jour: '', debut: '', vus: [], faits: 0, rdv: 0, liens: 0, courant: '' };
}
function garderSession() { stocker('session', JSON.stringify(SESSION)); }
function objectifJour() { const o = OBJECTIF_JOUR[S.espace]; return o ? o[new Date().getDay()] || 0 : 0; }
// Qui appeler ensuite : avec un numéro, pas encore proposé dans cette session, pas recontacté depuis son début.
function fileSession(depuis) {
  const L = listesJour(), dans15 = fmt(new Date(Date.now() + 15 * 6e4)), vus = new Set(SESSION.actif ? SESSION.vus : []);
  const tous = [...L.vusDemo, ...L.retard, ...L.duJour.filter(p => p.rappel <= dans15), ...L.maintenantOk, ...L.relances, ...L.negoSansDate];
  return tous.filter((p, i) => tous.indexOf(p) === i && !vus.has(p.id) && telInternational(p.telephone) && String(p.dernier || '') < depuis);
}
function carteSession(duJour) {
  if (vueEquipe()) return '';
  const n = duJour.filter(e => RES_APPEL().includes(e.resultat)).length, obj = objectifJour();
  const reste = fileSession(SESSION.actif ? SESSION.debut : maintenant()).length;
  const min = SESSION.actif ? Math.max(0, Math.round((Date.now() - versDate(SESSION.debut)) / 6e4)) : 0;
  const sous = SESSION.actif ? `${SESSION.faits} noté${SESSION.faits > 1 ? 's' : ''} en ${min} min${SESSION.rdv ? ' · ' + SESSION.rdv + ' RDV' : ''}${SESSION.liens ? ' · ' + SESSION.liens + ' lien' + (SESSION.liens > 1 ? 's' : '') : ''}`
    : reste ? reste + ' à appeler, dans l’ordre de la journée' : 'Personne à appeler pour l’instant';
  return `<div class="sess ${SESSION.actif ? 'en-cours' : ''}">
    <div class="sess-haut"><div><div class="sess-titre">${SESSION.actif ? '<i class="sess-point"></i>Session en cours' : 'Session d’appels'}</div><div class="sess-sous">${esc(sous)}</div></div>
      <div class="sess-compte"><b>${n}</b><span>${obj ? '/ ' + obj : 'appels'}</span></div></div>
    ${obj ? `<div class="sess-barre"><i style="width:${Math.min(100, Math.round(n / obj * 100))}%"></i></div>
      <div class="sess-sous">${n >= obj ? 'Grille du jour remplie.' : (obj - n) + ' appel' + (obj - n > 1 ? 's' : '') + ' pour remplir la grille du jour'}</div>` : ''}
    <div class="sess-actions">${SESSION.actif
      ? `<button class="btn sess-go" data-action="sess-reprendre" ${reste || SESSION.courant ? '' : 'disabled'}>Reprendre${reste ? ' · ' + reste + ' restant' + (reste > 1 ? 's' : '') : ''}</button><button class="btn clair" data-action="sess-fin">Terminer</button>`
      : `<button class="btn sess-go" data-action="sess-lancer" ${reste ? '' : 'disabled'}>Lancer ma session →</button>`}</div></div>`;
}
function lancerSession() {
  Object.assign(SESSION, { actif: true, jour: aujourdhui(), debut: maintenant(), vus: [], faits: 0, rdv: 0, liens: 0, courant: '' });
  garderSession(); suivantSession();
}
function suivantSession() {
  const p = fileSession(SESSION.debut)[0];
  if (!p) return finSession(true);
  SESSION.courant = p.id; SESSION.vus.push(p.id); garderSession();
  ouvrirFiche(p.id);
  const f = document.getElementById('feuille'); if (f) f.scrollTop = 0;
}
function reprendreSession() {
  const c = SESSION.courant && trouver(SESSION.courant);
  if (c && String(c.dernier || '') < SESSION.debut) ouvrirFiche(c.id); else suivantSession();
}
function finSession(vide) {
  const min = SESSION.debut ? Math.max(0, Math.round((Date.now() - versDate(SESSION.debut)) / 6e4)) : 0;
  const bilan = SESSION.faits + ' appel' + (SESSION.faits > 1 ? 's' : '') + ' noté' + (SESSION.faits > 1 ? 's' : '') + ' en ' + min + ' min'
    + (SESSION.rdv ? ', ' + SESSION.rdv + ' RDV' : '') + (SESSION.liens ? ', ' + SESSION.liens + ' lien' + (SESSION.liens > 1 ? 's' : '') : '');
  SESSION.actif = false; SESSION.courant = ''; garderSession();
  fermerFiche(); rendre();
  toast((vide ? 'Plus personne à appeler pour l’instant : ' : 'Session terminée : ') + bilan + '.');
}
function bandeauSession(p) {
  if (!SESSION.actif || SESSION.courant !== p.id) return '';
  const reste = fileSession(SESSION.debut).length;
  return `<div class="sess-bandeau"><span><i class="sess-point"></i><b>Session · n° ${SESSION.vus.length}</b>${reste ? ' · encore ' + reste : ' · le dernier'}</span>
    <button data-action="sess-passer">Passer →</button><button data-action="sess-fin">Terminer</button></div>`;
}

// ---------------------------------------------------------------------------
// Carte (20/10/2026, demandé par Nelson)
// ---------------------------------------------------------------------------
// Les prospects sur une carte du Luxembourg, et la recherche de commerces sans site
// dans la zone affichée, pour que Sam en trouve lui-même. Fond OpenStreetMap :
// la carte Apple intégrée demande un compte développeur payant. Le lien avec Apple Plans
// se fait par « Y aller », qui ouvre l'itinéraire dans l'appli Plans de l'iPhone.
// Positions : onglet Lieux du Sheets (partagé). Celles qui manquent sont cherchées sur
// OpenStreetMap (Nominatim, une requête par seconde, règle du service), le commerce
// d'abord, sinon le centre de sa commune (« approximative »).
// Commerces sans site : OpenStreetMap (Overpass), sans site connu, sans les chaînes, sans
// cafés, bars ni téléphonie (exclus pour tout le monde). « Pas de site connu » ne veut pas
// dire « pas de site » : toujours vérifier avant d'appeler.
const Carte = (() => {
  const C = { map: null, couche: null, couchePistes: null, filtre: 'actifs', pistes: [], file: [], enCours: false, faits: 0, aEnvoyer: [], communes: {}, moi: null };
  const LUX = [[49.44, 5.73], [50.19, 6.53]];
  // La bulle s'ouvre sous la barre de filtres et au-dessus des onglets, jamais dessous.
  const POPUP = { maxWidth: 260, autoPanPaddingTopLeft: [12, 170], autoPanPaddingBottomRight: [12, 110] };
  try { C.communes = JSON.parse(lire('communes') || '{}'); } catch (e) {}
  const charge = () => new Promise((ok, ko) => {
    if (window.L) return ok();
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; js.onload = ok; js.onerror = () => ko(new Error('Carte injoignable.')); document.head.appendChild(js);
  });
  const sansSite = p => !lienSite(p.site) || /facebook|instagram/i.test(p.site || '');
  // Plusieurs prospects au centre d'une même commune : on les écarte un peu en spirale.
  function decale(id, lat, lng) {
    const n = parseInt(String(id).replace(/\D/g, ''), 10) || 0, a = n * 2.399, r = 0.0012 * Math.sqrt(n % 40 + 1);
    return [lat + r * Math.cos(a), lng + r * Math.sin(a) * 1.5];
  }
  function lieuDe(p) {
    const l = S.data.lieux && S.data.lieux[p.id];
    if (!l) return null;
    return l.precision === 'précis' ? { ll: [l.lat, l.lng], approx: false } : { ll: decale(p.id, l.lat, l.lng), approx: true };
  }
  const lienPlans = (nom, commune, ll, approx) => 'https://maps.apple.com/?daddr=' + encodeURIComponent(approx || !ll ? [nom, commune, 'Luxembourg'].filter(Boolean).join(', ') : ll[0] + ',' + ll[1]) + '&q=' + encodeURIComponent(nom) + '&dirflg=d';
  function prospectsAffiches() {
    return S.data.prospects.filter(p => visible(p) && (
      C.filtre === 'tout' ? true : C.filtre === 'signes' ? cle(p) === 'signe' : C.filtre === 'sans-site' ? !['perdu', 'signe'].includes(cle(p)) && sansSite(p) : !['perdu', 'signe'].includes(cle(p))));
  }
  function popupProspect(p, lieu) {
    const tel = lienTel(p.telephone), v = vuesDe(p);
    return `<div class="pop"><b>${esc(p.entreprise)}</b><div class="pop-sous">${esc([p.secteur, p.commune].filter(Boolean).join(' · '))}</div>
      <div class="pop-sous"><span class="pastille" style="--statut:${couleur(p)}">${esc(statut(p.statut).label)}</span>${sansSite(p) ? ' · sans site' : ''}${lieu.approx ? ' · position approximative' : ''}</div>
      ${v ? `<div class="pop-sous vu-demo">démo ${esc(vuesTxt(v))}</div>` : ''}
      <div class="pop-act"><button data-action="carte-fiche" data-id="${esc(p.id)}">Fiche</button>
      <a href="${esc(lienPlans(p.entreprise, p.commune, lieu.ll, lieu.approx))}" target="_blank" rel="noopener">Y aller</a>
      ${tel ? `<a href="${tel}">Appeler</a>` : ''}</div></div>`;
  }
  function dessinerProspects(sansPlacer) {
    if (!C.map) return;
    C.couche.clearLayers();
    let places = 0, total = 0;
    prospectsAffiches().forEach(p => {
      total++;
      const lieu = lieuDe(p); if (!lieu) return;
      places++;
      L.circleMarker(lieu.ll, { radius: cle(p) === 'signe' ? 9 : 7, color: '#0b0c0b', weight: lieu.approx ? 1 : 2, dashArray: lieu.approx ? '2 3' : null,
        fillColor: couleur(p) === '#ffffff' ? '#f4f6f4' : couleur(p), fillOpacity: lieu.approx ? .7 : .95 })
        .bindPopup(() => popupProspect(p, lieu), POPUP).addTo(C.couche);
    });
    C.places = places; C.total = total;
    barre();
    if (sansPlacer) return;
    // Ceux qui n'ont pas encore de position : on les cherche, sans bloquer la carte.
    const manquants = S.data.prospects.filter(p => !['perdu'].includes(cle(p)) && !(S.data.lieux || {})[p.id] && !C.file.includes(p.id));
    C.file.push(...manquants.map(p => p.id));
    placer();
  }
  function barre() {
    const b = document.getElementById('carte-barre'); if (!b) return;
    const F = [['actifs', 'Actifs'], ['sans-site', 'Sans site'], ['signes', 'Clients'], ['tout', 'Tout']];
    b.innerHTML = `<div class="cb-filtres">${F.map(([k, l]) => `<button data-action="carte-filtre" data-k="${k}" class="${C.filtre === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="cb-bas"><span class="cb-info">${C.places || 0} sur la carte${C.total > C.places ? ' · ' + (C.total - C.places) + ' à placer' : ''}${C.enCours ? ' · placement en cours…' : ''}</span>
      <button data-action="carte-moi" aria-label="Me localiser">◎</button></div>
      <button class="cb-chercher" data-action="carte-chercher">Chercher des commerces sans site ici</button>
      ${C.pistes.length ? `<div class="cb-info cb-pistes">${C.pistes.length} commerce${C.pistes.length > 1 ? 's' : ''} sans site connu dans la zone · <button data-action="carte-effacer">effacer</button></div>` : ''}`;
  }
  // --- positions manquantes (Nominatim : 1 requête par seconde au plus) ---
  const attendre = ms => new Promise(r => setTimeout(r, ms));
  async function nominatim(q) {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=lu&limit=3&accept-language=fr&q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('Nominatim ' + r.status);
    return r.json();
  }
  const COMMERCE = /^(shop|amenity|craft|office|tourism|leisure|healthcare|club)$/;
  function correspond(res, nom) {
    const mots = sansAccent(nom).split(/[^a-z0-9]+/).filter(m => m.length >= 4 && !['salon', 'restaurant', 'garage', 'sarl', 'sàrl', 'boulangerie', 'coiffure'].includes(m));
    const n = sansAccent(res.name || res.display_name || '');

  }
  async function placer() {

        const p = trouver(C.file.shift()); if (!p || (S.data.lieux || {})[p.id]) continue;

          if (r) lieu = { lat: +r.lat, lng: +r.lon, precision: 'précis' };
          await attendre(1100);
        }
        if (!lieu && p.commune) {
          const k = sansAccent(p.commune);
          if (!C.communes[k]) {
            const r = (await nominatim(p.commune + ', Luxembourg'))[0];
            C.communes[k] = r ? [+r.lat, +r.lon] : 'x'; stocker('communes', JSON.stringify(C.communes));
            await attendre(1100);
          }
          if (Array.isArray(C.communes[k])) lieu = { lat: C.communes[k][0], lng: C.communes[k][1], precision: 'commune' };
        }
        if (!lieu) continue;
        S.data.lieux = S.data.lieux || {}; S.data.lieux[p.id] = lieu;
        C.aEnvoyer.push(Object.assign({ id: p.id, source: 'OpenStreetMap' }, lieu));

    } catch (e) { toast('Placement sur la carte interrompu : ' + (e.message || e), true); }
    C.enCours = false; envoyer(); dessinerProspects(true);
  }
  function envoyer() {
    if (!C.aEnvoyer.length) return;
    const lot = C.aEnvoyer.splice(0);
    appel('api_lieux_ajouter', S.pin, lot).catch(() => { C.aEnvoyer.push(...lot); });
  }
  // --- commerces sans site dans la zone (Overpass) ---
  const TYPES = { hairdresser: 'Coiffure', beauty: 'Institut de beauté', florist: 'Fleuriste', bakery: 'Boulangerie', pastry: 'Pâtisserie', butcher: 'Boucherie',
    car_repair: 'Garage auto', car: 'Voitures', tyres: 'Pneus', clothes: 'Vêtements', shoes: 'Chaussures', jewelry: 'Bijouterie', optician: 'Opticien',
    restaurant: 'Restaurant', fast_food: 'Restauration rapide', ice_cream: 'Glacier', dentist: 'Dentiste', doctors: 'Médecin', veterinary: 'Vétérinaire',
    driving_school: 'Auto-école', physiotherapist: 'Kinésithérapie', fitness_centre: 'Fitness', dance: 'Danse', tattoo: 'Tatouage', massage: 'Massage',

  if (/[\/:]/.test(s)) return '';

// ---------------------------------------------------------------------------
// Objectif du mois (20/10/2026, demandé par Nelson)
// ---------------------------------------------------------------------------
// Ce qui compte n'est pas le nombre d'appels mais l'argent signé. Les montants viennent
// de Factu (devis et factures Supabase) ; sans connexion à la facturation, seuls les RDV
// s'affichent. Tout ce qui est estimé est dit comme tel, avec l'hypothèse utilisée.
const OBJECTIF_MOIS = 15000; // CA HT visé par mois (context/CONTEXT.md)
const eur0 = n => Math.round(Number(n) || 0).toLocaleString('fr-FR') + ' €';
function vueObjectif() {
  const F = typeof Factu !== 'undefined' && Factu.donnees ? Factu.donnees() : null;
  const now = new Date(), mois = aujourdhui().slice(0, 7), nomMois = MOIS[now.getMonth()];
  const finMois = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  const joursRestants = finMois.getDate() - now.getDate() + 1;
  const J = S.data.journal, estAppel = e => RES_APPEL().includes(e.resultat);
  const rdvMois = J.filter(e => e.date.startsWith(mois) && e.resultat === 'RDV obtenu').length;
  const il30 = fmt(new Date(Date.now() - 30 * 864e5)).slice(0, 10);
  const a30 = J.filter(e => e.date.slice(0, 10) >= il30 && estAppel(e)).length, r30 = J.filter(e => e.date.slice(0, 10) >= il30 && e.resultat === 'RDV obtenu').length;

  if (!F || !F.session || !F.pret) {
    return section('Objectif du mois', nomMois, `<div class="obj">
      <div class="obj-haut"><div class="obj-lib">RDV obtenus en ${nomMois}</div><div class="obj-val">${rdvMois}</div></div>
      <div class="obj-note">Connecte la facturation (onglet Factu, une fois sur ce téléphone) pour suivre l’objectif de ${eur0(OBJECTIF_MOIS)} HT en euros signés.</div></div>`);
  }
  // Date de signature d'un devis accepté : sa première facture (l'acompte), sinon la date du devis.
  const dateSigne = d => F.factures.filter(f => f.devis_id === d.id).map(f => String(f.date_emission || '')).filter(Boolean).sort()[0] || String(d.date_emission || '');
  const acceptes = F.devis.filter(d => d.statut === 'accepté'), refuses = F.devis.filter(d => d.statut === 'refusé');
  const signesMois = acceptes.filter(d => dateSigne(d).startsWith(mois));
  const signe = signesMois.reduce((t, d) => t + (Number(d.total_ht) || 0), 0);
  const attente = F.devis.filter(d => d.statut === 'envoyé' && (!d.date_validite || String(d.date_validite) >= aujourdhui()));
  const tranches = acceptes.length + refuses.length;
  const tauxOui = tranches >= 3 ? acceptes.length / tranches : 0.3;
  const enJeu = attente.reduce((t, d) => t + (Number(d.total_ht) || 0), 0), probable = enJeu * tauxOui;
  const base = acceptes.length ? acceptes : F.devis.filter(d => d.statut !== 'brouillon');
  const panier = base.length ? base.reduce((t, d) => t + (Number(d.total_ht) || 0), 0) / base.length : 2000;
  // RDV → signature, sur 120 jours (le journal chargé) : estimation tant qu'il y a peu de recul.
  const il120 = fmt(new Date(Date.now() - 120 * 864e5)).slice(0, 10);
  const rdv120 = J.filter(e => e.date.slice(0, 10) >= il120 && e.resultat === 'RDV obtenu').length;
  const signes120 = acceptes.filter(d => dateSigne(d) >= il120).length;
  const tauxRdv = rdv120 >= 5 && signes120 ? Math.min(1, signes120 / rdv120) : 0.33;
  const reste = Math.max(0, OBJECTIF_MOIS - signe);
  const manque = Math.max(0, reste - probable);
  const signatures = manque ? Math.ceil(manque / panier) : 0;
  const rdvFaut = signatures ? Math.ceil(signatures / tauxRdv) : 0;
  const appelsParRdv = r30 ? a30 / r30 : 0;
  const appelsFaut = appelsParRdv ? Math.ceil(rdvFaut * appelsParRdv) : 0;
  const pSigne = Math.min(100, signe / OBJECTIF_MOIS * 100), pProb = Math.min(100 - pSigne, probable / OBJECTIF_MOIS * 100);
  const hyp = [
    tranches >= 3 ? `taux de oui aux devis ${Math.round(tauxOui * 100)} % (${acceptes.length} sur ${tranches} tranchés)` : 'taux de oui aux devis supposé à 30 % (moins de 3 devis tranchés)',
    acceptes.length ? `panier moyen ${eur0(panier)} HT (${acceptes.length} devis acceptés)` : base.length ? `panier moyen ${eur0(panier)} HT, calculé sur les devis envoyés (aucun accepté encore)` : 'panier moyen supposé à 2 000 € HT (aucun devis)',
    rdv120 >= 5 && signes120 ? `${Math.round(tauxRdv * 100)} % des RDV signent (${signes120} sur ${rdv120} en 120 jours)` : 'un RDV sur trois signe (supposé, trop peu de recul)',
    appelsParRdv ? `${Math.round(appelsParRdv)} appels pour un RDV (30 derniers jours)` : 'aucun RDV sur 30 jours : appels nécessaires inconnus',
  ];
  return section('Objectif du mois', nomMois + ' · ' + joursRestants + ' j restants', `<div class="obj">
    <div class="obj-haut"><div><div class="obj-lib">Signé en ${nomMois}, HT</div><div class="obj-val">${eur0(signe)}<span> / ${eur0(OBJECTIF_MOIS)}</span></div></div>
      <div class="obj-pct">${Math.round(pSigne)} %</div></div>
    <div class="obj-barre"><i class="s" style="width:${pSigne}%"></i><i class="p" style="width:${pProb}%"></i></div>
    <div class="obj-leg"><span><i class="s"></i>signé ${signesMois.length ? '(' + signesMois.length + ' devis)' : ''}</span><span><i class="p"></i>probable sur les devis en attente</span></div>
    <div class="obj-grille">
      <div><b>${reste ? eur0(reste) : 'Atteint'}</b><span>${reste ? 'reste à signer' : 'objectif du mois'}</span></div>
      <div><b>${attente.length}</b><span>devis en attente · ${eur0(enJeu)}, ≈ ${eur0(probable)} probables</span></div>
      <div><b>${signatures || '0'}</b><span>signature${signatures > 1 ? 's' : ''} encore nécessaire${signatures > 1 ? 's' : ''}</span></div>
      <div><b>${rdvFaut ? '≈ ' + rdvFaut : '0'}</b><span>RDV à obtenir${appelsFaut ? ' · ≈ ' + Math.ceil(appelsFaut / joursRestants) + ' appels par jour d’ici le ' + finMois.getDate() + ' ' + nomMois : ''}</span></div>
    </div>
    <details class="obj-calc"><summary>Comment c’est calculé</summary><ul>${hyp.map(h => '<li>' + esc(h) + '</li>').join('')}
      <li>Signé : devis acceptés, datés de leur première facture (l’acompte), sinon de leur date d’émission. Montants HT, maintenance de la première année comprise.</li></ul></details>
  </div>`);
}

// Courbe lissée en SVG, avec une bulle qui suit le doigt ou la souris (voir « pointermove »).
// Sur téléphone, un repère plus étroit : la courbe garde une hauteur lisible.
const COURBE = { H: 230, G: 34, B: 24, T: 44, largeur: () => window.innerWidth < 760 ? 360 : 640 };
function plafond(n) { if (n <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(n))); return Math.ceil(n / p * 2) / 2 * p; }

  const { H, G, B, T } = COURBE, W = COURBE.largeur(), n = etiquettes.length;
  const max = plafond(Math.max(1, ...series.flatMap(s => s.vals)));
  const X = i => G + (n > 1 ? i * (W - G - 6) / (n - 1) : 0), Y = v => T + (H - T - B) * (1 - v / max);
  const chemin = vals => vals.map((v, i) => {
    if (!i) return `M${X(0)},${Y(v)}`;
    // Catmull-Rom vers Bézier, poignées bornées au cadre : une journée à zéro ne plonge pas sous l'axe.
    const p0 = vals[Math.max(0, i - 2)], p1 = vals[i - 1], p3 = vals[Math.min(n - 1, i + 1)];
    const lim = y => Math.min(H - B, Math.max(T, y)), dx = (X(i) - X(i - 1)) / 3;
    return `C${X(i - 1) + dx},${lim(Y(p1) - (Y(v) - Y(p0)) / 6)} ${X(i) - dx},${lim(Y(v) - (Y(p3) - Y(p1)) / 6)} ${X(i)},${Y(v)}`;
  }).join('');
  const graduations = [0, .25, .5, .75, 1].map(f => `<line x1="${G}" x2="${W}" y1="${Y(max * f)}" y2="${Y(max * f)}" style="stroke:var(--v-grille)"/>
    <text class="axe" x="${G - 8}" y="${Y(max * f) + 3}" text-anchor="end">${Math.round(max * f)}</text>`).join('');
  const pas = Math.max(1, Math.ceil(n / (W < 500 ? 4 : 7)));
  const bas = etiquettes.map((e, i) => i % pas && i !== n - 1 ? '' : `<text class="axe" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(e)}</text>`).join('');
  const traces = series.map((s, k) => (s.aire ? `<path d="${chemin(s.vals)}L${X(n - 1)},${H - B}L${X(0)},${H - B}Z" fill="url(#deg-${id})"/>` : '')
    + `<path d="${chemin(s.vals)}" fill="none" style="stroke:${s.couleur}" stroke-width="${k ? 2 : 2.4}" ${s.pointille ? 'stroke-dasharray="5 5"' : ''} stroke-linecap="round"/>`).join('');
  const donnees = { W, x: etiquettes.map((_, i) => X(i) / W * 100), y: series[0].vals.map(v => Y(v) / H * 100), e: etiquettes, s: series.map(s => ({ n: s.nom, v: s.vals })) };
  return `<div class="v-courbe" data-courbe='${esc(JSON.stringify(donnees))}'>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.nom).join(', '))}"><defs><linearGradient id="deg-${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".22"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></linearGradient></defs>
      ${graduations}${bas}${traces}
      <line class="v-repere" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke-width="1.2" style="display:none;stroke:var(--v-contraste)"/>
      <circle class="v-point" r="5" stroke="#2f6bff" stroke-width="2.5" style="display:none;fill:var(--v-carte)"/></svg>
    <div class="v-bulle" style="display:none"></div></div>`;
}
function placerBulle(z, i) {

  // Par personne : toujours les deux, pour se situer. Lu sur tout le journal, pas sur l'espace

function vueArgent() {
  const F = typeof Factu !== 'undefined' && Factu.donnees ? Factu.donnees() : null;
  const tete = (outils) => `<div class="v-tete"><div><h1>Argent</h1><p>Encaissé, pas encore encaissé, abonnements · montants TTC sauf mention HT</p></div>${outils || ''}</div>`;

    <button class="btn" data-action="aller-factu">Ouvrir Factu</button></div>`;
  if (!F.pret) return tete() + '<div class="chargement">Lecture de la facturation…</div>';

  const auj = aujourdhui(), mois = auj.slice(0, 7), annee = auj.slice(0, 4);
  const P = S.argentPeriode || 'mois';
  const debut = P === 'mois' ? mois + '-01' : P === 'annee' ? annee + '-01-01' : P === '90' ? (() => { const d = new Date(); d.setDate(d.getDate() - 89); return fmt(d).slice(0, 10); })() : '0000';
  const dPrec = new Date(); dPrec.setDate(1); dPrec.setMonth(dPrec.getMonth() - 1); const moisPrec = fmt(dPrec).slice(0, 7);
  const libP = { mois: 'ce mois-ci', '90': 'sur 90 jours', annee: 'en ' + annee, tout: 'depuis le début' }[P];

  const facs = F.factures.filter(f => f.statut !== 'annulée');
  const parId = Object.fromEntries(facs.map(f => [f.id, f]));
  // Encaissements : la table des paiements (date réelle) ; sans elle, les factures payées à leur date d'émission.
  const encaissements = F.paiements ? F.paiements.filter(x => parId[x.facture_id]).map(x => ({ date: String(x.date), montant: Number(x.montant) || 0, f: parId[x.facture_id], moyen: x.moyen }))
    : facs.filter(f => Number(f.montant_paye) > 0).map(f => ({ date: String(f.date_emission), montant: Number(f.montant_paye), f, moyen: '' }));
  const somme = (L, cond) => L.filter(cond).reduce((s, e) => s + e.montant, 0);
  const enc = somme(encaissements, e => e.date >= debut);
  const encAbo = encaissements.filter(e => e.date >= debut).reduce((s, e) => s + e.montant * partAbo(e.f), 0);
  const encMois = somme(encaissements, e => e.date.startsWith(mois)), encPrec = somme(encaissements, e => e.date.startsWith(moisPrec));
  const evol = encPrec ? Math.round((encMois - encPrec) / encPrec * 100) : null;

  // Pas encore encaissé : factures émises non soldées, et brouillons pas encore émis.
  const reste = f => Math.max(0, (Number(f.total_ttc) || 0) - (Number(f.montant_paye) || 0));
  const emises = facs.filter(f => (f.statut === 'envoyée' || f.statut === 'en_retard') && reste(f) > 0.005);
  const enRetard = emises.filter(f => f.statut === 'en_retard' || (f.date_echeance && String(f.date_echeance) < auj));
  const brouillons = facs.filter(f => f.statut === 'brouillon');
  const du = emises.reduce((s, f) => s + reste(f), 0), duRetard = enRetard.reduce((s, f) => s + reste(f), 0);
  const aEmettre = brouillons.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0);
  const duAbo = emises.reduce((s, f) => s + reste(f) * partAbo(f), 0);

  // Abonnements : clients avec un forfait, et l'état de leur dernière facture de maintenance.
  const abos = F.clients.filter(c => Number(c.abonnement_mensuel) > 0 && c.statut !== 'inactif'
    && (c.statut === 'actif' || F.devis.some(d => d.client_id === c.id && d.statut === 'accepté'))).map(c => {
    const montant = Number(c.abonnement_montant_remise != null ? c.abonnement_montant_remise : c.abonnement_montant_standard) || Number(c.abonnement_mensuel) || 0;
    const annuel = c.abonnement_periodicite === 'annuel';
    // Le pire état gagne : une échéance en retard ne se cache pas derrière le brouillon suivant.
    const fms = facs.filter(f => f.client_id === c.id && partAbo(f) > 0.5).sort((a, b) => String(b.date_emission).localeCompare(String(a.date_emission)));
    const fm = fms[0], ouvertes = fms.filter(f => f.statut !== 'brouillon' && f.statut !== 'payée' && reste(f) > 0.005);
    const etat = !fm ? 'pas encore facturé' : ouvertes.some(f => enRetard.includes(f)) ? 'en retard' : ouvertes.length ? 'en attente'
      : fm.statut === 'brouillon' ? 'à émettre' : 'payé';
    return { c, montant, annuel, parMois: montant / (annuel ? 12 : 3), etat, fm };
  });
  const recurrentMois = abos.reduce((s, a) => s + a.parMois, 0);
  const abosPayes = abos.filter(a => a.etat === 'payé').length, abosRetard = abos.filter(a => a.etat === 'en retard').length;

  // Objectif du mois : signé (devis acceptés datés de leur première facture), comme dans Stats.
  const dateSigne = d => F.factures.filter(f => f.devis_id === d.id).map(f => String(f.date_emission || '')).filter(Boolean).sort()[0] || String(d.date_emission || '');
  const signeMois = F.devis.filter(d => d.statut === 'accepté' && dateSigne(d).startsWith(mois)).reduce((s, d) => s + (Number(d.total_ht) || 0), 0);
  const attente = F.devis.filter(d => d.statut === 'envoyé' && (!d.date_validite || String(d.date_validite) >= auj));
  const enJeu = attente.reduce((s, d) => s + (Number(d.total_ht) || 0), 0);
  const tranches = F.devis.filter(d => d.statut === 'accepté' || d.statut === 'refusé');
  const tauxOui = tranches.length ? tranches.filter(d => d.statut === 'accepté').length / tranches.length : 0;

  // Nos abonnements : prélèvements passés, sur la période et au total.
  const charges = (S.data.charges || []).map(c => { const pr = prelevements(c), mt = c.montant === '' ? null : Number(c.montant);
    return { c, pr, mt, parMois: mt == null ? 0 : mt / (c.rythme === 'annuel' ? 12 : 1), periode: pr.passes.filter(d => d >= debut).length, total: pr.passes.length }; });
  const depPeriode = charges.reduce((s, x) => s + (x.mt || 0) * x.periode, 0), depTotal = charges.reduce((s, x) => s + (x.mt || 0) * x.total, 0);
  const depMois = charges.filter(x => !x.c.fin || x.c.fin >= auj).reduce((s, x) => s + x.parMois, 0);
  const sansMontant = charges.filter(x => x.mt == null && (!x.c.fin || x.c.fin >= auj));
  const prochainDebit = charges.map(x => x.pr.prochain && { d: x.pr.prochain, x }).filter(Boolean).sort((a, b) => a.d.localeCompare(b.d))[0];

  // Devis : création du site, maintenance de la première année, acompte et solde (même règle que la facture).
  const devisL = F.devis.map(d => {
    const L = d.devis_lignes || [], tva = 1 + (Number(d.tva_taux) || 0) / 100;
    const estM = l => typeof NSDocs !== 'undefined' && NSDocs.estMaintenance(l), estF = l => typeof NSDocs !== 'undefined' && NSDocs.estFrais(l);
    const mtn = L.filter(estM).reduce((t, l) => t + (Number(l.montant_ht) || 0), 0);
    const site = L.length ? L.filter(l => !estM(l) && !estF(l)).reduce((t, l) => t + (Number(l.montant_ht) || 0), 0) : Number(d.total_ht) || 0;
    const expire = d.statut === 'envoyé' && d.date_validite && String(d.date_validite) < auj;
    return { d, site, mtn, ttc: Number(d.total_ttc) || 0, acompte: (site / 2 + mtn) * tva, solde: site / 2 * tva, expire,
      etat: expire ? 'expiré' : d.statut };
  }).sort((a, b) => String(b.d.date_emission).localeCompare(String(a.d.date_emission)));
  const devisAttente = devisL.filter(x => x.etat === 'envoyé');
  const potentielMois = devisAttente.reduce((s, x) => s + x.mtn / 12, 0);

  // Encaissements des 6 derniers mois.
  const mois6 = []; for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = fmt(d).slice(0, 7);
    mois6.push({ k, l: MOIS_COURT[d.getMonth()], v: somme(encaissements, e => e.date.startsWith(k)), a: encaissements.filter(e => e.date.startsWith(k)).reduce((s, e) => s + e.montant * partAbo(e.f), 0) }); }

  const outils = `<div class="v-outils"><div class="v-seg">${[['mois', 'Ce mois'], ['90', '90 j'], ['annee', annee], ['tout', 'Tout']].map(([k, l]) =>

  const c1 = `<div class="v-carte v-ar-total"><div class="v-carte-tete"><h3><span class="v-pico">${ICO.barres}</span>Encaissé ${libP}</h3>

  const aFaire = emises.slice().sort((a, b) => (enRetard.includes(b) - enRetard.includes(a)) || String(a.date_echeance).localeCompare(String(b.date_echeance)));

  const c6 = `<div class="v-carte" style="margin-top:14px"><div class="v-carte-tete"><h3><span class="v-pico">${ICO.table}</span>Mouvements<small>${aFaire.length} à encaisser · ${derniers.length} derniers encaissements</small></h3></div>
    ${aFaire.length || derniers.length ? `<div class="v-table-zone"><table class="v-table"><thead><tr><th>Client</th><th>Montant</th><th class="v-hm">Type</th><th class="v-hm">Date</th><th>État</th></tr></thead>
      <tbody>${aFaire.map(ligneFac).join('') + derniers.map(ligneEnc).join('')}</tbody></table></div>` : '<div class="vide">Aucune facture émise pour l’instant.</div>'}</div>`;
  const ETATS = { 'payé': '#93c47d', 'en attente': '#f6b26b', 'en retard': '#dd7e6b', 'à émettre': '#efefef', 'pas encore facturé': '#ffffff' };
  const c7 = `<div class="v-carte" style="margin-top:14px"><div class="v-carte-tete"><h3><span class="v-pico vert">${ICO.gens}</span>Abonnés<small>dernière facture de maintenance de chacun</small></h3></div>
    ${abos.length ? `<div class="v-table-zone"><table class="v-table"><thead><tr><th>Client</th><th>Forfait HT</th><th class="v-hm">Rythme</th><th class="v-hm">Prochaine échéance</th><th>État</th></tr></thead>
      <tbody>${abos.sort((a, b) => b.parMois - a.parMois).map(a => `<tr><td><div class="v-qui">${avatar(a.c.nom_etablissement || '?')}<div><b>${esc(a.c.nom_etablissement || '—')}</b><small>${esc(a.c.formule || '')}</small></div></div></td>
        <td><b>${eur2(a.montant)}</b></td><td class="v-hm"><span class="v-faible">${a.annuel ? 'annuel' : 'trimestriel'}${a.c.abonnement_moyen ? ' · ' + esc(a.c.abonnement_moyen) : ''}</span></td>

        <td><span class="v-st" style="--statut:${ETATS[a.etat]}">${esc(a.etat[0].toUpperCase() + a.etat.slice(1))}</span></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="vide">Aucun client avec un abonnement de maintenance pour l’instant.</div>'}</div>`;

  const nbARelancer = devisARelancer().length;

    ${devisL.length ? `<div class="v-table-zone"><table class="v-table"><thead><tr><th>Client</th><th>Total TTC</th><th class="v-hm">Site HT</th><th class="v-hm">Maintenance HT</th><th class="v-hm">À la signature</th><th class="v-hm">À la mise en ligne</th><th class="v-hm">Valable jusqu’au</th><th>Relance</th><th>État</th></tr></thead>

  const c9 = `<div class="v-carte" style="margin-top:14px"><div class="v-carte-tete" style="flex-wrap:wrap"><h3><span class="v-pico rouge">${SVG('<path d="M12 5v14M19 12l-7 7-7-7"/>')}</span>Nos abonnements<small>ce que NSD paie · ${eur2(depMois)} /mois TTC${sansMontant.length ? ' sans ' + esc(sansMontant.map(x => x.c.nom).join(', ')) : ''}</small></h3>
      <span class="v-delta neutre">${eur2(depTotal)} payés depuis le début</span></div>
    ${charges.length ? `<div class="v-table-zone"><table class="v-table"><thead><tr><th>Abonnement</th><th>Montant</th><th class="v-hm">Depuis</th><th class="v-hm">Prélèvements</th><th class="v-hm">Payé au total</th><th>Prochain</th></tr></thead>
      <tbody>${charges.map(x => `<tr data-charge="${esc(x.c.id)}"><td><div class="v-qui">${avatar(x.c.nom)}<div><b>${esc(x.c.nom)}</b><small>${esc(x.c.note || (x.c.rythme === 'annuel' ? 'chaque année' : 'chaque mois'))}</small></div></div></td>

        <td class="v-hm"><span class="v-faible">${esc(dateFr(x.c.debut))}</span></td><td class="v-hm">${x.total}${x.periode !== x.total ? ` <small class="v-faible">(${x.periode} ${esc(libP)})</small>` : ''}</td>

  return tete(outils) + `<div class="v-ar-haut">${c1}${c2}${c3}</div><div class="v-ar-milieu">${c4}${c5}</div>${c8}${c6}${c9}${c7}`

// ---------------------------------------------------------------------------
// Agenda (25/10/2026, demandé par Nelson) : le Google Agenda du compte NSD, lu et
// écrit en direct par Code.gs (api_agenda…). Pas de copie : ce que Sam pose ici est
// dans Google Agenda, ce qui est posé dans Google Agenda apparaît ici.
// ---------------------------------------------------------------------------
const AG = { H0: 7, H1: 22, PX: 52, cache: {}, charge: {} };
const AG_TYPES = [['[Annulé]', '#9aa0aa', 'Annulé'], ['RDV NSD', '#12a150', 'RDV'], ['Rappel NSD', '#f59e0b', 'Rappel'],
  ['Relance lien NSD', '#2f6bff', 'Relance'], ['Suivi négo NSD', '#c99a00', 'Suivi négo']];
function agType(ev) { const t = AG_TYPES.find(([p]) => ev.titre.indexOf(p) === 0); return t ? { c: t[1], l: t[2] } : { c: '#8e4ec6', l: '' }; }
const agIso = d => fmt(d).slice(0, 10);
const agDate = iso => { const [a, m, j] = iso.split('-').map(Number); return new Date(a, m - 1, j); };
const agPlus = (iso, n) => { const d = agDate(iso); d.setDate(d.getDate() + n); return agIso(d); };
const agLundi = iso => { const d = agDate(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return agIso(d); };
function agPeriode() {
  const v = S.agVue, d = S.agDate;
  if (v === 'jour') return [d, d];
  if (v === 'semaine') return [agLundi(d), agPlus(agLundi(d), 6)];
  const premier = d.slice(0, 8) + '01', debut = agLundi(premier);
  return [debut, agPlus(debut, 41)];
}
function agEvenements(du, au, forcer) {
  const cle = du + '_' + au, c = AG.cache[cle];

// Cinq boutons (décision du 24/09/2026), plus « En cours » pour une négociation
// ouverte (Nelson, 28/09/2026). « Rappel » regroupe trois motifs, qui restent
// distincts dans le Journal : c'est ce qui garde le suivi des appels.
const BOUTONS_RES = [['rappel', 'Rappel'], ['lien'], ['rdv'], ['negociation'], ['refus'], ['note']];
const MOTIFS_RAPPEL = [['pas_repondu', 'Pas de réponse'], ['absent', 'Gérant absent'], ['rappel', 'Convenu avec lui']];
const boutonDe = res => MOTIFS_RAPPEL.some(([k]) => k === res) ? 'rappel' : res;

// Sam : mar, mer, ven 10 h-12 h et 14 h-18 h ; lun, jeu et sam 10 h-12 h (lundi et jeudi après-midi : tournage) ;
// dim 14 h-17 h. Nelson : 9 h-12 h et 13 h 30-20 h, sauf le lundi et le jeudi 9 h-12 h (tournage).
// Trou : Sam 15 h 55-16 h 05 (post Instagram). Vue Équipe : les plages de Sam.
const MATIN_SAM = [['10:00', '12:00']], SEMAINE_SAM = [['10:00', '12:00'], ['14:00', '18:00']];
const JOUR_NELSON = [['09:00', '12:00'], ['13:30', '20:00']], MATIN_NELSON = [['09:00', '12:00']];
const PLAGES = {
  Sam: { 0: [['14:00', '17:00']], 1: MATIN_SAM, 2: SEMAINE_SAM, 3: SEMAINE_SAM, 4: MATIN_SAM, 5: SEMAINE_SAM, 6: MATIN_SAM },
  Nelson: { 0: JOUR_NELSON, 1: MATIN_NELSON, 2: JOUR_NELSON, 3: JOUR_NELSON, 4: MATIN_NELSON, 5: JOUR_NELSON, 6: JOUR_NELSON }
};
const TROUS = { Sam: [['15:55', '16:05']], Nelson: [] };
const hmDe = d => fmt(d).slice(11, 16);
function regler(d, hm) { const [h, m] = hm.split(':').map(Number); d.setHours(h, m, 0, 0); }
// Le premier moment d'appel à partir de d : dans une plage du jour, hors des trous
// de celui qui est connecté. Hors plage : le jour suivant, à la même heure. Une
// heure qui n'est dans aucune plage (après la fin) : l'ouverture du jour même.
function recalerAppel(d) {
  const depart = new Date(d), voulu = hmDe(d);
  const qui = S.moi && PLAGES[S.moi.nom] ? S.moi.nom : 'Sam';
  const caler = x => PLAGES[qui][x.getDay()].some(([debut, fin]) => {
    if (hmDe(x) < debut) regler(x, debut);
    TROUS[qui].forEach(([a, b]) => { if (hmDe(x) >= a && hmDe(x) < b) regler(x, b); });
    return hmDe(x) < fin;
  });
  for (let i = 0; i < 7; i++) {
    if (caler(d)) return d;
    d.setDate(d.getDate() + 1); regler(d, voulu);
  }
  regler(depart, '00:00'); caler(depart);
  return depart;
}
// Le premier créneau libre à partir de d, de 5 en 5 minutes, sans tomber sur un rappel déjà posé
// pour la même personne (le prospect ouvert ne compte pas). Le 25/10/2026, sept rappels de Sam
// notés le samedi vers 9 h 30 s'étaient tous empilés à 10 h le lundi, début de sa plage.
function creneauLibre(d) {
  const qui = S.moi && PLAGES[S.moi.nom] ? S.moi.nom : 'Sam';
  const pris = new Set(S.data.prospects.filter(p => p.id !== S.ouvert && p.rappel && respDe(p) === qui).map(p => String(p.rappel).slice(0, 16)));
  for (let i = 0; i < 200 && pris.has(fmt(d)); i++) d = recalerAppel(new Date(d.getTime() + 5 * 6e4));
  return d;
}
// Le prochain jour d'appel, à la même heure (à 5 min près), recalé dans ses plages,
// puis avancé au premier créneau libre si l'heure est déjà prise.
function demainMemeHeure() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  d.setMinutes(Math.round(d.getMinutes() / 5) * 5, 0, 0);
  return fmt(creneauLibre(recalerAppel(d)));
}

function optionsDates() {
  const o = [], now = new Date();
  const dans = h => { const d = new Date(now.getTime() + h * 36e5); d.setMinutes(d.getMinutes() < 30 ? 30 : 60, 0, 0); return d; };
  const a = (jPlus, h, m) => { const d = new Date(now); d.setDate(d.getDate() + jPlus); d.setHours(h, m || 0, 0, 0); return d; };
  o.push(['Prochain jour, même heure', null]);
  o.push(['Dans 1 h', dans(1)], ['Dans 2 h', dans(2)]);
  if (now.getHours() < 15) o.push(S.moi && S.moi.nom === 'Sam' ? ['Auj. 16 h 10', a(0, 16, 10)] : ['Auj. 16 h', a(0, 16)]);
  o.push(['Demain 10 h', a(1, 10)]);
  // Sam : « Demain 14 h », seulement si demain a une plage à 14 h (donc jamais quand demain est un lundi, un jeudi ou un samedi).
  if (S.moi && S.moi.nom === 'Sam') { const d = a(1, 14); if (fmt(recalerAppel(new Date(d))) === fmt(d)) o.push(['Demain 14 h', d]); }
  else o.push(['Demain 15 h', a(1, 15)]);
  const lundi = a(((8 - now.getDay()) % 7) || 7, 10); o.push(['Lundi 10 h', lundi]);
  return o.map(([l, d]) => [l, d ? fmt(d) : demainMemeHeure()]);
}

function modeleApres(res, p) {
  if (!p || !(telInternational(p.telephone) || p.email)) return null;
  const msgs = S.data.messages || [];
  // Nelson prospecte par WhatsApp sans appel : un premier « Lien envoyé » part

  if (res === 'lien' && S.moi && S.moi.nom === 'Nelson' && !(+p.nb)) {

}

// v : ce que Sam a ajusté avant l'envoi ({nom}, {date}, {lien}). Sans v, le
// gérant, le prochain rappel et la démo de son métier.
function remplir(txt, p, v) {
  const m = metierDe(p);
  v = v || {};
  const nom = v.nom !== undefined ? v.nom : nomCourt(p.gerant);
  const date = v.date !== undefined ? v.date : p.rappel;
  const lien = v.lien !== undefined ? v.lien : (m ? m.lien : '');
  let t = String(txt);
  // Pas de date : la phrase qui l'annonce disparaît (un lien sans relance prévue).
  if (!date && v.attendue) t = t.replace(/{date}/g, '[date à choisir]');
  else if (!date) t = t.split('\n').filter(l => !/{date}/.test(l)).join('\n').replace(/\n{3,}/g, '\n\n');
  return t
    .replace(/ ?{nom}/g, nom ? ' ' + nom : '')
    .replace(/{date}/g, date ? dateMessage(date) : '')
    .replace(/{bonjour}/g, 'Bonjour')
    .replace(/{gerant}/g, p.gerant || '')
    .replace(/{entreprise}/g, p.entreprise || '')
    .replace(/{constat}/g, p.mauvais || '[constat à écrire]')
    .replace(/{metier}/g, m ? m.metier.toLowerCase() : 'votre métier')
    .replace(/{lien}/g, lien)
    .replace(LIEN_VITRINE, u => lienSuivi(u, p))
    .replace(/{rdv}/g, p.rappel ? dateLongue(p.rappel) : '[date du RDV]')
    .replace(/{envoi}/g, dateEnvoi(p.dernier))
    .replace(/\bSamir\b/g, signataire().prenom)
    .replace(/{signature}/g, signataire().texte);
}
// Une démo envoyée porte l'ID du prospect (?p=P0412) : la vitrine prévient le CRM quand il
// l'ouvre (sites-web/ns-development/suivi.js). Un lien vers un autre site ne change pas.
const LIEN_VITRINE = /https?:\/\/(nsdevelopment26\.github\.io\/nsd-vitrine|(www\.)?nsdevelopment\.lu)[^\s<>"']*[^\s<>"'.,;:!?)]/g;
function lienSuivi(lien, p) {
  if (!lien || !p || !p.id || /[?&]p=/.test(lien)) return lien;
  const [base, ancre] = lien.split('#');
  return base + (base.includes('?') ? '&' : '?') + 'p=' + encodeURIComponent(p.id) + (ancre ? '#' + ancre : '');
}
// {envoi} : le jour du dernier message, « le 29 septembre », pour la relance.
function dateEnvoi(s) {
  const d = s ? new Date(String(s).replace(' ', 'T')) : null;
  return d && !isNaN(d) ? 'le ' + (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + MOIS[d.getMonth()] : 'il y a quelques jours';
}
// « Jean-Marc DUPONT » → « Jean-Marc Dupont ». Sam le change en « Monsieur Dupont » s'il veut.
function nomCourt(g) {
  return String(g || '').split(/[\/;,]| et /)[0].trim().toLowerCase()
    .replace(/(^|[\s'’-])(\p{L})/gu, (x, a, b) => a + b.toUpperCase());
}
// « aujourd'hui à 16 h », « demain à 10 h 30 », « lundi 29 septembre à 10 h ».
function dateMessage(s) {
  const d = versDate(s); if (!d) return '';
  const j = s.slice(0, 10), h = heure(s).replace(/h(\d)/, 'h $1');
  if (j === aujourdhui()) return 'aujourd’hui à ' + h;
  const demain = new Date(); demain.setDate(demain.getDate() + 1);
  if (j === fmt(demain).slice(0, 10)) return 'demain à ' + h;
  return JOURS_LONG[d.getDay()] + ' ' + (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + MOIS[d.getMonth()] + ' à ' + h;

    <button class="btn clair" data-action="fermer-msg">Pas envoyé</button>
    <button class="btn" data-action="noter-msg" data-titre="${esc(canal + ' : ' + titre)}">Oui, noter</button></div>`;
}

// --- Message d'après-appel ------------------------------------------------
// Rappel convenu, RDV obtenu, Lien envoyé : chacun son texte (onglet Messages,
// colonne APRÈS). Sam ajuste le nom et l'heure, le texte suit.
const APRES = { modele: null, v: null, genere: '', id: '' };

// Nom, date ou lien changé : on remplace dans le texte, sans perdre ce que Sam a retouché à la main.
function majMessageApres() {
  const p = trouver(S.ouvert), zone = document.getElementById('msg-texte');
  const lienEl = document.getElementById('apres-lien');
  const v = { nom: document.getElementById('apres-nom').value.trim(),
    date: dateChoisie(),
    lien: lienEl ? lienEl.value.trim() : APRES.v.lien, attendue: APRES.v.attendue };
  if (!zone) return;
  const neuf = remplir(APRES.modele.texte, p, v);
  if (zone.value === APRES.genere) zone.value = neuf;
  else {
    let t = zone.value;
    if (APRES.v.nom !== v.nom) t = t.replace('Bonjour' + (APRES.v.nom ? ' ' + APRES.v.nom : '') + ',', 'Bonjour' + (v.nom ? ' ' + v.nom : '') + ',');
    if (APRES.v.date !== v.date) {
      const avant = APRES.v.date ? dateMessage(APRES.v.date) : (APRES.v.attendue ? '[date à choisir]' : '');
      if (avant && v.date) t = t.split(avant).join(dateMessage(v.date));
      else if (!avant || !v.date) t = neuf; // la phrase de relance apparaît ou disparaît : on repart du modèle
    }
    if (APRES.v.lien && APRES.v.lien !== v.lien) t = t.split(APRES.v.lien).join(v.lien);
    zone.value = t;
  }
  APRES.v = v; APRES.genere = neuf;
}

function urlMessage(canal, p, txt, titre) {
  if (canal === 'whatsapp') return 'https://wa.me/' + telInternational(p.telephone) + '?text=' + encodeURIComponent(txt);
  if (canal === 'sms') return 'sms:+' + telInternational(p.telephone) + '?&body=' + encodeURIComponent(txt);
  // Un mail porte toujours la signature complète de celui qui l'envoie, à la place du « Prénom, NS Development ».
  const corps = txt.replace(new RegExp('\\n*' + signataire().prenom + ', NS Development\\s*$'), '') + '\n\n' + signataire().texte;
  return 'mailto:' + encodeURIComponent(p.email) + '?subject=' + encodeURIComponent(p.entreprise + ' : ' + titre.toLowerCase()) + '&body=' + encodeURIComponent(corps);
}

// WhatsApp touché avec un message prêt : on ouvre tout de suite (sinon le
// téléphone bloque l'ouverture), puis le résultat s'enregistre avec la trace du message.
function envoyerDirect(canal) {
  const res = CHOIX.res, def = S.data.resultats[res], p = trouver(S.ouvert);
  const txt = document.getElementById('msg-texte').value;
  if ((def.rappelObligatoire && !dateChoisie()) || txt.includes('[date à choisir]')) {
    toast('Choisis d’abord la date, elle s’écrit dans le message.', true);
    const z = document.getElementById('zone-res'); if (z) z.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  window.open(urlMessage(canal, p, txt, APRES.modele.titre), '_blank');
  enregistrer(document.querySelector('[data-action="enregistrer"]'), (canal === 'sms' ? 'SMS' : canal === 'mail' ? 'Mail' : 'WhatsApp') + ' envoyé : ' + APRES.modele.titre);
}

async function enregistrer(btn, message) {
  const res = CHOIX.res, def = S.data.resultats[res];
  const precise = document.getElementById('date-precise');
  const rappel = (precise && precise.value ? precise.value.replace('T', ' ') : CHOIX.rappel) || '';
  const pr = trouver(S.ouvert);
  const garderRdv = pr && cle(pr) === 'rdv' && (res === 'pas_repondu' || res === 'absent');
  if (def.rappelObligatoire && !rappel && !garderRdv) return toast('Choisis une date.', true);
  const note = [(document.getElementById('note-res') || {}).value || '', message || ''].filter(Boolean).join(' · ');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const p = await appel('api_logger', S.pin, S.ouvert, res, note, rappel, S.par, res === 'rdv' ? CHOIX.duree : null);
    // majLocale efface les champs _ : on les lit avant.
    const perdu = p._perdu, agenda = p._agenda || '';
    majLocale(p, { resultat: def.label, note: perdu ? [note, '3e appel sans réponse : passé en Perdu'].filter(Boolean).join(' · ') : note, rappel: perdu ? '' : rappel });
    toast(perdu ? '3e appel sans réponse : passé en Perdu.' : '« ' + def.label + ' » enregistré.' + (agenda ? ' ' + agenda + '.' : ''), /NON/.test(agenda));
    // En session, le prospect suivant s'ouvre tout seul.
    if (SESSION.actif && pr && SESSION.courant === pr.id) {
      SESSION.faits++; if (res === 'rdv') SESSION.rdv++; if (res === 'lien') SESSION.liens++; garderSession();
      rendre(); setTimeout(suivantSession, 350);
    } else { rendre(); fermerFiche(); }
  } catch (e) { btn.disabled = false; btn.textContent = 'Réessayer'; toast(e.message || String(e), true); }
}

function majLocale(p, entree) {
  delete p._ligne; delete p._agenda; delete p._perdu;
  const i = S.data.prospects.findIndex(x => x.id === p.id);
  const ancien = S.data.prospects[i] || {};
  const neuf = Object.assign({}, ancien, p); delete neuf._metier;
  if (i >= 0) S.data.prospects[i] = neuf; else S.data.prospects.push(neuf);
  if (entree) S.data.journal.push(Object.assign({ date: maintenant(), id: p.id, entreprise: p.entreprise, statut: neuf.statut, par: S.moi.nom }, entree));
}

async function noterMessage(titre) {
  // Un résultat est déjà choisi (Rappel, RDV…) : le message l'enregistre avec, la fiche se range au bon endroit.
  const btn = document.querySelector('[data-action="enregistrer"]');
  if (CHOIX.res && btn) return enregistrer(btn, titre);
  try {
    const p = await appel('api_logger', S.pin, S.ouvert, 'message', titre, '', S.par, null);
    majLocale(p, { resultat: 'Message envoyé', note: titre, rappel: '' });
    toast('Message noté.'); rendreFiche(); rendre();
    return true;
  } catch (e) { toast(e.message || String(e), true); return false; }
}

async function sauverEdition(form) {
  const champs = Object.fromEntries(new FormData(form).entries());
  champs.rappel = champs.rappel ? champs.rappel.replace('T', ' ') : '';
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const p = await appel('api_modifier', S.pin, S.ouvert, champs);
    const agenda = p._agenda || '';
    majLocale(p); toast('Fiche mise à jour.' + (agenda ? ' ' + agenda + '.' : '')); rendreFiche(); rendre();
  } catch (e) { btn.disabled = false; toast(e.message || String(e), true); }
}

async function ajouter(form, forcer) {
  const champs = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const r = await appel('api_ajouter', S.pin, champs, S.par, !!forcer);
    if (r.doublons) {
      btn.disabled = false;
      document.getElementById('zone-doublons').innerHTML = `<div class="doublon"><b>Déjà dans le Sheets ?</b><br>
        ${r.doublons.map(d => `<a href="#" data-ouvrir="${esc(d.id)}">${esc(d.entreprise)}</a> · ${esc(d.telephone || 'sans tél.')} · ${esc(d.statut)}`).join('<br>')}
        <p style="margin:10px 0 0"><button class="btn clair large" data-action="forcer-ajout">Ce n’est pas le même, ajouter quand même</button></p></div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    majLocale(r.prospect, { resultat: 'Ajout', note: champs.notes || '', rappel: '' });
    if (S.lieuAjout) { Carte.lieuPour(r.prospect.id, S.lieuAjout); S.lieuAjout = null; }
    toast(r.prospect.entreprise + ' ajouté.');
    S.vue = 'jour'; rendre(); ouvrirFiche(r.prospect.id);
  } catch (e) { btn.disabled = false; toast(e.message || String(e), true); }
}

  const mo = e.target.closest('[data-motif]');

  const ch = e.target.closest('tr[data-charge]');

  const es = e.target.closest('[data-espace]');

document.getElementById('btn-connexion').addEventListener('click', connexion);

async function connexion() {
  const pin = document.getElementById('pin').value.trim();
  if (!pin) return toast('Entre le code.', true);
  try { const moi = await appel('api_connexion', pin); S.pin = pin; stocker('pin', pin); stocker('espace', ''); demarrer(); toast('Bonjour ' + moi.nom + '.'); }
  catch (e) { toast(e.message || String(e), true); }
}

let chargementEnCours = null;
function charger() {
  // Un seul rechargement à la fois ; celui qui revient après une écriture est périmé.
  if (chargementEnCours) return chargementEnCours;
  const avant = S.ecritures;
  chargementEnCours = appel('api_charger', S.pin).then(d => {
    if (S.data && S.ecritures !== avant) return;
    S.data = d; appliquerDonnees();
  }).finally(() => { chargementEnCours = null; });
  return chargementEnCours;
}
function appliquerDonnees() {
  S.data.prospects.forEach(p => delete p._ligne);
  ['reels', 'audience', 'partages'].forEach(k => { S.data[k] = S.data[k] || []; });
  S.data.vues = S.data.vues || {};
  S.data.lieux = S.data.lieux || {};
  S.data.partage = S.data.partage || { lotParJour: 25, joursEntreDeux: 14 };
  S.moi = S.data.moi; S.par = S.moi.nom;
  // On arrive toujours sur son propre espace, sauf si on en a choisi un autre.
  if (![...S.data.equipe, EQUIPE_VUE].includes(S.espace)) S.espace = S.moi.nom;
  rendre();
  Factu.init();
}

async function demarrer() {
  document.getElementById('ecran-connexion').classList.add('cache');
  document.getElementById('app').classList.remove('cache');
  try { await charger(); }
  catch (e) {
    if (/Code/.test(e.message || '')) { stocker('pin', ''); location.reload(); return; }
    document.getElementById('vue').innerHTML = `<div class="vide">Impossible de lire le Sheets : ${esc(e.message || e)}</div>`;
  }
}

// Recharge les données quand Sam revient sur l'appli (après un appel par exemple).
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.pin && S.data && !S.ouvert) charger().catch(() => {}); });
setInterval(() => { if (S.data && !S.ouvert && !document.hidden && S.vue !== 'ajouter' && S.vue !== 'carte') rendre(); }, 60000);

// Démo ouverte : toutes les 2 minutes, les vues seules (pas tout le Sheets), et une alerte
// quand un de ses prospects vient d'ouvrir sa démo. Serveur pas encore à jour : on s'arrête.
let vuesActives = true;
async function verifierVues() {
  if (!vuesActives || !S.data || !S.pin || document.hidden) return;
  try {
    const v = await appel('api_vues', S.pin) || {};
    const avant = S.data.vues || {};
    const neufs = S.data.prospects.filter(p => visible(p) && v[p.id] && (!avant[p.id] || v[p.id].derniere > avant[p.id].derniere));
    S.data.vues = v;
    const chauds = neufs.filter(chaud);
    if (chauds.length) toast(chauds.length === 1 ? chauds[0].entreprise + ' vient d’ouvrir la démo.' : chauds.length + ' prospects viennent d’ouvrir leur démo.');
    if (neufs.length && !S.ouvert && S.vue !== 'ajouter' && S.vue !== 'carte') rendre();
  } catch (e) { if (/inconnue/i.test(e.message || '')) vuesActives = false; }
}
setInterval(verifierVues, 120000);

// Ouverte depuis script.google.com (et non la version installable) : on guide vers la bonne adresse.
if (!window.CRM_API) document.getElementById('bandeau-installer').classList.remove('cache');

S.pin = lire('pin');
S.espace = lire('espace');
if (S.pin) demarrer();
else document.getElementById('ecran-connexion').classList.remove('cache');

var NSContrat = {"version": "23/09/2026", "css": ".k {--k-ink:#16161a; --k-soft:#45454d; --k-muted:#76767f; --k-line:#d9d9de; --k-fill:#f4f4f6;}\n.k {-webkit-print-color-adjust: exact; print-color-adjust: exact;}\n.k {margin: 0; background: #fff; color: var(--k-ink);\n         font: 9.6pt/1.5 \"Helvetica Neue\", Helvetica, Arial, sans-serif;}\n.k .k-page {max-width: 176mm; margin: 0 auto; padding: 8mm 0;}\n.k .k-doc-tete {display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--k-ink);\n               padding-bottom: 10px; margin-bottom: 14px;}\n.k .k-doc-tete img {width: 44px; height: 44px; border-radius: 9px;}\n.k .k-doc-tete .k-id {flex: 1;}\n.k .k-doc-tete .k-id b {font-size: 13pt; letter-spacing: .01em;}\n.k .k-doc-tete .k-id small {display: block; color: var(--k-muted); font-size: 8pt;}\n.k .k-doc-tete .k-ver {text-align: right; font-size: 8pt; color: var(--k-muted);}\n.k h1 {font-size: 16pt; margin: 4px 0 2px; letter-spacing: -.01em;}\n.k .k-sub {color: var(--k-soft); margin: 0 0 14px;}\n.k h2 {font-size: 11.5pt; margin: 18px 0 6px; padding-top: 4px; border-top: 1px solid var(--k-line);}\n.k h3 {font-size: 10pt; margin: 12px 0 3px;}\n.k p {margin: 0 0 6px; text-align: justify; hyphens: auto;}\n.k ul, .k ol {margin: 0 0 6px; padding-left: 18px;}\n.k li {margin-bottom: 2px; text-align: justify; hyphens: auto;}\n.k table {width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 9pt;}\n.k th, .k td {border: 1px solid var(--k-line); padding: 5px 7px; vertical-align: top; text-align: left;}\n.k th {background: var(--k-fill); font-weight: 600;}\n.k .k-blank {display: inline-block; min-width: 60mm; border-bottom: 1px solid var(--k-ink); height: 1.2em; vertical-align: bottom;}\n.k .k-blank.k-s {min-width: 28mm;}\n.k .k-blank.k-l {min-width: 110mm;}\n.k .k-box {display: inline-block; width: 10px; height: 10px; border: 1px solid var(--k-ink); margin: 0 5px -1px 0;}\n.k .k-field td:first-child {width: 36%; color: var(--k-soft);}\n.k .k-
