var NSContrat = {"version": "23/09/2026", "css": ".k {--k-ink:#16161a; --k-soft:#45454d; --k-muted:#76767f; --k-line:#d9d9de; --k-fill:#f4f4f6;}\n.k {-webkit-print-color-adjust: exact; print-color-adjust: exact;}\n.k {margin: 0; background: #fff; color: var(--k-ink);\n         font: 9.6pt/1.5 \"Helvetica Neue\", Helvetica, Arial, sans-serif;}\n.k .k-page {max-width: 176mm; margin: 0 auto; padding: 8mm 0;}\n.k .k-doc-tete {display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--k-ink);\n               padding-bottom: 10px; margin-bottom: 14px;}\n.k .k-doc-tete img {width: 44px; height: 44px; border-radius: 9px;}\n.k .k-doc-tete .k-id {flex: 1;}\n.k .k-doc-tete .k-id b {font-size: 13pt; letter-spacing: .01em;}\n.k .k-doc-tete .k-id small {display: block; color: var(--k-muted); font-size: 8pt;}\n.k .k-doc-tete .k-ver {text-align: right; font-size: 8pt; color: var(--k-muted);}\n.k h1 {font-size: 16pt; margin: 4px 0 2px; letter-spacing: -.01em;}\n.k .k-sub {color: var(--k-soft); margin: 0 0 14px;}\n.k h2 {font-size: 11.5pt; margin: 18px 0 6px; padding-top: 4px; border-top: 1px solid var(--k-line);}\n.k h3 {font-size: 10pt; margin: 12px 0 3px;}\n.k p {margin: 0 0 6px; text-align: justify; hyphens: auto;}\n.k ul, .k ol {margin: 0 0 6px; padding-left: 18px;}\n.k li {margin-bottom: 2px; text-align: justify; hyphens: auto;}\n.k table {width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 9pt;}\n.k th, .k td {border: 1px solid var(--k-line); padding: 5px 7px; vertical-align: top; text-align: left;}\n.k th {background: var(--k-fill); font-weight: 600;}\n.k .k-blank {display: inline-block; min-width: 60mm; border-bottom: 1px solid var(--k-ink); height: 1.2em; vertical-align: bottom;}\n.k .k-blank.k-s {min-width: 28mm;}\n.k .k-blank.k-l {min-width: 110mm;}\n.k .k-box {display: inline-block; width: 10px; height: 10px; border: 1px solid var(--k-ink); margin: 0 5px -1px 0;}\n.k .k-field td:first-child {width: 36%; color: var(--k-soft);}\n.k .k-  contracte pas avec des consommateurs.</p>\n  <p>1.3. Elles sont remises au Client avant la signature du contrat, jointes aux conditions particulières et consultables à tout moment sur le site internet du Prestataire. La signature des conditions particulières emporte leur acceptation.</p>\n  <p>1.4. Elles prévalent sur toutes conditions générales ou d'achat du Client, sauf dérogation écrite et signée par le Prestataire.</p>\n\n  <h2>Article 2. Formation du contrat</h2>\n  <p>2.1. Les devis du Prestataire sont valables pendant la durée qui y est indiquée, à défaut pendant trente (30) jours.</p>\n  <p>2.2. Le contrat est formé par la signature des conditions particulières par les deux parties. Les travaux commencent à réception de l'acompte.</p>\n\n  <h2>Article 3. Création du site</h2>\n  <p>3.1. <b>Contenu de la prestation.</b> Le Prestataire réalise le site décrit au devis. Toute fonctionnalité ou page non mentionnée au devis fait l'objet d'un devis complémentaire.</p>\n  <p>3.2. <b>Collaboration du Client.</b> Le Client fournit dans les meilleurs délais les éléments nécessaires : textes, photos, logo, informations légales, horaires, tarifs, accès à ses comptes existants. Les délais annoncés par le Prestataire sont indicatifs et courent à compter de la réception de l'acompte et de ces éléments.</p>\n  <p>3.3. <b>Corrections.</b> Le prix de la création comprend deux (2) séries de corrections sur la proposition présentée, sauf mention contraire au devis. Les demandes au-delà, ou qui modifient le cahier des charges initial, sont facturées sur devis.</p>\n  <p>3.4. <b>Validation.</b> Lorsque le site est prêt, le Prestataire le présente au Client, qui dispose de dix (10) jours ouvrables pour le valider ou signaler par écrit les points non conformes au devis. Sans réponse dans ce délai, le site est réputé validé. Une validation n'exclut pas la correction ultérieure d'un défaut technique.</p>\n  <p>3.5. <b>Mise en ligne.</b> Le site est mis en ligne après sa validation et le paiement du solde. La date de mise en ligne marque le début du contrat de maintenance et d'hébergement.</p>\n  <p>3.6. <b>Inaction du Client.</b> Si le Client ne fournit pas les éléments demandés ou ne se prononce pas sur le site dans un délai de soixante (60) jours à compter de la demande écrite du Prestataire, celui-ci peut facturer le solde de la création. Le site est alors conservé et mis en ligne dès réception des éléments ou de la validation.</p>\n  <p>3.7. <b>Renonciation du Client.</b> Si le Client renonce au projet après le début des travaux, l'acompte reste acquis au Prestataire en contrepartie du travail engagé, sauf manquement de ce dernier.</p>\n\n  <h2>Article 4. Maintenance et hébergement : contenu du service</h2>\n  <p>4.1. Le forfait de maintenance comprend :</p>\n  <ul>\n    <li>l'hébergement du site au Luxembourg, auprès de Visual Online S.A. (Contern) ;</li>\n    <li>l'enregistrement et le renouvellement du nom de domaine au nom du Client ;</li>\n    <li>une (1) boîte mail professionnelle sur ce domaine, les boîtes supplémentaires étant en option ;</li>\n    <li>la maintenance technique, les mises à jour, la surveillance de sécurité, le certificat de sécurité (https) et les sauvegardes ;</li>\n    <li>l'assistance par e-mail et par téléphone, les jours ouvrables ;</li>\n    <li>les petites modifications définies à l'article 4.2.</li>\n  </ul>\n  <p>4.2. <b>Petites modifications.</b> Sont comprises les mises à jour de contenus existants : textes, photos, horaires, prix, carte ou menu, coordonnées, dans la limite d'une (1) heure de travail par trimestre, non reportable. Ne sont pas comprises : la création de nouvelles pages ou fonctionnalités, une refonte graphique, la rédaction de nouveaux contenus. Ces travaux, et les modifications au-delà de la limite, font l'objet d'un devis préalable accepté par le Client. L'option « modifications illimitées raisonnables » lève la limite horaire pour les mises à jour de contenus existants, dans un usage normal.</p>\n  <p>4.3. <b>Délais d'intervention.</b> Le Prestataire traite les demandes courantes dans un délai de cinq (5) jours ouvrables et les incidents rendant le site inaccessible dans les meilleurs délais.</p>\n  <p>4.4. <b>Obligation de moyens.</b> Le Prestataire met en œuvre les moyens raisonnables pour assurer la disponibilité et la sécurité du site. La disponibilité dépend aussi d'infrastructures tierces (hébergeur, registre des noms de domaine, réseaux) : une interruption temporaire, notamment pour maintenance, ne constitue pas un manquement.</p>\n  <p>4.5. <b>Caractère obligatoire.</b> Le Prestataire n'héberge et ne met en ligne un site qu'avec un contrat de maintenance en cours.</p>\n\n  <h2>Article 5. Durée de la maintenance</h2>\n  <p>5.1. Le contrat de maintenance et d'hébergement est conclu pour une <b>durée initiale ferme de douze (12) mois</b> à compter de la mise en ligne, que le Client ait choisi un paiement trimestriel ou annuel. Le paiement trimestriel est une facilité de paiement et ne réduit pas cette durée.</p>\n  <p>5.2. À l'issue de la durée initiale, le contrat se <b>renouvelle automatiquement par périodes successives de douze (12) mois</b>, sauf résiliation dans les conditions de l'article 6.</p>\n\n  <h2>Article 6. Résiliation</h2>\n  <p>6.1. <b>À l'échéance.</b> Chaque partie peut mettre fin au contrat à l'échéance de la période en cours en notifiant sa décision <b>au moins deux (2) mois avant cette échéance</b>, par lettre recommandée avec accusé de réception, ou par e-mail adressé à l'adresse de notification de l'autre partie et dont celle-ci accuse réception. Le Prestataire accuse réception d'une résiliation reçue par e-mail dans un délai de cinq (5) jours ouvrables.</p>\n  <p>6.2. <b>En cours de période.</b> Une résiliation à l'initiative du Client en cours de période ne prend effet qu'à l'échéance de celle-ci. Les sommes dues jusqu'à cette échéance restent dues ; en cas de paiement trimestriel, les trimestres restants de la période deviennent exigibles.</p>\n  <p>6.3. <b>Pour manquement.</b> En cas de manquement grave de l'une des parties à ses obligations, non réparé trente (30) jours après une mise en demeure par lettre recommandée, l'autre partie peut résilier le contrat de plein droit, sans préjudice de tous dommages et intérêts.</p>\n  <p>6.4. Les conséquences de la fin du contrat sont réglées à l'article 13.</p>\n\n  <h2>Article 7. Prix, facturation et paiement</h2>\n  <p>7.1. Les prix sont exprimés en euros <b>hors taxes</b>. La TVA luxembourgeoise au taux en vigueur à la date de facturation s'y ajoute (17 % à la date des présentes conditions).</p>\n  <p>7.2. <b>Création :</b> 50 % du prix à la signature, 50 % avant la mise en ligne.</p>\n  <p>7.3. <b>Maintenance :</b> facturée <b>d'avance</b>, au début de chaque trimestre ou de chaque année selon le rythme choisi. Les options récurrentes suivent le même rythme.</p>\n  <p>7.4. Les factures sont payables par virement bancaire dans un délai de <b>quinze (15) jours</b> à compter de leur date, sauf délai différent indiqué sur la facture.</p>\n  <p>7.5. <b>Retard de paiement.</b> Conformément à la loi modifiée du 18 avril 2004 relative aux délais de paiement et aux intérêts de retard, toute somme non payée à l'échéance porte de plein droit, sans mise en demeure, intérêt au taux légal applicable aux transactions commerciales, et donne lieu à une indemnité forfaitaire de quarante (40) euros pour frais de recouvrement. Le Prestataire peut réclamer une indemnisation complémentaire raisonnable si les frais de recouvrement exposés dépassent ce montant.</p>\n  <p>7.6. <b>Révision des prix.</b> Le Prestataire peut réviser le prix de la maintenance une fois par an, pour la période suivante. Il en informe le Client par écrit <b>au moins trois (3) mois avant l'échéance</b>, de sorte que le Client puisse résilier dans le délai de l'article 6.1 s'il n'accepte pas le nouveau prix.</p>\n\n  <h2>Article 8. Suspension en cas d'impayé</h2>\n  <p>8.1. Si une facture reste impayée quinze (15) jours après son échéance, le Prestataire adresse au Client une mise en demeure par écrit. Si le paiement n'intervient pas dans les huit (8) jours de cette mise en demeure, le Prestataire peut suspendre l'accès au site et aux services associés.</p>\n  <p>8.2. La suspension ne met pas fin au contrat, ne suspend pas les sommes dues et n'entraîne aucune suppression de données. Le service est rétabli dans les deux (2) jours ouvrables suivant le paiement intégral des sommes échues.</p>\n  <p>8.3. La suspension ne porte jamais sur le nom de domaine, qui reste la propriété du Client (article 9).</p>\n\n  <h2>Article 9. Nom de domaine</h2>\n  <p>9.1. Le nom de domaine est enregistré <b>au nom du Client, qui en est le seul titulaire</b>. Le Prestataire est désigné comme contact technique et en assure le renouvellement pendant la durée du contrat.</p>\n  <p>9.2. Le Client garantit que le nom choisi ne porte pas atteinte aux droits de tiers (marques, dénominations, noms commerciaux) et tient ses coordonnées de titulaire à jour.</p>\n  <p>9.3. À la fin du contrat, ou à tout moment sur demande écrite du Client, le Prestataire lui remet dans un délai de dix (10) jours ouvrables le code de transfert du domaine et l'assiste pour le changement de contact technique. Cette remise est due <b>indépendamment de tout litige sur le paiement</b>.</p>\n\n  <h2>Article 10. Propriété intellectuelle</h2>\n  <p>10.1. <b>Contenus du Client.</b> Les textes, photos, logos, marques et autres éléments fournis par le Client restent sa propriété. Il concède au Prestataire le droit de les utiliser pour réaliser, héberger et maintenir le site, et garantit disposer des droits nécessaires. Il garantit le Prestataire contre toute réclamation de tiers à ce titre.</p>\n  <p>10.2. <b>Créations réalisées pour le Client.</b> Sous réserve du <b>paiement intégral du prix de la création</b>, le Prestataire cède au Client, pour la durée légale de protection et pour le monde entier, les droits patrimoniaux de reproduction, de représentation et d'adaptation sur les éléments graphiques et les textes créés spécifiquement pour son site, aux fins de leur exploitation sur son site internet et sur ses supports de communication. Jusqu'au paiement intégral, le Client ne dispose que d'un droit d'usage provisoire.</p>\n  <p>10.3. <b>Savoir-faire et outils du Prestataire.</b> Le Prestataire conserve la propriété de ses méthodes, modèles de mise en page, bibliothèques de code, effets et animations génériques, ainsi que de ses modules logiciels (notamment le module de prise de rendez-vous et l'espace client), qu'il peut réutiliser pour d'autres clients. Le Client reçoit sur ces éléments, dans la mesure où ils sont intégrés à son site, un droit d'utilisation non exclusif pour les besoins de ce site. Le Prestataire s'interdit de reproduire pour un tiers l'identité propre du Client : son nom, son logo, ses textes et ses photos.</p>\n  <p>10.4. <b>Services hébergés.</b> Les modules fonctionnant sur l'infrastructure du Prestataire (prise de rendez-vous, espace client, envoi automatique de messages) sont fournis comme un service pendant la durée du contrat de maintenance. Ils cessent à la fin de celui-ci ; les données du Client lui sont alors restituées conformément à l'article 13 et à l'annexe « Traitement des données personnelles ».</p>\n  <p>10.5. <b>Références.</b> Selon le choix exprimé aux conditions particulières, le Prestataire peut présenter le site dans ses références et y faire figurer une mention discrète « Site réalisé par NS Development ». Le Client peut retirer cette autorisation à tout moment par écrit, avec effet dans un délai de trente (30) jours.</p>\n  <p>10.6. <b>Éléments de tiers.</b> Les polices de caractères, images et composants de tiers sont utilisés selon leurs licences respectives, que le Client s'engage à respecter.</p>\n\n  <h2>Article 11. Obligations du Client</h2>\n  <p>11.1. Le Client est l'<b>éditeur</b> de son site et reste responsable des informations qui y sont publiées : exactitude de ses prix, horaires, offres, mentions obligatoires propres à son activité (par exemple les allergènes en restauration ou les règles déontologiques d'une profession réglementée).</p>\n  <p>11.2. Le Prestataire rédige les pages « Mentions légales » et « Politique de confidentialité » du site à partir des informations que le Client lui communique. Le Client vérifie ces informations et signale sans délai tout changement (adresse, forme sociale, numéros d'immatriculation, autorisation d'établissement).</p>\n  <p>11.3. Le Client garde confidentiels ses identifiants d'accès et n'utilise pas le site ou la messagerie à des fins illicites ou contraires aux bonnes mœurs, ni pour l'envoi de messages commerciaux non sollicités.</p>\n\n  <h2>Article 12. Données personnelles</h2>\n  <p>12.1. Chaque partie traite les données personnelles dont elle a la charge dans le respect du règlement (UE) 2016/679 (RGPD) et de la loi du 1er août 2018 portant organisation de la Commission nationale pour la protection des données.</p>\n  <p>12.2. Pour les données qu'il traite <b>pour le compte du Client</b> (formulaires du site, messagerie, prise de rendez-vous), le Prestataire agit en qualité de <b>sous-traitant</b> au sens de l'article 28 du RGPD, dans les conditions de l'annexe « Traitement des données personnelles », qui fait partie intégrante du contrat.</p>\n  <p>12.3. Pour les données de ses propres clients et prospects (gestion commerciale, facturation), le Prestataire agit en qualité de responsable du traitement, conformément à sa politique de confidentialité publiée sur son site.</p>\n  <p>12.4. Les sites livrés par le Prestataire ne déposent pas de cookies ou traceurs non essentiels sans le consentement préalable des visiteurs et chargent leurs polices de caractères depuis leur propre hébergement. Tout ajout demandé par le Client (outil de mesure d'audience, publicité, réseaux sociaux intégrés) s'accompagne du recueil du consentement requis.</p>\n\n  <h2>Article 13. Fin du contrat et restitution</h2>\n  <p>13.1. À la fin du contrat de maintenance, pour quelque cause que ce soit, l'hébergement du site et des boîtes mail prend fin à la date d'effet de la résiliation. Il appartient au Client de récupérer le contenu de ses boîtes mail avant cette date ; le Prestataire lui indique la marche à suivre sur demande.</p>\n  <p>13.2. Sur demande écrite formulée au plus tard trente (30) jours après la fin du contrat, et sous réserve du paiement de la création, le Prestataire remet au Client une archive des fichiers de son site dans son état à la date de fin, ainsi que l'export de ses données prévu à l'annexe. L'assistance à la migration vers un autre prestataire est facturée sur devis.</p>\n  <p>13.3. Le code de transfert du nom de domaine est remis dans les conditions de l'article 9.3.</p>\n\n  <h2>Article 14. Responsabilité</h2>\n  <p>14.1. Le Prestataire est tenu d'une obligation de moyens. Il n'est pas responsable des dommages indirects, tels que perte de chiffre d'affaires, de clientèle, de données non sauvegardées par le Client ou atteinte à l'image, ni des défaillances de services tiers qu'il ne maîtrise pas (plateformes de réservation, réseaux sociaux, moteurs de recherche, fournisseurs d'accès).</p>\n  <p>14.2. Sa responsabilité, toutes causes confondues, est limitée au montant hors taxes payé par le Client au titre du contrat au cours des douze (12) mois précédant le fait générateur.</p>\n  <p>14.3. Ces limitations ne s'appliquent pas en cas de faute lourde ou intentionnelle, ni aux dommages corporels.</p>\n  <p>14.4. Le Prestataire ne garantit pas un positionnement déterminé dans les moteurs de recherche, qui dépend de facteurs qu'il ne maîtrise pas.</p>\n\n  <h2>Article 15. Force majeure</h2>\n  <p>Aucune partie n'est responsable d'un manquement causé par un événement de force majeure au sens du droit luxembourgeois. L'exécution est suspendue pendant la durée de l'événement. Si celui-ci dure plus de deux (2) mois, chaque partie peut résilier le contrat par lettre recommandée, sans indemnité.</p>\n\n  <h2>Article 16. Sous-traitance et confidentialité</h2>\n  <p>16.1. Le Prestataire peut recourir à des prestataires techniques (hébergement, envoi de messages, base de données). Il reste responsable envers le Client de leur intervention. Ceux qui traitent des données personnelles du Client sont listés dans l'annexe.</p>\n  <p>16.2. Chaque partie garde confidentielles les informations non publiques de l'autre dont elle a connaissance à l'occasion du contrat, pendant sa durée et deux (2) ans après sa fin.</p>\n\n  <h2>Article 17. Dispositions diverses</h2>\n  <p>17.1. <b>Modification des conditions générales.</b> Une nouvelle version s'applique au contrat en cours à compter du renouvellement suivant, si elle a été communiquée au Client au moins trois (3) mois avant l'échéance. À défaut d'acceptation, le Client peut résilier dans les conditions de l'article 6.1.</p>\n  <p>17.2. <b>Communications.</b> Les échanges par e-mail aux adresses indiquées dans les conditions particulières valent écrit, sauf lorsque les présentes exigent une lettre recommandée.</p>\n  <p>17.3. <b>Nullité partielle.</b> Si une clause est déclarée nulle, les autres clauses restent applicables et la clause nulle est remplacée par la disposition valable la plus proche de l'intention des parties.</p>\n  <p>17.4. <b>Tolérance.</b> Le fait de ne pas se prévaloir d'une clause ne vaut pas renonciation à s'en prévaloir ultérieurement.</p>\n  <p>17.5. <b>Langue.</b> Le contrat est rédigé en français. Toute traduction est fournie à titre informatif ; la version française prévaut.</p>\n\n  <h2>Article 18. Droit applicable et litiges</h2>\n  <p>18.1. Le contrat est soumis au <b>droit luxembourgeois</b>.</p>\n  <p>18.2. En cas de différend, les parties recherchent une solution amiable pendant trente (30) jours à compter de la notification écrite du différend par l'une d'elles.</p>\n  <p>18.3. À déf Aucune donnée personnelle exposée au site public :</b> le site ne reçoit que des plages horaires disponibles, jamais un nom, un téléphone ou un motif.</li>\n    <li><b>Accès nominatifs</b> du professionnel, mots de passe gérés par le fournisseur d'authentification et inconnus du Sous-traitant.</li>\n    <li><b>Sauvegardes</b> régulières, mises à jour de sécurité, accès d'administration limités aux gérants du Sous-traitant.</li>\n    <li><b>Effacement automatique</b> des identités passé le délai de conservation (article 6).</li>\n  </ul>\n\n  <h2>6. Durée de conservation</h2>\n  <p>Les coordonnées rattachées à un rendez-vous sont <b>automatiquement anonymisées vingt-quatre (24) mois</b> après la date du rendez-vous ; le rendez-vous est ensuite conservé sous forme anonyme à des fins statistiques. Ce délai peut être modifié sur instruction du Responsable de traitement, dans les limites de la réglementation qui lui est applicable. Les messages reçus par formulaire et par e-mail sont conservés dans la boîte du Client, qui en fixe la durée.</p>\n\n  <h2>7. Sort des données en fin de contrat</h2>\n  <p>Au terme du contrat, le Responsable de traitement indique par écrit dans les trente (30) jours s'il souhaite :</p>\n  <ul>\n    <li>la <b>restitution</b> de ses données dans un format lisible par machine (CSV ou JSON), puis leur suppression ; ou</li>\n    <li>leur <b>suppression</b> pure et simple.</li>\n  </ul>\n  <p>Sans instruction dans ce délai, le Sous-traitant procède à la suppression et la confirme par écrit, sauf obligation légale de conservation.</p>\n\n  <h2>8. Obligations du Responsable de traitement</h2>\n  <p>Le Responsable de traitement fournit au Sous-traitant des instructions conformes à la réglementation, informe les personnes concernées du traitement (le Sous-traitant rédige pour lui la politique de confidentialité du site), et reste l'interlocuteur des personnes concernées et de l'autorité de contrôle pour ses propres traitements.</p>\n\n  <div class=\"k-a       + a.recurrentes.map(r => '<tr><td class="cat" colspan="2">' + esc(r.libelle) + '</td><td class="on"><div class="opt">' + cb(true) + '<div><b>' + m(r.montant) + '</b> <span>HT</span></div></div></td></tr>').join('') + (mtn && !mtn.cat ? '<tr><td class="cat">Forfait convenu</td><td colspan="2" class="on"><div class="opt">' + cb(true) + '<div><b>' + m(mtn.montant) + '</b> <span>HT / ' + (mtn.annuel ? 'an' : 'trim.') + '</span></div></div></td></tr>' : '');

    const page1 = '<div class="sheet">' + tete('DEVIS', [['Devis N°', num], ['Date', fmtDate(d.date_emission)], ['Validité', d.date_validite ? 'jusqu’au ' + fmtDate(d.date_validite) : '30 jours']])
      + parties(c, 'Client &amp; références')
      + '<section>' + sec(1, 'Formule de base', 'formule choisie, prix HT') + formules + '</section>'
      + '<section>' + sec(2, 'Options complémentaires', 'options retenues, prix unit. HT') + options + '</section>'
      + '<section>' + sec(3, 'Maintenance, hébergement &amp; sécurité', 'obligatoire, ligne retenue cochée')
      + '<div class="inclus">Inclus : ' + C.INCLUS + '</div>'
      + '<div class="inclus">Chaque module (rendez-vous, inscriptions, catalogue, espace de modification, chat, paiement, blog) ajouté en option se surveille et se sauvegarde : il ajoute ' + m(C.MODULE.trim) + ' HT par trimestre, ou ' + m(C.MODULE.an) + ' HT par an.</div>'
      + '<table class="mtn"><thead><tr><th>Catégorie de formule</th><th>Option trimestrielle (3 mois)</th><th>Option annuelle (11 mois + 1 offert)</th></tr></thead><tbody>' + maintenance + '</tbody></table>'
      + '<div class="frais"><div class="ft">Frais supplémentaires éventuels (hors forfait)</div><div class="fm">' + esc(C.FRAIS_MENTION) + '</div>'
      + (a.frais.length ? a.frais.map(f => '<div class="fl"><span>' + esc(f.libelle) + '</span><b>' + (f.pu ? m(f.pu) + ' HT' : 'sur devis') + '</b></div>').join('')
        : '<div class="vide"></div><div class="vide"></div>') + '</div></section>'
      + '<div class="bas">NS Development SARL-S · devis ' + esc(num) + ' · page 1 / 2 · le décompte financier est en page 2</div></div>';

    const page2 = '<div class="sheet">' + tete('DEVIS', [['Page', '2 / 2'], ['N°', num]])
      + '<section>' + sec(4, 'Décompte financier &amp; modalités', 'montants en euros')
      + '<div class="page2"><div class="cond"><p><b>Conditions de paiement :</b></p>'
      + '<p><b>Acompte initial :</b> 50 % HT du prix du site web + 100 % HT du forfait de maintenance choisi (trimestriel ou annuel).</p>'
      + '<p><b>Solde final :</b> les 50 % HT restants du site web sont exigibles à la livraison clés en main, avant la mise en ligne publique.</p>'
      + '<p><b>Facturation :</b> une facture d’acompte est émise à la signature. La facture de solde sera émise lors de la validation finale.</p>'
      + (d.notes ? '<p><b>Notes :</b><br><span style="white-space:pre-wrap">' + esc(d.notes) + '</span></p>' : '') + '</div>'
      + '<div class="recap">' + (a.geste
        ? '<div class="r"><span class="rl">Création Site (HT)</span><span class="rv">' + m(t.site - a.geste.montant) + '</span></div>'
          + '<div class="r geste"><span class="rl">Geste commercial (' + eur(a.geste.pct).replace(/,00$/, '') + ' %)</span><span class="rv">' + m(a.geste.montant) + '</span></div>'
          + '<div class="r"><span class="rl">Total Création Site (HT)</span><span class="rv">' + m(t.site) + '</span></div>'
        : '<div class="r"><span class="rl">Total Création Site (HT)</span><span class="rv">' + m(t.site) + '</span></div>')
      + '<div class="r"><span class="rl">Total Maintenance (HT)</span><span class="rv">' + m(t.maintenance) + '</span></div>'
      + '<div class="r"><span class="rl"><b>Total HT Global</b></span><span class="rv">' + m(t.ht) + '</span></div>'
      + '<div class="r"><span class="rl">TVA (' + eur(taux).replace(/,00$/, '') + ' %)</span><span class="rv">' + m(t.tva) + '</span></div>'
      + '<div class="r total"><span class="rl">TOTAL TTC</span><span class="rv">' + m(t.ttc) + '</span></div>'
      + '<div class="r acc"><span class="rl">Acompte TTC à régler</span><span class="rv">' + m(t.acompte) + '</span></div>'
      + '<div class="r"><span class="rl">Solde TTC à la livraison</span><span class="rv">' + m(t.solde) + '</span></div></div></div></section>'
      + '<div class="sign"><div><div class="lbl">Bon pour accord (le client)</div><div class="note">Mention manuscrite « Bon pour accord », date et signature :</div><div class="zone">Date :</div></div>'
      + '<div><div class="lbl">Cachet et signature · NS Development</div><div class="note">&nbsp;</div><div class="zone"></div></div></div>'
      + piedLegal(E) + '</div>';

    return page('Devis ' + num + ' · ' + (c.nom_etablissement || ''), page1 + page2);
  }

  // ------------------------------------------------------------------ facture
  // Objet lu dans les lignes : « Acompte 50 % … », « Solde 50 % … », sinon facture unique.
  function objetFacture(lignes) {
    if (lignes.some(l => /^Acompte 50 %/.test(l.designation))) return 'acompte';
    if (lignes.some(l => /^Solde 50 %/.test(l.designation))) return 'solde';
    return 'unique';
  }
  const OBJETS = { acompte: 'Acompte 50 % à la commande', solde: 'Solde 50 % à la mise en ligne', unique: 'Facture unique (100 %)' };

  // contrat : { devis, lignes, signataire } pour joindre le contrat rempli (facture d'acompte ou unique).
  function docFactureHTML(f, lignes, c, contrat) {
    const E = EMETTEUR();
    lignes = lignes.filter(l => !estFrais(l));
    const m = n => eur(n) + ' €';
    const taux = Number(f.tva_taux) || 0;
    const site = arr(lignes.filter(l => !estMaintenance(l)).reduce((s, l) => s + (Number(l.montant_ht) || 0), 0));
    const mtn = arr(lignes.filter(estMaintenance).reduce((s, l) => s + (Number(l.montant_ht) || 0), 0));
    const ht = arr(site + mtn), tva = arr(ht * taux / 100), ttc = arr(ht + tva);
    const paye = Number(f.montant_paye) || 0, reste = arr(ttc - paye);
    const num = f.numero || 'Brouillon', ech = f.date_echeance ? fmtDate(f.date_echeance) : 'à réception';
    const obj = objetFacture(lignes);
    const refDevis = f.devis && f.devis.numero ? f.devis.numero : '';
    const meta = [['Facture N°', num], ['Date', fmtDate(f.date_emission)], ['Échéance', ech]];
    if (refDevis) meta.push(['Réf. devis', refDevis]);
    const table = lignes.length ? lignes.map(l => '<tr><td><div class="nm">' + esc(l.designation) + '</div></td><td class="num">' + eur(l.quantite).replace(/,00$/, '')
      + '</td><td class="num">' + m(l.prix_unitaire_ht) + '</td><td class="num">' + m(l.montant_ht) + '</td></tr>').join('')
      : '<tr><td colspan="4" style="color:#8b95a7;font-style:italic">Aucune ligne</td></tr>';
    const joint = contrat && contrat.devis ? contratCorps(contrat.devis, contrat.lignes || [], c, contrat.signataire) : '';
    return page('Facture ' + num + (joint ? ' et contrat' : '') + ' · ' + (c.nom_etablissement || ''), '<div class="sheet">' + tete('FACTURE', meta) + parties(c, 'Facturé à')
      + '<section>' + sec(1, 'Objet de la facture', '') + Object.keys(OBJETS).map(k => '<div class="row' + (k === obj ? ' on' : ' off') + '">' + cb(k === obj) + '<div class="d"><span class="nm">' + OBJETS[k] + '</span></div></div>').join('') + '</section>'
      + '<section>' + sec(2, 'Détail', 'repris du devis' + (refDevis ? ' ' + esc(refDevis) : ''))
      + '<table class="detail"><thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">P.U. HT</th><th class="num">Total HT</th></tr></thead><tbody>' + table + '</tbody></table></section>'
      + '<section>' + sec(3, 'Récapitulatif', 'montants en euros') + '<div class="page2"><div class="cond">'
      + '<p><b>Règlement :</b> virement bancaire, titulaire ' + E.nom + ', IBAN ' + esc(E.iban) + ', BIC ' + esc(E.bic) + '.</p>'
      + '<p><b>Communication :</b> le numéro de la facture. Échéance : <b>' + ech + '</b>.</p>'
      + (mtn ? '<p>La maintenance est obligatoire et facturée dès l’acompte ; les 12 mois courent à partir de la mise en ligne du site.</p>' : '')
      + '<p>Retard de paiement : intérêts au taux légal et indemnité forfaitaire de recouvrement de 40 €.</p></div>'
      + '<div class="recap"><div class="r"><span class="rl">Création du site (HT)</span><span class="rv">' + m(site) + '</span></div>'
      + (mtn ? '<div class="r"><span class="rl">Maintenance (HT)</span><span class="rv">' + m(mtn) + '</span></div>' : '')
      + '<div class="r"><span class="rl">TVA (' + eur(taux).replace(/,00$/, '') + ' %)</span><span class="rv">' + m(tva) + '</span></div>'
      + (paye > 0 ? '<div class="r"><span class="rl">Total TTC</span><span class="rv">' + m(ttc) + '</span></div><div class="r"><span class="rl">Déjà réglé</span><span class="rv">- ' + m(paye) + '</span></div>' : '')
      + '<div class="r total"><span class="rl">NET À PAYER</span><span class="rv">' + m(paye > 0 ? reste : ttc) + '</span></div></div></div></section>'
      + piedLegal(E) + '</div>' + joint, joint ? CSS_CONTRAT() : '');
  }

  // ------------------------------------------------------------------ contrat
  // Le contrat client (commercial/contrats/contrat-client.html) rempli avec le devis et la fiche
  // client. Partie 1 composée ici ; parties 2 (CGV) et 3 (annexe RGPD) reprises telles quelles
  // de Contrat.html, généré par commercial/contrats/generer.py. La partie 1 dit mot pour mot
  // la même chose que la partie 1 vierge du contrat : une phrase qui change là change ici.
  // Ce que seul le client peut faire reste vide : cases « professionnel », « références »,
  // « conditions reçues », lieu, date, signatures. Rien n'est inventé (RCS, qualité du signataire).
  const SIGNATAIRES = { Sam: 'Samir DINIS DA ROSA', Nelson: 'Nelson BARROSO' };
  const CSS_CONTRAT = () => (typeof NSContrat === 'undefined' ? '' : NSContrat.css)
    + '.k .k-v{font-weight:600}.k .k-box.k-on{background:var(--k-ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    + '.k .k-blank.k-plein{min-width:0;padding:0 4px;font-weight:600}'
    + '@media print{.sheet+.k{break-before:page}.k{background:#fff}.k .k-page{padding:0;max-width:100%}}';
  // Domaine du site actuel du client, s'il en a un vrai (pas une page Facebook ou un sous-domaine Wix).
  function domaine(url) {
    const h = String(url || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[/?#]/)[0];
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(h) && !/facebook|instagram|google|wixsite|linktr|tiktok|editus|business\.site|jimdo|webnode/.test(h) ? h : '';
  }
  function contratCorps(d, lignes, c, signataire) {
    if (typeof NSContrat === 'undefined') return '';
    const a = analyser(lignes, c), t = decompte(a.site, a.maintenance, Number(d.tva_taux) || 0);
    const acompte = arr(t.site / 2), solde = arr(t.site - acompte);
    const box = on => '<span class="k-box' + (on ? ' k-on' : '') + '"></span>';
    const val = v => v ? '<span class="k-v">' + esc(v) + '</span>' : '';
    const blanc = (v, taille) => v ? '<span class="k-blank k-plein">' + esc(v) + '</span>' : '<span class="k-blank' + (taille ? ' k-' + taille : '') + '"></span>';
    const contact = [c.contact_prenom, c.contact_nom].filter(Boolean).join(' ');
    const qui = SIGNATAIRES[signataire] || SIGNATAIRES.Sam;
    const num = d.numero ? d.numero.replace(/^DEV/, 'CTR') : '';
    const options = C.OPTIONS.filter(o => a.options[o.n]).map(o => o.n + (o.qte && a.options[o.n] !== 1 ? ' × ' + a.options[o.n] : ''))
      .concat(a.libres.map(l => l.designation + (Number(l.quantite) !== 1 ? ' × ' + eur(l.quantite).replace(/,00$/, '') : '')))
      .concat(a.geste ? [C.PREFIXE_GESTE + ' ' + eur(a.geste.pct).replace(/,00$/, '') + ' %'] : []);
    const mtn = a.mtn, nMod = mtn && mtn.modules || 0;
    const cellule = (on, txt) => '<td>' + box(on) + txt + '</td>';
    const maintenance = C.MAINTENANCE.map(x => { const ici = mtn && mtn.cat === x.cat;
      return '<tr><td>' + box(ici) + x.cat + '</td>' + cellule(ici && !mtn.annuel, x.trim + ' € HT par trimestre') + cellule(ici && mtn.annuel, x.an + ' € HT par an') + '</tr>'; }).join('')
      + '<tr><td>' + box(nMod) + 'Par module vendu en option (nombre : ' + (nMod || '___') + ' )</td><td>+' + C.MODULE.trim + ' € HT l’unité</td><td>+' + C.MODULE.an + ' € HT l’unité</td></tr>'
      + (mtn && !mtn.cat ? '<tr><td>' + box(true) + 'Forfait convenu</td>' + cellule(!mtn.annuel, mtn.annuel ? '' : eur(mtn.montant) + ' € HT par trimestre') + cellule(mtn.annuel, mtn.annuel ? eur(mtn.montant) + ' € HT par an' : '') + '</tr>' : '');
    const recurrentes = C.RECURRENTES.map(r => { const n = a.recurrentes.filter(x => x.libelle.indexOf(r.n) === 0).length;
      const parUnite = r.id === 'mail' || r.id === 'domaine';
      return '<tr><td>' + box(n) + esc(r.n) + (parUnite ? ' (nombre : ' + (n || '___') + ' )' : '') + '</td><td>+' + r.trim + ' € HT' + (parUnite ? ' l’unité' : '') + '</td><td>+' + r.an + ' € HT' + (parUnite ? ' l’unité' : '') + '</td></tr>'; }).join('');
    const dom = domaine(c.site_domaine);
    const opt = n => Boolean(a.options[n]);
    const formulaire = ['Essentiel', 'Vitrine', 'Pro'].includes(a.formule);
    const rdv = opt(C.OPTIONS.find(o => o.court === 'Rendez-vous NSD').n);
    const autres = C.OPTIONS.filter(o => ['Inscriptions (CRM)', 'Assistant de chat'].includes(o.court) && opt(o.n)).map(o => o.court === 'Assistant de chat' ? 'assistant de chat' : 'inscriptions en ligne').join(', ');
    const E = EMETTEUR();

    const partie1 = '<div class="k-page">'
      + '<div class="k-doc-tete"><img src="' + OPTS.logo + '" alt="NS Development"><div class="k-id"><b>' + E.nom + '</b>'
      + '<small>' + E.adresse + ' · RCS Luxembourg ' + E.rcs + ' · TVA ' + E.tva + ' · Autorisation d’établissement n° ' + E.autorisation + '</small></div>'
      + '<div class="k-ver">Contrat n° ' + blanc(num, 's') + '<br>Version des conditions : ' + NSContrat.version + '</div></div>'
      + '<div class="k-part-title">Partie 1</div><h1>Conditions particulières</h1>'
      + '<p class="k-sub">Création de site internet, maintenance et hébergement. Contrat entre professionnels.</p>'
      + '<h2>1. Les parties</h2>'
      + '<p><b>Le Prestataire :</b> NS Development SARL-S, société à responsabilité limitée simplifiée de droit luxembourgeois, siège social 2, rue de la fontaine, L-4988 Sanem, immatriculée au Registre de commerce et des sociétés de Luxembourg sous le n° B310037, TVA LU37686640, représentée par ' + blanc(qui) + ', en qualité de gérant.</p>'
      + '<p><b>Le Client :</b></p><table class="k-field">'
      + '<tr><td>Dénomination et forme juridique</td><td>' + val(c.nom_etablissement) + '</td></tr>'
      + '<tr><td>Enseigne commerciale (si différente)</td><td></td></tr>'
      + '<tr><td>Siège ou adresse professionnelle</td><td>' + val(c.adresse || c.ville) + '</td></tr>'
      + '<tr><td>N° RCS / N° TVA</td><td>' + '<span class="k-blank k-s"></span> / ' + val(c.tva_intra) + '</td></tr>'
      + '<tr><td>Représenté par (nom, qualité)</td><td>' + val(contact) + '</td></tr>'
      + '<tr><td>E-mail pour les notifications du contrat</td><td>' + val(c.email) + '</td></tr>'
      + '<tr><td>Téléphone</td><td>' + val(c.telephone) + '</td></tr></table>'
      + '<p>' + box(false) + '<b>Le Client déclare contracter pour les besoins de son activité commerciale, artisanale, libérale ou indépendante</b>, et non en qualité de consommateur.</p>'
      + '<h2>2. Création du site</h2><table class="k-field">'
      + '<tr><td>Devis de référence (n° et date)</td><td>' + val(d.numero ? d.numero + ' du ' + fmtDate(d.date_emission) : '') + '</td></tr>'
      + '<tr><td>Formule et options</td><td>' + val([a.formule].concat(options).filter(Boolean).join(' · ')) + '</td></tr>'
      + '<tr><td>Prix total de la création</td><td>' + blanc(eur(t.site), 's') + ' € HT, TVA en sus au taux légal</td></tr>'
      + '<tr><td>Acompte à la signature (50 %)</td><td>' + blanc(eur(acompte), 's') + ' € HT</td></tr>'
      + '<tr><td>Solde avant mise en ligne (50 %)</td><td>' + blanc(eur(solde), 's') + ' € HT</td></tr></table>'
      + '<h2>3. Maintenance et hébergement</h2>'
      + '<p>Obligatoire pour toute mise en ligne (article 4.5 des conditions générales). Elle démarre le jour de la mise en ligne.</p>'
      + '<table><tr><th>Formule (selon la catégorie du site)</th><th>Paiement trimestriel</th><th>Paiement annuel (11 mois + 1 offert)</th></tr>' + maintenance + '</table>'
      + '<table><tr><th>Options récurrentes (même rythme de paiement)</th><th>Trimestriel</th><th>Annuel</th></tr>' + recurrentes + '</table>'
      + '<div class="k-note k-avoid"><b>Durée :</b> 12 mois à compter de la mise en ligne, <b>ferme</b>, quel que soit le rythme de paiement choisi. Le contrat se renouvelle ensuite automatiquement par périodes de 12 mois, sauf résiliation par l’une ou l’autre partie <b>au moins 2 mois avant la fin de la période en cours</b>, par lettre recommandée ou par e-mail (article 6 des conditions générales).</div>'
      + '<h2>4. Nom de domaine</h2>'
      + '<p>Nom de domaine : ' + blanc(dom) + ' ' + box(false) + 'à enregistrer ' + box(Boolean(dom)) + 'existant, à transférer.</p>'
      + '<p>Le nom de domaine est enregistré <b>au nom du Client, qui en est le seul titulaire</b>. Le Prestataire en assure la gestion technique et le renouvellement pendant la durée du contrat, ces frais étant compris dans la maintenance (article 9 des conditions générales).</p>'
      + '<h2>5. Données personnelles</h2><p>Services par lesquels le Prestataire traite des données pour le compte du Client (cocher) :</p>'
      + '<p>' + box(formulaire) + 'formulaire de contact du site &nbsp; ' + box(true) + 'boîte(s) mail &nbsp; ' + box(rdv) + 'prise de rendez-vous en ligne &nbsp; ' + box(Boolean(autres)) + 'autre : ' + blanc(autres, 's') + '</p>'
      + '<p>L’<b>annexe « Traitement des données personnelles »</b> (partie 3) s’applique et fait partie intégrante du contrat.</p>'
      + '<h2>6. Références</h2><p>' + box(false) + 'Le Client <b>autorise</b> ' + box(false) + 'Le Client <b>n’autorise pas</b> le Prestataire à présenter le site dans ses références commerciales et à y faire figurer la mention discrète « Site réalisé par NS Development » (article 10.5 des conditions générales).</p>'
      + '<h2>7. Documents contractuels</h2>'
      + '<p>Le contrat est formé, par ordre de priorité décroissant, des présentes conditions particulières, du devis de référence, de l’annexe « Traitement des données personnelles » (qui prévaut sur tout autre document pour ce qui concerne les données personnelles) et des conditions générales de prestation, version du ' + NSContrat.version + '. Les conditions générales ou d’achat du Client ne s’appliquent pas.</p>'
      + '<p>' + box(false) + '<b>Le Client reconnaît avoir reçu les conditions générales de prestation et l’annexe « Traitement des données personnelles » avant la signature, en avoir pris connaissance et les accepter sans réserve.</b></p>'
      + '<div class="k-avoid"><p style="margin-top:10px">Fait à <span class="k-blank k-s"></span>, le <span class="k-blank k-s"></span>, en deux exemplaires originaux, un pour chaque partie. Une signature électronique a la même valeur qu’une signature manuscrite.</p>'
      + '<div class="k-sign"><div><b>Pour le Prestataire</b>NS Development SARL-S<span>Nom et qualité : ' + esc(qui) + ', co-gérant</span><span>Signature :</span></div>'
      + '<div><b>Pour le Client</b>« Lu et approuvé »<span>Nom et qualité : ' + esc(contact) + '</span><span>Signature et cachet :</span></div></div></div></div>';
    return '<div class="k">' + partie1 + NSContrat.suite.replace('{{CLIENT}}', esc(c.nom_etablissement || '')) + '</div>';
  }
  function docContratHTML(d, lignes, c, signataire) {
    return page('Contrat ' + (d.numero ? d.numero.replace(/^DEV/, 'CTR') : 'brouillon') + ' · ' + (c.nom_etablissement || ''), contratCorps(d, lignes, c, signataire), CSS_CONTRAT());
  }

  return {
    CATALOGUE, optionsIncluses, modulesVendus, ligneMaintenance, lireMaintenance, ligneRecurrente, estRecurrente, estMaintenance, estFrais, estGeste, ligneGeste, ligneFrais, decompte, analyser, objetFacture,
    // options : { iban, bic, logo } ; seules les valeurs non vides remplacent les défauts.
    devis(d, lignes, c, options) { regler(options); return docDevisHTML(d, lignes || [], c || {}); },
    facture(f, lignes, c, options, contrat) { regler(options); return docFactureHTML(f, lignes || [], c || {}, contrat); },
    // Le contrat seul, rempli. signataire : 'Sam' ou 'Nelson' (celui qui envoie).
    contrat(d, lignes, c, options, signataire) { regler(options); return docContratHTML(d, lignes || [], c || {}, signataire); },
    contratDisponible: () => typeof NSContrat !== 'undefined',
  };
  function regler(o) { Object.keys(o || {}).forEach(k => { if (o[k]) OPTS[k] = o[k]; }); }
})();
if (typeof module !== 'undefined') module.exports = NSDocs;
</script>

<script>
// ===========================================================================
// Devis et factures : branchés sur la base Supabase existante (la même que
// l'espace client et l'admin). Une seule numérotation DEV / FAC, attribuée
// par la base au moment où le document quitte le brouillon.
// Logique et documents repris de sites-web/ns-development/espace-client-admin.html.
// ===========================================================================
const Factu = (() => {
  const F = { sb: null, session: null, clients: [], devis: [], factures: [], pret: false, erreur: '', menage: false, choix: new Set(), onglet: 'docs', filtre: 'tous' };

  // Catalogue : la grille du 30/09/2026, tenue dans Documents.html.
  const { FORMULES, OPTIONS, MAINTENANCE, MODULE, RECURRENTES } = NSDocs.CATALOGUE;
  // 2 625 € pour un montant rond, 2 597,40 € dès qu'il y a des centimes (jamais « 2 597,4 »).
  const eur = n => { n = Math.round((Number(n) || 0) * 100) / 100; return n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
  const isoJour = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fmtDate = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  const cls = s => sansAccent(s || '').replace(/[^a-z]/g, '');

  // ------------------------------------------------------------------ données
  // Erreur « JWT » (Nelson, 14/10/2026) : la base refuse parfois le jeton de connexion.
  // « JWT expired » : le téléphone est resté en veille, le jeton d'une heure n'a pas été
  // renouvelé à temps. « JWT issued at future » : jeton tout juste renouvelé, refusé une
  // seconde ou deux par la base (écart d'horloge, vu aussi sur la synchro du Mac).
  // On attend, on renouvelle le jeton si besoin, et on rejoue la requête (3 essais).
  const pause = ms => new Promise(r => setTimeout(r, ms));
  const erreurJwt = e => /JWT|PGRST30[13]/i.test(String(e && (e.message || e.code) || e || ''));
  async function fetchJwt(url, opts) {
    for (let i = 0; ; i++) {
      const r = await fetch(url, opts);
      if (r.status !== 401 || i >= 3 || String(url).includes('/auth/v1/')) return r;
      const txt = await r.clone().text().catch(() => '');
      if (!erreurJwt(txt)) return r;
      await pause(1200 * (i + 1));
      if (/expired|invalid/i.test(txt) && F.sb) {
        const { data } = await F.sb.auth.refreshSession().catch(() => ({ data: null }));
        if (!data || !data.session) return r;
        const h = new Headers(opts && opts.headers); h.set('Authorization', 'Bearer ' + data.session.access_token);
        opts = Object.assign({}, opts, { headers: h });
      }
    }
  }

  async function init() {
    if (F.sb || !window.supabase || !S.data) return;
    F.sb = window.supabase.createClient(S.data.supabase.url, S.data.supabase.cle, { auth: { persistSession: true, storageKey: 'crmnsd-supabase' }, global: { fetch: fetchJwt } });
    const { data } = await F.sb.auth.getSession();
    F.session = data.session;
    if (F.session) await charger(); else { F.pret = true; if (S.vue === 'factu') rendre(); }
  }

  async function charger() {
    F.erreur = '';
    const [c, d, f] = await Promise.all([
      F.sb.from('clients').select('*').order('created_at', { ascending: false }),
      F.sb.from('devis').select('*, clients(nom_etablissement)').order('created_at', { ascending: false }),
      F.sb.from('factures').select('*, clients(nom_etablissement), factures_lignes(designation)').order('created_at', { ascending: false }),
    ]);
    const err = c.error || d.error || f.error;
    // Toujours refusé après les essais : la session est perdue, on redemande la connexion.
    if (err && erreurJwt(err)) {
      await F.sb.auth.signOut().catch(() => {}); F.session = null; F.pret = true;
      toast('Connexion à la facturation expirée : reconnecte-toi.', true);
      if (S.vue === 'factu') rendre(); return;
    }
    if (err) F.erreur = err.message;
    F.clients = c.data || []; F.devis = d.data || []; F.factures = f.data || [];
    F.pret = true;
    if (S.vue === 'factu') rendre();
  }

  async function connexion(form) {
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Connexion…';
    const { data, error } = await F.sb.auth.signInWithPassword({ email: form.email.value.trim(), password: form.mdp.value });
    if (error) { btn.disabled = false; btn.textContent = 'Se connecter'; return toast('Email ou mot de passe incorrect.', true); }
    const { data: prof } = await F.sb.from('profiles').select('role').eq('id', data.session.user.id).single();
    if (!prof || prof.role !== 'admin') { await F.sb.auth.signOut(); btn.disabled = false; btn.textContent = 'Se connecter'; return toast('Ce compte n’est pas administrateur.', true); }
    F.session = data.session; await charger();
  }

  // ------------------------------------------------------------------ vue liste
  function vue() {
    if (!F.pret) return '<div class="chargement">Connexion à la facturation…</div>';
    if (!F.session) return `<h2 class="section">Facturation</h2>
      <div class="bloc" style="margin-top:0"><p class="sous" style="margin-top:0">Connexion avec le compte admin <b>NSD</b> (nsdevelopment26@gmail.com), le même pour Sam et Nelson. Une seule fois par téléphone.</p>
      <form id="fx-login"><label class="champ">Email<input name="email" type="email" autocomplete="username" required></label>
      <label class="champ">Mot de passe<input name="mdp" type="password" autocomplete="current-password" required></label>
      <button class="btn large">Se connecter</button></form></div>`;

    const onglets = `<div class="fx-onglets"><button class="${F.onglet === 'docs' ? 'on' : ''}" data-fx="onglet-docs">Devis et factures</button>
      <button class="${F.onglet === 'suivi' ? 'on' : ''}" data-fx="onglet-suivi">Suivi clients</button></div>`;
    if (F.onglet === 'suivi' && !F.menage) return onglets + vueSuivi();
    const auj = isoJour(new Date());
    const aEmettre = F.factures.filter(f => f.statut === 'brouillon');
    const impayees = F.factures.filter(f => f.statut === 'envoyée' || f.statut === 'en_retard');
    const enAttente = F.devis.filter(d => d.statut === 'envoyé');
    const du = impayees.reduce((s, f) => s + (Number(f.total_ttc) || 0) - (Number(f.montant_paye) || 0), 0);
    const coche = (type, id) => { if (!F.menage) return ''; const ok = type === 'devis' ? devisSupprimable(id) : factureSupprimable(id);
      return ok ? `<span class="fx-coche">${F.choix.has(type + ':' + id) ? '✓' : ''}</span>` : ''; };
    const attrs = (type, id) => { if (!F.menage) return `data-fx-${type}="${id}"`;
      const ok = type === 'devis' ? devisSupprimable(id) : factureSupprimable(id);
      return ok ? `data-fx-choix="${type}:${id}"` : 'data-fx-bloque="1"'; };
    const etat = (type, id) => F.menage ? (F.choix.has(type + ':' + id) ? ' choisie' : ((type === 'devis' ? devisSupprimable(id) : factureSupprimable(id)) ? '' : ' bloquee')) : '';
    const carteDevis = d => `<div class="fx-carte${etat('devis', d.id)}" ${attrs('devis', d.id)}>${coche('devis', d.id)}<div class="corps"><div class="nom">${esc(d.clients ? d.clients.nom_etablissement : '?')}</div>
      <div class="meta">${d.numero ? esc(d.numero) : 'Brouillon'} · ${fmtDate(d.date_emission)} <span class="fx-st ${cls(d.statut)}">${esc(d.statut)}</span></div></div>
      <div class="mt">${eur(d.total_ttc)} €</div></div>`;
    const carteFacture = f => {
      const retard = f.statut === 'envoyée' && f.date_echeance && f.date_echeance < auj;
      return `<div class="fx-carte${etat('facture', f.id)}" ${attrs('facture', f.id)}>${coche('facture', f.id)}<div class="corps"><div class="nom">${esc(f.clients ? f.clients.nom_etablissement : '?')}</div>
      <div class="meta">${f.numero ? esc(f.numero) : 'Brouillon'} · échéance ${fmtDate(f.date_echeance)} <span class="fx-st ${retard ? 'retard' : cls(f.statut)}">${retard ? 'en retard' : esc(f.statut)}</span></div></div>
      <div class="mt">${eur(f.total_ttc)} €${Number(f.montant_paye) ? `<div class="meta">payé ${eur(f.montant_paye)} €</div>` : ''}</div></div>`;
    };
    return `${F.menage ? '' : onglets}${F.erreur ? `<div class="fx-alerte">Erreur Supabase : ${esc(F.erreur)}</div>` : ''}
      ${!S.data.banque.iban ? '<div class="fx-alerte">IBAN non configuré : les documents afficheront « à compléter » en pied de page.</div>' : ''}
      <div class="grille" style="margin-bottom:6px">
        <div class="kpi"><div class="v">${eur(du)} €</div><div class="l">à encaisser TTC</div></div>
        <div class="kpi"><div class="v">${enAttente.length}</div><div class="l">devis en attente de réponse</div></div></div>
      ${F.menage ? `<div class="fx-alerte" style="background:#fff8e1;border-color:#f3d98b">Touche les devis et factures à supprimer. Une facture émise (avec numéro FAC) ne se supprime pas : c'est un document légal. Un devis déjà facturé non plus.</div>`
        : `<div class="fx-bar"><button class="btn" data-fx="nouveau-devis">＋ Nouveau devis</button><button class="btn clair" data-fx="menage">Supprimer…</button></div>`}
      ${aEmettre.length ? section('Factures à émettre', 'brouillons sans numéro', aEmettre.map(carteFacture).join('')) : ''}
      ${impayees.length ? section('Factures à encaisser', impayees.length + '', impayees.map(carteFacture).join('')) : ''}
      ${section('Devis', F.devis.length + '', F.devis.length ? F.devis.map(carteDevis).join('') : '<div class="vide">Aucun devis. Ouvre la fiche d’un prospect et touche « Faire un devis ».</div>')}
      ${section('Toutes les factures', F.factures.length + '', F.factures.length ? F.factures.map(carteFacture).join('') : '<div class="vide">Aucune facture. Une facture se crée depuis un devis accepté.</div>')}
      ${F.menage ? `<div class="fx-menage"><button class="btn clair" data-fx="menage-fin">Annuler</button>
        <button class="btn danger" data-fx="menage-go" ${F.choix.size ? '' : 'disabled'}>Supprimer${F.choix.size ? ' (' + F.choix.size + ')' : ''}</button></div>`
        : `<p style="margin-top:18px"><button class="btn clair large" data-fx="deconnexion">Se déconnecter de la facturation</button></p>`}`;
  }

  // ------------------------------------------------------------------ suivi clients
  // Demandé par Nelson le 14/10/2026 : tous ceux qui ont reçu un devis, où ils en sont
  // (devis accepté ou non, facture payée ou non), et le taux de réussite en graphique.
  // Un devis « reçu » = un devis qui a quitté le brouillon (numéro DEV). Les factures
  // brouillon et annulées ne comptent pas : seules les factures émises sont dues.
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  function suiviClients() {
    const auj = isoJour(new Date());
    const recus = F.devis.filter(d => d.numero && d.statut !== 'brouillon');
    const parClient = {};
    recus.forEach(d => { (parClient[d.client_id] = parClient[d.client_id] || { id: d.client_id, nom: d.clients ? d.clients.nom_etablissement : '?', devis: [], factures: [] }).devis.push(d); });
    F.factures.filter(f => f.numero && f.statut !== 'annulée' && f.statut !== 'brouillon' && parClient[f.client_id]).forEach(f => parClient[f.client_id].factures.push(f));
    return Object.values(parClient).map(c => {
      const d = c.devis[0];   // le plus récent (liste triée par date de création décroissante)
      const facture = c.factures.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0);
      const paye = c.factures.reduce((s, f) => s + (Number(f.montant_paye) || 0), 0);
      const retard = c.factures.some(f => f.statut !== 'payée' && f.date_echeance && f.date_echeance < auj);
      const reste = Math.round((facture - paye) * 100) / 100;
      const devisEtat = c.devis.some(x => x.statut === 'accepté') ? 'accepté' : d.statut === 'refusé' ? 'refusé' : d.statut === 'envoyé' ? 'en attente' : d.statut;
      const paiement = !c.factures.length ? (devisEtat === 'accepté' ? 'à facturer' : '') : reste <= 0.005 ? 'payé' : retard ? 'en retard' : paye > 0 ? 'payé en partie' : 'non payé';
      return Object.assign(c, { dernier: d, devisEtat, paiement, facture, paye, reste, montant: Number(d.total_ttc) || 0 });
    });
  }
  const FILTRES = [['tous', 'Tous'], ['attente', 'Devis en attente'], ['accepte', 'Acceptés'], ['refuse', 'Refusés'], ['impaye', 'À encaisser'], ['paye', 'Payés']];
  const filtrer = (c, f) => f === 'tous' || (f === 'attente' && c.devisEtat === 'en attente') || (f === 'accepte' && c.devisEtat === 'accepté')
    || (f === 'refuse' && c.devisEtat === 'refusé') || (f === 'impaye' && c.reste > 0.005) || (f === 'paye' && c.paiement === 'payé');
  const COUL = { accepte: '#6aa84f', refuse: '#dd7e6b', attente: '#8fb1ee', encaisse: '#6aa84f', du: '#dd7e6b' };

  // Anneau : part des devis acceptés, refusés et en attente, avec le taux au centre.
  function anneau(parts, centre, legende) {
    const total = parts.reduce((s, p) => s + p.n, 0), r = 46, C = 2 * Math.PI * r;
    let fait = 0;
    const arcs = total ? parts.filter(p => p.n).map(p => { const l = p.n / total * C;
      const a = `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-fait}" transform="rotate(-90 60 60)"/>`;
      fait += l; return a; }).join('') : '';
    return `<div class="sv-taux"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${esc(centre.texte)}">
      <circle r="${r}" cx="60" cy="60" fill="none" stroke="#efeeeb" stroke-width="16"/>${arcs}
      <text x="60" y="58" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor">${centre.v}</text>
      <text x="60" y="76" text-anchor="middle" font-size="10" fill="#6b6b6b">${esc(centre.l)}</text></svg>
      <div class="sv-leg">${legende}</div></div>`;
  }

  function vueSuivi() {
    const L = suiviClients();
    const n = L.length, acc = L.filter(c => c.devisEtat === 'accepté').length, ref = L.filter(c => c.devisEtat === 'refusé').length, att = L.filter(c => c.devisEtat === 'en attente').length;
    const factures = L.filter(c => c.factures.length).length, payes = L.filter(c => c.paiement === 'payé').length;
    const signe = L.filter(c => c.devisEtat === 'accepté').reduce((s, c) => s + c.montant, 0);
    const encaisse = L.reduce((s, c) => s + c.paye, 0), du = L.reduce((s, c) => s + Math.max(0, c.reste), 0);
    const tranches = acc + ref;
    if (!n) return '<div class="vide">Aucun devis envoyé pour l’instant. Dès qu’un devis reçoit son numéro DEV, son client apparaît ici.</div>';

    const legende = [['Acceptés', acc, COUL.accepte], ['Refusés', ref, COUL.refuse], ['En attente', att, COUL.attente]]
      .map(([l, v, c]) => `<div><i style="background:${c}"></i>${l} <b>${v}</b></div>`).join('')
      + `<div style="color:var(--doux);font-size:12px;margin-top:4px">${tranches ? 'Sur les devis tranchés : ' + pct(acc, tranches) + ' % de oui' : 'Aucun devis tranché pour l’instant'}</div>`;
    const etapes = [['Devis envoyés', n], ['Acceptés', acc], ['Facturés', factures], ['Payés en entier', payes]];
    const entonnoir = etapes.map(([l, v], i) => `<div><div class="l"><span>${l}</span><b>${v}${i ? `<span class="pct">${pct(v, n)} %</span>` : ''}</b></div>
      <div class="barre"><span style="width:${Math.max(v ? 3 : 0, pct(v, n))}%;opacity:${1 - i * .18}"></span></div></div>`).join('');
    const argent = encaisse + du;

    const liste = L.filter(c => filtrer(c, F.filtre)).map(c => {
      const st = c.devisEtat === 'accepté' ? 'accepte' : c.devisEtat === 'refusé' ? 'refuse' : 'envoye';
      const pst = { 'payé': 'payee', 'non payé': 'envoyee', 'payé en partie': 'envoyee', 'en retard': 'retard', 'à facturer': 'brouillon' }[c.paiement] || '';
      return `<div class="fx-carte sv-carte" data-fx-devis="${c.dernier.id}"><div class="corps"><div class="nom">${esc(c.nom)}</div>
        <div class="meta">${esc(c.dernier.numero)} · ${fmtDate(c.dernier.date_emission)}${c.devis.length > 1 ? ' · ' + c.devis.length + ' devis' : ''}</div>
        <div class="meta" style="margin-top:4px"><span class="fx-st ${st}">devis ${esc(c.devisEtat)}</span>${c.paiement ? `<span class="fx-st ${pst}">${esc(c.paiement)}</span>` : ''}</div></div>
        <div class="mt">${eur(c.montant)} €${c.factures.length ? `<div class="meta">payé ${eur(c.paye)} €</div>${c.reste > 0.005 ? `<div class="meta reste">reste ${eur(c.reste)} €</div>` : ''}` : ''}</div></div>`;
    }).join('') || '<div class="vide">Personne dans ce filtre.</div>';

    return `${F.erreur ? `<div class="fx-alerte">Erreur Supabase : ${esc(F.erreur)}</div>` : ''}
      <div class="grille" style="margin-bottom:8px">
        <div class="kpi"><div class="v">${pct(acc, n)} %</div><div class="l">taux de réussite (${acc} sur ${n} clients)</div></div>
        <div class="kpi"><div class="v">${eur(Math.round(signe))} €</div><div class="l">signé TTC (devis acceptés)</div></div></div>
      <div class="sv-bloc"><h3>Réponse aux devis</h3>${anneau([{ n: acc, c: COUL.accepte }, { n: ref, c: COUL.refuse }, { n: att, c: COUL.attente }], { v: pct(acc, n) + ' %', l: 'acceptés', texte: pct(acc, n) + ' % des devis acceptés' }, legende)}</div>
      <div class="sv-bloc"><h3>Du devis au paiement</h3><div class="sv-ent">${entonnoir}</div></div>
      <div class="sv-bloc"><h3>Argent des factures émises</h3>
        <div class="sv-argent">${argent ? `<span style="width:${pct(encaisse, argent)}%;background:${COUL.encaisse}"></span><span style="width:${100 - pct(encaisse, argent)}%;background:${COUL.du}"></span>` : ''}</div>
        <div class="sv-leg"><div><i style="background:${COUL.encaisse}"></i>Encaissé <b>${eur(encaisse)} €</b></div><div><i style="background:${COUL.du}"></i>Reste à encaisser <b>${eur(du)} €</b></div></div></div>
      ${section('Clients qui ont reçu un devis', n + '', `<div class="sv-filtres">${FILTRES.map(([k, l]) => `<button class="${F.filtre === k ? 'on' : ''}" data-fx="filtre" data-k="${k}">${l}</button>`).join('')}</div>${liste}`)}`;
  }

  // ------------------------------------------------------------------ suppression
  // Brouillons et devis sans facture émise seulement (Nelson, 29/09/2026 : Sam avait des
  // devis de test qu'il ne pouvait pas effacer). Une facture numérotée est un document
  // légal : la numérotation FAC doit rester continue, elle ne se supprime jamais.
  const factureSupprimable = id => { const f = F.factures.find(x => x.id === id); return !!f && f.statut === 'brouillon' && !f.numero && !(Number(f.montant_paye) > 0); };
  const devisSupprimable = id => !!F.devis.find(x => x.id === id) && !F.factures.some(f => f.devis_id === id && (f.numero || f.statut !== 'brouillon'));

  async function supprimer(elements) {
    const devis = elements.filter(e => e.type === 'devis' && devisSupprimable(e.id)).map(e => e.id);
    const facs = elements.filter(e => e.type === 'facture' && factureSupprimable(e.id)).map(e => e.id);
    // Les factures brouillon d'un devis supprimé partent avec lui.
    F.factures.forEach(f => { if (devis.includes(f.devis_id) && factureSupprimable(f.id) && !facs.includes(f.id)) facs.push(f.id); });
    if (!devis.length && !facs.length) return toast('Rien à supprimer.', true);
    const numerotes = devis.map(id => F.devis.find(x => x.id === id)).filter(d => d.numero).map(d => d.numero);
    const texte = 'Supprimer définitivement ' + [devis.length ? devis.length + ' devis' : '', facs.length ? facs.length + ' facture(s) brouillon' : ''].filter(Boolean).join(' et ') + ' ?'
      + (numerotes.length ? '\n\nDevis déjà numérotés : ' + numerotes.join(', ') + '. Leur numéro ne sera pas réattribué.' : '') + '\n\nC’est irréversible.';
    if (!confirm(texte)) return false;
    try {
      if (facs.length) { const { data, error } = await F.sb.from('factures').delete().in('id', facs).is('numero', null).select('id');
        if (error) throw error; if ((data || []).length !== facs.length) throw new Error('Une facture n’a pas pu être supprimée (déjà émise ?).'); }
      if (devis.length) { const { data, error } = await F.sb.from('devis').delete().in('id', devis).select('id');
        if (error) throw error; if ((data || []).length !== devis.length) throw new Error('Un devis n’a pas pu être supprimé.'); }
      toast('Supprimé : ' + [devis.length ? devis.length + ' devis' : '', facs.length ? facs.length + ' facture(s)' : ''].filter(Boolean).join(', ') + '.');
      return true;
    } catch (e) { toast('Suppression : ' + (e.message || e), true); return false; }
    finally { await charger(); }
  }

    v.innerHTML = `<div class="feuille">${html}</div>`;
    v.classList.remove('cache'); document.body.style.overflow = 'hidden';
  }

      pas: 'Paiement et espace de modification compris. Au-delà de 50 produits : « 50 produits en plus ». Tailles et couleurs, plusieurs livraisons ou synchro caisse : ligne sur mesure.' },

  // edit : { devis, a (lignes analysées), client } pour reprendre un brouillon existant.
  function nouveauDevis(prospect, edit) {
    if (!F.session) { S.vue = 'factu'; fermerFiche(); rendre(); return toast('Connecte-toi d’abord à la facturation.', true); }
    D.prospect = prospect || null; D.clientId = prospect && prospect.client ? prospect.client : '';
    D.base = null; D.opts = {}; D.lignes = []; D.mtnCat = null; D.annuel = false; D.frais = FRAIS_DEFAUT(); D.geste = 0; D.rec = {}; D.editId = null;
    if (edit) {
      const a = edit.a; D.prospect = null; D.editId = edit.devis.id; D.clientId = edit.devis.client_id;
      D.base = a.formule; D.opts = Object.assign({}, a.options);
      D.lignes = a.libres.map(l => ({ designation: l.designation, quantite: Number(l.quantite) || 0, pu: Number(l.prix_unitaire_ht) || 0 }));
      D.mtnCat = a.mtn && a.mtn.cat ? a.mtn.cat : (a.formule ? catDe(a.formule) : null); D.annuel = !!(a.mtn && a.mtn.annuel);
      a.recurrentes.forEach(r => { const x = RECURRENTES.find(y => r.libelle.startsWith(y.n)); if (x) D.rec[x.id] = true; });
      D.frais = a.frais.map(f => ({ designation: f.libelle, pu: f.pu || '' }));
      D.geste = a.geste ? a.geste.pct : 0;
    }
    const dans30 = new Date(Date.now() + 30 * 864e5);
    const cc = F.clients.find(c => c.id === D.clientId) || {};
    const nomClient = prospect ? prospect.entreprise : (edit ? cc.nom_etablissement || '' : '');
    feuille(tete(edit ? 'Modifier le brouillon' : 'Nouveau devis', nomClient ? esc(nomClient) + (D.clientId ? '' : ' · la fiche client sera créée') : '') + `

      ${prospect || edit ? '' : `<label class="champ">Client<select name="client" required><option value="">Choisir un client…</option>
        ${F.clients.map(c => `<option value="${c.id}">${esc(c.nom_etablissement)}</option>`).join('')}</select></label>
        <div class="sous" style="margin-bottom:10px">Pour un nouveau client, pars plutôt de sa fiche prospect : ses infos sont reprises.</div>`}
        <label class="champ">Adresse<input name="adresse" value="${esc(cc.adresse || '')}" placeholder="N°, rue, code postal, localité"></label>
        <label class="champ">N° TVA client<input name="tva_intra" value="${esc(cc.tva_intra || '')}" placeholder="LU12345678, si société"></label></div>
      <div class="bloc"><h3>1 · Formule de base</h3><div class="fx-chips" id="fx-bases"></div><div id="fx-inclus"></div></div>
      <div class="bloc"><h3>2 · Options complémentaires</h3><div id="fx-qtes"></div><div class="fx-chips" id="fx-opts"></div></div>
      <div class="bloc"><h3>Lignes sur mesure</h3><div id="fx-lignes"></div>
        <button type="button" class="btn clair large" data-fx="ajout-ligne">＋ Ajouter une ligne</button></div>
      <div class="bloc"><h3>3 · Maintenance, hébergement &amp; sécurité</h3>
        <div class="sous" style="margin:0 0 8px">Obligatoire. Catégorie reprise de la formule, modifiable.</div>
        <div class="fx-chips" id="fx-mtn-cat"></div><div class="fx-chips" id="fx-mtn-per" style="margin-top:8px"></div>
        <div class="sous" id="fx-mtn-mod" style="margin:8px 0 0"></div>
        <h3 style="margin-top:14px">Options récurrentes</h3>
        <div class="sous" style="margin:0 0 8px">Au même rythme que la maintenance, payées avec elle.</div>
        <div class="fx-chips" id="fx-rec"></div>

        <button type="button" class="btn clair large" data-fx="ajout-frais">＋ Ajouter des frais</button></div>
      <div class="bloc"><h3>Geste commercial</h3>
        <div class="sous" style="margin:0 0 8px">Remise en % sur la création du site (pas sur la maintenance). Le prix se recalcule en direct.</div>
        <div class="fx-geste"><input name="geste" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="0" aria-label="Geste commercial en pourcentage"> <b>%</b>
          <div class="fx-chips" id="fx-gestes"></div></div>
        <div class="fx-geste-effet" id="fx-geste-effet"></div></div>

      <div class="fx-totaux" id="fx-totaux"></div>

    if (edit) {

      f.querySelector('[type=submit]').textContent = 'Enregistrer les modifications';
      if (edit.a.mtn && !edit.a.mtn.cat) toast('Ancienne maintenance non reconnue : choisis-la de nouveau (partie 3).', true);
    }
    dessinerChoix(); calculer();
  }

  // Un brouillon (sans numéro) se reprend en entier : mêmes écrans que pour un nouveau devis.
  async function modifierDevis(id) {
    const d = F.devis.find(x => x.id === id);
    if (!d || d.statut !== 'brouillon' || d.numero) return toast('Seul un devis brouillon, sans numéro, se modifie.', true);
    const { data: lignes, error } = await F.sb.from('devis_lignes').select('*').eq('devis_id', id).order('ordre');
    if (error) return toast(error.message, true);
    const client = F.clients.find(c => c.id === d.client_id) || {};
    nouveauDevis(null, { devis: d, a: NSDocs.analyser(lignes || [], client), client });
  }

    const m = MAINTENANCE.find(x => x.cat === D.mtnCat);

    document.getElementById('fx-frais').innerHTML = D.frais.map((l, i) => `<div class="fx-frais" data-i="${i}">
      <input data-k="designation" placeholder="Ex. boîte mail supplémentaire" value="${esc(l.designation)}"><input data-k="pu" type="number" min="0" step="0.01" placeholder="Prix HT" value="${l.pu}">
      <button type="button" data-fx="suppr-frais" data-i="${i}" aria-label="Retirer">×</button></div>`).join('');
    document.getElementById('fx-gestes').innerHTML = [0, ...GESTES].map(g => `<button type="button" data-fx-geste="${g}" class="${D.geste === g ? 'on' : ''}">${g ? g + ' %' : 'Aucun'}</button>`).join('');
    document.getElementById('fx-lignes').innerHTML = D.lignes.map((l, i) => `<div class="fx-ligne" data-i="${i}">
