 contracte pas avec des consommateurs.</p>\n  <p>1.3. Elles sont remises au Client avant la signature du contrat, jointes aux conditions particulières et consultables à tout moment sur le site internet du Prestataire. La signature des conditions particulières emporte leur acceptation.</p>\n  <p>1.4. Elles prévalent sur toutes conditions générales ou d'achat du Client, sauf dérogation écrite et signée par le Prestataire.</p>\n\n  <h2>Article 2. Formation du contrat</h2>\n  <p>2.1. Les devis du Prestataire sont valables pendant la durée qui y est indiquée, à défaut pendant trente (30) jours.</p>\n  <p>2.2. Le contrat est formé par la signature des conditions particulières par les deux parties. Les travaux commencent à réception de l'acompte.</p>\n\n  <h2>Article 3. Création du site</h2>\n  <p>3.1. <b>Contenu de la prestation.</b> Le Prestataire réalise le site décrit au devis. Toute fonctionnalité ou page non mentionnée au devis fait l'objet d'un devis complémentaire.</p>\n  <p>3.2. <b>Collaboration du Client.</b> Le Client fournit dans les meilleurs délais les éléments nécessaires : textes, photos, logo, informations légales, horaires, tarifs, accès à ses comptes existants. Les délais annoncés par le Prestataire sont indicatifs et courent à compter de la réception de l'acompte et de ces éléments.</p>\n  <p>3.3. <b>Corrections.</b> Le prix de la création comprend deux (2) séries de corrections sur la proposition présentée, sauf mention contraire au devis. Les demandes au-delà, ou qui modifient le cahier des charges initial, sont facturées sur devis.</p>\n  <p>3.4. <b>Validation.</b> Lorsque le site est prêt, le Prestataire le présente au Client, qui dispose de dix (10) jours ouvrables pour le valider ou signaler par écrit les points non conformes au devis. Sans réponse dans ce délai, le site est réputé validé. Une validation n'exclut pas la correction ultérieure d'un défaut technique.</p>\n  <p>3.5. <b>Mise en ligne.</b> Le site est mis en ligne après sa validation et le paiement du solde. La date de mise en ligne marque le début du contrat de maintenance et d'hébergement.</p>\n  <p>3.6. <b>Inaction du Client.</b> Si le Client ne fournit pas les éléments demandés ou ne se prononce pas sur le site dans un délai de soixante (60) jours à compter de la demande écrite du Prestataire, celui-ci peut facturer le solde de la création. Le site est alors conservé et mis en ligne dès réception des éléments ou de la validation.</p>\n  <p>3.7. <b>Renonciation du Client.</b> Si le Client renonce au projet après le début des travaux, l'acompte reste acquis au Prestataire en contrepartie du travail engagé, sauf manquement de ce dernier.</p>\n\n  <h2>Article 4. Maintenance et hébergement : contenu du service</h2>\n  <p>4.1. Le forfait de maintenance comprend :</p>\n  <ul>\n    <li>l'hébergement du site au Luxembourg, auprès de Visual Online S.A. (Contern) ;</li>\n    <li>l'enregistrement et le renouvellement du nom de domaine au nom du Client ;</li>\n    <li>une (1) boîte mail professionnelle sur ce domaine, les boîtes supplémentaires étant en option ;</li>\n    <li>la maintenance technique, les mises à jour, la surveillance de sécurité, le certificat de sécurité (https) et les sauvegardes ;</li>\n    <li>l'assistance par e-mail et par téléphone, les jours ouvrables ;</li>\n    <li>les petites modifications définies à l'article 4.2.</li>\n  </ul>\n  <p>4.2. <b>Petites modifications.</b> Sont comprises les mises à jour de contenus existants : textes, photos, horaires, prix, carte ou menu, coordonnées, dans la limite d'une (1) heure de travail par trimestre, non reportable. Ne sont pas comprises : la création de nouvelles pages ou fonctionnalités, une refonte graphique, la rédaction de nouveaux contenus. Ces travaux, et les modifications au-delà de la limite, font l'objet d'un devis préalable accepté par le Client. L'option « modifications illimitées raisonnables » lève la limite horaire pour les mises à jour de contenus existants, dans un usage normal.</p>\n  <p>4.3. <b>Délais d'intervention.</b> Le Prestataire traite les demandes courantes dans un délai de cinq (5) jours ouvrables et les incidents rendant le site inaccessible dans les meilleurs délais.</p>\n  <p>4.4. <b>Obligation de moyens.</b> Le Prestataire met en œuvre les moyens raisonnables pour assurer la disponibilité et la sécurité du site. La disponibilité dépend aussi d'infrastructures tierces (hébergeur, registre des noms de domaine, réseaux) : une interruption temporaire, notamment pour maintenance, ne constitue pas un manquement.</p>\n  <p>4.5. <b>Caractère obligatoire.</b> Le Prestataire n'héberge et ne met en ligne un site qu'avec un contrat de maintenance en cours.</p>\n\n  <h2>Article 5. Durée de la maintenance</h2>\n  <p>5.1. Le contrat de maintenance et d'hébergement est conclu pour une <b>durée initiale ferme de douze (12) mois</b> à compter de la mise en ligne, que le Client ait choisi un paiement trimestriel ou annuel. Le paiement trimestriel est une facilité de paiement et ne réduit pas cette durée.</p>\n  <p>5.2. À l'issue de la durée initiale, le contrat se <b>renouvelle automatiquement par périodes successives de douze (12) mois</b>, sauf résiliation dans les conditions de l'article 6.</p>\n\n  <h2>Article 6. Résiliation</h2>\n  <p>6.1. <b>À l'échéance.</b> Chaque partie peut mettre fin au contrat à l'échéance de la période en cours en notifiant sa décision <b>au moins deux (2) mois avant cette échéance</b>, par lettre recommandée avec accusé de réception, ou par e-mail adressé à l'adresse de notification de l'autre partie et dont celle-ci accuse réception. Le Prestataire accuse réception d'une résiliation reçue par e-mail dans un délai de cinq (5) jours ouvrables.</p>\n  <p>6.2. <b>En cours de période.</b> Une résiliation à l'initiative du Client en cours de période ne prend effet qu'à l'échéance de celle-ci. Les sommes dues jusqu'à cette échéance restent dues ; en cas de paiement trimestriel, les trimestres restants de la période deviennent exigibles.</p>\n  <p>6.3. <b>Pour manquement.</b> En cas de manquement grave de l'une des parties à ses obligations, non réparé trente (30) jours après une mise en demeure par lettre recommandée, l'autre partie peut résilier le contrat de plein droit, sans préjudice de tous dommages et intérêts.</p>\n  <p>6.4. Les conséquences de la fin du contrat sont réglées à l'article 13.</p>\n\n  <h2>Article 7. Prix, facturation et paiement</h2>\n  <p>7.1. Les prix sont exprimés en euros <b>hors taxes</b>. La TVA luxembourgeoise au taux en vigueur à la date de facturation s'y ajoute (17 % à la date des présentes conditions).</p>\n  <p>7.2. <b>Création :</b> 50 % du prix à la signature, 50 % avant la mise en ligne.</p>\n  <p>7.3. <b>Maintenance :</b> facturée <b>d'avance</b>, au début de chaque trimestre ou de chaque année selon le rythme choisi. Les options récurrentes suivent le même rythme.</p>\n  <p>7.4. Les factures sont payables par virement bancaire dans un délai de <b>quinze (15) jours</b> à compter de leur date, sauf délai différent indiqué sur la facture.</p>\n  <p>7.5. <b>Retard de paiement.</b> Conformément à la loi modifiée du 18 avril 2004 relative aux délais de paiement et aux intérêts de retard, toute somme non payée à l'échéance porte de plein droit, sans mise en demeure, intérêt au taux légal applicable aux transactions commerciales, et donne lieu à une indemnité forfaitaire de quarante (40) euros pour frais de recouvrement. Le Prestataire peut réclamer une indemnisation complémentaire raisonnable si les frais de recouvrement exposés dépassent ce montant.</p>\n  <p>7.6. <b>Révision des prix.</b> Le Prestataire peut réviser le prix de la maintenance une fois par an, pour la période suivante. Il en informe le Client par écrit <b>au moins trois (3) mois avant l'échéance</b>, de sorte que le Client puisse résilier dans le délai de l'article 6.1 s'il n'accepte pas le nouveau prix.</p>\n\n  <h2>Article 8. Suspension en cas d'impayé</h2>\n  <p>8.1. Si une facture reste impayée quinze (15) jours après son échéance, le Prestataire adresse au Client une mise en demeure par écrit. Si le paiement n'intervient pas dans les huit (8) jours de cette mise en demeure, le Prestataire peut suspendre l'accès au site et aux services associés.</p>\n  <p>8.2. La suspension ne met pas fin au contrat, ne suspend pas les sommes dues et n'entraîne aucune suppression de données. Le service est rétabli dans les deux (2) jours ouvrables suivant le paiement intégral des sommes échues.</p>\n  <p>8.3. La suspension ne porte jamais sur le nom de domaine, qui reste la propriété du Client (article 9).</p>\n\n  <h2>Article 9. Nom de domaine</h2>\n  <p>9.1. Le nom de domaine est enregistré <b>au nom du Client, qui en est le seul titulaire</b>. Le Prestataire est désigné comme contact technique et en assure le renouvellement pendant la durée du contrat.</p>\n  <p>9.2. Le Client garantit que le nom choisi ne porte pas atteinte aux droits de tiers (marques, dénominations, noms commerciaux) et tient ses coordonnées de titulaire à jour.</p>\n  <p>9.3. À la fin du contrat, ou à tout moment sur demande écrite du Client, le Prestataire lui remet dans un délai de dix (10) jours ouvrables le code de transfert du domaine et l'assiste pour le changement de contact technique. Cette remise est due <b>indépendamment de tout litige sur le paiement</b>.</p>\n\n  <h2>Article 10. Propriété intellectuelle</h2>\n  <p>10.1. <b>Contenus du Client.</b> Les textes, photos, logos, marques et autres éléments fournis par le Client restent sa propriété. Il concède au Prestataire le droit de les utiliser pour réaliser, héberger et maintenir le site, et garantit disposer des droits nécessaires. Il garantit le Prestataire contre toute réclamation de tiers à ce titre.</p>\n  <p>10.2. <b>Créations réalisées pour le Client.</b> Sous réserve du <b>paiement intégral du prix de la création</b>, le Prestataire cède au Client, pour la durée légale de protection et pour le monde entier, les droits patrimoniaux de reproduction, de représentation et d'adaptation sur les éléments graphiques et les textes créés spécifiquement pour son site, aux fins de leur exploitation sur son site internet et sur ses supports de communication. Jusqu'au paiement intégral, le Client ne dispose que d'un droit d'usage provisoire.</p>\n  <p>10.3. <b>Savoir-faire et outils du Prestataire.</b> Le Prestataire conserve la propriété de ses méthodes, modèles de mise en page, bibliothèques de code, effets et animations génériques, ainsi que de ses modules logiciels (notamment le module de prise de rendez-vous et l'espace client), qu'il peut réutiliser pour d'autres clients. Le Client reçoit sur ces éléments, dans la mesure où ils sont intégrés à son site, un droit d'utilisation non exclusif pour les besoins de ce site. Le Prestataire s'interdit de reproduire pour un tiers l'identité propre du Client : son nom, son logo, ses textes et ses photos.</p>\n  <p>10.4. <b>Services hébergés.</b> Les modules fonctionnant sur l'infrastructure du Prestataire (prise de rendez-vous, espace client, envoi automatique de messages) sont fournis comme un service pendant la durée du contrat de maintenance. Ils cessent à la fin de celui-ci ; les données du Client lui sont alors restituées conformément à l'article 13 et à l'annexe « Traitement des données personnelles ».</p>\n  <p>10.5. <b>Références.</b> Selon le choix exprimé aux conditions particulières, le Prestataire peut présenter le site dans ses références et y faire figurer une mention discrète « Site réalisé par NS Development ». Le Client peut retirer cette autorisation à tout moment par écrit, avec effet dans un délai de trente (30) jours.</p>\n  <p>10.6. <b>Éléments de tiers.</b> Les polices de caractères, images et composants de tiers sont utilisés selon leurs licences respectives, que le Client s'engage à respecter.</p>\n\n  <h2>Article 11. Obligations du Client</h2>\n  <p>11.1. Le Client est l'<b>éditeur</b> de son site et reste responsable des informations qui y sont publiées : exactitude de ses prix, horaires, offres, mentions obligatoires propres à son activité (par exemple les allergènes en restauration ou les règles déontologiques d'une profession réglementée).</p>\n  <p>11.2. Le Prestataire rédige les pages « Mentions légales » et « Politique de confidentialité » du site à partir des informations que le Client lui communique. Le Client vérifie ces informations et signale sans délai tout changement (adresse, forme sociale, numéros d'immatriculation, autorisation d'établissement).</p>\n  <p>11.3. Le Client garde confidentiels ses identifiants d'accès et n'utilise pas le site ou la messagerie à des fins illicites ou contraires aux bonnes mœurs, ni pour l'envoi de messages commerciaux non sollicités.</p>\n\n  <h2>Article 12. Données personnelles</h2>\n  <p>12.1. Chaque partie traite les données personnelles dont elle a la charge dans le respect du règlement (UE) 2016/679 (RGPD) et de la loi du 1er août 2018 portant organisation de la Commission nationale pour la protection des données.</p>\n  <p>12.2. Pour les données qu'il traite <b>pour le compte du Client</b> (formulaires du site, messagerie, prise de rendez-vous), le Prestataire agit en qualité de <b>sous-traitant</b> au sens de l'article 28 du RGPD, dans les conditions de l'annexe « Traitement des données personnelles », qui fait partie intégrante du contrat.</p>\n  <p>12.3. Pour les données de ses propres clients et prospects (gestion commerciale, facturation), le Prestataire agit en qualité de responsable du traitement, conformément à sa politique de confidentialité publiée sur son site.</p>\n  <p>12.4. Les sites livrés par le Prestataire ne déposent pas de cookies ou traceurs non essentiels sans le consentement préalable des visiteurs et chargent leurs polices de caractères depuis leur propre hébergement. Tout ajout demandé par le Client (outil de mesure d'audience, publicité, réseaux sociaux intégrés) s'accompagne du recueil du consentement requis.</p>\n\n  <h2>Article 13. Fin du contrat et restitution</h2>\n  <p>13.1. À la fin du contrat de maintenance, pour quelque cause que ce soit, l'hébergement du site et des boîtes mail prend fin à la date d'effet de la résiliation. Il appartient au Client de récupérer le contenu de ses boîtes mail avant cette date ; le Prestataire lui indique la marche à suivre sur demande.</p>\n  <p>13.2. Sur demande écrite formulée au plus tard trente (30) jours après la fin du contrat, et sous réserve du paiement de la création, le Prestataire remet au Client une archive des fichiers de son site dans son état à la date de fin, ainsi que l'export de ses données prévu à l'annexe. L'assistance à la migration vers un autre prestataire est facturée sur devis.</p>\n  <p>13.3. Le code de transfert du nom de domaine est remis dans les conditions de l'article 9.3.</p>\n\n  <h2>Article 14. Responsabilité</h2>\n  <p>14.1. Le Prestataire est tenu d'une obligation de moyens. Il n'est pas responsable des dommages indirects, tels que perte de chiffre d'affaires, de clientèle, de données non sauvegardées par le Client ou atteinte à l'image, ni des défaillances de services tiers qu'il ne maîtrise pas (plateformes de réservation, réseaux sociaux, moteurs de recherche, fournisseurs d'accès).</p>\n  <p>14.2. Sa responsabilité, toutes causes confondues, est limitée au montant hors taxes payé par le Client au titre du contrat au cours des douze (12) mois précédant le fait générateur.</p>\n  <p>14.3. Ces limitations ne s'appliquent pas en cas de faute lourde ou intentionnelle, ni aux dommages corporels.</p>\n  <p>14.4. Le Prestataire ne garantit pas un positionnement déterminé dans les moteurs de recherche, qui dépend de facteurs qu'il ne maîtrise pas.</p>\n\n  <h2>Article 15. Force majeure</h2>\n  <p>Aucune partie n'est responsable d'un manquement causé par un événement de force majeure au sens du droit luxembourgeois. L'exécution est suspendue pendant la durée de l'événement. Si celui-ci dure plus de deux (2) mois, chaque partie peut résilier le contrat par lettre recommandée, sans indemnité.</p>\n\n  <h2>Article 16. Sous-traitance et confidentialité</h2>\n  <p>16.1. Le Prestataire peut recourir à des prestataires techniques (hébergement, envoi de messages, base de données). Il reste responsable envers le Client de leur intervention. Ceux qui traitent des données personnelles du Client sont listés dans l'annexe.</p>\n  <p>16.2. Chaque partie garde confidentielles les informations non publiques de l'autre dont elle a connaissance à l'occasion du contrat, pendant sa durée et deux (2) ans après sa fin.</p>\n\n  <h2>Article 17. Dispositions diverses</h2>\n  <p>17.1. <b>Modification des conditions générales.</b> Une nouvelle version s'applique au contrat en cours à compter du renouvellement suivant, si elle a été communiquée au Client au moins trois (3) mois avant l'échéance. À défaut d'acceptation, le Client peut résilier dans les conditions de l'article 6.1.</p>\n  <p>17.2. <b>Communications.</b> Les échanges par e-mail aux adresses indiquées dans les conditions particulières valent écrit, sauf lorsque les présentes exigent une lettre recommandée.</p>\n  <p>17.3. <b>Nullité partielle.</b> Si une clause est déclarée nulle, les autres clauses restent applicables et la clause nulle est remplacée par la disposition valable la plus proche de l'intention des parties.</p>\n  <p>17.4. <b>Tolérance.</b> Le fait de ne pas se prévaloir d'une clause ne vaut pas renonciation à s'en prévaloir ultérieurement.</p>\n  <p>17.5. <b>Langue.</b> Le contrat est rédigé en français. Toute traduction est fournie à titre informatif ; la version française prévaut.</p>\n\n  <h2>Article 18. Droit applicable et litiges</h2>\n  <p>18.1. Le contrat est soumis au <b>droit luxembourgeois</b>.</p>\n  <p>18.2. En cas de différend, les parties recherchent une solution amiable pendant trente (30) jours à compter de la notification écrite du différend par l'une d'elles.</p>\n  <p>18.3. À défaut d'accord, le litige relève de la compétence exclusive des juridictions de l'arrondissement judiciaire de Luxembourg.</p>\n</div>\n<p class=\"k-paraphe\">Paraphe du Client : ________</p>\n</div>\n\n<div class=\"k-page k-part\">\n  <div class=\"k-part-title\">Partie 3 · Annexe</div>\n  <h1>Traitement des données personnelles</h1>\n  <p class=\"k-sub\">Accord de sous-traitance au sens de l'article 28 du règlement (UE) 2016/679 (RGPD)</p>\n\n  <p>Entre <b>NS Development SARL-S</b>, 2, rue de la fontaine, L-4988 Sanem, RCS Luxembourg B310037 (le « Sous-traitant »), et le Client désigné aux conditions particulières (le « Responsable de traitement »).</p>\n\n  <h2>1. Objet</h2>\n  <p>Le Sous-traitant traite des données personnelles <b>pour le compte</b> du Responsable de traitement, uniquement pour fournir les services cochés à l'article 5 des conditions particulières. Le Responsable de traitement détermine seul les finalités du traitement. Le Sous-traitant n'utilise ces données ni pour son propre compte, ni à des fins commerciales, ni pour entraîner un système automatisé.</p>\n\n  <h2>2. Description du traitement</h2>\n  <table>\n    <tr><th>Service</th><th>Données traitées</th><th>Personnes concernées</th></tr>\n    <tr><td>Formulaire de contact</td><td>nom, e-mail, téléphone, contenu du message</td><td>visiteurs du site qui écrivent au Client</td></tr>\n    <tr><td>Boîte(s) mail</td><td>contenu et métadonnées des e-mails reçus et envoyés</td><td>correspondants du Client</td></tr>\n    <tr><td>Prise de rendez-vous</td><td>nom, prénom, e-mail, téléphone, date, heure et prestation, commentaire libre</td><td>clients, patients ou usagers du Client</td></tr>\n    <tr><td>Hébergement du site</td><td>journaux techniques du serveur (adresse IP, date, page demandée)</td><td>visiteurs du site</td></tr>\n  </table>\n  <p><b>Nature des opérations :</b> hébergement, stockage, sauvegarde, consultation technique, transmission des messages, suppression.</p>\n  <p><b>Données sensibles.</b> Chez un professionnel de santé, le commentaire libre d'un rendez-vous peut contenir des données de santé au sens de l'article 9 du RGPD. Le Sous-traitant recommande de ne pas y solliciter d'information médicale ; le Responsable de traitement reste maître de la formulation de ce champ.</p>\n  <p><b>Durée :</b> celle du contrat de maintenance, puis les délais de l'article 7 ci-dessous.</p>\n\n  <h2>3. Obligations du Sous-traitant</h2>\n  <ol>\n    <li>Ne traiter les données que sur <b>instruction documentée</b> du Responsable de traitement, le contrat valant instruction initiale, et l'informer si une instruction lui paraît contraire à la réglementation.</li>\n    <li>Garantir que les personnes autorisées à traiter les données sont tenues à la <b>confidentialité</b>.</li>\n    <li>Mettre en œuvre les <b>mesures de sécurité</b> de l'article 5 ci-dessous (article 32 du RGPD).</li>\n    <li>Ne recourir à un autre sous-traitant que dans les conditions de l'article 4 ci-dessous.</li>\n    <li>Aider le Responsable de traitement à répondre aux demandes d'exercice des droits des personnes : accès, rectification, effacement, limitation, opposition, portabilité.</li>\n    <li>L'aider à respecter ses obligations de sécurité, de notification des violations et, le cas échéant, d'analyse d'impact (articles 32 à 36 du RGPD).</li>\n    <li><b>Notifier toute violation de données</b> au Responsable de traitement dans les meilleurs délais et au plus tard <b>quarante-huit (48) heures</b> après en avoir pris connaissance, avec les éléments connus : nature de la violation, catégories et volume approximatif des données, conséquences probables, mesures prises ou envisagées.</li>\n    <li>Supprimer ou restituer les données au terme du contrat (article 7).</li>\n    <li>Mettre à disposition les informations nécessaires pour démontrer le respect de ces obligations et permettre la réalisation d'audits, avec un préavis raisonnable et aux frais du Responsable de traitement.</li>\n    <li>Tenir le registre des catégories de traitements effectués pour le compte de ses clients (article 30.2 du RGPD) et coopérer avec la Commission nationale pour la protection des données (CNPD).</li>\n  </ol>\n\n  <h2>4. Sous-traitants ultérieurs</h2>\n  <p>Le Responsable de traitement autorise le recours aux prestataires suivants, selon les services souscrits :</p>\n  <table>\n    <tr><th>Prestataire</th><th>Rôle</th><th>Lieu de traitement et garanties</th></tr>\n    <tr><td>Visual Online S.A., 6, rue Goell, L-5326 Contern (RCS B79872)</td><td>hébergement du site, boîtes mail, enregistrement du nom de domaine</td><td>Luxembourg</td></tr>\n    <tr><td>Supabase Pte. Ltd, 65 Chulia Street, Singapour</td><td>base de données et authentification du module de rendez-vous et de l'espace client</td><td>données hébergées dans l'Union européenne (Irlande) ; accès éventuels depuis l'extérieur de l'Union encadrés par les clauses contractuelles types de la Commission européenne, intégrées à son accord de traitement des données</td></tr>\n    <tr><td>Plus Five Five, Inc., exploitant Resend (États-Unis)</td><td>acheminement des e-mails automatiques du module de rendez-vous</td><td>États-Unis ; société adhérente au EU-U.S. Data Privacy Framework, et clauses contractuelles types</td></tr>\n  </table>\n  <p>Tout ajout ou remplacement est notifié par écrit au Responsable de traitement, qui dispose de trente (30) jours pour s'y opposer de manière motivée. Le Sous-traitant impose à ses sous-traitants ultérieurs des obligations de protection équivalentes à celles de la présente annexe.</p>\n\n  <h2>5. Mesures de sécurité</h2>\n  <ul>\n    <li><b>Chiffrement des échanges</b> (https) sur le site, les formulaires et les accès d'administration ; chiffrement au repos assuré par l'hébergeur de la base de données.</li>\n    <li><b>Cloisonnement par la base de données :</b> chaque client n'accède qu'à ses propres données, le contrôle étant exercé par le serveur et non par la page web.</li>\n    <li><b>Aucune donnée personnelle exposée au site public :</b> le site ne reçoit que des plages horaires disponibles, jamais un nom, un téléphone ou un motif.</li>\n    <li><b>Accès nominatifs</b> du professionnel, mots de passe gérés par le fournisseur d'authentification et inconnus du Sous-traitant.</li>\n    <li><b>Sauvegardes</b> régulières, mises à jour de sécurité, accès d'administration limités aux gérants du Sous-traitant.</li>\n    <li><b>Effacement automatique</b> des identités passé le délai de conservation (article 6).</li>\n  </ul>\n\n  <h2>6. Durée de conservation</h2>\n  <p>Les coordonnées rattachées à un rendez-vous sont <b>automatiquement anonymisées vingt-quatre (24) mois</b> après la date du rendez-vous ; le rendez-vous est ensuite conservé sous forme anonyme à des fins statistiques. Ce délai peut être modifié sur instruction du Responsable de traitement, dans les limites de la réglementation qui lui est applicable. Les messages reçus par formulaire et par e-mail sont conservés dans la boîte du Client, qui en fixe la durée.</p>\n\n  <h2>7. Sort des données en fin de contrat</h2>\n  <p>Au terme du contrat, le Responsable de traitement indique par écrit dans les trente (30) jours s'il souhaite :</p>\n  <ul>\n    <li>la <b>restitution</b> de ses données dans un format lisible par machine (CSV ou JSON), puis leur suppression ; ou</li>\n    <li>leur <b>suppression</b> pure et simple.</li>\n  </ul>\n  <p>Sans instruction dans ce délai, le Sous-traitant procède à la suppression et la confirme par écrit, sauf obligation légale de conservation.</p>\n\n  <h2>8. Obligations du Responsable de traitement</h2>\n  <p>Le Responsable de traitement fournit au Sous-traitant des instructions conformes à la réglementation, informe les personnes concernées du traitement (le Sous-traitant rédige pour lui la politique de confidentialité du site), et reste l'interlocuteur des personnes concernées et de l'autorité de contrôle pour ses propres traitements.</p>\n\n  <div class=\"k-a   // Formatage à la main : selon le moteur, toLocaleString('fr-FR') écrit « 1350,00 » sans séparateur.
  const eur = n => { const v = Math.round((Number(n) || 0) * 100) / 100, [e, d] = Math.abs(v).toFixed(2).split('.');
    return (v < 0 ? '-' : '') + e.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + ',' + d; };

    const E = EMETTEUR();
    const num = d.numero || 'Brouillon';
    const taux = Number(d.tva_taux) || 0;
    const a = analyser(lignes, c);
    const t = decompte(a.site, a.maintenance, taux);
    const m = n => eur(n) + ' €';

    const formules = C.FORMULES.map(f => { const on = a.formule === f.n;
      return '<div class="row' + (on ? ' on' : ' off') + '">' + cb(on) + '<div class="d"><div class="nm">' + f.n + '</div><div class="ds">' + esc(f.desc) + '</div></div><div class="p">' + m(f.pu) + '</div></div>'; }).join('');
    const inclus = optionsIncluses(a.formule);
    // Seules les options retenues (et celles comprises dans la formule) sont listées : le catalogue
    // complet ne tient plus sur la page 1 depuis la grille du 30/09/2026.
    const options = C.OPTIONS.filter(o => a.options[o.n] || inclus.includes(o.n)).map(o => { const q = a.options[o.n], on = Boolean(q);
      if (inclus.includes(o.n)) return '<div class="row on">' + cb(true) + '<div class="d"><span class="nm">' + esc(o.n) + '</span></div>'
        + '<div class="p"><span class="u">compris dans ' + esc(a.formule) + '</span>inclus</div></div>';
      return '<div class="row' + (on ? ' on' : ' off') + '">' + cb(on) + '<div class="d"><span class="nm">' + esc(o.n) + '</span>'
        + (o.qte ? '<span class="q">x <b>' + (on ? eur(q).replace(/,00$/, '') : '&nbsp;&nbsp;') + '</b></span>' : '') + '</div>'
        + '<div class="p">' + (o.qte ? '<span class="u">l’unité</span>' : '') + m(o.pu) + (on && o.qte && q !== 1 ? '<span class="tot">= ' + m(o.pu * q) + '</span>' : '') + '</div></div>'; }).join('')
      + a.libres.map(l => '<div class="row on">' + cb(true) + '<div class="d"><span class="nm">' + esc(l.designation) + '</span>'
        + (Number(l.quantite) !== 1 ? '<span class="q">x <b>' + eur(l.quantite).replace(/,00$/, '') + '</b></span>' : '') + '</div>'
        + '<div class="p">' + (Number(l.quantite) !== 1 ? '<span class="u">l’unité</span>' + m(l.prix_unitaire_ht) + '<span class="tot">= ' + m(l.montant_ht) + '</span>' : m(l.montant_ht)) + '</div></div>').join('')
      || '<div class="row off"><div class="d"><span class="ds">Aucune option retenue.</span></div></div>';
    const mtn = a.mtn, nMod = mtn && mtn.modules || 0;
    const maintenance = C.MAINTENANCE.map(x => {
      const onT = mtn && mtn.cat === x.cat && !mtn.annuel, onA = mtn && mtn.cat === x.cat && mtn.annuel;
      return '<tr><td class="cat">' + x.cat + '</td><td class="' + (onT ? 'on' : '') + '"><div class="opt">' + cb(onT) + '<div><b>' + m(x.trim) + '</b> <span>HT / trim.</span></div></div></td>'
        + '<td class="' + (onA ? 'on' : '') + '"><div class="opt">' + cb(onA) + '<div><b>' + m(x.an) + '</b> <span>HT / an</span><span class="eco">Éco. ' + eur(x.trim / 3 * 12 - x.an).replace(/,00$/, '') + ' €</span></div></div></td></tr>';
    }).join('')
      + '<tr><td class="cat">+ par module' + (nMod ? ' (× ' + nMod + ')' : '') + '</td>'
      + '<td class="' + (nMod && !mtn.annuel ? 'on' : '') + '"><div class="opt">' + cb(nMod && !mtn.annuel) + '<div><b>' + m(C.MODULE.trim) + '</b> <span>HT / trim.</span>' + (nMod && !mtn.annuel ? '<span class="eco">= ' + m(C.MODULE.trim * nMod) + '</span>' : '') + '</div></div></td>'
      + '<td class="' + (nMod && mtn.annuel ? 'on' : '') + '"><div class="opt">' + cb(nMod && mtn.annuel) + '<div><b>' + m(C.MODULE.an) + '</b> <span>HT / an</span>' + (nMod && mtn.annuel ? '<span class="eco">= ' + m(C.MODULE.an * nMod) + '</span>' : '') + '</div></div></td></tr>'
      + a.recurrentes.map(r => '<tr><td class="cat" colspan="2">' + esc(r.libelle) + '</td><td class="on"><div class="opt">' + cb(true) + '<div><b>' + m(r.montant) + '</b> <span>HT</span></div></div></td></tr>').join('') + (mtn && !mtn.cat ? '<tr><td class="cat">Forfait convenu</td><td colspan="2" class="on"><div class="opt">' + cb(true) + '<div><b>' + m(mtn.montant) + '</b> <span>HT / ' + (mtn.annuel ? 'an' : 'trim.') + '</span></div></div></td></tr>' : '');

    const page1 = '<div class="sheet">' + tete('DEVIS', [['Devis N°', num], ['Date', fmtDate(d.date_emission)], ['Validité', d.date_validite ? 'jusqu’au ' + fmtDate(d.date_validite) : '30 jours']])
      + parties(c, 'Client &amp; références')
      + '<section>' + sec(1, 'Formule de base', 'formule choisie, prix HT') + formules + '</section>'
      + '<section>' + sec(2, 'Options complémentaires', 'options retenues, prix unit. HT') + options + '</section>'
      + '<section>' + sec(3, 'Maintenance, hébergement &amp; sécurité', 'obligatoire, ligne retenue cochée')
      + '<div class="inclus">Inclus : ' + C.INCLUS + '</div>'
      + '<div class="inclus">Chaque module (rendez-vous, inscriptions, catalogue, espace de modification, chat, paiement, blog) ajouté en option se surveille et se sauvegarde : il ajoute ' + m(C.MODULE.trim) + ' HT par trimestre, ou ' + m(C.MODULE.an) + ' HT par an.</div>'
      + '<table class="mtn"><thead><tr><th>Catégorie de formule</th><th>Option trimestrielle (3 mois)</th><th>Option annuelle (11 mois + 1 offert)</th></tr></thead><tbody>' + maintenance + '</tbody></table>'
      + '<div class="frais"><div class="ft">Frais supplémentaires éventuels (hors forfait)</div><div class="fm">' + esc(C.FRAIS_MENTION) + '</div>'
      + (a.frais.length ? a.frais.map(f => '<div class="fl"><span>' + esc(f.libelle) + '</span><b>' + (f.pu ? m(f.pu) + ' HT' : 'sur devis') + '</b></div>').join('')
        : '<div class="vide"></div><div class="vide"></div>') + '</div></section>'
      + '<div class="bas">NS Development SARL-S · devis ' + esc(num) + ' · page 1 / 2 · le décompte financier est en page 2</div></div>';

    const page2 = '<div class="sheet">' + tete('DEVIS', [['Page', '2 / 2'], ['N°', num]])
      + '<section>' + sec(4, 'Décompte financier &amp; modalités', 'montants en euros')
      + '<div class="page2"><div class="cond"><p><b>Conditions de paiement :</b></p>'
      + '<p><b>Acompte initial :</b> 50 % HT du prix du site web + 100 % HT du forfait de maintenance choisi (trimestriel ou annuel).</p>'
      + '<p><b>Solde final :</b> les 50 % HT restants du site web sont exigibles à la livraison clés en main, avant la mise en ligne publique.</p>'
      + '<p><b>Facturation :</b> une facture d’acompte est émise à la signature. La facture de solde sera émise lors de la validation finale.</p>'
      + (d.notes ? '<p><b>Notes :</b><br><span style="white-space:pre-wrap">' + esc(d.notes) + '</span></p>' : '') + '</div>'
      + '<div class="recap">' + (a.geste
        ? '<div class="r"><span class="rl">Création Site (HT)</span><span class="rv">' + m(t.site - a.geste.montant) + '</span></div>'
          + '<div class="r geste"><span class="rl">Geste commercial (' + eur(a.geste.pct).replace(/,00$/, '') + ' %)</span><span class="rv">' + m(a.geste.montant) + '</span></div>'
          + '<div class="r"><span class="rl">Total Création Site (HT)</span><span class="rv">' + m(t.site) + '</span></div>'
        : '<div class="r"><span class="rl">Total Création Site (HT)</span><span class="rv">' + m(t.site) + '</span></div>')
      + '<div class="r"><span class="rl">Total Maintenance (HT)</span><span class="rv">' + m(t.maintenance) + '</span></div>'
      + '<div class="r"><span class="rl"><b>Total HT Global</b></span><span class="rv">' + m(t.ht) + '</span></div>'
      + '<div class="r"><span class="rl">TVA (' + eur(taux).replace(/,00$/, '') + ' %)</span><span class="rv">' + m(t.tva) + '</span></div>'
      + '<div class="r total"><span class="rl">TOTAL TTC</span><span class="rv">' + m(t.ttc) + '</span></div>'
      + '<div class="r acc"><span class="rl">Acompte TTC à régler</span><span class="rv">' + m(t.acompte) + '</span></div>'
      + '<div class="r"><span class="rl">Solde TTC à la livraison</span><span class="rv">' + m(t.solde) + '</span></div></div></div></section>'
      + '<div class="sign"><div><div class="lbl">Bon pour accord (le client)</div><div class="note">Mention manuscrite « Bon pour accord », date et signature :</div><div class="zone">Date :</div></div>'
      + '<div><div class="lbl">Cachet et signature · NS Development</div><div class="note">&nbsp;</div><div class="zone">' + (d.numero && signataire ? signatureNSD(signataire, d.date_emission, 'devis ' + d.numero) : '') + '</div></div></div>'
      + piedLegal(E) + '</div>';

    return page('Devis ' + num + ' · ' + (c.nom_etablissement || ''), page1 + page2, d.numero && signataire ? CSS_SIGNE() + '.sign .zone .k-signe{margin-top:6px}' : '');
  }

  // ------------------------------------------------------------------ facture
  // Objet lu dans les lignes : « Acompte 50 % … », « Solde 50 % … », sinon facture unique.
  function objetFacture(lignes) {
    if (lignes.some(l => /^Acompte 50 %/.test(l.designation))) return 'acompte';
    if (lignes.some(l => /^Solde 50 %/.test(l.designation))) return 'solde';
    return 'unique';
  }
  const OBJETS = { acompte: 'Acompte 50 % à la commande', solde: 'Solde 50 % à la mise en ligne', unique: 'Facture unique (100 %)' };

  // contrat : { devis, lignes, signataire } pour joindre le contrat rempli (facture d'acompte ou unique).
  // signataireF : 'Sam' ou 'Nelson' pour signer la facture (case cochée dans Factu), sinon rien.
  function docFactureHTML(f, lignes, c, contrat, signataireF) {
    const E = EMETTEUR();
    lignes = lignes.filter(l => !estFrais(l));
    const m = n => eur(n) + ' €';
    const taux = Number(f.tva_taux) || 0;
    const site = arr(lignes.filter(l => !estMaintenance(l)).reduce((s, l) => s + (Number(l.montant_ht) || 0), 0));
    const mtn = arr(lignes.filter(estMaintenance).reduce((s, l) => s + (Number(l.montant_ht) || 0), 0));
    const ht = arr(site + mtn), tva = arr(ht * taux / 100), ttc = arr(ht + tva);
    const paye = Number(f.montant_paye) || 0, reste = arr(ttc - paye);
    const num = f.numero || 'Brouillon', ech = f.date_echeance ? fmtDate(f.date_echeance) : 'à réception';
    const obj = objetFacture(lignes);
    const refDevis = f.devis && f.devis.numero ? f.devis.numero : '';
    const meta = [['Facture N°', num], ['Date', fmtDate(f.date_emission)], ['Échéance', ech]];
    if (refDevis) meta.push(['Réf. devis', refDevis]);
    const table = lignes.length ? lignes.map(l => '<tr><td><div class="nm">' + esc(l.designation) + '</div></td><td class="num">' + eur(l.quantite).replace(/,00$/, '')
      + '</td><td class="num">' + m(l.prix_unitaire_ht) + '</td><td class="num">' + m(l.montant_ht) + '</td></tr>').join('')
      : '<tr><td colspan="4" style="color:#8b95a7;font-style:italic">Aucune ligne</td></tr>';
    const joint = contrat && contrat.devis ? contratCorps(contrat.devis, contrat.lignes || [], contrat.client || c, contrat.signataire, f.date_emission, contrat.signer) : '';
    const sigF = signataireF && f.numero ? signatureNSD(signataireF, f.date_emission, 'facture ' + f.numero) : '';
    return page('Facture ' + num + (joint ? ' et contrat' : '') + ' · ' + (c.nom_etablissement || ''), '<div class="sheet">' + tete('FACTURE', meta) + parties(c, 'Facturé à')
      + '<section>' + sec(1, 'Objet de la facture', '') + Object.keys(OBJETS).map(k => '<div class="row' + (k === obj ? ' on' : ' off') + '">' + cb(k === obj) + '<div class="d"><span class="nm">' + OBJETS[k] + '</span></div></div>').join('') + '</section>'
      + '<section>' + sec(2, 'Détail', 'repris du devis' + (refDevis ? ' ' + esc(refDevis) : ''))
      + '<table class="detail"><thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">P.U. HT</th><th class="num">Total HT</th></tr></thead><tbody>' + table + '</tbody></table></section>'
      + '<section>' + sec(3, 'Récapitulatif', 'montants en euros') + '<div class="page2"><div class="cond">'
      + '<p><b>Règlement :</b> virement bancaire, titulaire ' + E.nom + ', IBAN ' + esc(E.iban) + ', BIC ' + esc(E.bic) + '.</p>'
      + '<p><b>Communication :</b> le numéro de la facture. Échéance : <b>' + ech + '</b>.</p>'
      + (mtn ? '<p>La maintenance est obligatoire et facturée dès l’acompte ; les 12 mois courent à partir de la mise en ligne du site.</p>' : '')
      + '<p>Retard de paiement : intérêts au taux légal et indemnité forfaitaire de recouvrement de 40 €.</p></div>'
      + '<div class="recap"><div class="r"><span class="rl">Création du site (HT)</span><span class="rv">' + m(site) + '</span></div>'
      + (mtn ? '<div class="r"><span class="rl">Maintenance (HT)</span><span class="rv">' + m(mtn) + '</span></div>' : '')
      + '<div class="r"><span class="rl">TVA (' + eur(taux).replace(/,00$/, '') + ' %)</span><span class="rv">' + m(tva) + '</span></div>'
      + (paye > 0 ? '<div class="r"><span class="rl">Total TTC</span><span class="rv">' + m(ttc) + '</span></div><div class="r"><span class="rl">Déjà réglé</span><span class="rv">- ' + m(paye) + '</span></div>' : '')
      + '<div class="r total"><span class="rl">NET À PAYER</span><span class="rv">' + m(paye > 0 ? reste : ttc) + '</span></div></div></div></section>'
      + (sigF ? '<div class="sign-f"><div class="lbl">Pour NS Development SARL-S</div>' + sigF + '</div>' : '')
      + piedLegal(E) + '</div>' + joint, (joint ? CSS_CONTRAT() : '')
      + (sigF ? CSS_SIGNE() + '.sign-f{margin-top:18px;display:flex;flex-direction:column;align-items:flex-end;break-inside:avoid}.sign-f .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}' : ''));
  }

  // ------------------------------------------------------------------ contrat
  // Le contrat client (commercial/contrats/contrat-client.html) rempli avec le devis et la fiche
  // client. Partie 1 composée ici ; parties 2 (CGV) et 3 (annexe RGPD) reprises telles quelles
  // de Contrat.html, généré par commercial/contrats/generer.py. La partie 1 dit mot pour mot
  // la même chose que la partie 1 vierge du contrat : une phrase qui change là change ici.
  // Ce que seul le client peut faire reste vide : cases « professionnel », « références »,
  // « conditions reçues », lieu, date, signatures. Rien n'est inventé (RCS, qualité du signataire).
  const SIGNATAIRES = { Sam: 'Samir DINIS DA ROSA', Nelson: 'Nelson BARROSO' };
  // Signature électronique de NS Development (Nelson, 14/10/2026) : cachet de la société et
  // signature manuscrite stylisée du gérant qui envoie, avec la mention qui la date. Posée
  // côté Prestataire en partie 1 et côté Sous-traitant dans l'annexe RGPD. Le client signe
  // toujours lui-même. Police (Herr Von Muellerhoff, licence OFL) et logo embarqués par
  // generer.py : rendu identique dans l'appli et dans les PDF du Mac.
  const MANUSCRIT = { Sam: 'Samir Dinis da Rosa', Nelson: 'Nelson Barroso' };
  const ENCRE = '#1f3fbf';
  function cachetSVG(taille) {
    const c = ENCRE, f = 'Helvetica Neue,Helvetica,Arial,sans-serif';
    return '<svg xmlns="http://www.w3.org/2000/svg" class="k-cachet" width="' + taille + '" height="' + taille + '" viewBox="0 0 200 200" aria-label="Cachet NS Development SARL-S">'
      + '<defs><path id="k-arc-h" d="M 100,100 m -75,0 a 75,75 0 1,1 150,0"/><path id="k-arc-b" d="M 100,100 m -77,0 a 77,77 0 0,0 154,0"/></defs>'
      + '<circle cx="100" cy="100" r="96" fill="none" stroke="' + c + '" stroke-width="4"/>'
      + '<circle cx="100" cy="100" r="89" fill="none" stroke="' + c + '" stroke-width="1.4"/>'
      + '<circle cx="100" cy="100" r="58" fill="none" stroke="' + c + '" stroke-width="1.4"/>'
      + '<text font-family="' + f + '" font-weight="800" font-size="14.5" letter-spacing="1.3" fill="' + c + '"><textPath href="#k-arc-h" startOffset="50%" text-anchor="middle">NS DEVELOPMENT SARL-S</textPath></text>'
      + '<text font-family="' + f + '" font-weight="700" font-size="11.5" letter-spacing="1.2" fill="' + c + '"><textPath href="#k-arc-b" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">RCS B310037 · LUXEMBOURG</textPath></text>'
      + '<circle cx="18.5" cy="100" r="2.6" fill="' + c + '"/><circle cx="181.5" cy="100" r="2.6" fill="' + c + '"/>'
      + (NSContrat.logo ? '<image href="' + NSContrat.logo + '" x="72" y="60" width="56" height="56"/>' : '')
      + '<text x="100" y="138" text-anchor="middle" font-family="' + f + '" font-weight="700" font-size="10" letter-spacing="1.6" fill="' + c + '">SANEM</text></svg>';
  }
  // ref : « contrat CTR-… » ou « devis DEV-… », affiché dans la mention.
  function signatureNSD(signataire, date, ref) {
    if (typeof NSContrat === 'undefined') return '';
    const qui = SIGNATAIRES[signataire] ? signataire : 'Sam';
    return '<div class="k-signe">' + cachetSVG(86) + '<div class="k-signe-t"><div class="k-manuscrit">' + MANUSCRIT[qui] + '</div>'
      + '<div class="k-mention">Signé électroniquement par ' + SIGNATAIRES[qui] + ', co-gérant<br>le ' + fmtDate(date) + (ref ? ' · ' + esc(ref) : '') + '</div></div></div>';
  }
  // Styles de la signature, partagés par le contrat et le devis.
  const CSS_SIGNE = () => (typeof NSContrat !== 'undefined' && NSContrat.police ? '@font-face{font-family:"NSD Signature";src:url(data:font/woff2;base64,' + NSContrat.police + ') format("woff2")}' : '')
    + '.k-signe{display:flex;align-items:center;gap:8px}.k-cachet{flex:none;transform:rotate(-9deg);opacity:.93;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    + '.k-manuscrit{font-family:"NSD Signature",cursive;font-size:30px;line-height:1.05;color:#14234f;white-space:nowrap;transform:rotate(-3deg);transform-origin:left bottom;margin:0 0 4px}'
    + '.k-mention{font-size:7pt;line-height:1.35;color:#45454d}';
  const CSS_CONTRAT = () => (typeof NSContrat === 'undefined' ? '' : NSContrat.css)
    + '.k .k-v{font-weight:600}.k .k-box.k-on{background:var(--k-ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    + '.k .k-blank.k-plein{min-width:0;padding:0 4px;font-weight:600}'
    + CSS_SIGNE() + '.k .k-sign .k-signe,.k .k-sign .k-signe div{border:0;padding:0;min-height:0}.k .k-sign .k-signe{margin-top:4px}'
    + '@media print{.sheet+.k{break-before:page}.k{background:#fff}.k .k-page{padding:0;max-width:100%}.k .k-cachet{-webkit-print-color-adjust:exact;print-color-adjust:exact}}';
  // Domaine du site actuel du client, s'il en a un vrai (pas une page Facebook ou un sous-domaine Wix).
  function domaine(url) {
    const h = String(url || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[/?#]/)[0];
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(h) && !/facebook|instagram|google|wixsite|linktr|tiktok|editus|business\.site|jimdo|webnode/.test(h) ? h : '';
  }
  // date : jour de la signature de NS Development (émission de la facture d'acompte, sinon aujourd'hui).
  // signer : false pour un contrat sans la signature de NS Development (case décochée dans Factu).
  function contratCorps(d, lignes, c, signataire, date, signer) {
    if (typeof NSContrat === 'undefined') return '';
    if (!date) { const t = new Date(); date = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
    const a = analyser(lignes, c), t = decompte(a.site, a.maintenance, Number(d.tva_taux) || 0);
    const acompte = arr(t.site / 2), solde = arr(t.site - acompte);
    const box = on => '<span class="k-box' + (on ? ' k-on' : '') + '"></span>';
    const val = v => v ? '<span class="k-v">' + esc(v) + '</span>' : '';
    const blanc = (v, taille) => v ? '<span class="k-blank k-plein">' + esc(v) + '</span>' : '<span class="k-blank' + (taille ? ' k-' + taille : '') + '"></span>';
    // c.gerant, c.rcs, c.enseigne : repris de la fiche prospect du CRM (Factu.html, ficheContrat).
    const contact = c.gerant || [c.contact_prenom, c.contact_nom].filter(Boolean).join(' ');
    const qui = SIGNATAIRES[signataire] || SIGNATAIRES.Sam;
    const num = d.numero ? d.numero.replace(/^DEV/, 'CTR') : '';
    const options = C.OPTIONS.filter(o => a.options[o.n]).map(o => o.n + (o.qte && a.options[o.n] !== 1 ? ' × ' + a.options[o.n] : ''))
      .concat(a.libres.map(l => l.designation + (Number(l.quantite) !== 1 ? ' × ' + eur(l.quantite).replace(/,00$/, '') : '')))
      .concat(a.geste ? [C.PREFIXE_GESTE + ' ' + eur(a.geste.pct).replace(/,00$/, '') + ' %'] : []);
    const mtn = a.mtn, nMod = mtn && mtn.modules || 0;
    const cellule = (on, txt) => '<td>' + box(on) + txt + '</td>';
    const maintenance = C.MAINTENANCE.map(x => { const ici = mtn && mtn.cat === x.cat;
      return '<tr><td>' + box(ici) + x.cat + '</td>' + cellule(ici && !mtn.annuel, x.trim + ' € HT par trimestre') + cellule(ici && mtn.annuel, x.an + ' € HT par an') + '</tr>'; }).join('')
      + '<tr><td>' + box(nMod) + 'Par module vendu en option (nombre : ' + (nMod || '___') + ' )</td><td>+' + C.MODULE.trim + ' € HT l’unité</td><td>+' + C.MODULE.an + ' € HT l’unité</td></tr>'
      + (mtn && !mtn.cat ? '<tr><td>' + box(true) + 'Forfait convenu</td>' + cellule(!mtn.annuel, mtn.annuel ? '' : eur(mtn.montant) + ' € HT par trimestre') + cellule(mtn.annuel, mtn.annuel ? eur(mtn.montant) + ' € HT par an' : '') + '</tr>' : '');

<script>
// ===========================================================================
// Devis et factures : branchés sur la base Supabase existante (la même que
// l'espace client et l'admin). Une seule numérotation DEV / FAC, attribuée
// par la base au moment où le document quitte le brouillon.
// Logique et documents repris de sites-web/ns-development/espace-client-admin.html.
// ===========================================================================
const Factu = (() => {
  const F = { sb: null, session: null, clients: [], devis: [], factures: [], pret: false, erreur: '', menage: false, choix: new Set(), onglet: 'docs', filtre: 'tous' };

  // Catalogue : la grille du 30/09/2026, tenue dans Documents.html.
  const { FORMULES, OPTIONS, MAINTENANCE, MODULE, RECURRENTES } = NSDocs.CATALOGUE;
  // 2 625 € pour un montant rond, 2 597,40 € dès qu'il y a des centimes (jamais « 2 597,4 »).
  const eur = n => { n = Math.round((Number(n) || 0) * 100) / 100; return n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
  const isoJour = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fmtDate = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  const cls = s => sansAccent(s || '').replace(/[^a-z]/g, '');

  // ------------------------------------------------------------------ données
  // Erreur « JWT » (Nelson, 14/10/2026) : la base refuse parfois le jeton de connexion.
  // « JWT expired » : le téléphone est resté en veille, le jeton d'une heure n'a pas été
  // renouvelé à temps. « JWT issued at future » : jeton tout juste renouvelé, refusé une
  // seconde ou deux par la base (écart d'horloge, vu aussi sur la synchro du Mac).
  // On attend, on renouvelle le jeton si besoin, et on rejoue la requête (3 essais).
  const pause = ms => new Promise(r => setTimeout(r, ms));
  const erreurJwt = e => /JWT|PGRST30[13]/i.test(String(e && (e.message || e.code) || e || ''));
  async function fetchJwt(url, opts) {
    for (let i = 0; ; i++) {
      const r = await fetch(url, opts);
      if (r.status !== 401 || i >= 3 || String(url).includes('/auth/v1/')) return r;
      const txt = await r.clone().text().catch(() => '');
      if (!erreurJwt(txt)) return r;
      await pause(1200 * (i + 1));
      if (/expired|invalid/i.test(txt) && F.sb) {
        const { data } = await F.sb.auth.refreshSession().catch(() => ({ data: null }));
        if (!data || !data.session) return r;
        const h = new Headers(opts && opts.headers); h.set('Authorization', 'Bearer ' + data.session.access_token);
        opts = Object.assign({}, opts, { headers: h });
      }
    }
  }

  async function init() {
    if (F.sb || !window.supabase || !S.data) return;
    F.sb = window.supabase.createClient(S.data.supabase.url, S.data.supabase.cle, { auth: { persistSession: true, storageKey: 'crmnsd-supabase' }, global: { fetch: fetchJwt } });
    const { data } = await F.sb.auth.getSession();
    F.session = data.session;
    if (F.session) await charger(); else { F.pret = true; if (S.vue === 'factu' || S.vue === 'argent') rendre(); }
  }

  async function charger() {
    F.erreur = '';
    const [c, d, f, pay] = await Promise.all([
      F.sb.from('clients').select('*').order('created_at', { ascending: false }),
      F.sb.from('devis').select('*, clients(nom_etablissement), devis_lignes(designation, montant_ht)').order('created_at', { ascending: false }),
      F.sb.from('factures').select('*, clients(nom_etablissement), factures_lignes(designation, montant_ht)').order('created_at', { ascending: false }),
      // Pour l'onglet Argent (23/10/2026) : la date réelle de chaque encaissement. Une erreur ici ne bloque pas Factu.
      F.sb.from('paiements').select('*').order('date', { ascending: false }),
    ]);
    const err = c.error || d.error || f.error;
    // Toujours refusé après les essais : la session est perdue, on redemande la connexion.
    if (err && erreurJwt(err)) {
      await F.sb.auth.signOut().catch(() => {}); F.session = null; F.pret = true;
      toast('Connexion à la facturation expirée : reconnecte-toi.', true);
      if (S.vue === 'factu') rendre(); return;
    }
    if (err) F.erreur = err.message;
    F.clients = c.data || []; F.devis = d.data || []; F.factures = f.data || []; F.paiements = pay.error ? null : pay.data || [];
    F.pret = true;
    // La Journée aussi : sa section « Devis à relancer » attend ces devis, chargés après elle.
    if (S.vue === 'factu' || S.vue === 'stats' || S.vue === 'argent' || S.vue === 'jour') rendre();
  }

  async function connexion(form) {
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Connexion…';
    const { data, error } = await F.sb.auth.signInWithPassword({ email: form.email.value.trim(), password: form.mdp.value });
    if (error) { btn.disabled = false; btn.textContent = 'Se connecter'; return toast('Email ou mot de passe incorrect.', true); }
    const { data: prof } = await F.sb.from('profiles').select('role').eq('id', data.session.user.id).single();
    if (!prof || prof.role !== 'admin') { await F.sb.auth.signOut(); btn.disabled = false; btn.textContent = 'Se connecter'; return toast('Ce compte n’est pas administrateur.', true); }
    F.session = data.session; await charger();
  }

  // ------------------------------------------------------------------ vue liste
  function vue() {
    if (!F.pret) return '<div class="chargement">Connexion à la facturation…</div>';
    if (!F.session) return `<h2 class="section">Facturation</h2>
      <div class="bloc" style="margin-top:0"><p class="sous" style="margin-top:0">Connexion avec le compte admin <b>NSD</b> (nsdevelopment26@gmail.com), le même pour Sam et Nelson. Une seule fois par téléphone.</p>
      <form id="fx-login"><label class="champ">Email<input name="email" type="email" autocomplete="username" required></label>
      <label class="champ">Mot de passe<input name="mdp" type="password" autocomplete="current-password" required></label>
      <button class="btn large">Se connecter</button></form></div>`;

    const onglets = `<div class="fx-onglets"><button class="${F.onglet === 'docs' ? 'on' : ''}" data-fx="onglet-docs">Devis et factures</button>
      <button class="${F.onglet === 'suivi' ? 'on' : ''}" data-fx="onglet-suivi">Suivi clients</button></div>`;
    if (F.onglet === 'suivi' && !F.menage) return onglets + vueSuivi();
    const auj = isoJour(new Date());
    const aEmettre = F.factures.filter(f => f.statut === 'brouillon');
    const impayees = F.factures.filter(f => f.statut === 'envoyée' || f.statut === 'en_retard');
    const enAttente = F.devis.filter(d => d.statut === 'envoyé');
    const du = impayees.reduce((s, f) => s + (Number(f.total_ttc) || 0) - (Number(f.montant_paye) || 0), 0);
    const coche = (type, id) => { if (!F.menage) return ''; const ok = type === 'devis' ? devisSupprimable(id) : factureSupprimable(id);
      return ok ? `<span class="fx-coche">${F.choix.has(type + ':' + id) ? '✓' : ''}</span>` : ''; };
    const attrs = (type, id) => { if (!F.menage) return `data-fx-${type}="${id}"`;
      const ok = type === 'devis' ? devisSupprimable(id) : factureSupprimable(id);
      return ok ? `data-fx-choix="${type}:${id}"` : 'data-fx-bloque="1"'; };
    const etat = (type, id) => F.menage ? (F.choix.has(type + ':' + id) ? ' choisie' : ((type === 'devis' ? devisSupprimable(id) : factureSupprimable(id)) ? '' : ' bloquee')) : '';
    const carteDevis = d => `<div class="fx-carte${etat('devis', d.id)}" ${attrs('devis', d.id)}>${coche('devis', d.id)}<div class="corps"><div class="nom">${esc(d.clients ? d.clients.nom_etablissement : '?')}</div>
      <div class="meta">${d.numero ? esc(d.numero) : 'Brouillon'} · ${fmtDate(d.date_emission)} <span class="fx-st ${cls(d.statut)}">${esc(d.statut)}</span></div></div>
      <div class="mt">${eur(d.total_ttc)} €</div></div>`;
    const carteFacture = f => {
      const retard = f.statut === 'envoyée' && f.date_echeance && f.date_echeance < auj;
      return `<div class="fx-carte${etat('facture', f.id)}" ${attrs('facture', f.id)}>${coche('facture', f.id)}<div class="corps"><div class="nom">${esc(f.clients ? f.clients.nom_etablissement : '?')}</div>
      <div class="meta">${f.numero ? esc(f.numero) : 'Brouillon'} · échéance ${fmtDate(f.date_echeance)} <span class="fx-st ${retard ? 'retard' : cls(f.statut)}">${retard ? 'en retard' : esc(f.statut)}</span></div></div>
      <div class="mt">${eur(f.total_ttc)} €${Number(f.montant_paye) ? `<div class="meta">payé ${eur(f.montant_paye)} €</div>` : ''}</div></div>`;
    };
    return `${F.menage ? '' : onglets}${F.erreur ? `<div class="fx-alerte">Erreur Supabase : ${esc(F.erreur)}</div>` : ''}
      ${!S.data.banque.iban ? '<div class="fx-alerte">IBAN non configuré : les documents afficheront « à compléter » en pied de page.</div>' : ''}
      <div class="grille" style="margin-bottom:6px">
        <div class="kpi"><div class="v">${eur(du)} €</div><div class="l">à encaisser TTC</div></div>
        <div class="kpi"><div class="v">${enAttente.length}</div><div class="l">devis en attente de réponse</div></div></div>
      ${F.menage ? `<div class="fx-alerte" style="background:#fff8e1;border-color:#f3d98b">Touche les devis et factures à supprimer. Une facture émise (avec numéro FAC) ne se supprime pas : c'est un document légal. Un devis déjà facturé non plus.</div>`
        : `<div class="fx-bar"><button class="btn" data-fx="nouveau-devis">＋ Nouveau devis</button><button class="btn clair" data-fx="menage">Supprimer…</button></div>`}
      ${F.menage ? '' : blocRelances()}
      ${aEmettre.length ? section('Factures à émettre', 'brouillons sans numéro', aEmettre.map(carteFacture).join('')) : ''}
      ${impayees.length ? section('Factures à encaisser', impayees.length + '', impayees.map(carteFacture).join('')) : ''}
      ${section('Devis', F.devis.length + '', F.devis.length ? F.devis.map(carteDevis).join('') : '<div class="vide">Aucun devis. Ouvre la fiche d’un prospect et touche « Faire un devis ».</div>')}
      ${section('Toutes les factures', F.factures.length + '', F.factures.length ? F.factures.map(carteFacture).join('') : '<div class="vide">Aucune facture. Une facture se crée depuis un devis accepté.</div>')}
      ${F.menage ? `<div class="fx-menage"><button class="btn clair" data-fx="menage-fin">Annuler</button>
        <button class="btn danger" data-fx="menage-go" ${F.choix.size ? '' : 'disabled'}>Supprimer${F.choix.size ? ' (' + F.choix.size + ')' : ''}</button></div>`
        : `${blocSignature()}<p style="margin-top:18px"><button class="btn clair large" data-fx="deconnexion">Se déconnecter de la facturation</button></p>`}`;
  }

  // ------------------------------------------------------------------ relances des devis
  // Supervision (26/10/2026) : tous les devis envoyés, les plus en retard d'abord. Calcul dans Index.html (suiviDevis).
  function blocRelances() {
    const L = F.devis.filter(d => d.statut === 'envoyé').map(d => ({ d, sv: suiviDevis(d) }));
    if (!L.length) return '';
    const ordre = { retard: 0, reprise: 0, prevu: 1, pause: 2 };
    L.sort((a, b) => ordre[a.sv.etat] - ordre[b.sv.etat] || a.sv.prochaine.localeCompare(b.sv.prochaine));
    const n = L.filter(x => x.sv.etat === 'retard' || x.sv.etat === 'reprise').length;
    return section('Relances des devis', n ? n + ' à relancer' : 'tout est à jour', L.map(({ d, sv }) => { const e = etatRelance(sv);
      return `<div class="fx-carte" data-fx-devis="${d.id}"><div class="corps"><div class="nom">${esc(d.clients ? d.clients.nom_etablissement : '?')}</div>
        <div class="meta">${esc(d.numero || '')} · dernier contact ${esc(dateCourte(sv.dernier))} · ${sv.relances ? sv.relances + ' relance' + (sv.relances > 1 ? 's' : '') : 'jamais relancé'}${sv.pause ? ' · ' + esc(sv.pause.note) : ''}</div>
        <div style="margin-top:4px"><span class="relance-pill ${e.cls}">${esc(e.txt)}</span></div></div>
        <div class="mt">${eur(d.total_ttc)} €</div></div>`; }).join(''));
  }
  const LIB_REL = { Envoi: 'Devis envoyé', Relance: 'Relance', Réponse: 'Réponse du client', Pause: 'Pas de relance' };
  function blocSuiviRelances(d) {
    const sv = suiviDevis(d), e = etatRelance(sv);
    const fil = sv.ev.length ? sv.ev.slice().reverse() : [{ date: sv.debut, type: 'Envoi', note: 'date du devis (envoi non noté)', par: '' }];
    const form = F.formRelance && F.formRelance.devis === d.id ? formRelance(d, F.formRelance.type) : '';
    return `<div class="bloc"><h3>Suivi des relances</h3>
      <div><span class="relance-pill ${e.cls}">${esc(e.txt)}</span></div>
      <p class="sous" style="margin:8px 0 0">Sans réponse, on relance ${RELANCE_JOURS} jours après le dernier contact. Pour attendre plus longtemps, il faut une raison et une date de reprise.</p>
      <ul class="relance-fil">${fil.map(r => `<li><span class="q">${esc(dateCourte(r.date))}</span><span><b>${esc(LIB_REL[r.type] || r.type)}</b>${r.canal ? ' · ' + esc(r.canal) : ''}${r.par ? ' · ' + esc(r.par) : ''}
        ${r.note ? '<br>' + esc(r.note) : ''}${r.type === 'Pause' && r.reprise ? '<br><span class="q">reprise le ' + esc(jourCourt(r.reprise)) + '</span>' : ''}</span></li>`).join('')}</ul>
      ${d.statut === 'envoyé' ? (form || `<div class="relance-boutons"><button class="btn" data-fx="relance-form" data-type="Relance" data-id="${d.id}">J’ai relancé</button>
        <button class="btn clair" data-fx="relance-form" data-type="Réponse" data-id="${d.id}">Le client a répondu</button>
        <button class="btn clair large-2" data-fx="relance-form" data-type="Pause" data-id="${d.id}">Ne pas relancer pour l’instant…</button></div>`) : ''}</div>`;
  }
  function formRelance(d, type) {
    const reprise = decalerJour(aujourdhui(), 7);
    return `<form id="fx-relance" class="bloc" style="margin-top:12px;box-shadow:none" autocomplete="off">
      <input type="hidden" name="devis" value="${d.id}"><input type="hidden" name="type" value="${type}">
      <h3 style="margin-bottom:8px">${type === 'Relance' ? 'J’ai relancé' : type === 'Réponse' ? 'Le client a répondu' : 'Ne pas relancer pour l’instant'}</h3>
      ${type === 'Relance' ? `<label class="champ">Comment<select name="canal"><option>Appel</option><option>WhatsApp</option><option>Mail</option><option>SMS</option><option>Sur place</option></select></label>` : ''}
      ${type === 'Pause' ? `<label class="champ">Pourquoi on ne relance pas *<input name="note" required placeholder="Ex. il revient de vacances, il attend l’avis de son associé…"></label>
        <label class="champ">On reprend le *<input name="reprise" type="date" required value="${reprise}"></label>`
        : `<label class="champ">${type === 'Réponse' ? 'Ce qu’il a dit' : 'Note'}<input name="note" placeholder="${type === 'Réponse' ? 'Ex. il réfléchit, rappeler jeudi' : 'Ex. messagerie, message laissé'}"></label>`}
      <div class="fx-deux"><button type="button" class="btn clair" data-fx="relance-annuler" data-id="${d.id}">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form>`;
  }
  async function noterRelance(r) {
    const d = F.devis.find(x => x.id === r.devis); if (!d) return null;
    const p = prospectDuClient(d.client_id);
    const ligne = await appel('api_relance_ajouter', S.pin, Object.assign({ numero: d.numero || '', client: d.clients ? d.clients.nom_etablissement : '', prospect: p ? p.id : '' }, r));
    (S.data.relancesDevis = S.data.relancesDevis || []).push(ligne);
    return ligne;
  }
  async function enregistrerRelance(form) {
    const b = form.querySelector('button[type=submit]'); b.disabled = true;
    const r = Object.fromEntries([...form.elements].filter(e => e.name).map(e => [e.name, e.value]));
    try { await noterRelance(r); F.formRelance = null; toast(r.type === 'Pause' ? 'Pause notée, reprise le ' + jourCourt(r.reprise) + '.' : 'Noté dans le suivi du devis.'); ouvrirDevis(r.devis); rendre(); }
    catch (e) { b.disabled = false; toast(e.message || String(e), true); }
  }

  // ------------------------------------------------------------------ suivi clients
  // Demandé par Nelson le 14/10/2026 : tous ceux qui ont reçu un devis, où ils en sont
  // (devis accepté ou non, facture payée ou non), et le taux de réussite en graphique.
  // Un devis « reçu » = un devis qui a quitté le brouillon (numéro DEV). Les factures
  // brouillon et annulées ne comptent pas : seules les factures émises sont dues.
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  function suiviClients() {
    const auj = isoJour(new Date());
    const recus = F.devis.filter(d => d.numero && d.statut !== 'brouillon');
    const parClient = {};
    recus.forEach(d => { (parClient[d.client_id] = parClient[d.client_id] || { id: d.client_id, nom: d.clients ? d.clients.nom_etablissement : '?', devis: [], factures: [] }).devis.push(d); });
    F.factures.filter(f => f.numero && f.statut !== 'annulée' && f.statut !== 'brouillon' && parClient[f.client_id]).forEach(f => parClient[f.client_id].factures.push(f));
    return Object.values(parClient).map(c => {
      const d = c.devis[0];   // le plus récent (liste triée par date de création décroissante)
      const facture = c.factures.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0);
      const paye = c.factures.reduce((s, f) => s + (Number(f.montant_paye) || 0), 0);
      const retard = c.factures.some(f => f.statut !== 'payée' && f.date_echeance && f.date_echeance < auj);
      const reste = Math.round((facture - paye) * 100) / 100;
      const devisEtat = c.devis.some(x => x.statut === 'accepté') ? 'accepté' : d.statut === 'refusé' ? 'refusé' : d.statut === 'envoyé' ? 'en attente' : d.statut;
      const paiement = !c.factures.length ? (devisEtat === 'accepté' ? 'à facturer' : '') : reste <= 0.005 ? 'payé' : retard ? 'en retard' : paye > 0 ? 'payé en partie' : 'non payé';
      return Object.assign(c, { dernier: d, devisEtat, paiement, facture, paye, reste, montant: Number(d.total_ttc) || 0 });
    });
  }
  const FILTRES = [['tous', 'Tous'], ['attente', 'Devis en attente'], ['accepte', 'Acceptés'], ['refuse', 'Refusés'], ['impaye', 'À encaisser'], ['paye', 'Payés']];
  const filtrer = (c, f) => f === 'tous' || (f === 'attente' && c.devisEtat === 'en attente') || (f === 'accepte' && c.devisEtat === 'accepté')
    || (f === 'refuse' && c.devisEtat === 'refusé') || (f === 'impaye' && c.reste > 0.005) || (f === 'paye' && c.paiement === 'payé');
  const COUL = { accepte: '#6aa84f', refuse: '#dd7e6b', attente: '#8fb1ee', encaisse: '#6aa84f', du: '#dd7e6b' };

  // Anneau : part des devis acceptés, refusés et en attente, avec le taux au centre.
  function anneau(parts, centre, legende) {
    const total = parts.reduce((s, p) => s + p.n, 0), r = 46, C = 2 * Math.PI * r;
    let fait = 0;
    const arcs = total ? parts.filter(p => p.n).map(p => { const l = p.n / total * C;
      const a = `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-fait}" transform="rotate(-90 60 60)"/>`;
      fait += l; return a; }).join('') : '';
    return `<div class="sv-taux"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${esc(centre.texte)}">
      <circle r="${r}" cx="60" cy="60" fill="none" stroke="#efeeeb" stroke-width="16"/>${arcs}
      <text x="60" y="58" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor">${centre.v}</text>
      <text x="60" y="76" text-anchor="middle" font-size="10" fill="#6b6b6b">${esc(centre.l)}</text></svg>
      <div class="sv-leg">${legende}</div></div>`;
  }

  function vueSuivi() {
    const L = suiviClients();
    const n = L.length, acc = L.filter(c => c.devisEtat === 'accepté').length, ref = L.filter(c => c.devisEtat === 'refusé').length, att = L.filter(c => c.devisEtat === 'en attente').length;
    const factures = L.filter(c => c.factures.length).length, payes = L.filter(c => c.paiement === 'payé').length;
    const signe = L.filter(c => c.devisEtat === 'accepté').reduce((s, c) => s + c.montant, 0);
    const encaisse = L.reduce((s, c) => s + c.paye, 0), du = L.reduce((s, c) => s + Math.max(0, c.reste), 0);
    const tranches = acc + ref;
    if (!n) return '<div class="vide">Aucun devis envoyé pour l’instant. Dès qu’un devis reçoit son numéro DEV, son client apparaît ici.</div>';

    const legende = [['Acceptés', acc, COUL.accepte], ['Refusés', ref, COUL.refuse], ['En attente', att, COUL.attente]]
      .map(([l, v, c]) => `<div><i style="background:${c}"></i>${l} <b>${v}</b></div>`).join('')
      + `<div style="color:var(--doux);font-size:12px;margin-top:4px">${tranches ? 'Sur les devis tranchés : ' + pct(acc, tranches) + ' % de oui' : 'Aucun devis tranché pour l’instant'}</div>`;
    const etapes = [['Devis envoyés', n], ['Acceptés', acc], ['Facturés', factures], ['Payés en entier', payes]];
    const entonnoir = etapes.map(([l, v], i) => `<div><div class="l"><span>${l}</span><b>${v}${i ? `<span class="pct">${pct(v, n)} %</span>` : ''}</b></div>
      <div class="barre"><span style="width:${Math.max(v ? 3 : 0, pct(v, n))}%;opacity:${1 - i * .18}"></span></div></div>`).join('');
    const argent = encaisse + du;

    const liste = L.filter(c => filtrer(c, F.filtre)).map(c => {
      const st = c.devisEtat === 'accepté' ? 'accepte' : c.devisEtat === 'refusé' ? 'refuse' : 'envoye';
      const pst = { 'payé': 'payee', 'non payé': 'envoyee', 'payé en partie': 'envoyee', 'en retard': 'retard', 'à facturer': 'brouillon' }[c.paiement] || '';
      return `<div class="fx-carte sv-carte" data-fx-devis="${c.dernier.id}"><div class="corps"><div class="nom">${esc(c.nom)}</div>
        <div class="meta">${esc(c.dernier.numero)} · ${fmtDate(c.dernier.date_emission)}${c.devis.length > 1 ? ' · ' + c.devis.length + ' devis' : ''}</div>
        <div class="meta" style="margin-top:4px"><span class="fx-st ${st}">devis ${esc(c.devisEtat)}</span>${c.paiement ? `<span class="fx-st ${pst}">${esc(c.paiement)}</span>` : ''}</div></div>
        <div class="mt">${eur(c.montant)} €${c.factures.length ? `<div class="meta">payé ${eur(c.paye)} €</div>${c.reste > 0.005 ? `<div class="meta reste">reste ${eur(c.reste)} €</div>` : ''}` : ''}</div></div>`;
    }).join('') || '<div class="vide">Personne dans ce filtre.</div>';

    return `${F.erreur ? `<div class="fx-alerte">Erreur Supabase : ${esc(F.erreur)}</div>` : ''}
      <div class="grille" style="margin-bottom:8px">
        <div class="kpi"><div class="v">${pct(acc, n)} %</div><div class="l">taux de réussite (${acc} sur ${n} clients)</div></div>
        <div class="kpi"><div class="v">${eur(Math.round(signe))} €</div><div class="l">signé TTC (devis acceptés)</div></div></div>
      <div class="sv-bloc"><h3>Réponse aux devis</h3>${anneau([{ n: acc, c: COUL.accepte }, { n: ref, c: COUL.refuse }, { n: att, c: COUL.attente }], { v: pct(acc, n) + ' %', l: 'acceptés', texte: pct(acc, n) + ' % des devis acceptés' }, legende)}</div>
      <div class="sv-bloc"><h3>Du devis au paiement</h3><div class="sv-ent">${entonnoir}</div></div>
      <div class="sv-bloc"><h3>Argent des factures émises</h3>
        <div class="sv-argent">${argent ? `<span style="width:${pct(encaisse, argent)}%;background:${COUL.encaisse}"></span><span style="width:${100 - pct(encaisse, argent)}%;background:${COUL.du}"></span>` : ''}</div>
        <div class="sv-leg"><div><i style="background:${COUL.encaisse}"></i>Encaissé <b>${eur(encaisse)} €</b></div><div><i style="background:${COUL.du}"></i>Reste à encaisser <b>${eur(du)} €</b></div></div></div>
      ${section('Clients qui ont reçu un devis', n + '', `<div class="sv-filtres">${FILTRES.map(([k, l]) => `<button class="${F.filtre === k ? 'on' : ''}" data-fx="filtre" data-k="${k}">${l}</button>`).join('')}</div>${liste}`)}`;
  }

  // ------------------------------------------------------------------ suppression
  // Brouillons et devis sans facture émise seulement (Nelson, 29/09/2026 : Sam avait des
  // devis de test qu'il ne pouvait pas effacer). Une facture numérotée est un document
  // légal : la numérotation FAC doit rester continue, elle ne se supprime jamais.
  const factureSupprimable = id => { const f = F.factures.find(x => x.id === id); return !!f && f.statut === 'brouillon' && !f.numero && !(Number(f.montant_paye) > 0); };
  const devisSupprimable = id => !!F.devis.find(x => x.id === id) && !F.factures.some(f => f.devis_id === id && (f.numero || f.statut !== 'brouillon'));

  async function supprimer(elements) {
    const devis = elements.filter(e => e.type === 'devis' && devisSupprimable(e.id)).map(e => e.id);
    const facs = elements.filter(e => e.type === 'facture' && factureSupprimable(e.id)).map(e => e.id);
    // Les factures brouillon d'un devis supprimé partent avec lui.
    F.factures.forEach(f => { if (devis.includes(f.devis_id) && factureSupprimable(f.id) && !facs.includes(f.id)) facs.push(f.id); });
    if (!devis.length && !facs.length) return toast('Rien à supprimer.', true);
    const numerotes = devis.map(id => F.devis.find(x => x.id === id)).filter(d => d.numero).map(d => d.numero);
    const texte = 'Supprimer définitivement ' + [devis.length ? devis.length + ' devis' : '', facs.length ? facs.length + ' facture(s) brouillon' : ''].filter(Boolean).join(' et ') + ' ?'
      + (numerotes.length ? '\n\nDevis déjà numérotés : ' + numerotes.join(', ') + '. Leur numéro ne sera pas réattribué.' : '') + '\n\nC’est irréversible.';
    if (!confirm(texte)) return false;
    try {
      if (facs.length) { const { data, error } = await F.sb.from('factures').delete().in('id', facs).is('numero', null).select('id');
        if (error) throw error; if ((data || []).length !== facs.length) throw new Error('Une facture n’a pas pu être supprimée (déjà émise ?).'); }
      if (devis.length) { const { data, error } = await F.sb.from('devis').delete().in('id', devis).select('id');
        if (error) throw error; if ((data || []).length !== devis.length) throw new Error('Un devis n’a pas pu être supprimé.'); }
      toast('Supprimé : ' + [devis.length ? devis.length + ' devis' : '', facs.length ? facs.length + ' facture(s)' : ''].filter(Boolean).join(', ') + '.');
      return true;
    } catch (e) { toast('Suppression : ' + (e.message || e), true); return false; }
    finally { await charger(); }
  }

  // ------------------------------------------------------------------ feuille
  function feuille(html) {
    let v = document.getElementById('fx-voile');
    if (!v) { v = document.createElement('div'); v.id = 'fx-voile'; v.className = 'voile'; document.body.appendChild(v);
      v.addEventListener('click', e => { if (e.target === v) fermer(); }); }
    v.innerHTML = `<div class="feuille">${html}</div>`;
    v.classList.remove('cache'); document.body.style.overflow = 'hidden';
  }
  function fermer() { const v = document.getElementById('fx-voile'); if (v) v.classList.add('cache'); document.body.style.overflow = ''; }
  function tete(titre, sous) {
    return `<div class="feuille-tete"><div class="poignee"></div><div class="ligne1"><div><h1>${titre}</h1>${sous ? `<div class="sous">${sous}</div>` : ''}</div>
      <button class="fermer" data-fx="fermer" aria-label="Fermer">✕</button></div></div>`;
  }

  // ------------------------------------------------------------------ devis : composition
  // Même déroulé que le devis validé : 1 formule, 2 options, 3 maintenance
  // (obligatoire), 4 décompte avec acompte et solde.
  const D = { prospect: null, clientId: '', base: null, opts: {}, lignes: [], mtnCat: null, annuel: false, frais: [], geste: 0, rec: {} };
  // L'heure hors forfait est annoncée sur chaque devis (grille du 30/09/2026), Sam peut la retirer.
  const FRAIS_DEFAUT = () => [{ designation: 'Heure de travail hors forfait, au-delà de l’heure de petites modifications comprise chaque trimestre', pu: NSDocs.CATALOGUE.TAUX_HORAIRE }];
  const nbModules = () => NSDocs.modulesVendus(D.opts, D.base).length;
  const GESTES = [5, 10, 15, 20];
  const catDe = formule => { const m = MAINTENANCE.find(x => x.formules.includes(formule)); return m ? m.cat : null; };

  // une (Nelson, 28/09/2026) : Sam voit ce qu'il ne doit pas revendre en option.
  // Source : manuel du commercial § 05 et grille tarifaire (entreprise/tarifs/).
  const INCLUS = {
    Essentiel: { liste: ['1 page adaptée au téléphone', 'Animations', 'Formulaire de contact', 'Google Maps', 'Référencement de base', 'Mise en ligne'],

      pas: 'Paiement et espace de modification compris. Au-delà de 50 produits : « 50 produits en plus ». Tailles et couleurs, plusieurs livraisons ou synchro caisse : ligne sur mesure.' },
    Signature: { liste: ['Jusqu’à 15 pages', 'Direction artistique propre, animations avancées', 'Site en 3 langues', 'Rédaction des textes', 'Référencement local avancé', 'Espace de modification du site', 'Fiche Google Business'],
      pas: 'Aucun module compris : catalogue, rendez-vous ou inscriptions s’ajoutent comme pour les autres formules. Langue supplémentaire à partir de la 4e.' },

  const MTN_INCLUS = NSDocs.CATALOGUE.INCLUS;

  // edit : { devis, a (lignes analysées), client } pour reprendre un brouillon existant.
  // Infos du client imprimées sur le devis et la facture (Sam, 21/10/2026 : elles étaient fausses et
  // impossibles à corriger). On part de la fiche de facturation, et ce qui manque vient de la fiche CRM.
  function valeursClient(c, p) {
    c = c || {}; p = p || {};
    return {
      nom: c.nom_etablissement || p.entreprise || '',
      contact: [c.contact_prenom, c.contact_nom].filter(Boolean).join(' ') || p.gerant || '',
      adresse: c.adresse || '', tva: c.tva_intra || '',
      email: c.email || p.email || '', tel: c.telephone || String(p.telephone || '').split(/[\/;]| ou /)[0].trim(),

  // Ce que le formulaire écrit dans la fiche client. Un champ vidé efface l'info, sauf la raison sociale.
  function majDepuisForm(form) {
    const g = n => (form[n] && form[n].value || '').trim();
    const m = { contact_prenom: null, contact_nom: g('c_contact') || null, adresse: g('adresse') || null,
      tva_intra: g('tva_intra') || null, email: g('c_email') || null, telephone: g('c_tel') || null };

  async function ecrireClient(clientId, form) {
    const { error } = await F.sb.from('clients').update(majDepuisForm(form)).eq('id', clientId);
    return error;
  }
  // Corriger la fiche client depuis un devis ou une facture, quel que soit son statut.
  function infosClient(clientId, retour) {

  async function enregistrerClient(form) {
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Enregistrement…';
    const err = await ecrireClient(form.dataset.client, form);
    if (err) { btn.disabled = false; btn.textContent = 'Enregistrer les infos'; return toast(err.message, true); }
    await charger(); toast('Infos du client enregistrées.');
    const [type, id] = form.dataset.retour.split(':');
    if (type === 'devis') ouvrirDevis(id); else if (type === 'facture') ouvrirFacture(id); else fermer();
