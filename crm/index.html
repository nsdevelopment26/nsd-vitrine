  function nouveauDevis(prospect, edit) {
    if (!F.session) { S.vue = 'factu'; fermerFiche(); rendre(); return toast('Connecte-toi d’abord à la facturation.', true); }
    D.prospect = prospect || null; D.clientId = prospect && prospect.client ? prospect.client : '';
    D.base = null; D.opts = {}; D.lignes = []; D.mtnCat = null; D.annuel = false; D.frais = FRAIS_DEFAUT(); D.geste = 0; D.rec = {}; D.editId = null;
    if (edit) {
      const a = edit.a; D.prospect = null; D.editId = edit.devis.id; D.clientId = edit.devis.client_id;
      D.base = a.formule; D.opts = Object.assign({}, a.options);
      D.lignes = a.libres.map(l => ({ designation: l.designation, quantite: Number(l.quantite) || 0, pu: Number(l.prix_unitaire_ht) || 0 }));
      D.mtnCat = a.mtn && a.mtn.cat ? a.mtn.cat : (a.formule ? catDe(a.formule) : null); D.annuel = !!(a.mtn && a.mtn.annuel);
      a.recurrentes.forEach(r => { const x = RECURRENTES.find(y => r.libelle.startsWith(y.n)); if (x) D.rec[x.id] = true; });
      D.frais = a.frais.map(f => ({ designation: f.libelle, pu: f.pu || '' }));
      D.geste = a.geste ? a.geste.pct : 0;
    }
    const dans30 = new Date(Date.now() + 30 * 864e5);
    const cc = F.clients.find(c => c.id === D.clientId) || {};
    const nomClient = prospect ? prospect.entreprise : (edit ? cc.nom_etablissement || '' : '');
    feuille(tete(edit ? 'Modifier le brouillon' : 'Nouveau devis', nomClient ? esc(nomClient) + (D.clientId ? '' : ' · la fiche client sera créée') : '') + `
      <form id="fx-devis">
      <div class="bloc"><h3>Client &amp; références</h3>
      ${prospect || edit ? '' : `<label class="champ">Client<select name="client" required><option value="">Choisir un client…</option>
        ${F.clients.map(c => `<option value="${c.id}">${esc(c.nom_etablissement)}</option>`).join('')}</select></label>
        <div class="sous" style="margin-bottom:10px">Pour un nouveau client, pars plutôt de sa fiche prospect : ses infos sont reprises.</div>`}
        <div id="fx-champs-client">${champsClient(cc, prospect || prospectDuClient(D.clientId) || {})}</div></div>
      <div class="bloc"><h3>1 · Formule de base</h3><div class="fx-chips" id="fx-bases"></div><div id="fx-inclus"></div></div>
      <div class="bloc"><h3>2 · Options complémentaires</h3><div id="fx-qtes"></div><div class="fx-chips" id="fx-opts"></div></div>
      <div class="bloc"><h3>Lignes sur mesure</h3><div id="fx-lignes"></div>
        <button type="button" class="btn clair large" data-fx="ajout-ligne">＋ Ajouter une ligne</button></div>
      <div class="bloc"><h3>3 · Maintenance, hébergement &amp; sécurité</h3>
        <div class="sous" style="margin:0 0 8px">Obligatoire. Catégorie reprise de la formule, modifiable.</div>
        <div class="fx-chips" id="fx-mtn-cat"></div><div class="fx-chips" id="fx-mtn-per" style="margin-top:8px"></div>
        <div class="sous" id="fx-mtn-mod" style="margin:8px 0 0"></div>
        <h3 style="margin-top:14px">Options récurrentes</h3>
        <div class="sous" style="margin:0 0 8px">Au même rythme que la maintenance, payées avec elle.</div>
        <div class="fx-chips" id="fx-rec"></div>
        <h3 style="margin-top:14px">Frais supplémentaires éventuels</h3>
        <div class="sous" style="margin:0 0 8px">Hors forfait, annoncés sur le devis mais <b>pas comptés dans le prix</b>. Le devis prévient toujours que des frais peuvent s’ajouter ; écris ici ceux déjà connus (prix facultatif).</div>
        <div id="fx-frais"></div>
        <button type="button" class="btn clair large" data-fx="ajout-frais">＋ Ajouter des frais</button></div>
      <div class="bloc"><h3>Geste commercial</h3>
        <div class="sous" style="margin:0 0 8px">Remise en % sur la création du site (pas sur la maintenance). Le prix se recalcule en direct.</div>
        <div class="fx-geste"><input name="geste" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="0" aria-label="Geste commercial en pourcentage"> <b>%</b>
          <div class="fx-chips" id="fx-gestes"></div></div>
        <div class="fx-geste-effet" id="fx-geste-effet"></div></div>
      <div class="bloc"><div class="fx-deux">
          <label class="champ">TVA %<input name="tva" type="number" value="17" min="0" step="0.01"></label>
          <label class="champ">Valable jusqu’au<input name="validite" type="date" value="${isoJour(dans30)}"></label></div>
        <label class="champ">Notes (visibles sur le devis)<textarea name="notes"></textarea></label>
        <label class="champ">Enregistrer comme<select name="statut"><option value="brouillon">Brouillon, sans numéro</option><option value="envoyé">Envoyé : reçoit son numéro DEV</option></select></label></div>
      <div class="fx-totaux" id="fx-totaux"></div>

    if (edit) {
      const f = document.getElementById('fx-devis'), d = edit.devis;
      f.notes.value = d.notes || ''; f.tva.value = d.tva_taux != null ? d.tva_taux : 17; f.geste.value = D.geste;
      if (d.date_validite) f.validite.value = String(d.date_validite).slice(0, 10);
      f.querySelector('[type=submit]').textContent = 'Enregistrer les modifications';
      if (edit.a.mtn && !edit.a.mtn.cat) toast('Ancienne maintenance non reconnue : choisis-la de nouveau (partie 3).', true);
    }
    dessinerChoix(); calculer();
  }

  // Un brouillon (sans numéro) se reprend en entier : mêmes écrans que pour un nouveau devis.
  async function modifierDevis(id) {
    const d = F.devis.find(x => x.id === id);
    if (!d || d.statut !== 'brouillon' || d.numero) return toast('Seul un devis brouillon, sans numéro, se modifie.', true);
    const { data: lignes, error } = await F.sb.from('devis_lignes').select('*').eq('devis_id', id).order('ordre');
    if (error) return toast(error.message, true);
    const client = F.clients.find(c => c.id === d.client_id) || {};
    nouveauDevis(null, { devis: d, a: NSDocs.analyser(lignes || [], client), client });
  }

  function dessinerChoix() {
    const chip = (attr, cle, n, prix, on) => `<button type="button" ${attr}="${esc(cle)}" class="${on ? 'on' : ''}">${esc(n)}<b>${prix}</b></button>`;
    document.getElementById('fx-bases').innerHTML = FORMULES.map(b => chip('data-fx-base', b.n, b.n, eur(b.pu) + ' €', D.base === b.n)).join('');
    document.getElementById('fx-inclus').innerHTML = encartInclus();
    document.getElementById('fx-qtes').innerHTML = OPTIONS.filter(o => o.qte).map(o => `<div class="fx-qte"><span>${esc(o.court)}<b>${eur(o.pu)} € l’unité</b></span>
      <input type="number" min="0" step="1" inputmode="numeric" data-fx-qte="${esc(o.n)}" value="${D.opts[o.n] || 0}" aria-label="Quantité ${esc(o.court)}"></div>`).join('');
    const inclus = NSDocs.optionsIncluses(D.base);
    document.getElementById('fx-opts').innerHTML = OPTIONS.filter(o => !o.qte).map(o => inclus.includes(o.n)
      ? `<button type="button" class="inclus" disabled aria-disabled="true">✓ ${esc(o.court)}<b>Inclus dans ${esc(D.base)}</b></button>`
      : chip('data-fx-opt', o.n, o.court + (o.alerte ? ' ⚠' : ''), eur(o.pu) + ' €' + (o.module ? ' + ' + MODULE.trim + ' €/trim.' : ''), D.opts[o.n])).join('')
      + OPTIONS.filter(o => o.alerte && D.opts[o.n]).map(o => `<div class="fx-pas">⚠ ${esc(o.court)} : ${esc(o.alerte)}</div>`).join('');
    document.getElementById('fx-mtn-cat').innerHTML = MAINTENANCE.map(m => chip('data-fx-mtn', m.cat, m.cat, eur(m.trim) + ' € / trim.', D.mtnCat === m.cat)).join('');
    const nm = nbModules();
    document.getElementById('fx-mtn-mod').innerHTML = nm
      ? `Modules en option : <b>${nm}</b> × ${eur(D.annuel ? MODULE.an : MODULE.trim)} € = <b>${eur(nm * (D.annuel ? MODULE.an : MODULE.trim))} € HT ${D.annuel ? 'par an' : 'par trimestre'}</b>, ajoutés à la maintenance.`
      : 'Aucun module en option : pas de supplément.';
    document.getElementById('fx-rec').innerHTML = RECURRENTES.map(r => chip('data-fx-rec', r.id, r.court || r.n, '+ ' + eur(D.annuel ? r.an : r.trim) + ' € ' + (D.annuel ? '/ an' : '/ trim.'), D.rec[r.id])).join('');
    const m = MAINTENANCE.find(x => x.cat === D.mtnCat);
    document.getElementById('fx-mtn-per').innerHTML = m ? chip('data-fx-per', 'trim', 'Trimestrielle (3 mois)', eur(m.trim) + ' € HT / trim.', !D.annuel)
      + chip('data-fx-per', 'an', 'Annuelle (11 mois + 1 offert)', eur(m.an) + ' € HT / an · éco. ' + eur(m.trim * 4 - m.an) + ' €', D.annuel) : '<div class="sous">Choisis la formule, ou une catégorie.</div>';
    document.getElementById('fx-frais').innerHTML = D.frais.map((l, i) => `<div class="fx-frais" data-i="${i}">
      <input data-k="designation" placeholder="Ex. boîte mail supplémentaire" value="${esc(l.designation)}"><input data-k="pu" type="number" min="0" step="0.01" placeholder="Prix HT" value="${l.pu}">
      <button type="button" data-fx="suppr-frais" data-i="${i}" aria-label="Retirer">×</button></div>`).join('');
    document.getElementById('fx-gestes').innerHTML = [0, ...GESTES].map(g => `<button type="button" data-fx-geste="${g}" class="${D.geste === g ? 'on' : ''}">${g ? g + ' %' : 'Aucun'}</button>`).join('');
    document.getElementById('fx-lignes').innerHTML = D.lignes.map((l, i) => `<div class="fx-ligne" data-i="${i}">
      <input data-k="designation" placeholder="Désignation" value="${esc(l.designation)}"><input data-k="quantite" type="number" min="0" value="${l.quantite}">
      <input data-k="pu" type="number" min="0" step="0.01" placeholder="PU HT" value="${l.pu}"><button type="button" data-fx="suppr-ligne" data-i="${i}">×</button></div>`).join('');
  }

  // Lignes du site (formule, options, sur mesure), puis la maintenance en dernier.
  function lignesDevis() {
    const L = [];
    const base = FORMULES.find(b => b.n === D.base);
    if (base) L.push({ designation: base.n, quantite: 1, prix_unitaire_ht: base.pu, montant_ht: base.pu });
    OPTIONS.forEach(o => { const q = Number(D.opts[o.n]) || 0; if (q > 0) L.push({ designation: o.n, quantite: q, prix_unitaire_ht: o.pu, montant_ht: Math.round(q * o.pu * 100) / 100 }); });
    D.lignes.forEach(l => { if (!String(l.designation).trim()) return; const q = Number(l.quantite) || 0, pu = Number(l.pu) || 0;
      L.push({ designation: l.designation.trim(), quantite: q, prix_unitaire_ht: pu, montant_ht: Math.round(q * pu * 100) / 100 }); });
    // Geste commercial : sur le site seulement, calculé avant la maintenance.
    const siteBrut = L.reduce((s, l) => s + l.montant_ht, 0);
    if (D.geste > 0 && siteBrut > 0) L.push(NSDocs.ligneGeste(D.geste, siteBrut));
    const mtn = D.mtnCat && NSDocs.ligneMaintenance(D.mtnCat, D.annuel, nbModules());
    if (mtn) L.push(mtn);
    if (mtn) RECURRENTES.forEach(r => { if (D.rec[r.id]) L.push(NSDocs.ligneRecurrente(r.id, D.annuel)); });
    D.frais.forEach(f => { if (String(f.designation).trim()) L.push(NSDocs.ligneFrais(f.designation, Number(f.pu) || 0)); });
    return L.map((l, i) => Object.assign(l, { ordre: i }));
  }

  function totaux() {
    const L = lignesDevis(), form = document.getElementById('fx-devis');
    const site = L.filter(l => !NSDocs.estMaintenance(l)).reduce((s, l) => s + l.montant_ht, 0);
    const mtn = L.filter(NSDocs.estMaintenance).reduce((s, l) => s + l.montant_ht, 0);
    return NSDocs.decompte(site, mtn, form ? Number(form.tva.value) || 0 : 17);
  }

  function calculer() {
    const form = document.getElementById('fx-devis'); if (!form) return;
    const t = totaux(), taux = Number(form.tva.value) || 0;
    const g = lignesDevis().find(NSDocs.estGeste), remise = g ? -g.montant_ht : 0;
    document.getElementById('fx-geste-effet').textContent = g
      ? `− ${eur(remise)} € HT sur le site (${eur(t.site + remise)} € → ${eur(t.site)} €), soit − ${eur(remise * (1 + taux / 100))} € TTC pour le client.`
      : (D.geste > 0 ? 'Choisis d’abord une formule ou une option : le geste porte sur le prix du site.' : '');
    document.getElementById('fx-totaux').innerHTML = (g ? `<div><span>Création site HT</span><span>${eur(t.site + remise)} €</span></div>
      <div class="fx-remise"><span>Geste commercial ${eur(D.geste)} %</span><span>− ${eur(remise)} €</span></div>` : '')
      + `<div><span>Total création site HT</span><span>${eur(t.site)} €</span></div>
      <div><span>Total maintenance HT</span><span>${eur(t.maintenance)} €</span></div>
      <div><span>Total HT global</span><span>${eur(t.ht)} €</span></div>
      <div><span>TVA ${eur(taux)} %</span><span>${eur(t.tva)} €</span></div><div class="gros"><span>Total TTC</span><span>${eur(t.ttc)} €</span></div>
      <div><span>Acompte TTC à la signature</span><span>${eur(t.acompte)} €</span></div>
      <div><span>Solde TTC à la livraison</span><span>${eur(t.solde)} €</span></div>
      <div class="fx-note">Acompte = 50 % du site + 100 % de la maintenance. Solde = 50 % du site.</div>`;
  }

  async function enregistrerDevis(form) {
    const lignes = lignesDevis();
    if (D.geste < 0 || D.geste >= 100) return toast('Le geste commercial doit être entre 0 et 99 %.', true);
    if (!lignes.some(l => !NSDocs.estMaintenance(l) && !NSDocs.estFrais(l) && !NSDocs.estGeste(l))) return toast('Choisis au moins une formule, une option ou une ligne.', true);
    if (!D.mtnCat) return toast('La maintenance est obligatoire : choisis sa catégorie.', true);
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Enregistrement…';
    const echec = m => { btn.disabled = false; btn.textContent = 'Enregistrer le devis'; toast(m, true); };
    try {
      let clientId = D.clientId || (form.client ? form.client.value : '');
      // Prospect sans fiche client : on la crée depuis le CRM, et on garde le lien.
      if (!clientId && D.prospect) {
        const p = D.prospect;
        const { data: c, error } = await F.sb.from('clients').insert({
          nom_etablissement: (form.c_nom && form.c_nom.value.trim()) || p.entreprise, contact_nom: p.gerant || null, email: p.email || null,
          telephone: p.telephone || null, ville: p.commune || null, metier: p.secteur || null,
          site_domaine: p.site || null, formule: D.base || null, statut: 'prospect',
          notes: 'Créé depuis le CRM NSD (' + p.id + ').',
        }).select('*').single();
        if (error) return echec('Fiche client : ' + error.message);
        clientId = c.id; F.clients.unshift(c);
        const maj = await appel('api_modifier', S.pin, p.id, { client: c.id });
        majLocale(maj); D.prospect = maj; D.clientId = c.id;
      }
      if (!clientId) return echec('Choisis un client.');
      const t = totaux(), taux = Number(form.tva.value) || 0;
      const champs = { date_validite: form.validite.value || null, statut: form.statut.value, tva_taux: taux, total_ht: t.ht, total_ttc: t.ttc,
        notes: form.notes.value.trim() || null };
      let dev;
      if (D.editId) {
        // Brouillon modifié : les nouvelles lignes d'abord, les anciennes ensuite, pour ne jamais laisser un devis vide.
        const { data: anciennes, error: e0 } = await F.sb.from('devis_lignes').select('id').eq('devis_id', D.editId);
        if (e0) return echec('Devis : ' + e0.message);
        const { data: maj, error: e1 } = await F.sb.from('devis').update(champs).eq('id', D.editId).eq('statut', 'brouillon').select('id');
        if (e1) return echec('Devis : ' + e1.message);
        if (!maj || !maj.length) return echec('Ce devis n’est plus un brouillon : il ne se modifie plus.');
        dev = { id: D.editId };
        const { error: e2 } = await F.sb.from('devis_lignes').insert(lignes.map(l => Object.assign({}, l, { devis_id: dev.id })));
        if (e2) return echec('Erreur sur les lignes, le devis garde ses anciennes lignes : ' + e2.message);
        const ids = (anciennes || []).map(l => l.id);
        if (ids.length) { const { error: e3 } = await F.sb.from('devis_lignes').delete().in('id', ids); if (e3) return echec('Nouvelles lignes posées, mais les anciennes restent : ' + e3.message); }
      } else {
        const { data: cree, error: e1 } = await F.sb.from('devis').insert(Object.assign({ client_id: clientId, date_emission: isoJour(new Date()) }, champs)).select('id').single();
        if (e1) return echec('Devis : ' + e1.message);
        dev = cree;
        const { error: e2 } = await F.sb.from('devis_lignes').insert(lignes.map(l => Object.assign({}, l, { devis_id: dev.id })));
        if (e2) return echec('Devis créé, mais erreur sur les lignes : ' + e2.message);
      }
      // La fiche client suit le devis : formule, forfait trimestriel de référence, périodicité.
      // Référence trimestrielle de la fiche client : forfait + modules + options récurrentes.
      const m = MAINTENANCE.find(x => x.cat === D.mtnCat), recs = RECURRENTES.filter(r => D.rec[r.id]);
      const trimRef = m.trim + nbModules() * MODULE.trim + recs.reduce((t, r) => t + r.trim, 0);
      // abonnement_montant_standard se calcule dans la base (colonne générée) : ne jamais l'écrire.
      const majClient = { abonnement_mensuel: trimRef, abonnement_periodicite: D.annuel ? 'annuel' : 'trimestriel' };
      if (D.base) majClient.formule = D.base;
      const cc = F.clients.find(c => c.id === clientId);
      if (!cc || !cc.abonnement_moyen) majClient.abonnement_moyen = D.annuel ? 'virement' : 'sepa';
      await F.sb.from('clients').update(majClient).eq('id', clientId);
      // Les infos client du formulaire vont dans la fiche : c'est elle que le devis imprime.
      const e3 = await ecrireClient(clientId, form);
      if (e3) toast('Devis enregistré, mais les infos du client n’ont pas pu être gardées : ' + e3.message, true);
      toast((D.editId ? 'Devis modifié' : 'Devis enregistré') + (form.statut.value === 'envoyé' ? ' avec son numéro.' : ' en brouillon.'));
      await charger(); ouvrirDevis(dev.id);
    } catch (e) { echec(e.message || String(e)); }
  }

  // ------------------------------------------------------------------ devis : fiche
  function prospectDuClient(clientId) { return S.data.prospects.find(p => p.client === clientId); }
  // Le contrat se remplit d'abord avec la fiche du client dans le CRM (Nelson, 14/10/2026) :
  // le N° RCS, le gérant et l'enseigne n'existent que là. La fiche de facturation complète
  // ce que la fiche n'a pas (adresse postale, TVA, e-mail et téléphone saisis au devis).
  function ficheContrat(c, clientId) {
    const p = prospectDuClient(clientId) || {};
    const norm = x => sansAccent(x).replace(/\b(s\.?a\.?r\.?l\.?(-s)?|sarl(-s)?|s\.?a\.?|scs|snc)\b/g, '').replace(/[^a-z0-9]/g, '');
    const enseigne = p.entreprise && norm(p.entreprise) && !norm(c.nom_etablissement).includes(norm(p.entreprise)) ? p.entreprise : '';
    return Object.assign({}, c, {
      rcs: String(p.rcs || '').trim(), gerant: String(p.gerant || '').trim(), enseigne,
      email: c.email || p.email || '', telephone: c.telephone || p.telephone || '', adresse: c.adresse || c.ville || p.commune || '',
      contact_nom: c.contact_nom || (c.contact_prenom ? '' : String(p.gerant || '').trim()),
    });
  }

  function ouvrirDevis(id) {
    const d = F.devis.find(x => x.id === id); if (!d) return;
    const facs = F.factures.filter(f => f.devis_id === id && f.statut !== 'annulée');
    const objets = facs.map(f => NSDocs.objetFacture(f.factures_lignes || []));
    const act = [];
    act.push('<button class="btn large" data-fx="voir-devis" data-id="' + id + '">Voir le devis (PDF)</button>');
    if (d.statut !== 'refusé' && NSDocs.contratDisponible()) act.push('<button class="btn clair large" data-fx="voir-contrat" data-id="' + id + '">Voir le contrat rempli (PDF)</button>');
    if (d.statut === 'brouillon' && !d.numero) act.push('<button class="btn large" data-fx="modifier-devis" data-id="' + id + '">Modifier le devis</button>');
    act.push('<button class="btn clair large" data-fx="infos-client" data-client="' + d.client_id + '" data-retour="devis:' + id + '">Corriger les infos du client</button>');
    if (d.statut === 'brouillon') act.push('<button class="btn clair large" data-fx="statut-devis" data-st="envoyé" data-id="' + id + '">Marquer envoyé (attribue le numéro)</button>');
    if (d.statut === 'envoyé') act.push('<div class="fx-deux"><button class="btn" data-fx="statut-devis" data-st="accepté" data-id="' + id + '">Accepté</button><button class="btn clair" data-fx="statut-devis" data-st="refusé" data-id="' + id + '">Refusé</button></div>');
    // Modèle validé : facture d'acompte à la signature, facture de solde à la livraison.
    if (d.statut !== 'refusé') {
      if (!facs.length) act.push('<button class="btn clair large" data-fx="facturer" data-objet="acompte" data-id="' + id + '">Facture d’acompte (50 % du site + maintenance)</button>'
        + '<button class="btn clair large" data-fx="facturer" data-objet="unique" data-id="' + id + '">Facture unique (100 %)</button>');
      else if (objets.includes('acompte') && !objets.includes('solde')) act.push('<button class="btn clair large" data-fx="facturer" data-objet="solde" data-id="' + id + '">Facture de solde (50 % du site, à la livraison)</button>');
    }
    const libelle = { acompte: 'd’acompte', solde: 'de solde', unique: '' };
    facs.forEach((f, i) => act.push('<button class="btn clair large" data-fx-facture="' + f.id + '">Voir la facture ' + libelle[objets[i]] + ' ' + esc(f.numero || 'brouillon') + '</button>'));
    if (devisSupprimable(id)) act.push('<button class="btn danger large" data-fx="suppr-devis" data-id="' + id + '">Supprimer ce devis</button>');
    feuille(tete(d.numero ? esc(d.numero) : 'Devis brouillon', esc(d.clients ? d.clients.nom_etablissement : '') + ' · <span class="fx-st ' + cls(d.statut) + '">' + esc(d.statut) + '</span>')
      + `<div class="bloc"><dl class="infos"><dt>Émis le</dt><dd>${fmtDate(d.date_emission)}</dd><dt>Valable jusqu’au</dt><dd>${fmtDate(d.date_validite)}</dd>
         <dt>Total HT</dt><dd>${eur(d.total_ht)} €</dd><dt>Total TTC</dt><dd><b>${eur(d.total_ttc)} €</b></dd></dl></div>
         ${d.statut !== 'brouillon' ? blocSuiviRelances(d) : ''}
         <div style="display:grid;gap:8px;margin-top:12px">${act.join('')}</div>`);
  }

  async function changerStatutDevis(id, st) {
    if (st === 'envoyé' && !confirm('Marquer ce devis comme envoyé ? Il reçoit un numéro DEV définitif.')) return;
    const { error } = await F.sb.from('devis').update({ statut: st }).eq('id', id);
    if (error) return toast(error.message, true);
    await charger();
    const d = F.devis.find(x => x.id === id);
    toast(st === 'envoyé' ? 'Devis ' + (d && d.numero || '') + ' envoyé.' : 'Devis ' + st + '.');
    // Le suivi des relances part de l'envoi, et se clôt sur la réponse (26/10/2026).
    try { await noterRelance(st === 'envoyé' ? { devis: id, type: 'Envoi' } : { devis: id, type: 'Réponse', note: 'Devis ' + st }); } catch (e) { toast('Suivi des relances non noté : ' + e.message, true); }
    // Devis accepté = client signé dans le CRM.
    const p = d && prospectDuClient(d.client_id);
    if (st === 'accepté' && p && cle(p) !== 'signe' && confirm('Passer ' + p.entreprise + ' en « Client signé » dans le CRM ?')) {
      try { const maj = await appel('api_logger', S.pin, p.id, 'signe', 'Devis ' + (d.numero || '') + ' accepté', '', S.par, null);
        majLocale(maj, { resultat: 'Client signé', note: 'Devis accepté', rappel: '' }); } catch (e) { toast(e.message, true); }
    }
    ouvrirDevis(id);
  }

  // ------------------------------------------------------------------ factures
  // objet : 'acompte' (50 % du site + 100 % de la maintenance), 'solde' (50 % du site) ou 'unique' (tout le devis).
  async function facturer(devisId, objet) {
    const dev = F.devis.find(x => x.id === devisId);
    const { data: lignes, error: e0 } = await F.sb.from('devis_lignes').select('*').eq('devis_id', devisId).order('ordre');
    if (e0) return toast(e0.message, true);
    const L = (lignes || []).filter(l => !NSDocs.estFrais(l)), ref = dev.numero ? ' (devis ' + dev.numero + ')' : '';
    const site = Math.round(L.filter(l => !NSDocs.estMaintenance(l)).reduce((s, l) => s + (Number(l.montant_ht) || 0), 0) * 100) / 100;
    const moitie = Math.round(site / 2 * 100) / 100;
    const mtn = L.filter(NSDocs.estMaintenance).map(l => ({ designation: l.designation, quantite: l.quantite, prix_unitaire_ht: l.prix_unitaire_ht, montant_ht: l.montant_ht }));
    const ligne = (designation, mt) => ({ designation, quantite: 1, prix_unitaire_ht: mt, montant_ht: mt });
    let FL;
    if (objet === 'acompte') FL = [ligne('Acompte 50 % · création du site web' + ref, moitie), ...mtn];
    else if (objet === 'solde') FL = [ligne('Solde 50 % · création du site web, à la livraison' + ref, Math.round((site - moitie) * 100) / 100)];
    else FL = L.map(l => ({ designation: l.designation, quantite: l.quantite, prix_unitaire_ht: l.prix_unitaire_ht, montant_ht: l.montant_ht }));
    FL.forEach((l, i) => { l.ordre = i; });
    const ht = Math.round(FL.reduce((s, l) => s + (Number(l.montant_ht) || 0), 0) * 100) / 100, taux = Number(dev.tva_taux) || 0;
    const { data: fac, error: e1 } = await F.sb.from('factures').insert({
      client_id: dev.client_id, devis_id: dev.id, date_emission: isoJour(new Date()), date_echeance: isoJour(new Date(Date.now() + 15 * 864e5)),
      statut: 'brouillon', tva_taux: taux, total_ht: ht, total_ttc: Math.round(ht * (1 + taux / 100) * 100) / 100, notes: dev.notes || null,
    }).select('id').single();
    if (e1) return toast(e1.message, true);
    if (FL.length) {
      const { error: e2 } = await F.sb.from('factures_lignes').insert(FL.map(l => Object.assign({ facture_id: fac.id }, l)));
      if (e2) toast('Facture créée, mais erreur sur les lignes : ' + e2.message, true);
    }
    await charger(); toast('Facture ' + ({ acompte: 'd’acompte', solde: 'de solde', unique: '' }[objet] || '') + ' créée en brouillon. Vérifie-la, puis émets-la.'); ouvrirFacture(fac.id);
  }

  function ouvrirFacture(id) {
    const f = F.factures.find(x => x.id === id); if (!f) return;
    const reste = (Number(f.total_ttc) || 0) - (Number(f.montant_paye) || 0);
    // Facture d'acompte ou unique = celle qui part à la signature : le contrat rempli la suit
    // dans le même PDF (Nelson, 14/10/2026). La facture de solde part seule.
    const avecContrat = f.devis_id && NSDocs.contratDisponible() && NSDocs.objetFacture(f.factures_lignes || []) !== 'solde';
    const act = avecContrat
      ? ['<button class="btn large" data-fx="voir-facture-contrat" data-id="' + id + '">Facture + contrat rempli (PDF à envoyer)</button>',
         '<button class="btn clair large" data-fx="voir-facture" data-id="' + id + '">Facture seule</button>']
      : ['<button class="btn large" data-fx="voir-facture" data-id="' + id + '">Voir la facture (PDF)</button>'];
    if (f.statut === 'brouillon') act.push('<button class="btn clair large" data-fx="emettre" data-id="' + id + '">Émettre : attribuer le numéro légal</button>');
    if (f.statut === 'brouillon') act.push('<button class="btn clair large" data-fx="infos-client" data-client="' + f.client_id + '" data-retour="facture:' + id + '">Corriger les infos du client</button>');
    if (factureSupprimable(id)) act.push('<button class="btn danger large" data-fx="suppr-facture" data-id="' + id + '">Supprimer ce brouillon</button>');
    const paiement = (f.statut === 'envoyée' || f.statut === 'en_retard') ? `<form class="bloc" id="fx-paiement" data-id="${id}"><h3>Enregistrer un paiement</h3>
      <div class="fx-deux"><label class="champ">Montant<input name="montant" type="number" step="0.01" min="0" value="${Math.round(reste * 100) / 100}"></label>
      <label class="champ">Date<input name="date" type="date" value="${isoJour(new Date())}"></label></div>
      <div class="fx-deux"><label class="champ">Moyen<select name="moyen"><option value="virement">Virement</option><option value="sepa">SEPA</option><option value="carte">Carte</option><option value="espèces">Espèces</option></select></label>
      <label class="champ">Référence<input name="ref"></label></div><button class="btn large">Enregistrer le paiement</button></form>` : '';
    feuille(tete(f.numero ? esc(f.numero) : 'Facture brouillon', esc(f.clients ? f.clients.nom_etablissement : '') + ' · <span class="fx-st ' + cls(f.statut) + '">' + esc(f.statut) + '</span>')
      + `<div class="bloc"><dl class="infos"><dt>Émise le</dt><dd>${fmtDate(f.date_emission)}</dd><dt>Échéance</dt><dd>${fmtDate(f.date_echeance)}</dd>
         <dt>Total TTC</dt><dd><b>${eur(f.total_ttc)} €</b></dd><dt>Déjà payé</dt><dd>${eur(f.montant_paye)} €</dd><dt>Reste dû</dt><dd><b>${eur(reste)} €</b></dd></dl></div>
         <div style="display:grid;gap:8px;margin-top:12px">${act.join('')}</div>${paiement}`);
  }

  async function emettre(id) {
    if (!confirm('Émettre cette facture ? Elle reçoit un numéro FAC légal et définitif. C’est irréversible.')) return;
    const { error } = await F.sb.from('factures').update({ statut: 'envoyée' }).eq('id', id);
    if (error) return toast(error.message, true);
    await charger(); const f = F.factures.find(x => x.id === id);
    toast('Facture ' + (f && f.numero || '') + ' émise.'); ouvrirFacture(id);
  }

  async function payer(form) {
    const id = form.dataset.id, montant = Number(form.montant.value) || 0;
    if (montant <= 0) return toast('Montant invalide.', true);
    const btn = form.querySelector('button'); btn.disabled = true;
    const { error } = await F.sb.from('paiements').insert({ facture_id: id, date: form.date.value || null, montant, moyen: form.moyen.value, reference: form.ref.value.trim() || null });
    if (error) { btn.disabled = false; return toast(error.message, true); }
    const { data: pays } = await F.sb.from('paiements').select('montant').eq('facture_id', id);
    const total = (pays || []).reduce((s, p) => s + Number(p.montant), 0);
    const f = F.factures.find(x => x.id === id);
    await F.sb.from('factures').update({ montant_paye: total, statut: total >= Number(f.total_ttc) - 0.005 ? 'payée' : 'envoyée' }).eq('id', id);
    await charger(); toast('Paiement enregistré.'); ouvrirFacture(id);
  }

  // ------------------------------------------------------------------ documents
  // type : 'devis', 'facture', 'contrat' (id du devis) ou 'facture-contrat' (la facture, suivie du contrat de son devis).
  async function voir(type, id) {
    const estDevis = type === 'devis' || type === 'contrat', table = estDevis ? 'devis' : 'factures';
    const { data: doc, error } = await F.sb.from(table).select(estDevis ? '*, clients(*)' : '*, clients(*), devis(*)').eq('id', id).single();
    if (error) return toast(error.message, true);
    const { data: lignes } = await F.sb.from(table + '_lignes').select('*').eq(estDevis ? 'devis_id' : 'facture_id', id).order('ordre');
    const c = doc.clients || {}, qui = S.moi && S.moi.nom, cc = ficheContrat(c, doc.client_id);
    let html;
    if (type === 'devis') html = docDevisHTML(doc, lignes || [], cc);
    else if (type === 'contrat') html = NSDocs.contrat(doc, lignes || [], cc, S.data.banque, qui, reglageSig().contrat);
    else if (type === 'facture-contrat' && doc.devis) {
      const { data: lignesDevis, error: e2 } = await F.sb.from('devis_lignes').select('*').eq('devis_id', doc.devis.id).order('ordre');
      if (e2) return toast(e2.message, true);
      html = NSDocs.facture(doc, lignes || [], cc, S.data.banque, { devis: doc.devis, lignes: lignesDevis || [], signataire: qui, client: cc, signer: reglageSig().contrat }, signeur('facture'));
    } else html = docFactureHTML(doc, lignes || [], cc);
    const v = document.createElement('div'); v.className = 'fx-doc'; v.id = 'fx-doc';
    v.innerHTML = '<div class="outils"><button class="btn clair" data-fx="fermer-doc">Fermer</button><button class="btn clair" data-fx="imprimer">PDF / Partager</button><button class="btn clair" data-fx="onglet">Nouvel onglet</button></div><iframe title="Document"></iframe>';
    document.body.appendChild(v);
    v.querySelector('iframe').srcdoc = html;
    v._html = html;
  }

  // Sur téléphone, l'impression ne marche pas dans l'appli installée (Sam, 21/10/2026) :
  // on fabrique le PDF dans la page, puis on ouvre le menu Partager (WhatsApp, mail, Fichiers).
  // Sur ordinateur, l'impression du navigateur donne un meilleur PDF : on la garde.
  const LIB_PDF = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
  // Le PDF du téléphone se construit page par page, comme à l'impression (Sam, 21/10/2026 : la
  // première version capturait l'écran du téléphone et coupait le devis n'importe où).
  // Le cadre passe à la largeur d'une page A4 imprimée, les règles d'impression s'appliquent,
  // puis chaque feuille (.sheet) devient une page. Une feuille plus haute qu'une page se découpe.
  async function pdfTelephone(f) {
    const w = f.contentWindow, doc = f.contentDocument, LARGEUR = 703; // 186 mm à 96 ppp
    for (const src of LIB_PDF) if (!doc.querySelector('script[src="' + src + '"]')) await new Promise((ok, ko) => { const s = doc.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('pas de connexion')); doc.head.appendChild(s); });
    const style = f.style.cssText;
    f.style.cssText = 'position:fixed;left:-10000px;top:0;width:' + LARGEUR + 'px;height:1100px;border:0';
    const regles = [];
    [...doc.styleSheets].forEach(sh => { try { [...sh.cssRules].forEach(r => { if (r.media && /print/.test(r.media.mediaText)) [...r.cssRules].forEach(x => regles.push(x.cssText)); }); } catch (e) {} });
    const css = doc.createElement('style');
    css.textContent = regles.join('\n') + 'html,body{background:#fff!important;padding:0!important;margin:0!important}.sheet{box-shadow:none!important;border:0!important;margin:0!important;border-radius:0!important;max-width:none!important}';
    doc.head.appendChild(css);
    try {
      await new Promise(r => setTimeout(r, 400));
      const pdf = new w.jspdf.jsPDF(w.JSON.parse('{"unit":"mm","format":"a4","orientation":"portrait"}'));
      const ML = 12, MH = 9, PW = 186, PH = 280; let premiere = true;
      const page = () => { if (!premiere) pdf.addPage(); premiere = false; };
      const feuilles = doc.querySelectorAll('.sheet').length ? [...doc.querySelectorAll('.sheet')] : [doc.body];
      for (const el of feuilles) {
        const cv = await w.html2canvas(el, w.JSON.parse('{"scale":2,"backgroundColor":"#ffffff","useCORS":true,"windowWidth":' + LARGEUR + '}'));
        const hmm = cv.height * PW / cv.width;
        if (hmm <= PH * 1.12) {
          // Tient sur une page (au besoin un peu réduite).
          const k = Math.min(1, PH / hmm);
          page(); pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', ML + PW * (1 - k) / 2, MH, PW * k, hmm * k);
        } else {
          // Feuille longue (contrat) : découpée en pages pleines.
          const tranche = Math.floor(cv.width * PH / PW);
          for (let y = 0; y < cv.height; y += tranche) {
            const h = Math.min(tranche, cv.height - y), t2 = doc.createElement('canvas');
            t2.width = cv.width; t2.height = h; const g = t2.getContext('2d');
            g.fillStyle = '#fff'; g.fillRect(0, 0, t2.width, h); g.drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
            page(); pdf.addImage(t2.toDataURL('image/jpeg', 0.92), 'JPEG', ML, MH, PW, h * PW / cv.width);
          }
        }
      }
      return pdf.output('blob');
    } finally { css.remove(); f.style.cssText = style; }
  }
  async function imprimerOuPartager(btn) {
    const f = document.querySelector('#fx-doc iframe'); if (!f) return;
    if (!matchMedia('(pointer: coarse)').matches) { f.contentWindow.focus(); f.contentWindow.print(); return; }
    const avant = btn.textContent; btn.disabled = true; btn.textContent = 'PDF…';
    try {
      const nom = (f.contentDocument.title || 'document').replace(/[\\/:*?"<>|]+/g, '-').trim() + '.pdf';
      const blob = await pdfTelephone(f);
      const fichier = new File([blob], nom, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
        try { await navigator.share({ files: [fichier], title: nom.replace(/\.pdf$/, '') }); }
        catch (e) { if (e.name !== 'AbortError') throw e; }
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) { toast('PDF : ' + (e.message || e), true); }
    btn.disabled = false; btn.textContent = avant;
  }

  const docDevisHTML = (d, l, c) => NSDocs.devis(d, l, c, S.data.banque, signeur('devis'));
  const docFactureHTML = (f, l, c) => NSDocs.facture(f, l, c, S.data.banque, null, signeur('facture'));

  // ------------------------------------------------------------------ ma signature
  // Nelson, 14/10/2026 : chacun voit sa signature (cachet + nom manuscrit), la télécharge
  // en PNG, et coche sur quels documents elle se pose quand c'est lui qui les ouvre.
  // Réglage gardé sur le téléphone, par personne (Sam et Nelson ont chacun le leur).
  const SIG_DEFAUT = { devis: true, facture: false, contrat: true };
  const cleSig = () => 'crmnsd-signature-' + ((S.moi && S.moi.nom) || '');
  function reglageSig() {
    try { return Object.assign({}, SIG_DEFAUT, JSON.parse(localStorage.getItem(cleSig()) || '{}')); } catch (e) { return Object.assign({}, SIG_DEFAUT); }
  }
  function changerSig(k, v) { const r = reglageSig(); r[k] = v; try { localStorage.setItem(cleSig(), JSON.stringify(r)); } catch (e) {} }
  const quiSigne = () => S.moi && NSDocs.MANUSCRIT && NSDocs.MANUSCRIT[S.moi.nom] ? S.moi.nom : null;
  const signeur = type => reglageSig()[type] ? quiSigne() : null;
  function stylesSignature() {
    if (document.getElementById('fx-sig-css')) return;
    const st = document.createElement('style'); st.id = 'fx-sig-css'; st.textContent = NSDocs.CSS_SIGNE(); document.head.appendChild(st);
  }
  function blocSignature() {
    const qui = quiSigne(); if (!qui || !NSDocs.contratDisponible()) return '';
    stylesSignature();
    const r = reglageSig();
    const coche = (k, l) => `<label class="fx-sig-case"><input type="checkbox" data-fx-sig="${k}" ${r[k] ? 'checked' : ''}> ${l}</label>`;
    return section('Ma signature', esc(qui), `<div class="bloc" style="margin-top:0"><div class="fx-sig-apercu">${NSDocs.signature(qui, isoJour(new Date()), '')}</div>
      <div class="sous" style="margin:10px 0 6px">Posée avec la date du document sur ce que tu ouvres ici. Coche où la mettre :</div>
      <div class="fx-sig-cases">${coche('devis', 'Devis')}${coche('facture', 'Factures')}${coche('contrat', 'Contrats')}</div>
      <button class="btn clair large" data-fx="sig-png" style="margin-top:12px">Télécharger ma signature (PNG)</button></div>`);
  }
  // PNG 1920 × 640, fond transparent, dessiné dans le téléphone (rien n'est publié en ligne).
  async function pngSignature(qui) {
    const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 640; const x = cv.getContext('2d');
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(NSDocs.cachet(560));
    await img.decode();
    x.save(); x.translate(320, 320); x.rotate(-9 * Math.PI / 180); x.globalAlpha = .93; x.drawImage(img, -280, -280, 560, 560); x.restore();
    const ff = new FontFace('NSD Signature PNG', 'url(data:font/woff2;base64,' + NSContrat.police + ')'); await ff.load(); document.fonts.add(ff);
    const txt = NSDocs.MANUSCRIT[qui]; let taille = 190; x.font = taille + 'px "NSD Signature PNG"';
    const w = x.measureText(txt).width; if (w > 1180) { taille = Math.floor(taille * 1180 / w); x.font = taille + 'px "NSD Signature PNG"'; }
    x.fillStyle = '#14234f'; x.save(); x.translate(660, 390); x.rotate(-3 * Math.PI / 180); x.fillText(txt, 0, 0); x.restore();
    return cv.toDataURL('image/png');
  }
  async function telechargerSignature() {
    const qui = quiSigne(); if (!qui) return;
    try {
      const url = await pngSignature(qui);
      const v = document.createElement('div'); v.className = 'fx-doc'; v.id = 'fx-doc';
      v.innerHTML = '<div class="outils"><button class="btn clair" data-fx="fermer-doc">Fermer</button><a class="btn" style="text-align:center;text-decoration:none" download="signature-nsd-' + qui + '.png" href="' + url + '">Télécharger</a></div>'
        + '<div style="flex:1;display:grid;place-items:center;padding:16px;overflow:auto"><img alt="Ma signature" src="' + url + '" style="max-width:100%;background:#fff;border-radius:12px"></div>'
        + '<p class="sous" style="text-align:center;padding:0 16px 18px;margin:0">Sur iPhone : appui long sur l’image, puis « Enregistrer dans Photos ».</p>';
      document.body.appendChild(v);
    } catch (e) { toast('Signature : ' + (e.message || e), true); }
  }

  // ------------------------------------------------------------------ événements
  document.addEventListener('click', e => {
    const t = e.target;
    const ch = t.closest('[data-fx-choix]'); if (ch) { const k = ch.dataset.fxChoix; if (F.choix.has(k)) F.choix.delete(k); else F.choix.add(k); return rendre(); }
    if (t.closest('[data-fx-bloque]')) return toast('Facture émise ou devis déjà facturé : ne se supprime pas.', true);
    const dv = t.closest('[data-fx-devis]'); if (dv) return ouvrirDevis(dv.dataset.fxDevis);
    const fc = t.closest('[data-fx-facture]'); if (fc) return ouvrirFacture(fc.dataset.fxFacture);
    const b = t.closest('[data-fx-base]'); if (b) { D.base = D.base === b.dataset.fxBase ? null : b.dataset.fxBase; if (D.base) { D.mtnCat = catDe(D.base); NSDocs.optionsIncluses(D.base).forEach(n => delete D.opts[n]); } dessinerChoix(); return calculer(); }
    const o = t.closest('[data-fx-opt]'); if (o) { const k = o.dataset.fxOpt; if (D.opts[k]) delete D.opts[k]; else D.opts[k] = true; dessinerChoix(); return calculer(); }
    const mc = t.closest('[data-fx-mtn]'); if (mc) { D.mtnCat = mc.dataset.fxMtn; dessinerChoix(); return calculer(); }
    const rc = t.closest('[data-fx-rec]'); if (rc) { const k = rc.dataset.fxRec; if (D.rec[k]) delete D.rec[k]; else D.rec[k] = true; dessinerChoix(); return calculer(); }
    const ge = t.closest('[data-fx-geste]'); if (ge) { D.geste = Number(ge.dataset.fxGeste); const i = document.querySelector('#fx-devis [name=geste]'); if (i) i.value = D.geste; dessinerChoix(); return calculer(); }
    const pe = t.closest('[data-fx-per]'); if (pe) { D.annuel = pe.dataset.fxPer === 'an'; dessinerChoix(); return calculer(); }
    const a = t.closest('[data-fx]'); if (!a) return;
    const act = a.dataset.fx, id = a.dataset.id;
    if (act === 'fermer') fermer();
    else if (act === 'nouveau-devis') nouveauDevis(null);
    else if (act === 'onglet-docs' || act === 'onglet-suivi') { F.onglet = act === 'onglet-suivi' ? 'suivi' : 'docs'; rendre(); }
    else if (act === 'filtre') { F.filtre = a.dataset.k; rendre(); }
    else if (act === 'menage') { F.menage = true; F.choix.clear(); rendre(); }
    else if (act === 'menage-fin') { F.menage = false; F.choix.clear(); rendre(); }
    else if (act === 'menage-go') { const el = [...F.choix].map(k => ({ type: k.split(':')[0], id: k.split(':')[1] }));
      a.disabled = true; supprimer(el).then(ok => { if (ok) { F.menage = false; F.choix.clear(); } rendre(); }); }
    else if (act === 'suppr-devis') supprimer([{ type: 'devis', id }]).then(ok => ok && fermer());
    else if (act === 'suppr-facture') supprimer([{ type: 'facture', id }]).then(ok => ok && fermer());
    else if (act === 'deconnexion') F.sb.auth.signOut().then(() => { F.session = null; rendre(); });
    else if (act === 'ajout-ligne') { D.lignes.push({ designation: '', quantite: 1, pu: '' }); dessinerChoix(); calculer(); }
    else if (act === 'ajout-frais') { D.frais.push({ designation: '', pu: '' }); dessinerChoix(); calculer(); }
    else if (act === 'suppr-frais') { D.frais.splice(Number(a.dataset.i), 1); dessinerChoix(); calculer(); }
    else if (act === 'suppr-ligne') { D.lignes.splice(Number(a.dataset.i), 1); dessinerChoix(); calculer(); }
    else if (act === 'voir-devis') voir('devis', id);
    else if (act === 'modifier-devis') modifierDevis(id);
    else if (act === 'infos-client') infosClient(a.dataset.client, a.dataset.retour);
    else if (act === 'voir-facture') voir('facture', id);
    else if (act === 'voir-facture-contrat') voir('facture-contrat', id);
    else if (act === 'voir-contrat') voir('contrat', id);
    else if (act === 'statut-devis') changerStatutDevis(id, a.dataset.st);
    else if (act === 'relance-form') { F.formRelance = { devis: id, type: a.dataset.type }; ouvrirDevis(id); }
    else if (act === 'relance-annuler') { F.formRelance = null; ouvrirDevis(id); }
    else if (act === 'facturer') facturer(id, a.dataset.objet);
    else if (act === 'emettre') emettre(id);
    else if (act === 'fermer-doc') document.getElementById('fx-doc').remove();
    else if (act === 'sig-png') telechargerSignature();
    else if (act === 'imprimer') imprimerOuPartager(a);
    else if (act === 'onglet') { const u = URL.createObjectURL(new Blob([document.getElementById('fx-doc')._html], { type: 'text/html' })); window.open(u, '_blank'); }
  });
  document.addEventListener('input', e => {
    const l = e.target.closest('.fx-ligne');
    if (l) { D.lignes[Number(l.dataset.i)][e.target.dataset.k] = e.target.value; return calculer(); }
    const fr = e.target.closest('.fx-frais');
    if (fr) { D.frais[Number(fr.dataset.i)][e.target.dataset.k] = e.target.value; return calculer(); }
    if (e.target.name === 'geste' && e.target.closest('#fx-devis')) {
      D.geste = Math.max(0, Number(String(e.target.value).replace(',', '.')) || 0);
      document.querySelectorAll('[data-fx-geste]').forEach(b => b.classList.toggle('on', Number(b.dataset.fxGeste) === D.geste));
      return calculer();
    }
    const q = e.target.closest('[data-fx-qte]');
    if (q) { const n = Math.max(0, Math.floor(Number(q.value) || 0)); if (n) D.opts[q.dataset.fxQte] = n; else delete D.opts[q.dataset.fxQte]; return calculer(); }
    if (e.target.closest('#fx-devis')) calculer();
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.fxSig;
    if (k) { changerSig(k, e.target.checked); toast('Signature ' + (e.target.checked ? 'ajoutée sur les ' : 'retirée des ') + { devis: 'devis', facture: 'factures', contrat: 'contrats' }[k] + '.'); }
  });
  // Devis sans prospect : choisir le client dans la liste remplit ses infos.
  document.addEventListener('change', e => {
    if (e.target.name !== 'client' || !e.target.closest('#fx-devis')) return;
    const id = e.target.value, z = document.getElementById('fx-champs-client');
    if (z) z.innerHTML = champsClient(F.clients.find(c => c.id === id) || {}, prospectDuClient(id) || {});
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'fx-login') { e.preventDefault(); connexion(e.target); }
    if (e.target.id === 'fx-devis') { e.preventDefault(); enregistrerDevis(e.target); }
    if (e.target.id === 'fx-client') { e.preventDefault(); enregistrerClient(e.target); }
    if (e.target.id === 'fx-paiement') { e.preventDefault(); payer(e.target); }
    if (e.target.id === 'fx-relance') { e.preventDefault(); enregistrerRelance(e.target); }
  });

  // donnees : lu par l'objectif du mois (Stats), en lecture seule.
  return { init, vue, nouveauDevis, ouvrirDevis, recharger: () => F.session && charger(), donnees: () => F };
})();
</script>
