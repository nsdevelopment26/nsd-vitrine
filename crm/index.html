<script>
// ===========================================================================
// Devis et factures : branchés sur la base Supabase existante (la même que
// l'espace client et l'admin). Une seule numérotation DEV / FAC, attribuée
// par la base au moment où le document quitte le brouillon.
// Logique et documents repris de sites-web/ns-development/espace-client-admin.html.
// ===========================================================================
const Factu = (() => {
  const F = { sb: null, session: null, clients: [], devis: [], factures: [], pret: false, erreur: '' };

  // Catalogue : identique à la grille tarifaire et à l'admin.
  const FORMULES = [
    { n: 'Essentiel', pu: 1350 }, { n: 'Vitrine', pu: 2625 }, { n: 'Pro', pu: 3750 },
    { n: 'Boutique', pu: 3750 }, { n: 'Signature', pu: 6000 },
  ];
  const OPTIONS = [
    { n: 'Langue supplémentaire', pu: 450 }, { n: 'Rendez-vous en ligne', pu: 300 },
    { n: 'Paiement en ligne', pu: 900 }, { n: 'Catalogue métier', pu: 900 },
    { n: 'Rédaction des textes', pu: 300 }, { n: 'Logo et identité', pu: 350 },
    { n: 'SEO local avancé', pu: 350 }, { n: 'Fiche Google Business', pu: 90 },
    { n: 'Blog / actualités', pu: 250 }, { n: 'Galerie avancée', pu: 150 },
    { n: 'Page supplémentaire', pu: 150 },
  ];
  // Options de suivi, au trimestre (valeurs de commercial/facturation/index.html).
  const SUIVI = [
    { id: 'mail', n: 'Boîte mail supplémentaire', pu: 15 },
    { id: 'seo', n: 'SEO local suivi', pu: 75 },
    { id: 'modif', n: 'Modifications illimitées', pu: 60 },
  ];
  const MTN_TRIMESTRE = { Essentiel: 150, Vitrine: 150, Pro: 225, Boutique: 225, Signature: 300 };
  const aboAnnuel = t => Math.round((Number(t) || 0) / 3 * 11 * 100) / 100;
  const eur = n => (Number(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const isoJour = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fmtDate = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  const cls = s => sansAccent(s || '').replace(/[^a-z]/g, '');

  // ------------------------------------------------------------------ données
  async function init() {
    if (F.sb || !window.supabase || !S.data) return;
    F.sb = window.supabase.createClient(S.data.supabase.url, S.data.supabase.cle, { auth: { persistSession: true, storageKey: 'crmnsd-supabase' } });
    const { data } = await F.sb.auth.getSession();
    F.session = data.session;
    if (F.session) await charger(); else { F.pret = true; if (S.vue === 'factu') rendre(); }
  }

  async function charger() {
    F.erreur = '';
    const [c, d, f] = await Promise.all([
      F.sb.from('clients').select('*').order('created_at', { ascending: false }),
      F.sb.from('devis').select('*, clients(nom_etablissement)').order('created_at', { ascending: false }),
      F.sb.from('factures').select('*, clients(nom_etablissement)').order('created_at', { ascending: false }),
    ]);
    const err = c.error || d.error || f.error;
    if (err) F.erreur = err.message;
    F.clients = c.data || []; F.devis = d.data || []; F.factures = f.data || [];
    F.pret = true;
    if (S.vue === 'factu') rendre();
  }

  async function connexion(form) {
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Connexion…';
    const { data, error } = await F.sb.auth.signInWithPassword({ email: form.email.value.trim(), password: form.mdp.value });
    if (error) { btn.disabled = false; btn.textContent = 'Se connecter'; return toast('Email ou mot de passe incorrect.', true); }
    const { data: prof } = await F.sb.from('profiles').select('role').eq('id', data.session.user.id).single();
    if (!prof || prof.role !== 'admin') { await F.sb.auth.signOut(); btn.disabled = false; btn.textContent = 'Se connecter'; return toast('Ce compte n’est pas administrateur.', true); }
    F.session = data.session; await charger();
  }

  // ------------------------------------------------------------------ vue liste
  function vue() {
    if (!F.pret) return '<div class="chargement">Connexion à la facturation…</div>';
    if (!F.session) return `<h2 class="section">Facturation</h2>
      <div class="bloc" style="margin-top:0"><p class="sous" style="margin-top:0">Connexion avec le compte admin <b>NSD</b> (nsdevelopment26@gmail.com), le même pour Sam et Nelson. Une seule fois par téléphone.</p>
      <form id="fx-login"><label class="champ">Email<input name="email" type="email" autocomplete="username" required></label>
      <label class="champ">Mot de passe<input name="mdp" type="password" autocomplete="current-password" required></label>
      <button class="btn large">Se connecter</button></form></div>`;

    const auj = isoJour(new Date());
    const aEmettre = F.factures.filter(f => f.statut === 'brouillon');
    const impayees = F.factures.filter(f => f.statut === 'envoyée' || f.statut === 'en_retard');
    const enAttente = F.devis.filter(d => d.statut === 'envoyé');
    const du = impayees.reduce((s, f) => s + (Number(f.total_ttc) || 0) - (Number(f.montant_paye) || 0), 0);
    const carteDevis = d => `<div class="fx-carte" data-fx-devis="${d.id}"><div class="corps"><div class="nom">${esc(d.clients ? d.clients.nom_etablissement : '?')}</div>
      <div class="meta">${d.numero ? esc(d.numero) : 'Brouillon'} · ${fmtDate(d.date_emission)} <span class="fx-st ${cls(d.statut)}">${esc(d.statut)}</span></div></div>
      <div class="mt">${eur(d.total_ttc)} €</div></div>`;
    const carteFacture = f => {
      const retard = f.statut === 'envoyée' && f.date_echeance && f.date_echeance < auj;
      return `<div class="fx-carte" data-fx-facture="${f.id}"><div class="corps"><div class="nom">${esc(f.clients ? f.clients.nom_etablissement : '?')}</div>
      <div class="meta">${f.numero ? esc(f.numero) : 'Brouillon'} · échéance ${fmtDate(f.date_echeance)} <span class="fx-st ${retard ? 'retard' : cls(f.statut)}">${retard ? 'en retard' : esc(f.statut)}</span></div></div>
      <div class="mt">${eur(f.total_ttc)} €${Number(f.montant_paye) ? `<div class="meta">payé ${eur(f.montant_paye)} €</div>` : ''}</div></div>`;
    };
    return `${F.erreur ? `<div class="fx-alerte">Erreur Supabase : ${esc(F.erreur)}</div>` : ''}
      ${!S.data.banque.iban ? '<div class="fx-alerte">IBAN non configuré : les documents afficheront « à compléter » en pied de page.</div>' : ''}
      <div class="grille" style="margin-bottom:6px">
        <div class="kpi"><div class="v">${eur(du)} €</div><div class="l">à encaisser TTC</div></div>
        <div class="kpi"><div class="v">${enAttente.length}</div><div class="l">devis en attente de réponse</div></div></div>
      <div class="fx-bar"><button class="btn" data-fx="nouveau-devis">＋ Nouveau devis</button></div>
      ${aEmettre.length ? section('Factures à émettre', 'brouillons sans numéro', aEmettre.map(carteFacture).join('')) : ''}
      ${impayees.length ? section('Factures à encaisser', impayees.length + '', impayees.map(carteFacture).join('')) : ''}
      ${section('Devis', F.devis.length + '', F.devis.length ? F.devis.map(carteDevis).join('') : '<div class="vide">Aucun devis. Ouvre la fiche d’un prospect et touche « Faire un devis ».</div>')}
      ${section('Toutes les factures', F.factures.length + '', F.factures.length ? F.factures.map(carteFacture).join('') : '<div class="vide">Aucune facture. Une facture se crée depuis un devis accepté.</div>')}
      <p style="margin-top:18px"><button class="btn clair large" data-fx="deconnexion">Se déconnecter de la facturation</button></p>`;
  }

  // ------------------------------------------------------------------ feuille
  function feuille(html) {
    let v = document.getElementById('fx-voile');
    if (!v) { v = document.createElement('div'); v.id = 'fx-voile'; v.className = 'voile'; document.body.appendChild(v);
      v.addEventListener('click', e => { if (e.target === v) fermer(); }); }
    v.innerHTML = `<div class="feuille">${html}</div>`;
    v.classList.remove('cache'); document.body.style.overflow = 'hidden';
  }
  function fermer() { const v = document.getElementById('fx-voile'); if (v) v.classList.add('cache'); document.body.style.overflow = ''; }
  function tete(titre, sous) {
    return `<div class="feuille-tete"><div class="poignee"></div><div class="ligne1"><div><h1>${titre}</h1>${sous ? `<div class="sous">${sous}</div>` : ''}</div>
      <button class="fermer" data-fx="fermer" aria-label="Fermer">✕</button></div></div>`;
  }

  // ------------------------------------------------------------------ devis : composition
  const D = { prospect: null, clientId: '', base: null, opts: {}, suivi: {}, lignes: [] };

  function nouveauDevis(prospect) {
    if (!F.session) { S.vue = 'factu'; fermerFiche(); rendre(); return toast('Connecte-toi d’abord à la facturation.', true); }
    D.prospect = prospect || null; D.clientId = prospect && prospect.client ? prospect.client : '';
    D.base = null; D.opts = {}; D.suivi = {}; D.lignes = [];
    const dans30 = new Date(Date.now() + 30 * 864e5);
    const nomClient = prospect ? prospect.entreprise : '';
    feuille(tete('Nouveau devis', nomClient ? esc(nomClient) + (D.clientId ? '' : ' · la fiche client sera créée') : '') + `
      <form id="fx-devis">
      ${prospect ? '' : `<div class="bloc"><label class="champ" style="margin:0">Client<select name="client" required><option value="">Choisir un client…</option>
        ${F.clients.map(c => `<option value="${c.id}">${esc(c.nom_etablissement)}</option>`).join('')}</select></label>
        <div class="sous">Pour un nouveau client, pars plutôt de sa fiche prospect : ses infos sont reprises.</div></div>`}
      <div class="bloc"><h3>Formule</h3><div class="fx-chips" id="fx-bases"></div></div>
      <div class="bloc"><h3>Options</h3><div class="fx-chips" id="fx-opts"></div></div>
      <div class="bloc"><h3>Lignes sur mesure</h3><div id="fx-lignes"></div>
        <button type="button" class="btn clair large" data-fx="ajout-ligne">＋ Ajouter une ligne</button></div>
      <div class="bloc"><h3>Maintenance</h3><div class="fx-chips" id="fx-suivi"></div>
        <div class="fx-deux" style="margin-top:12px">
          <label class="champ">Forfait trimestriel HT<input name="abo" type="number" min="0" step="1"></label>
          <label class="champ">Facturée<select name="periode"><option value="trimestriel">au trimestre</option><option value="annuel">à l’année (1 mois offert)</option></select></label></div>
        <div class="sous" id="fx-abo-info"></div></div>
      <div class="bloc"><div class="fx-deux">
          <label class="champ">TVA %<input name="tva" type="number" value="17" min="0" step="0.01"></label>
          <label class="champ">Valable jusqu’au<input name="validite" type="date" value="${isoJour(dans30)}"></label></div>
        <label class="champ">Notes (visibles sur le devis)<textarea name="notes"></textarea></label>
        <label class="champ">Enregistrer comme<select name="statut"><option value="brouillon">Brouillon, sans numéro</option><option value="envoyé">Envoyé : reçoit son numéro DEV</option></select></label></div>
      <div class="fx-totaux" id="fx-totaux"></div>
      <p><button class="btn large" type="submit">Enregistrer le devis</button></p></form>`);
    dessinerChoix(); calculer();
  }

  function dessinerChoix() {
    const chip = (attr, cle, n, prix, on) => `<button type="button" ${attr}="${esc(cle)}" class="${on ? 'on' : ''}">${esc(n)}<b>${prix}</b></button>`;
    document.getElementById('fx-bases').innerHTML = FORMULES.map(b => chip('data-fx-base', b.n, b.n, eur(b.pu) + ' €', D.base === b.n)).join('');
    document.getElementById('fx-opts').innerHTML = OPTIONS.map(o => chip('data-fx-opt', o.n, o.n, eur(o.pu) + ' €', D.opts[o.n])).join('');
    document.getElementById('fx-suivi').innerHTML = SUIVI.map(o => chip('data-fx-suivi', o.id, o.n, '+ ' + o.pu + ' € / trim.', D.suivi[o.id])).join('');
    document.getElementById('fx-lignes').innerHTML = D.lignes.map((l, i) => `<div class="fx-ligne" data-i="${i}">
      <input data-k="designation" placeholder="Désignation" value="${esc(l.designation)}"><input data-k="quantite" type="number" min="0" value="${l.quantite}">
      <input data-k="pu" type="number" min="0" step="0.01" placeholder="PU HT" value="${l.pu}"><button type="button" data-fx="suppr-ligne" data-i="${i}">×</button></div>`).join('');
  }

  function lignesDevis() {
    const L = []; let ordre = 0;
    const base = FORMULES.find(b => b.n === D.base);
    if (base) L.push({ designation: base.n, quantite: 1, prix_unitaire_ht: base.pu, montant_ht: base.pu, ordre: ordre++ });
    OPTIONS.forEach(o => { if (D.opts[o.n]) L.push({ designation: o.n, quantite: 1, prix_unitaire_ht: o.pu, montant_ht: o.pu, ordre: ordre++ }); });
    D.lignes.forEach(l => { if (!String(l.designation).trim()) return; const q = Number(l.quantite) || 0, pu = Number(l.pu) || 0;
      L.push({ designation: l.designation.trim(), quantite: q, prix_unitaire_ht: pu, montant_ht: Math.round(q * pu * 100) / 100, ordre: ordre++ }); });
    return L;
  }

  function calculer(aboManuel) {
    const form = document.getElementById('fx-devis'); if (!form) return;
    const suivi = SUIVI.reduce((s, o) => s + (D.suivi[o.id] ? o.pu : 0), 0);
    // Le forfait suit la formule choisie DANS le devis (et non la fiche client).
    if (!aboManuel) form.abo.value = D.base ? MTN_TRIMESTRE[D.base] + suivi : (suivi || '');
    const abo = Number(form.abo.value) || 0, annuel = form.periode.value === 'annuel';
    document.getElementById('fx-abo-info').textContent = abo ? (annuel ? 'Facturé ' + eur(aboAnnuel(abo)) + ' € HT / an au lieu de ' + eur(abo * 4) + ' €.' : 'Facturé ' + eur(abo) + ' € HT / trimestre, soit ' + eur(abo * 4) + ' € sur l’année.') : '';
    const ht = lignesDevis().reduce((s, l) => s + l.montant_ht, 0), taux = Number(form.tva.value) || 0, tva = ht * taux / 100;
    document.getElementById('fx-totaux').innerHTML = `<div><span>Prestation HT</span><span>${eur(ht)} €</span></div>
      <div><span>TVA ${eur(taux)} %</span><span>${eur(tva)} €</span></div><div class="gros"><span>Total TTC</span><span>${eur(ht + tva)} €</span></div>
      <div><span>Acompte 50 % à la signature</span><span>${eur((ht + tva) / 2)} € TTC</span></div>
      ${abo ? `<div><span>Maintenance</span><span>${annuel ? eur(aboAnnuel(abo)) + ' € HT / an' : eur(abo) + ' € HT / trim.'}</span></div>` : ''}`;
  }

  async function enregistrerDevis(form) {
    const lignes = lignesDevis();
    if (!lignes.length) return toast('Choisis au moins une formule, une option ou une ligne.', true);
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Enregistrement…';
    const echec = m => { btn.disabled = false; btn.textContent = 'Enregistrer le devis'; toast(m, true); };
    try {
      let clientId = D.clientId || (form.client ? form.client.value : '');
      // Prospect sans fiche client : on la crée depuis le CRM, et on garde le lien.
      if (!clientId && D.prospect) {
        const p = D.prospect;
        const { data: c, error } = await F.sb.from('clients').insert({
          nom_etablissement: p.entreprise, contact_nom: p.gerant || null, email: p.email || null,
          telephone: p.telephone || null, ville: p.commune || null, metier: p.secteur || null,
          site_domaine: p.site || null, formule: D.base || null, statut: 'prospect',
          notes: 'Créé depuis le CRM NSD (' + p.id + ').',
        }).select('*').single();
        if (error) return echec('Fiche client : ' + error.message);
        clientId = c.id; F.clients.unshift(c);
        const maj = await appel('api_modifier', S.pin, p.id, { client: c.id });
        majLocale(maj); D.prospect = maj; D.clientId = c.id;
      }
      if (!clientId) return echec('Choisis un client.');
      const ht = lignes.reduce((s, l) => s + l.montant_ht, 0), taux = Number(form.tva.value) || 0;
      const { data: dev, error: e1 } = await F.sb.from('devis').insert({
        client_id: clientId, date_emission: isoJour(new Date()), date_validite: form.validite.value || null,
        statut: form.statut.value, tva_taux: taux, total_ht: ht, total_ttc: Math.round((ht + ht * taux / 100) * 100) / 100,
        notes: form.notes.value.trim() || null,
      }).select('id').single();
      if (e1) return echec('Devis : ' + e1.message);
      const { error: e2 } = await F.sb.from('devis_lignes').insert(lignes.map(l => Object.assign({}, l, { devis_id: dev.id })));
      if (e2) return echec('Devis créé, mais erreur sur les lignes : ' + e2.message);
      const majAbo = { abonnement_mensuel: Number(form.abo.value) || 0, abonnement_periodicite: form.periode.value };
      if (D.base) majAbo.formule = D.base;
      const cc = F.clients.find(c => c.id === clientId);
      if (!cc || !cc.abonnement_moyen) majAbo.abonnement_moyen = form.periode.value === 'annuel' ? 'virement' : 'sepa';
      await F.sb.from('clients').update(majAbo).eq('id', clientId);
      toast(form.statut.value === 'envoyé' ? 'Devis enregistré avec son numéro.' : 'Devis enregistré en brouillon.');
      await charger(); ouvrirDevis(dev.id);
    } catch (e) { echec(e.message || String(e)); }
  }

  // ------------------------------------------------------------------ devis : fiche
  function prospectDuClient(clientId) { return S.data.prospects.find(p => p.client === clientId); }

  function ouvrirDevis(id) {
    const d = F.devis.find(x => x.id === id); if (!d) return;
    const fac = F.factures.find(f => f.devis_id === id);
    const act = [];
    act.push('<button class="btn large" data-fx="voir-devis" data-id="' + id + '">Voir le devis (PDF)</button>');
    if (d.statut === 'brouillon') act.push('<button class="btn clair large" data-fx="statut-devis" data-st="envoyé" data-id="' + id + '">Marquer envoyé (attribue le numéro)</button>');
    if (d.statut === 'envoyé') act.push('<div class="fx-deux"><button class="btn" data-fx="statut-devis" data-st="accepté" data-id="' + id + '">Accepté</button><button class="btn clair" data-fx="statut-devis" data-st="refusé" data-id="' + id + '">Refusé</button></div>');
    if (!fac && d.statut !== 'refusé') act.push('<button class="btn clair large" data-fx="facturer" data-id="' + id + '">Créer la facture</button>');
    if (fac) act.push('<button class="btn clair large" data-fx-facture="' + fac.id + '">Voir la facture ' + esc(fac.numero || 'brouillon') + '</button>');
    feuille(tete(d.numero ? esc(d.numero) : 'Devis brouillon', esc(d.clients ? d.clients.nom_etablissement : '') + ' · <span class="fx-st ' + cls(d.statut) + '">' + esc(d.statut) + '</span>')
      + `<div class="bloc"><dl class="infos"><dt>Émis le</dt><dd>${fmtDate(d.date_emission)}</dd><dt>Valable jusqu’au</dt><dd>${fmtDate(d.date_validite)}</dd>
         <dt>Total HT</dt><dd>${eur(d.total_ht)} €</dd><dt>Total TTC</dt><dd><b>${eur(d.total_ttc)} €</b></dd></dl></div>
         <div style="display:grid;gap:8px;margin-top:12px">${act.join('')}</div>`);
  }

  async function changerStatutDevis(id, st) {
    if (st === 'envoyé' && !confirm('Marquer ce devis comme envoyé ? Il reçoit un numéro DEV définitif.')) return;
    const { error } = await F.sb.from('devis').update({ statut: st }).eq('id', id);
    if (error) return toast(error.message, true);
    await charger();
    const d = F.devis.find(x => x.id === id);
    toast(st === 'envoyé' ? 'Devis ' + (d && d.numero || '') + ' envoyé.' : 'Devis ' + st + '.');
    // Devis accepté = client signé dans le CRM.
    const p = d && prospectDuClient(d.client_id);
    if (st === 'accepté' && p && cle(p) !== 'signe' && confirm('Passer ' + p.entreprise + ' en « Client signé » dans le CRM ?')) {
      try { const maj = await appel('api_logger', S.pin, p.id, 'signe', 'Devis ' + (d.numero || '') + ' accepté', '', S.par, null);
        majLocale(maj, { resultat: 'Client signé', note: 'Devis accepté', rappel: '' }); } catch (e) { toast(e.message, true); }
    }
    ouvrirDevis(id);
  }

  // ------------------------------------------------------------------ factures
  async function facturer(devisId) {
    const dev = F.devis.find(x => x.id === devisId);
    const { data: lignes, error: e0 } = await F.sb.from('devis_lignes').select('*').eq('devis_id', devisId).order('ordre');
    if (e0) return toast(e0.message, true);
    const { data: fac, error: e1 } = await F.sb.from('factures').insert({
      client_id: dev.client_id, devis_id: dev.id, date_emission: isoJour(new Date()), date_echeance: isoJour(new Date(Date.now() + 15 * 864e5)),
      statut: 'brouillon', tva_taux: dev.tva_taux, total_ht: dev.total_ht, total_ttc: dev.total_ttc, notes: dev.notes || null,
    }).select('id').single();
    if (e1) return toast(e1.message, true);
    if (lignes && lignes.length) {
      const { error: e2 } = await F.sb.from('factures_lignes').insert(lignes.map(l => ({ facture_id: fac.id, designation: l.designation,
        quantite: l.quantite, prix_unitaire_ht: l.prix_unitaire_ht, montant_ht: l.montant_ht, ordre: l.ordre })));
      if (e2) toast('Facture créée, mais erreur sur les lignes : ' + e2.message, true);
    }
    await charger(); toast('Facture créée en brouillon. Vérifie-la, puis émets-la.'); ouvrirFacture(fac.id);
  }

  function ouvrirFacture(id) {
    const f = F.factures.find(x => x.id === id); if (!f) return;
    const reste = (Number(f.total_ttc) || 0) - (Number(f.montant_paye) || 0);
    const act = ['<button class="btn large" data-fx="voir-facture" data-id="' + id + '">Voir la facture (PDF)</button>'];
    if (f.statut === 'brouillon') act.push('<button class="btn clair large" data-fx="emettre" data-id="' + id + '">Émettre : attribuer le numéro légal</button>');
    const paiement = (f.statut === 'envoyée' || f.statut === 'en_retard') ? `<form class="bloc" id="fx-paiement" data-id="${id}"><h3>Enregistrer un paiement</h3>
      <div class="fx-deux"><label class="champ">Montant<input name="montant" type="number" step="0.01" min="0" value="${Math.round(reste * 100) / 100}"></label>
      <label class="champ">Date<input name="date" type="date" value="${isoJour(new Date())}"></label></div>
      <div class="fx-deux"><label class="champ">Moyen<select name="moyen"><option value="virement">Virement</option><option value="sepa">SEPA</option><option value="carte">Carte</option><option value="espèces">Espèces</option></select></label>
      <label class="champ">Référence<input name="ref"></label></div><button class="btn large">Enregistrer le paiement</button></form>` : '';
    feuille(tete(f.numero ? esc(f.numero) : 'Facture brouillon', esc(f.clients ? f.clients.nom_etablissement : '') + ' · <span class="fx-st ' + cls(f.statut) + '">' + esc(f.statut) + '</span>')
      + `<div class="bloc"><dl class="infos"><dt>Émise le</dt><dd>${fmtDate(f.date_emission)}</dd><dt>Échéance</dt><dd>${fmtDate(f.date_echeance)}</dd>
         <dt>Total TTC</dt><dd><b>${eur(f.total_ttc)} €</b></dd><dt>Déjà payé</dt><dd>${eur(f.montant_paye)} €</dd><dt>Reste dû</dt><dd><b>${eur(reste)} €</b></dd></dl></div>
         <div style="display:grid;gap:8px;margin-top:12px">${act.join('')}</div>${paiement}`);
  }

  async function emettre(id) {
    if (!confirm('Émettre cette facture ? Elle reçoit un numéro FAC légal et définitif. C’est irréversible.')) return;
    const { error } = await F.sb.from('factures').update({ statut: 'envoyée' }).eq('id', id);
    if (error) return toast(error.message, true);
    await charger(); const f = F.factures.find(x => x.id === id);
    toast('Facture ' + (f && f.numero || '') + ' émise.'); ouvrirFacture(id);
  }

  async function payer(form) {
    const id = form.dataset.id, montant = Number(form.montant.value) || 0;
    if (montant <= 0) return toast('Montant invalide.', true);
    const btn = form.querySelector('button'); btn.disabled = true;
    const { error } = await F.sb.from('paiements').insert({ facture_id: id, date: form.date.value || null, montant, moyen: form.moyen.value, reference: form.ref.value.trim() || null });
    if (error) { btn.disabled = false; return toast(error.message, true); }
    const { data: pays } = await F.sb.from('paiements').select('montant').eq('facture_id', id);
    const total = (pays || []).reduce((s, p) => s + Number(p.montant), 0);
    const f = F.factures.find(x => x.id === id);
    await F.sb.from('factures').update({ montant_paye: total, statut: total >= Number(f.total_ttc) - 0.005 ? 'payée' : 'envoyée' }).eq('id', id);
    await charger(); toast('Paiement enregistré.'); ouvrirFacture(id);
  }

  // ------------------------------------------------------------------ documents
  async function voir(type, id) {
    const table = type === 'devis' ? 'devis' : 'factures';
    const { data: doc, error } = await F.sb.from(table).select('*, clients(*)').eq('id', id).single();
    if (error) return toast(error.message, true);
    const { data: lignes } = await F.sb.from(table + '_lignes').select('*').eq(type === 'devis' ? 'devis_id' : 'facture_id', id).order('ordre');
    const html = type === 'devis' ? docDevisHTML(doc, lignes || [], doc.clients || {}) : docFactureHTML(doc, lignes || [], doc.clients || {});
    const v = document.createElement('div'); v.className = 'fx-doc'; v.id = 'fx-doc';
    v.innerHTML = '<div class="outils"><button class="btn clair" data-fx="fermer-doc">Fermer</button><button class="btn clair" data-fx="imprimer">Imprimer / PDF</button><button class="btn clair" data-fx="onglet">Nouvel onglet</button></div><iframe title="Document"></iframe>';
    document.body.appendChild(v);
    v.querySelector('iframe').srcdoc = html;
    v._html = html;
  }

  const docDevisHTML = (d, l, c) => NSDocs.devis(d, l, c, S.data.banque);
  const docFactureHTML = (f, l, c) => NSDocs.facture(f, l, c, S.data.banque);

  // ------------------------------------------------------------------ événements
  document.addEventListener('click', e => {
    const t = e.target;
    const dv = t.closest('[data-fx-devis]'); if (dv) return ouvrirDevis(dv.dataset.fxDevis);
    const fc = t.closest('[data-fx-facture]'); if (fc) return ouvrirFacture(fc.dataset.fxFacture);
    const b = t.closest('[data-fx-base]'); if (b) { D.base = D.base === b.dataset.fxBase ? null : b.dataset.fxBase; dessinerChoix(); return calculer(); }
    const o = t.closest('[data-fx-opt]'); if (o) { const k = o.dataset.fxOpt; if (D.opts[k]) delete D.opts[k]; else D.opts[k] = true; dessinerChoix(); return calculer(); }
    const s = t.closest('[data-fx-suivi]'); if (s) { const k = s.dataset.fxSuivi; if (D.suivi[k]) delete D.suivi[k]; else D.suivi[k] = true; dessinerChoix(); return calculer(); }
    const a = t.closest('[data-fx]'); if (!a) return;
    const act = a.dataset.fx, id = a.dataset.id;
    if (act === 'fermer') fermer();
    else if (act === 'nouveau-devis') nouveauDevis(null);
    else if (act === 'deconnexion') F.sb.auth.signOut().then(() => { F.session = null; rendre(); });
    else if (act === 'ajout-ligne') { D.lignes.push({ designation: '', quantite: 1, pu: '' }); dessinerChoix(); calculer(); }
    else if (act === 'suppr-ligne') { D.lignes.splice(Number(a.dataset.i), 1); dessinerChoix(); calculer(); }
    else if (act === 'voir-devis') voir('devis', id);
    else if (act === 'voir-facture') voir('facture', id);
    else if (act === 'statut-devis') changerStatutDevis(id, a.dataset.st);
    else if (act === 'facturer') facturer(id);
    else if (act === 'emettre') emettre(id);
    else if (act === 'fermer-doc') document.getElementById('fx-doc').remove();
    else if (act === 'imprimer') { const f = document.querySelector('#fx-doc iframe'); f.contentWindow.focus(); f.contentWindow.print(); }
    else if (act === 'onglet') { const u = URL.createObjectURL(new Blob([document.getElementById('fx-doc')._html], { type: 'text/html' })); window.open(u, '_blank'); }
  });
  document.addEventListener('input', e => {
    const l = e.target.closest('.fx-ligne');
    if (l) { D.lignes[Number(l.dataset.i)][e.target.dataset.k] = e.target.value; return calculer(true); }
    // Le forfait ne se recalcule qu'au choix d'une formule ou d'un suivi : une saisie à la main est respectée.
    if (e.target.closest('#fx-devis')) calculer(true);
  });
  document.addEventListener('change', e => { if (e.target.name === 'periode' && e.target.closest('#fx-devis')) calculer(true); });
  document.addEventListener('submit', e => {
    if (e.target.id === 'fx-login') { e.preventDefault(); connexion(e.target); }
    if (e.target.id === 'fx-devis') { e.preventDefault(); enregistrerDevis(e.target); }
    if (e.target.id === 'fx-paiement') { e.preventDefault(); payer(e.target); }
  });

  return { init, vue, nouveauDevis, recharger: () => F.session && charger() };
})();
</script>
