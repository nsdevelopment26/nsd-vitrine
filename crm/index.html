<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="theme-color" content="#0f0f10">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<style>
  :root {
    --fond: #f4f3f1; --carte: #ffffff; --encre: #141414; --doux: #6b6b6b; --ligne: #e4e2de;
    --noir: #0f0f10; --accent: #141414; --danger: #b3261e; --ok: #2e7d32; --alerte: #c25e00;
    --rayon: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fond); color: var(--encre);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .cache { display: none !important; }

  header.barre { position: sticky; top: 0; z-index: 5; background: var(--noir); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
  .barre-int { max-width: 1180px; margin: 0 auto; }
  .logo img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .barre-haut { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
  .tuile { width: 30px; height: 30px; border-radius: 8px; background: #1d1d1f; border: 1px solid #333;
    display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  .moi { border: 1px solid #333; background: #1d1d1f; color: #ddd; border-radius: 99px; padding: 6px 12px;
    font-size: 13px; font-weight: 600; }
  .espaces { display: flex; gap: 6px; margin-top: 12px; }
  .espaces button { flex: 1; border: 1px solid #333; background: #1d1d1f; color: #c9c9c9; border-radius: 9px;
    padding: 8px 6px; font-size: 14px; font-weight: 600; }
  .espaces button.actif { background: #fff; color: var(--noir); border-color: #fff; }
  .qui { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 99px;
    background: #e9e7e3; color: #333; }
  .qui.libre { background: transparent; border: 1px dashed #aaa; color: var(--doux); }
  .recherche { margin-top: 12px; width: 100%; border: 0; border-radius: 10px; padding: 11px 14px;
    background: #fff; color: #141414; font-size: 16px; }

  main { padding: 14px 16px; max-width: 760px; margin: 0 auto; }
  @media (min-width: 1000px) {
    main { max-width: 1180px; }
    body[data-vue="pipeline"] main { max-width: none; padding-left: 24px; padding-right: 24px; }
    .grille-cartes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grille-cartes > .lp { margin-bottom: 0; }
  }

  /* Sélecteur de journée */
  .jourbar { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; }
  .jourbar .fleche { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--ligne); background: #fff; font-size: 20px; }
  .jour-choix { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; min-height: 42px; background: #fff;
    border: 1px solid var(--ligne); border-radius: 12px; padding: 4px 12px; cursor: pointer; }
  .jour-choix b { font-size: 16px; }
  .jour-choix b::first-letter { text-transform: uppercase; }
  .jour-choix small { color: var(--doux); font-size: 12px; }
  .jour-choix input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .retour-auj { display: block; width: 100%; margin: 0 0 6px; border: 0; background: var(--noir); color: #fff; border-radius: 12px; padding: 10px; font-weight: 700; font-size: 14px; }
  .bilan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .bilan div { background: #fff; border: 1px solid var(--ligne); border-radius: 12px; padding: 8px 10px; }
  .bilan b { display: block; font-size: 20px; line-height: 1.1; }
  .bilan span { color: var(--doux); font-size: 12px; }

  /* Fiche lisible d'un coup d'œil */
  .lp { background: var(--carte); border: 1px solid var(--ligne); border-left: 6px solid var(--statut, #fff); border-radius: var(--rayon);
    padding: 12px 14px 10px; margin-bottom: 8px; cursor: pointer; }
  .lp-tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .lp-nom { font-weight: 750; font-size: 16px; line-height: 1.25; }
  .lp-droite { text-align: right; white-space: nowrap; font-weight: 750; font-size: 14px; }
  .lp-droite.retard { color: var(--danger); }
  .lp-droite small { display: block; font-weight: 600; color: var(--doux); font-size: 12px; }
  .lp-sous { color: var(--doux); font-size: 13px; margin-top: 1px; }
  .lp-grille { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin-top: 8px; font-size: 14px; }
  .lp-grille dt { color: var(--doux); font-size: 12px; padding-top: 2px; }
  .lp-grille dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .lp-grille dd.faible { color: var(--doux); }
  .lp-grille a { font-weight: 650; text-decoration: none; }
  .lp-resultat { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--statut, #eee); }
  .lp-actions { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 6px; margin-top: 10px; }
  .lp-actions a, .lp-actions button { display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 9px 6px;
    font-size: 13px; font-weight: 700; text-decoration: none; border: 1px solid var(--ligne); background: #fff; }
  .lp-actions .appeler { background: var(--noir); color: #fff; border-color: var(--noir); }
  .lp-actions .inactif { opacity: .35; pointer-events: none; }
  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux);
    margin: 22px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  h2.section:first-child { margin-top: 4px; }
  h2.section small { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .vide { color: var(--doux); font-size: 14px; padding: 14px; background: var(--carte);
    border-radius: var(--rayon); border: 1px dashed var(--ligne); }

  .pastille { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--statut, #eee); color: #141414; border: 1px solid rgba(0,0,0,.08); }
  .plus { width: 100%; background: transparent; border: 1px solid var(--ligne); border-radius: 10px; padding: 10px; color: var(--doux); }

  nav.onglets { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: #fff; border-top: 1px solid var(--ligne);
    display: grid; grid-template-columns: repeat(6, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  nav.onglets button { border: 0; background: none; padding: 10px 4px 12px; font-size: 12px; color: var(--doux);
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav.onglets button .ico { font-size: 20px; line-height: 1; }
  nav.onglets button.actif { color: var(--encre); font-weight: 700; }

  /* Pipeline */
  .filtres { display: flex; gap: 8px; margin-bottom: 12px; }
  .filtres select { flex: 1; border: 1px solid var(--ligne); background: #fff; border-radius: 10px; padding: 10px; }
  .colonnes { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px;
    margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .colonne { flex: 0 0 82%; max-width: 320px; scroll-snap-align: start; background: #ebe9e5; border-radius: var(--rayon); padding: 10px; }
  /* Sur ordinateur, les colonnes occupent toute la largeur : plus rien à faire glisser. */
  @media (min-width: 1000px) {
    .colonnes { display: grid; grid-template-columns: repeat(var(--nb-col, 7), minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0; gap: 8px; }
    .colonne { max-width: none; min-width: 0; padding: 8px; }
    .colonne .liste { max-height: calc(100vh - 290px); }
  }
  .colonne h3 { margin: 2px 4px 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .colonne .liste { max-height: 64vh; overflow-y: auto; }
  .pc { background: var(--carte); border: 1px solid var(--ligne); border-left: 5px solid var(--statut, #fff); border-radius: 12px;
    padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .pc-nom { font-weight: 700; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pc-meta { color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .pc-bas { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 6px; margin-top: 5px; align-items: baseline; }
  .pc-bas a { font-weight: 650; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .pc-date { font-weight: 700; white-space: nowrap; }
  .pc-date.retard { color: var(--danger); }

  /* Stats */
  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .kpi { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 14px; }
  .kpi .v { font-size: 28px; font-weight: 800; line-height: 1.1; }
  .kpi .l { color: var(--doux); font-size: 13px; }
  .barres { display: flex; align-items: flex-end; gap: 4px; height: 130px; background: var(--carte); border: 1px solid var(--ligne);
    border-radius: var(--rayon); padding: 12px 10px 26px; position: relative; }
  .barre-j { flex: 1; background: var(--noir); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
  .barre-j span { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--doux); }
  .barre-j em { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 10px; font-style: normal; color: var(--encre); }
  table.recap { width: 100%; border-collapse: collapse; background: var(--carte); border-radius: var(--rayon); overflow: hidden; border: 1px solid var(--ligne); }
  table.recap td { padding: 10px 12px; border-bottom: 1px solid var(--ligne); font-size: 14px; }
  table.recap td:last-child { text-align: right; font-weight: 700; }

  /* Formulaires */
  label.champ { display: block; margin-bottom: 12px; font-size: 13px; color: var(--doux); }
  label.champ input, label.champ select, label.champ textarea { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--ligne);
    background: #fff; border-radius: 10px; padding: 11px 12px; font-size: 16px; color: var(--encre); }
  textarea { resize: vertical; min-height: 70px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 13px 16px;
    font-weight: 700; background: var(--noir); color: #fff; text-decoration: none; }
  .btn.large { width: 100%; }
  .btn.clair { background: #fff; color: var(--encre); border: 1px solid var(--ligne); }
  .btn:disabled { opacity: .5; }

  /* Fiche */
  .voile { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  .feuille { background: var(--fond); width: 100%; max-width: 760px; max-height: 94vh; overflow-y: auto; border-radius: 20px 20px 0 0;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  .feuille-tete { position: sticky; top: 0; background: var(--fond); padding: 12px 0 10px; z-index: 2; }
  .poignee { width: 40px; height: 5px; border-radius: 3px; background: #cfccc6; margin: 0 auto 10px; }
  .feuille-tete .ligne1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .feuille-tete h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  .fermer { border: 0; background: #e6e3de; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; flex: 0 0 auto; }
  .sous { color: var(--doux); font-size: 14px; margin-top: 4px; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 4px; }
  .actions a, .actions button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #fff;
    border: 1px solid var(--ligne); border-radius: 12px; text-decoration: none; font-size: 12px; font-weight: 600; }
  .actions .ico { font-size: 20px; }
  .actions .inactif { opacity: .35; pointer-events: none; }
  .actions .pret { background: #25d366; border-color: #25d366; color: #fff; }
  .msg-haut { margin: 8px 0 4px; }
  .msg-haut .tete { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--doux); margin-bottom: 4px; }
  .msg-haut input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--ligne); border-radius: 8px; }
  .msg-haut textarea { width: 100%; box-sizing: border-box; height: 118px; font: inherit; font-size: 13px; line-height: 1.35; padding: 8px 10px; border: 1px solid var(--ligne); border-radius: 10px; resize: vertical; }
  .btn.inactif { opacity: .35; pointer-events: none; }
  .actions .principal { background: var(--noir); color: #fff; border-color: var(--noir); }
  .bloc { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 14px; margin-top: 12px; }
  .bloc h3 { margin: 0 0 10px; font-size: 14px; }
  .resultats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .resultats button { border: 1px solid var(--ligne); background: #fff; border-radius: 12px; padding: 12px 8px; font-weight: 650; font-size: 14px;
    border-left: 6px solid var(--statut, #ddd); text-align: left; }
  .resultats button.choisi { outline: 2px solid var(--noir); }
  .dates { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .dates button { border: 1px solid var(--ligne); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  .dates button.choisi { background: var(--noir); color: #fff; border-color: var(--noir); }
  dl.infos { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 8px 10px; font-size: 14px; }
  dl.infos dt { color: var(--doux); }
  dl.infos dd { margin: 0; word-break: break-word; }
  .conseil { background: #fff7e6; border: 1px solid #f3d9a4; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .histo { list-style: none; padding: 0; margin: 0; }
  .histo li { padding: 8px 0; border-bottom: 1px solid var(--ligne); font-size: 14px; }
  .histo li:last-child { border-bottom: 0; }
  .histo .d { color: var(--doux); font-size: 12px; }
  .doublon { background: #fdecea; border: 1px solid #f5c2bd; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--noir); color: #fff;
    padding: 11px 16px; border-radius: 12px; z-index: 20; font-size: 14px; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.erreur { background: var(--danger); }
  /* Reels */
  .rc { background: var(--carte); border: 1px solid var(--ligne); border-left: 6px solid var(--statut, #c13584); border-radius: var(--rayon);
    padding: 12px 14px 10px; margin-bottom: 8px; }
  .rc.fait { opacity: .55; }
  .rc-tete { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .rc-nom { font-weight: 750; font-size: 16px; line-height: 1.25; }
  .rc-pseudo { font-size: 13px; font-weight: 650; color: #8a2a5c; text-decoration: none; white-space: nowrap; }
  .rc-sous { color: var(--doux); font-size: 13px; margin-top: 1px; }
  .rc-actions { display: grid; grid-template-columns: 1.6fr 1fr; gap: 6px; margin-top: 10px; }
  .rc-actions a, .rc-actions button { display: flex; align-items: center; justify-content: center; border-radius: 10px; padding: 10px 6px;
    font-size: 13px; font-weight: 700; text-decoration: none; border: 1px solid var(--ligne); background: #fff; text-align: center; }
  .rc-actions .insta { background: var(--noir); color: #fff; border-color: var(--noir); }
  .rc-actions .envoye { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  .rc-petit { margin-top: 6px; display: flex; gap: 14px; font-size: 12px; }
  .rc-petit button { border: 0; background: none; padding: 2px 0; color: var(--doux); text-decoration: underline; font-size: 12px; }
  .reel-choix { display: flex; gap: 8px; margin-bottom: 8px; }
  .reel-choix select { flex: 1; min-width: 0; border: 1px solid var(--ligne); background: #fff; border-radius: 10px; padding: 10px; }
  .reel-texte { white-space: pre-wrap; font-size: 13px; background: #fff; border: 1px solid var(--ligne); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .metiers-choix { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .metiers-choix label { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--ligne); border-radius: 99px;
    padding: 6px 11px; font-size: 13px; color: var(--encre); }
  details.bloc summary { font-weight: 700; font-size: 14px; cursor: pointer; }
  .chargement { text-align: center; padding: 60px 20px; color: var(--doux); }

  /* Connexion */
  .connexion { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 380px; margin: 0 auto; }
  .bandeau-installer { display: block; background: #35d29a; color: #0f0f10; font-weight: 700; font-size: 14px; text-align: center;
    padding: 10px 16px; text-decoration: none; }
  .logo-connexion { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 18px; }
  .connexion h1 { margin: 0 0 6px; }
  .connexion p { color: var(--doux); margin: 0 0 22px; }
  .code { letter-spacing: .4em; text-align: center; font-size: 24px !important; }
</style>
</head>
<body>
<a id="bandeau-installer" class="bandeau-installer cache" href="https://nsdevelopment26.github.io/nsd-vitrine/crm/" target="_top">
  Pour avoir le logo NS sur l’écran d’accueil, ouvre l’appli ici puis ajoute-la depuis Safari →</a>

<div id="ecran-connexion" class="connexion cache">
  <img class="logo-connexion" src="icones/nsd-vert-tuile-96.png" alt="NS Development" width="64" height="64">
  <h1>CRM NSD</h1>
  <p>La prospection de NS Development, reliée au Google Sheets.</p>
  <label class="champ">Code d’accès
    <input id="pin" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
  </label>
  <button class="btn large" id="btn-connexion">Entrer</button>
</div>

<div id="app" class="cache">
  <header class="barre"><div class="barre-int">
    <div class="barre-haut">
      <div class="logo"><img src="icones/nsd-vert-tuile-96.png" alt="NS Development"> CRM</div>
      <button class="moi cache" id="moi" data-action="deconnexion" aria-label="Changer de personne"></button>
    </div>
    <div class="espaces" id="espaces"></div>
    <input class="recherche" id="recherche" type="search" placeholder="Chercher un nom, un numéro, une commune…">
  </div></header>
  <main id="vue"><div class="chargement">Chargement du Sheets…</div></main>
  <nav class="onglets" id="onglets">
    <button data-vue="jour" class="actif"><span class="ico">☎︎</span>Journée</button>
    <button data-vue="pipeline"><span class="ico">▦</span>Pipeline</button>
    <button data-vue="ajouter"><span class="ico">＋</span>Ajouter</button>
    <button data-vue="factu"><span class="ico">€</span>Factu</button>
    <button data-vue="reels"><span class="ico">▶︎</span>Reels</button>
    <button data-vue="stats"><span class="ico">↗︎</span>Stats</button>
  </nav>
</div>

<div id="fiche" class="voile cache"></div>
<div id="toast" class="toast cache"></div>

<script>
// ---------------------------------------------------------------------------
// État
// ---------------------------------------------------------------------------
// Un code par personne depuis le 26/09/2026 : le serveur dit qui est connecté
// (S.moi). S.espace = ce qu'on regarde : son espace, celui de l'autre, ou Équipe.
const S = { pin: '', par: '', moi: null, espace: '', data: null, vue: 'jour', recherche: '', filtreSecteur: '', ouvert: null, plusJour: 25,
  jour: '', journeesChargees: {}, ecritures: 0 };

function stocker(k, v) { try { localStorage.setItem('crmnsd_' + k, v); } catch (e) {} }
function lire(k) { try { return localStorage.getItem('crmnsd_' + k) || ''; } catch (e) { return ''; } }

// Deux façons de parler au Sheets, même code serveur derrière :
// - ouverte depuis script.google.com : google.script.run ;
// - installée sur le téléphone (nsd-vitrine/crm/) : l'API JSON de l'Apps Script.
// Fiabilité (29/09/2026, « le CRM beug souvent ») :
// - l'iPhone coupe les requêtes quand Sam part sur WhatsApp ou le téléphone : une écriture
//   porte un identifiant unique (rid) et se relance seule, le serveur ne l'applique qu'une
//   fois (plus d'appel compté deux fois, plus de Perdu au 2e « pas de réponse ») ;
// - une requête qui traîne est coupée au bout de 30 s au lieu de bloquer le bouton ;
// - chaque écriture fait monter S.ecritures : un rechargement parti avant est ignoré.
const ECRITURES = ['api_logger', 'api_modifier', 'api_ajouter', 'api_reel_ajouter', 'api_partage', 'api_audience_ajouter'];
const attendreVisible = () => document.hidden ? new Promise(ok => {
  const f = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', f); ok(); } };
  document.addEventListener('visibilitychange', f);
}) : Promise.resolve();
const pause = ms => new Promise(ok => setTimeout(ok, ms));
function appelUnique(corps) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const minuteur = setTimeout(() => ctrl && ctrl.abort(), 30000);
  return fetch(window.CRM_API, { method: 'POST', body: JSON.stringify(corps), signal: ctrl ? ctrl.signal : undefined })
    .then(r => { if (!r.ok) throw Object.assign(new Error('Serveur injoignable (' + r.status + ').'), { reseau: true }); return r.text(); },
      e => { throw Object.assign(new Error(e && e.name === 'AbortError' ? 'Le serveur ne répond pas.' : 'Connexion perdue.'), { reseau: true }); })
    // Google renvoie parfois une page HTML au lieu de la réponse (mesuré le 29/09/2026) : on relance.
    .then(t => { try { return JSON.parse(t); } catch (e) { throw Object.assign(new Error('Réponse illisible de Google.'), { reseau: true }); } })
    .finally(() => clearTimeout(minuteur));
}
async function appel(fn, ...args) {
  const ecriture = ECRITURES.includes(fn);
  if (ecriture) S.ecritures++;
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, ko) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e))[fn](...args);
    });
  }
  const corps = { fn, args };
  if (ecriture) corps.rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  let r;
  try {
    for (let essai = 1; ; essai++) {
      try { r = await appelUnique(corps); break; }
      catch (e) {
        if (!e.reseau || essai >= 6) { signalerErreur('appel ' + fn + ' : ' + e.message); throw new Error(e.message + ' Réessaie.'); }
        await attendreVisible(); await pause(essai * 700);
      }
    }
  } finally { if (ecriture) S.ecritures++; }
  if (r.erreur) { if (fn !== 'api_charger' || !/Code/.test(r.erreur)) signalerErreur(fn + ' : ' + r.erreur); throw new Error(r.erreur); }
  return r.resultat;
}

// Les erreurs de l'appli partent dans l'onglet « Erreurs » du Sheets : on voit ce que Sam a vu.
let erreursEnvoyees = 0;
function signalerErreur(msg) {
  if (!window.CRM_API || !S.pin || erreursEnvoyees >= 20) return;
  erreursEnvoyees++;
  try { fetch(window.CRM_API, { method: 'POST', body: JSON.stringify({ fn: 'api_erreur', args: [S.pin, String(msg).slice(0, 500), (S.vue || '') + ' · ' + navigator.userAgent.slice(0, 120)] }) }).catch(() => {}); } catch (e) {}
}
window.addEventListener('error', e => signalerErreur('JS : ' + (e.message || '') + ' @' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => signalerErreur('Promesse : ' + ((e.reason && e.reason.message) || e.reason)));

function toast(msg, erreur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (erreur ? ' erreur' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('cache'), erreur ? 5000 : 2600);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------------
// Dates (format du Sheets : « 2026-09-23 14:00 »)
// ---------------------------------------------------------------------------
const pad = n => String(n).padStart(2, '0');
function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function maintenant() { return fmt(new Date()); }
function aujourdhui() { return maintenant().slice(0, 10); }
function versDate(s) { const m = String(s).match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const JOURS_LONG = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function heure(s) { const d = versDate(s); return d ? d.getHours() + ' h' + (d.getMinutes() ? pad(d.getMinutes()) : '') : ''; }
function dateCourte(s) {
  const d = versDate(s); if (!d) return '';
  const j = s.slice(0, 10);
  if (j === aujourdhui()) return 'auj. ' + heure(s);
  const demain = new Date(); demain.setDate(demain.getDate() + 1);
  if (j === fmt(demain).slice(0, 10)) return 'demain ' + heure(s);
  return JOURS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + ' ' + heure(s);
}
function dateLongue(s) { const d = versDate(s); return d ? JOURS_LONG[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' à ' + heure(s) : ''; }

// ---------------------------------------------------------------------------
// Métiers, statuts, téléphones
// ---------------------------------------------------------------------------
function sansAccent(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
// Un mot-clé court (bar, pub, spa, gym) doit être un mot entier : « barber » n'est pas un bar,
// « espace » n'est pas un spa. Les plus longs restent des débuts de mot (coiff, boulang…).
function contientMot(txt, k) {
  return k.length > 3 ? txt.includes(k) : new RegExp('(^|[^a-z0-9])' + k + '([^a-z0-9]|$)').test(txt);
}
function metierDe(p) {
  if (p._metier !== undefined) return p._metier;
  const txt = sansAccent(p.secteur + ' ' + p.entreprise);
  const sect = sansAccent(p.secteur);
  let trouve = null;
  // Le secteur prime sur le nom : « Café » dans un nom de restaurant ne doit pas gagner.
  for (const pass of [sect, txt]) {
    if (!pass.trim()) continue;
    trouve = S.data.metiers.find(m => m.motsCles.split(',').map(x => sansAccent(x).trim()).some(k => k && k !== '*' && contientMot(pass, k)));
    if (trouve) break;
  }
  trouve = trouve || S.data.metiers.find(m => m.motsCles.trim() === '*') || null;
  p._metier = trouve; return trouve;
}
function dansCreneau(p, quand) {
  const m = metierDe(p); if (!m || !m.creneaux) return true;
  const hm = (quand || maintenant()).slice(11, 16);
  return m.creneaux.split(',').some(c => { const [a, b] = c.trim().split('-'); return a && b && hm >= a.trim() && hm < b.trim(); });
}
function prochainCreneau(p) {
  const m = metierDe(p); if (!m || !m.creneaux) return '';
  const hm = maintenant().slice(11, 16);
  const debuts = m.creneaux.split(',').map(c => c.trim().split('-')[0].trim()).filter(Boolean).sort();
  return debuts.find(d => d > hm) || '';
}
function statut(label) { return S.data.statuts.find(s => s.label === label || s.k === label) || S.data.statuts[0]; }
function cle(p) { return statut(p.statut).k; }
function couleur(p) { return statut(p.statut).color; }
function telInternational(t) {
  let d = String(t || '').split(/[\/;,]| ou /)[0].replace(/\.0$/, '').replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('352') && d.length > 9) return d;
  return '352' + d;
}
function lienTel(t) { const i = telInternational(t); return i ? 'tel:+' + i : ''; }
function lienSite(s) { s = String(s || '').trim(); if (!s || !/[.]/.test(s)) return ''; return /^https?:/i.test(s) ? s : 'https://' + s; }
function lienInsta(s) { s = String(s || '').trim(); if (!s) return ''; if (/^https?:/i.test(s)) return s; return 'https://instagram.com/' + s.replace(/^@/, ''); }
function trouver(id) { return S.data.prospects.find(p => p.id === id); }
function historique(id) { return S.data.journal.filter(j => j.id === id).sort((a, b) => b.date.localeCompare(a.date)); }
const RES_APPEL = () => Object.values(S.data.resultats).filter(r => r.appel).map(r => r.label);

// --- Espaces ---------------------------------------------------------------
// Un prospect travaillé sans responsable date d'avant les espaces : c'est Sam.
// Un « À appeler » sans responsable est libre, visible des deux.
const EQUIPE_VUE = 'Équipe';
function respDe(p) { return p.responsable || (cle(p) === 'a_appeler' ? '' : S.data.equipe[0]); }
function parDe(e) { return !e.par || e.par === S.data.parHistorique ? S.data.equipe[0] : e.par; }
function vueEquipe() { return S.espace === EQUIPE_VUE; }
function aLui(p) { return vueEquipe() || respDe(p) === S.espace; }
function visible(p) { return aLui(p) || !respDe(p); }
function entreeVisible(e) { return vueEquipe() || parDe(e) === S.espace; }
function badgeQui(p) {
  const r = respDe(p);
  if (!vueEquipe() && r === S.espace) return '';
  return ` · <span class="qui ${r ? '' : 'libre'}">${esc(r || 'libre')}</span>`;
}
function rendreEspaces() {
  const noms = S.data.equipe.concat(EQUIPE_VUE);
  document.getElementById('espaces').innerHTML = noms.map(n =>
    `<button data-espace="${esc(n)}" class="${n === S.espace ? 'actif' : ''}">${esc(n === S.moi.nom ? n + ' (moi)' : n)}</button>`).join('');
  const m = document.getElementById('moi'); m.textContent = S.moi.nom + ' · changer'; m.classList.remove('cache');
}

// ---------------------------------------------------------------------------
// Rendu
// ---------------------------------------------------------------------------
// Tout ce qu'il faut pour appeler, sans ouvrir la fiche.
function dernierContact(p) {
  const h = historique(p.id).find(e => e.resultat !== 'Ajout');
  if (!h) return p.dernier ? 'Dernier contact ' + dateCourte(p.dernier) : '';
  return dateCourte(h.date) + ' · ' + h.resultat + (h.note ? ' · « ' + h.note + ' »' : '');
}
function carteRiche(p, droite, entree) {
  const m = metierDe(p), tel = lienTel(p.telephone), wa = telInternational(p.telephone);
  const sous = [p.secteur || (m && m.metier), p.commune].filter(Boolean).join(' · ');
  const notes = String(p.notes || '').split(' · ').filter(x => !/^Contacté \?/.test(x)).join(' · ');
  const dernier = entree ? '' : dernierContact(p);
  const lignes = [
    ['Gérant', p.gerant ? esc(p.gerant) : '<span class="faible">inconnu, demander le responsable</span>'],
    ['Tél.', tel ? `<a href="${tel}" data-stop="1">${esc(p.telephone)}</a>` : '<span class="faible">aucun numéro</span>'],
    p.mauvais || p.site ? ['Constat', esc(p.mauvais || '') + (p.site && !/^https?:\/\/(www\.)?facebook/i.test(p.site) ? (p.mauvais ? ' · ' : '') + esc(p.site) : '')] : null,
    entree ? ['Résultat', `<span class="lp-resultat" style="--statut:${statut(entree.statut).color}">${esc(entree.resultat)}</span>${entree.rappel ? ' → ' + esc(dateCourte(entree.rappel)) : ''}`] : null,
    entree && entree.note ? ['Dit', esc(entree.note)] : null,
    dernier ? ['Dernier', esc(dernier)] : null,
    !entree && notes ? ['Notes', esc(notes.length > 160 ? notes.slice(0, 160) + '…' : notes)] : null,
  ].filter(Boolean);
  return `<div class="lp" data-id="${esc(p.id)}" style="--statut:${couleur(p)}">
    <div class="lp-tete"><div><div class="lp-nom">${esc(p.entreprise)}</div><div class="lp-sous">${esc(sous || '—')} · <span class="pastille" style="--statut:${couleur(p)}">${esc(statut(p.statut).label)}</span>${badgeQui(p)}</div></div>
      ${droite || ''}</div>
    <dl class="lp-grille">${lignes.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="lp-actions">
      <a class="appeler ${tel ? '' : 'inactif'}" href="${tel || '#'}" data-stop="1">☎︎ Appeler</a>
      <button data-action="carte-wa" data-id="${esc(p.id)}" class="${wa ? '' : 'inactif'}">WhatsApp</button>
      <button data-action="carte-noter" data-id="${esc(p.id)}">Noter l’appel</button>
    </div></div>`;
}
// Carte du pipeline : étroite, rien ne doit être tronqué d'important.
function carteCompacte(p) {
  const m = metierDe(p), tel = lienTel(p.telephone);
  return `<div class="pc" data-id="${esc(p.id)}" style="--statut:${couleur(p)}">
    <div class="pc-nom">${esc(p.entreprise)}</div>
    <div class="pc-meta">${esc([p.secteur || (m && m.metier), p.commune, p.gerant].filter(Boolean).join(' · ') || '—')}</div>
    ${vueEquipe() ? `<div class="pc-meta"><span class="qui ${respDe(p) ? '' : 'libre'}">${esc(respDe(p) || 'libre')}</span></div>` : ''}
    <div class="pc-bas">${tel ? `<a href="${tel}" data-stop="1">${esc(String(p.telephone).split(/\s*[\/;]\s*|\s+ou\s+/)[0])}</a>` : '<span class="pc-meta">sans tél.</span>'}
      ${p.rappel ? `<span class="pc-date ${p.rappel < maintenant() ? 'retard' : ''}">${cle(p) === 'rdv' ? 'RDV ' : ''}${esc(dateCourte(p.rappel))}</span>` : ''}</div>
  </div>`;
}
function droite(texte, sous, retard) {
  return `<div class="lp-droite ${retard ? 'retard' : ''}">${esc(texte)}${sous ? `<small>${esc(sous)}</small>` : ''}</div>`;
}
function grille(html) { return `<div class="grille-cartes">${html}</div>`; }

function section(titre, info, html) {
  return `<h2 class="section">${titre}${info ? `<small>${info}</small>` : ''}</h2>${html}`;
}

// Le formulaire « Ajouter » survit aux redessins automatiques (toutes les 60 s, et au retour sur
// l'appli après un passage dans une autre) : sans ça, tout ce que Sam avait tapé disparaissait.
const FORMS_GARDES = ['form-ajout', 'form-reel', 'form-audience'];
function garderSaisie() {
  const f = FORMS_GARDES.map(id => document.getElementById(id)).find(Boolean); if (!f) return null;
  const a = document.activeElement, z = document.getElementById('zone-doublons');
  return { form: f.id, valeurs: [...f.elements].filter(e => e.name).map(e => [e.name, e.type === 'checkbox' ? e.checked : e.value]), doublons: z ? z.innerHTML : '',
    focus: a && f.contains(a) ? a.name : '' };
}
function remettreSaisie(s) {
  const f = s && document.getElementById(s.form); if (!f) return;
  s.valeurs.forEach(([n, v]) => { const e = f.elements[n]; if (!e) return; if (e.type === 'checkbox') e.checked = v; else e.value = v; });
  const z = document.getElementById('zone-doublons'); if (z && s.doublons) z.innerHTML = s.doublons;
  if (s.focus && f.elements[s.focus]) f.elements[s.focus].focus({ preventScroll: true });
}

function rendre() {
  if (!S.data) return;
  const saisie = garderSaisie();
  rendreEspaces();
  document.querySelectorAll('#onglets button').forEach(b => b.classList.toggle('actif', b.dataset.vue === S.vue));
  document.body.dataset.vue = S.recherche ? 'recherche' : S.vue;
  const v = document.getElementById('vue');
  if (S.recherche) v.innerHTML = vueRecherche();
  else if (S.vue === 'jour') v.innerHTML = vueJour();
  else if (S.vue === 'pipeline') v.innerHTML = vuePipeline();
  else if (S.vue === 'ajouter') v.innerHTML = vueAjouter();
  else if (S.vue === 'factu') v.innerHTML = Factu.vue();
  else if (S.vue === 'reels') v.innerHTML = vueReels();
  else v.innerHTML = vueStats();
  remettreSaisie(saisie);
}

// ---------------------------------------------------------------------------
// Journée : n'importe quel jour, passé ou à venir
// ---------------------------------------------------------------------------
function jourLong(j) {
  const [a, m, d] = j.split('-').map(Number); const dt = new Date(a, m - 1, d);
  return JOURS_LONG[dt.getDay()] + ' ' + d + ' ' + MOIS[m - 1] + (a !== new Date().getFullYear() ? ' ' + a : '');
}
function decalerJour(j, n) { const [a, m, d] = j.split('-').map(Number); const dt = new Date(a, m - 1, d + n); return fmt(dt).slice(0, 10); }
function barreJour() {
  const auj = aujourdhui(), j = S.jour;
  const ecart = Math.round((new Date(j) - new Date(auj)) / 864e5);
  const rel = ecart === 0 ? 'Aujourd’hui' : ecart === -1 ? 'Hier' : ecart === 1 ? 'Demain' : ecart < 0 ? 'Il y a ' + (-ecart) + ' jours' : 'Dans ' + ecart + ' jours';
  return `<div class="jourbar">
    <button class="fleche" data-action="jour" data-n="-1" aria-label="Jour précédent">‹</button>
    <label class="jour-choix"><b>${esc(jourLong(j))}</b><small>${rel} · changer de date</small>
      <input type="date" id="jour-date" value="${j}" aria-label="Choisir une date"></label>
    <button class="fleche" data-action="jour" data-n="1" aria-label="Jour suivant">›</button>
  </div>
  ${ecart !== 0 ? '<button class="retour-auj" data-action="jour-auj">Revenir à aujourd’hui</button>' : ''}`;
}
// Le journal d'un jour : en mémoire (120 derniers jours), sinon demandé au Sheets.
function journalDe(j) {
  if (S.journeesChargees[j]) return S.journeesChargees[j];
  const limite = S.data.journal.reduce((m, e) => e.date < m ? e.date : m, aujourdhui());
  if (j >= limite.slice(0, 10)) return S.data.journal.filter(e => e.date.startsWith(j) || String(e.rappel).startsWith(j));
  appel('api_journee', S.pin, j).then(r => { S.journeesChargees[j] = r; if (S.vue === 'jour' && S.jour === j) rendre(); })
    .catch(e => toast(e.message || String(e), true));
  return null;
}
function bilanJour(entrees) {
  const appels = RES_APPEL();
  const faits = entrees.filter(e => appels.includes(e.resultat));
  const n = f => faits.filter(f).length;
  return `<div class="bilan"><div><b>${faits.length}</b><span>appels</span></div>
    <div><b>${n(e => e.resultat !== 'Pas de réponse')}</b><span>décrochés</span></div>
    <div><b>${n(e => e.resultat === 'Lien envoyé')}</b><span>liens</span></div>
    <div><b>${n(e => e.resultat === 'RDV obtenu')}</b><span>RDV</span></div></div>`;
}
// Les appels passés un jour donné, dans l'ordre de la journée.
function sectionAppelsDuJour(j, entrees) {
  const faits = entrees.filter(e => e.date.startsWith(j) && e.id && e.resultat !== 'Import' && entreeVisible(e))
    .sort((a, b) => a.date.localeCompare(b.date));
  const cartes = faits.map(e => {
    const p = trouver(e.id) || { id: e.id, entreprise: e.entreprise, statut: e.statut };
    return carteRiche(p, droite(heure(e.date)), e);
  });
  return section('Appels passés', faits.length ? faits.length + ' contacts' : '',
    faits.length ? grille(cartes.join('')) : '<div class="vide">Aucun contact enregistré ce jour-là.</div>');
}

function vueJour() {
  if (!S.jour) S.jour = aujourdhui();
  const j = S.jour, auj = aujourdhui();
  if (j !== auj) return barreJour() + (j < auj ? vueJourPasse(j) : vueJourAVenir(j));
  const entrees = journalDe(j) || [];
  return barreJour() + bilanJour(entrees.filter(e => e.date.startsWith(j) && entreeVisible(e))) + vueAujourdhui() + sectionAppelsDuJour(j, entrees);
}

function vueJourPasse(j) {
  const entrees = journalDe(j);
  if (!entrees) return '<div class="chargement">Lecture du journal de ce jour-là…</div>';
  const duJour = entrees.filter(e => e.date.startsWith(j));
  // Ce qui était prévu pour ce jour-là (rappels et RDV posés avant), dans cet espace.
  // « Fait » compte l'appel de n'importe qui : un rappel repris par l'autre est fait.
  const prevus = entrees.filter(e => String(e.rappel).startsWith(j) && !e.date.startsWith(j)
    && (trouver(e.id) ? aLui(trouver(e.id)) : entreeVisible(e)));
  const vus = new Set();
  const cartesPrevus = prevus.sort((a, b) => a.rappel.localeCompare(b.rappel)).filter(e => !vus.has(e.id) && vus.add(e.id)).map(e => {
    const p = trouver(e.id) || { id: e.id, entreprise: e.entreprise, statut: e.statut };
    const fait = duJour.some(x => x.id === e.id);
    return carteRiche(p, droite(heure(e.rappel), fait ? 'fait' : 'pas rappelé', !fait));
  });
  return bilanJour(duJour.filter(entreeVisible)) + sectionAppelsDuJour(j, entrees)
    + (cartesPrevus.length ? section('Ce qui était prévu', cartesPrevus.length + ' rappels ou RDV', grille(cartesPrevus.join(''))) : '');
}

function vueJourAVenir(j) {
  const prevus = S.data.prospects.filter(p => String(p.rappel).startsWith(j) && !['perdu', 'signe'].includes(cle(p)) && aLui(p))
    .sort((a, b) => a.rappel.localeCompare(b.rappel));
  return section('Rappels et RDV prévus', prevus.length ? prevus.length + ' prévus' : '',
    prevus.length ? grille(prevus.map(p => carteRiche(p, droite((cle(p) === 'rdv' ? 'RDV ' : '') + heure(p.rappel)))).join(''))
      : '<div class="vide">Rien de prévu ce jour-là pour l’instant. Les rappels posés depuis la fiche d’un prospect apparaîtront ici.</div>');
}

function vueAujourdhui() {
  const now = maintenant(), jour = aujourdhui();
  // Son espace : ses prospects, plus les « À appeler » libres (après les siens).
  const actifs = S.data.prospects.filter(p => !['perdu', 'signe'].includes(cle(p)) && visible(p));
  const avecRappel = actifs.filter(p => p.rappel);
  const retard = avecRappel.filter(p => p.rappel < now).sort((a, b) => a.rappel.localeCompare(b.rappel));
  const duJour = avecRappel.filter(p => p.rappel.slice(0, 10) === jour && p.rappel >= now).sort((a, b) => a.rappel.localeCompare(b.rappel));
  const aDater = actifs.filter(p => cle(p) === 'rappel' && !p.rappel);
  const froids = actifs.filter(p => ['a_appeler', 'sans_reponse'].includes(cle(p)) && !p.rappel && !String(p.dernier).startsWith(jour) && p.telephone);
  const libre = p => respDe(p) ? 0 : 1;
  const ordre = (a, b) => (vueEquipe() ? 0 : libre(a) - libre(b)) || (cle(a) === 'a_appeler' ? 0 : 1) - (cle(b) === 'a_appeler' ? 0 : 1) || String(a.dernier).localeCompare(String(b.dernier)) || a.id.localeCompare(b.id);
  const maintenantOk = froids.filter(p => dansCreneau(p)).sort(ordre);
  const plusTard = froids.filter(p => !dansCreneau(p) && prochainCreneau(p)).sort((a, b) => prochainCreneau(a).localeCompare(prochainCreneau(b)) || ordre(a, b));
  const il2j = new Date(); il2j.setDate(il2j.getDate() - 2);
  const relances = actifs.filter(p => cle(p) === 'lien' && !p.rappel && String(p.dernier || '') < fmt(il2j))
    .sort((a, b) => String(a.dernier).localeCompare(String(b.dernier)));
  const rdvOuRappel = p => (cle(p) === 'rdv' ? 'RDV ' : '') + dateCourte(p.rappel);

  let h = '';
  if (retard.length) h += section('En retard', retard.length + ' à replacer', grille(retard.map(p => carteRiche(p, droite(rdvOuRappel(p), 'en retard', true))).join('')));
  h += section('Rappels et RDV du jour', duJour.length ? duJour.length + ' prévus' : '',
    duJour.length ? grille(duJour.map(p => carteRiche(p, droite((cle(p) === 'rdv' ? 'RDV ' : '') + heure(p.rappel)))).join(''))
      : '<div class="vide">Aucun rappel prévu pour le reste de la journée.</div>');
  if (aDater.length) h += section('Rappels sans date', 'à dater', grille(aDater.map(p => carteRiche(p, droite('à dater'))).join('')));
  h += section('À appeler maintenant', maintenantOk.length + ' dans leur créneau',
    maintenantOk.length ? grille(maintenantOk.slice(0, S.plusJour).map(p => carteRiche(p, cle(p) === 'sans_reponse' ? droite(p.nb + '×', 'sans réponse') : '')).join(''))
      + (maintenantOk.length > S.plusJour ? '<button class="plus" data-action="plus">Afficher plus</button>' : '')
      : '<div class="vide">Personne dans son créneau d’appel à cette heure. Regarde « Plus tard ».</div>');
  if (relances.length) h += section('Liens envoyés à relancer', relances.length + ' sans relance prévue',
    grille(relances.map(p => carteRiche(p, droite('à relancer', p.dernier ? 'lien ' + dateCourte(p.dernier) : ''))).join('')));
  if (plusTard.length) h += section('Plus tard aujourd’hui', plusTard.length + ' prospects',
    grille(plusTard.slice(0, 15).map(p => carteRiche(p, droite('à ' + prochainCreneau(p).replace(':', ' h ')))).join('')));
  return h;
}

// Reels : partager un Reel du compte NSD en message privé, par lots (13/10/2026)
// ---------------------------------------------------------------------------
// L'appli choisit les commerces et prépare le texte ; l'envoi se fait à la main dans
// Instagram. Un lot par jour (S.data.partage.lotParJour) pour ne pas faire bloquer le
// compte, et jamais deux Reels au même commerce à moins de joursEntreDeux jours.
const MESSAGE_REEL_DEFAUT = 'Bonjour\n\n'
  + 'C’est {prenom} de NS Development, on crée des sites internet pour les commerces du Luxembourg.\n\n'
  + 'On vient de publier cette vidéo et on a tout de suite pensé à {entreprise}\n\n'
  + '{lien}\n\n'
  + 'Si ça vous parle, on vous montre en cinq minutes ce que ça donnerait pour vous. Sinon aucun souci, bonne continuation';
function pseudoInsta(s) {
  s = String(s || '').trim(); if (!s) return '';
  const m = s.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  if (m) return ['reel', 'reels', 'p', 'stories', 'explore'].includes(m[1].toLowerCase()) ? '' : m[1].toLowerCase();
  if (/[\/:]/.test(s)) return '';
  const nu = s.replace(/^@/, '');
  return /^[A-Za-z0-9._]{2,30}$/.test(nu) ? nu.toLowerCase() : '';
}
function reelsTries() { return (S.data.reels || []).slice().sort((a, b) => b.date.localeCompare(a.date)); }
function reelChoisi() { const r = reelsTries(); return r.find(x => x.id === S.reel) || r[0] || null; }
function metiersDuReel(r) { return String(r.metiers || '').split(',').map(x => x.trim()).filter(Boolean); }
// Tout le monde qui peut recevoir un Reel : les prospects du CRM qui ont un Instagram
// (ceux en cours d'abord, jamais Perdu ni Client signé), puis l'audience repérée à part.
const ORDRE_CHAUD = { negociation: 0, rdv: 1, lien: 2, rappel: 3, sans_reponse: 4, a_appeler: 5, perdu: 6 };
// Un Perdu reçoit les Reels s'il n'a jamais dit non : passé en Perdu par « Pas de réponse »
// (décision de Nelson du 13/10/2026). Dans l'onglet Audience, Tom ne lie que des Perdu sans
// réponse ; un Perdu lié qui a refusé depuis (« Pas intéressé ») sort quand même.
function aRefuse(p) {
  if (cle(p) !== 'perdu') return false;
  const h = historique(p.id).find(e => e.statut === 'Perdu' && RES_APPEL().includes(e.resultat));
  return !h || h.resultat !== S.data.resultats.pas_repondu.label;
}
function refusAuJournal(p) {
  const h = historique(p.id).find(e => e.statut === 'Perdu' && RES_APPEL().includes(e.resultat));
  return cle(p) === 'perdu' && !!h && h.resultat !== S.data.resultats.pas_repondu.label;
}
function audienceReels() {
  const vus = new Set(), liste = [];
  S.data.prospects.filter(p => cle(p) !== 'signe' && !aRefuse(p) && pseudoInsta(p.instagram))
    .sort((a, b) => (ORDRE_CHAUD[cle(a)] ?? 9) - (ORDRE_CHAUD[cle(b)] ?? 9))
    .forEach(p => { const ps = pseudoInsta(p.instagram); if (vus.has(ps)) return; vus.add(ps);
      const m = metierDe(p); liste.push({ cible: p.id, entreprise: p.entreprise, metier: m ? m.metier : '', commune: p.commune, pseudo: ps, prospect: p }); });
  (S.data.audience || []).forEach(a => { const ps = pseudoInsta(a.instagram); if (!ps || vus.has(ps)) return; vus.add(ps);
    const lie = a.prospect && trouver(a.prospect);
    if (lie && (cle(lie) === 'signe' || refusAuJournal(lie))) return;
    const m = metierDe(a._p || (a._p = { secteur: a.metier, entreprise: a.entreprise }));
    liste.push({ cible: a.id, entreprise: a.entreprise, metier: m ? m.metier : a.metier, commune: a.commune, pseudo: ps, prospect: lie || null }); });
  return liste;
}
function partagesDe(pseudo) { return (S.data.partages || []).filter(x => pseudoInsta(x.instagram) === pseudo); }
function envoyesAujourdhui() { return (S.data.partages || []).filter(x => x.resultat === 'Envoyé' && x.date.slice(0, 10) === aujourdhui()).length; }
function candidatsReel(r) {
  const vises = metiersDuReel(r), jours = S.data.partage.joursEntreDeux;
  const limite = fmt(new Date(Date.now() - jours * 864e5));
  return audienceReels().filter(c => {
    if (vises.length && !vises.includes(c.metier)) return false;
    const h = partagesDe(c.pseudo);
    if (h.some(x => x.reel === r.id || x.resultat === 'Introuvable')) return false;
    return !h.some(x => x.resultat === 'Envoyé' && x.date >= limite);
  });
}

async function copierTexte(t) {

  const pipe = S.data.prospects.filter(aLui);

  const jours = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = fmt(d).slice(0, 10); jours.push({ k, d, n: J.filter(e => e.date.startsWith(k) && estAppel(e)).length }); }
  const max = Math.max(1, ...jours.map(j => j.n));

  return section('Aujourd’hui', '', `<div class="grille">
      <div class="kpi"><div class="v">${compte(jour, estAppel)}</div><div class="l">appels</div></div>
      <div class="kpi"><div class="v">${compte(jour, rdv)}</div><div class="l">RDV obtenus</div></div></div>`)
    + section('Cette semaine', 'depuis lundi', `<div class="grille">
      <div class="kpi"><div class="v">${compte(debutSem, estAppel)}</div><div class="l">appels</div></div>
      <div class="kpi"><div class="v">${compte(debutSem, decroche)}</div><div class="l">décrochés</div></div>
      <div class="kpi"><div class="v">${compte(debutSem, e => e.resultat === 'Lien envoyé')}</div><div class="l">liens envoyés</div></div>
      <div class="kpi"><div class="v">${compte(debutSem, rdv)}</div><div class="l">RDV obtenus</div></div></div>`)
    + section('Appels par jour', '14 derniers jours', `<div class="barres">${jours.map(j =>
      `<div class="barre-j" style="height:${Math.round(j.n / max * 100)}%"><em>${j.n || ''}</em><span>${j.d.getDate()}</span></div>`).join('')}</div>`)
    + section('Sur 30 jours', '', `<table class="recap">
      <tr><td>Appels passés</td><td>${a30}</td></tr>
      <tr><td>Taux de décroché</td><td>${a30 ? Math.round(dec30 / a30 * 100) + ' %' : '—'}</td></tr>
      <tr><td>Appels pour un RDV</td><td>${r30 ? Math.round(a30 / r30) : '—'}</td></tr></table>`)
    + (vueEquipe() ? section('Par personne', 'cette semaine', `<table class="recap">
      <tr><td></td><td>Appels</td><td>Décrochés</td><td>RDV</td></tr>
      ${S.data.equipe.map(n => { const c = f => compte(debutSem, e => parDe(e) === n && f(e));
        return `<tr><td>${esc(n)}</td><td>${c(estAppel)}</td><td>${c(decroche)}</td><td>${c(rdv)}</td></tr>`; }).join('')}</table>`) : '')
    + section('Pipeline', pipe.length + ' prospects', `<table class="recap">${S.data.statuts.map(s =>
      `<tr><td><span class="pastille" style="--statut:${s.color}">${esc(s.label)}</span></td><td>${pipe.filter(p => cle(p) === s.k).length}</td></tr>`).join('')}</table>`)
    + `<p style="margin-top:18px"><a class="btn clair large" href="${esc(S.data.lienSheets)}" target="_blank">Ouvrir le Google Sheets</a></p>`;
}

// Cinq boutons (décision du 24/09/2026), plus « En cours » pour une négociation
// ouverte (Nelson, 28/09/2026). « Rappel » regroupe trois motifs, qui restent
// distincts dans le Journal : c'est ce qui garde le suivi des appels.
const BOUTONS_RES = [['rappel', 'Rappel'], ['lien'], ['rdv'], ['negociation'], ['refus'], ['note']];
const MOTIFS_RAPPEL = [['pas_repondu', 'Pas de réponse'], ['absent', 'Gérant absent'], ['rappel', 'Convenu avec lui']];
const boutonDe = res => MOTIFS_RAPPEL.some(([k]) => k === res) ? 'rappel' : res;
// Plages d'appel par personne (règles de Nelson du 28/09/2026, tournages déplacés le 14/10/2026).
// Sam : mar, mer, ven 10 h-12 h et 14 h-18 h ; lun, jeu et sam 10 h-12 h (lundi et jeudi après-midi : tournage) ;
// dim 14 h-17 h. Nelson : 9 h-12 h et 13 h 30-20 h, sauf le lundi et le jeudi 9 h-12 h (tournage).
// Trou : Sam 15 h 55-16 h 05 (post Instagram). Vue Équipe : les plages de Sam.
const MATIN_SAM = [['10:00', '12:00']], SEMAINE_SAM = [['10:00', '12:00'], ['14:00', '18:00']];
const JOUR_NELSON = [['09:00', '12:00'], ['13:30', '20:00']], MATIN_NELSON = [['09:00', '12:00']];
const PLAGES = {
  Sam: { 0: [['14:00', '17:00']], 1: MATIN_SAM, 2: SEMAINE_SAM, 3: SEMAINE_SAM, 4: MATIN_SAM, 5: SEMAINE_SAM, 6: MATIN_SAM },
  Nelson: { 0: JOUR_NELSON, 1: MATIN_NELSON, 2: JOUR_NELSON, 3: JOUR_NELSON, 4: MATIN_NELSON, 5: JOUR_NELSON, 6: JOUR_NELSON }
};
const TROUS = { Sam: [['15:55', '16:05']], Nelson: [] };
const hmDe = d => fmt(d).slice(11, 16);
function regler(d, hm) { const [h, m] = hm.split(':').map(Number); d.setHours(h, m, 0, 0); }
// Le premier moment d'appel à partir de d : dans une plage du jour, hors des trous
// de celui qui est connecté. Hors plage : le jour suivant, à la même heure. Une
// heure qui n'est dans aucune plage (après la fin) : l'ouverture du jour même.
function recalerAppel(d) {
  const depart = new Date(d), voulu = hmDe(d);
  const qui = S.moi && PLAGES[S.moi.nom] ? S.moi.nom : 'Sam';
  const caler = x => PLAGES[qui][x.getDay()].some(([debut, fin]) => {
    if (hmDe(x) < debut) regler(x, debut);
    TROUS[qui].forEach(([a, b]) => { if (hmDe(x) >= a && hmDe(x) < b) regler(x, b); });
    return hmDe(x) < fin;
  });
  for (let i = 0; i < 7; i++) {
    if (caler(d)) return d;
    d.setDate(d.getDate() + 1); regler(d, voulu);
  }
  regler(depart, '00:00'); caler(depart);
  return depart;
}
// Le prochain jour d'appel, à la même heure (à 5 min près), recalé dans ses plages.
function demainMemeHeure() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  d.setMinutes(Math.round(d.getMinutes() / 5) * 5, 0, 0);
  return fmt(recalerAppel(d));
}

function optionsDates() {
  const o = [], now = new Date();
  const dans = h => { const d = new Date(now.getTime() + h * 36e5); d.setMinutes(d.getMinutes() < 30 ? 30 : 60, 0, 0); return d; };
  const a = (jPlus, h, m) => { const d = new Date(now); d.setDate(d.getDate() + jPlus); d.setHours(h, m || 0, 0, 0); return d; };
  o.push(['Prochain jour, même heure', null]);
  o.push(['Dans 1 h', dans(1)], ['Dans 2 h', dans(2)]);
  if (now.getHours() < 15) o.push(S.moi && S.moi.nom === 'Sam' ? ['Auj. 16 h 10', a(0, 16, 10)] : ['Auj. 16 h', a(0, 16)]);
  o.push(['Demain 10 h', a(1, 10)]);
  // Sam : « Demain 14 h », seulement si demain a une plage à 14 h (donc jamais quand demain est un lundi, un jeudi ou un samedi).
  if (S.moi && S.moi.nom === 'Sam') { const d = a(1, 14); if (fmt(recalerAppel(new Date(d))) === fmt(d)) o.push(['Demain 14 h', d]); }
  else o.push(['Demain 15 h', a(1, 15)]);
  const lundi = a(((8 - now.getDay()) % 7) || 7, 10); o.push(['Lundi 10 h', lundi]);
  return o.map(([l, d]) => [l, d ? fmt(d) : demainMemeHeure()]);
}
// Les deux derniers appels (hors notes et messages) sont des « Pas de réponse ».
function troisiemeSansReponse(p) {
  if (!p || !['a_appeler', 'rappel', 'sans_reponse'].includes(cle(p))) return false;
  const appels = historique(p.id).filter(e => RES_APPEL().includes(e.resultat)).slice(0, 2);
  return appels.length === 2 && appels.every(e => e.resultat === 'Pas de réponse');
}
function zoneResultat() {
  const def = S.data.resultats[CHOIX.res]; if (!def) return '';
  const avecDate = CHOIX.res !== 'refus' && CHOIX.res !== 'signe' && CHOIX.res !== 'note';
  const motif = boutonDe(CHOIX.res) === 'rappel';
  const p = trouver(S.ouvert);
  // Un RDV qui ne décroche pas garde sa date : pas de rappel à choisir.
  const garderRdv = p && cle(p) === 'rdv' && (CHOIX.res === 'pas_repondu' || CHOIX.res === 'absent');
  const titreDate = CHOIX.res === 'rdv' ? 'Date du rendez-vous' : CHOIX.res === 'lien' ? 'Relancer le… (facultatif)'
    : CHOIX.res === 'negociation' ? 'Prochain point le… (facultatif)' : 'Rappeler le…';
  return `${motif ? `<div style="margin-top:14px;font-size:13px;color:var(--doux)">Pourquoi ?</div>
    <div class="dates">${MOTIFS_RAPPEL.map(([k, l]) => `<button data-motif="${k}" class="${CHOIX.res === k ? 'choisi' : ''}">${l}</button>`).join('')}</div>` : ''}
    ${garderRdv ? '<div class="sous" style="margin-top:10px">Le RDV reste à sa date, l’appel est noté dans l’historique.</div>' : ''}
    ${CHOIX.res === 'pas_repondu' && troisiemeSansReponse(p) ? '<div class="sous" style="margin-top:10px;color:var(--danger)"><b>3e appel sans réponse : il passera en Perdu.</b></div>' : ''}
    ${avecDate && !garderRdv ? `<div style="margin-top:14px;font-size:13px;color:var(--doux)">${titreDate}${def.rappelObligatoire ? ' *' : ''}</div>
    <div class="dates">${optionsDates().map(([l, v]) => `<button data-date="${v}" class="${CHOIX.rappel === v ? 'choisi' : ''}">${l}</button>`).join('')}</div>
    <label class="champ">Ou une date précise<input type="datetime-local" id="date-precise" value="${CHOIX.rappel ? CHOIX.rappel.replace(' ', 'T') : ''}"></label>` : ''}
    ${CHOIX.res === 'rdv' ? `<div style="font-size:13px;color:var(--doux)">Durée dans l’agenda</div>
    <div class="dates">${(S.data.rdvDurees || [30, 60, 90]).map(m => `<button data-duree="${m}" class="${CHOIX.duree === m ? 'choisi' : ''}">${m < 60 ? m + ' min' : (m / 60 + ' h').replace('.5 h', ' h 30')}</button>`).join('')}</div>` : ''}
    <label class="champ">${CHOIX.res === 'note' ? 'Note' : 'Ce qui s’est dit (facultatif)'}<textarea id="note-res" placeholder="Nom de la personne, objection, heure qui l’arrange…"></textarea></label>
    ${motif && CHOIX.res !== 'rappel' ? '<div class="sous" style="margin-top:6px">Un texte au client ? Choisis « Convenu avec lui ».</div>' : ''}
    <button class="btn large" data-action="enregistrer">Enregistrer « ${esc(motif ? 'Rappel · ' + def.label.replace('Rappel convenu', 'convenu') : def.label)} »${modeleApres(CHOIX.res, p) ? ' sans message' : ''}</button>`;
}

// Rappel convenu, RDV obtenu, Lien envoyé : le texte au client s'écrit en haut
// de la fiche, sous WhatsApp, dès le bouton touché, et suit la date choisie.
// WhatsApp (ou SMS, Mail) enregistre le résultat et ouvre le message tout prêt.
function rendreMessageHaut() {
  const el = document.getElementById('msg-haut'); if (!el) return;
  const p = trouver(S.ouvert), modele = modeleApres(CHOIX.res, p);
  document.querySelectorAll('.actions [data-action="msg"]').forEach(b => b.classList.toggle('pret', !!modele && !b.classList.contains('inactif')));
  if (!modele) { APRES.modele = null; el.innerHTML = ''; return; }
  const ancien = document.getElementById('bloc-msg'); if (ancien) ancien.remove();
  const m = metierDe(p), garde = APRES.modele && APRES.id === p.id;
  APRES.id = p.id; APRES.modele = modele;
  APRES.v = { nom: garde ? APRES.v.nom : nomCourt(p.gerant), date: dateChoisie(),
    lien: garde ? APRES.v.lien : (m ? m.lien : ''), attendue: CHOIX.res !== 'lien' };
  APRES.genere = remplir(modele.texte, p, APRES.v);
  el.innerHTML = `<div class="tete"><b>Message « ${esc(modele.titre)} »</b><input id="apres-nom" value="${esc(APRES.v.nom)}" placeholder="Nom (vide : « Bonjour, »)" aria-label="Nom de la personne"></div>
    <textarea id="msg-texte" aria-label="Message">${esc(APRES.genere)}</textarea>`;
}
function dateChoisie() {
  const precise = document.getElementById('date-precise');
  return (precise && precise.value ? precise.value.replace('T', ' ') : CHOIX.rappel) || '';
}
function modeleApres(res, p) {
  if (!p || !(telInternational(p.telephone) || p.email)) return null;
  const msgs = S.data.messages || [];
  // Nelson prospecte par WhatsApp sans appel : un premier « Lien envoyé » part
  // avec le modèle « Premier contact », pas avec le « suite à notre appel » de Sam.
  if (res === 'lien' && S.moi && S.moi.nom === 'Nelson' && !(+p.nb)) {
    const premier = msgs.find(m => /premier contact/i.test(m.titre) && m.canal.toLowerCase().trim() === 'whatsapp');
    if (premier) return premier;
  }
  // Lien resté sans réponse : « Rappel » puis WhatsApp envoie la relance et décale la date en un geste.
  if ((res === 'pas_repondu' || res === 'absent') && cle(p) === 'lien' && +p.nb) {
    const relance = msgs.find(m => /relance/i.test(m.titre) && m.canal.toLowerCase().trim() === 'whatsapp');
    if (relance) return relance;
  }
  return msgs.find(m => m.apres === res) || null;
}

function formEdition(p) {
  const f = (k, l, type) => `<label class="champ">${l}<input name="${k}" type="${type || 'text'}" value="${esc(p[k] || '')}"></label>`;
  return `<form class="bloc" id="form-edit"><h3>Modifier la fiche</h3>
    ${f('entreprise', 'Entreprise')}${f('secteur', 'Secteur')}${f('commune', 'Commune')}${f('telephone', 'Téléphone', 'tel')}
    ${f('gerant', 'Nom du gérant')}${f('email', 'Email', 'email')}${f('site', 'Site web')}${f('instagram', 'Instagram')}
    ${f('mauvais', 'Mauvais points')}${f('rcs', 'N° RCS')}
    <label class="champ">Prochain rappel<input name="rappel" type="datetime-local" value="${esc((p.rappel || '').replace(' ', 'T'))}"></label>
    <label class="champ">Responsable<select name="responsable">${optionsResponsable(respDe(p))}</select></label>
    <label class="champ">Statut<select name="statut">${S.data.statuts.filter(s => s.k !== 'sans_reponse' || s.k === cle(p)).map(s => `<option value="${s.k}" ${s.k === cle(p) ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}</select></label>
    <label class="champ">Notes<textarea name="notes">${esc(p.notes || '')}</textarea></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn clair" data-action="annuler-edit">Annuler</button>
    <button class="btn" type="submit">Enregistrer</button></div></form>`;
}

// --- Messages -------------------------------------------------------------
// v : ce que Sam a ajusté avant l'envoi ({nom}, {date}, {lien}). Sans v, le
// gérant, le prochain rappel et la démo de son métier.
function remplir(txt, p, v) {
  const m = metierDe(p);
  v = v || {};
  const nom = v.nom !== undefined ? v.nom : nomCourt(p.gerant);
  const date = v.date !== undefined ? v.date : p.rappel;
  const lien = v.lien !== undefined ? v.lien : (m ? m.lien : '');
  let t = String(txt);
  // Pas de date : la phrase qui l'annonce disparaît (un lien sans relance prévue).
  if (!date && v.attendue) t = t.replace(/{date}/g, '[date à choisir]');
  else if (!date) t = t.split('\n').filter(l => !/{date}/.test(l)).join('\n').replace(/\n{3,}/g, '\n\n');
  return t
    .replace(/ ?{nom}/g, nom ? ' ' + nom : '')
    .replace(/{date}/g, date ? dateMessage(date) : '')
    .replace(/{bonjour}/g, 'Bonjour')
    .replace(/{gerant}/g, p.gerant || '')
    .replace(/{entreprise}/g, p.entreprise || '')
    .replace(/{constat}/g, p.mauvais || '[constat à écrire]')
    .replace(/{metier}/g, m ? m.metier.toLowerCase() : 'votre métier')
    .replace(/{lien}/g, lien)
    .replace(/{rdv}/g, p.rappel ? dateLongue(p.rappel) : '[date du RDV]')
    .replace(/{envoi}/g, dateEnvoi(p.dernier))
    .replace(/\bSamir\b/g, signataire().prenom)
    .replace(/{signature}/g, signataire().texte);
}
// {envoi} : le jour du dernier message, « le 29 septembre », pour la relance.
function dateEnvoi(s) {
  const d = s ? new Date(String(s).replace(' ', 'T')) : null;
  return d && !isNaN(d) ? 'le ' + (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + MOIS[d.getMonth()] : 'il y a quelques jours';
}
// « Jean-Marc DUPONT » → « Jean-Marc Dupont ». Sam le change en « Monsieur Dupont » s'il veut.
function nomCourt(g) {
  return String(g || '').split(/[\/;,]| et /)[0].trim().toLowerCase()
    .replace(/(^|[\s'’-])(\p{L})/gu, (x, a, b) => a + b.toUpperCase());
}
// « aujourd'hui à 16 h », « demain à 10 h 30 », « lundi 29 septembre à 10 h ».
function dateMessage(s) {
  const d = versDate(s); if (!d) return '';
  const j = s.slice(0, 10), h = heure(s).replace(/h(\d)/, 'h $1');
  if (j === aujourdhui()) return 'aujourd’hui à ' + h;
  const demain = new Date(); demain.setDate(demain.getDate() + 1);
  if (j === fmt(demain).slice(0, 10)) return 'demain à ' + h;
  return JOURS_LONG[d.getDay()] + ' ' + (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + MOIS[d.getMonth()] + ' à ' + h;
}

};

function ouvrirMessages(canal) {
  const p = trouver(S.ouvert);

  // Lien déjà parti, resté sans réponse : la relance vient en tête, pas le « suite à notre appel ».
  if (cle(p) === 'lien' && +p.nb) modeles.sort((a, b) => /relance/i.test(b.titre) - /relance/i.test(a.titre));
  // Prospect jamais contacté, Nelson connecté : le « Premier contact » vient en tête.
  else if (S.moi && S.moi.nom === 'Nelson' && !(+p.nb)) modeles.sort((a, b) => /premier contact/i.test(b.titre) - /premier contact/i.test(a.titre));
  const zone = document.createElement('div');
  zone.className = 'bloc'; zone.id = 'bloc-msg';
  zone.innerHTML = `<h3>${canal === 'mail' ? 'Mail' : canal === 'sms' ? 'SMS' : 'WhatsApp'} à ${esc(p.entreprise)}</h3>
    ${modeles.length ? `<label class="champ">Modèle<select id="msg-modele">${modeles.map((m, i) => `<option value="${i}">${esc(m.titre)}</option>`).join('')}</select></label>` : ''}
    ${canal === 'mail' ? `<label class="champ">Objet<input id="msg-sujet"></label>` : ''}
    <label class="champ">Message<textarea id="msg-texte" style="min-height:180px"></textarea></label>
    <button class="btn large" data-action="envoyer" data-canal="${canal}">Ouvrir ${canal === 'mail' ? 'le mail' : canal === 'sms' ? 'le SMS' : 'WhatsApp'}</button>`;
  const ancien = document.getElementById('bloc-msg'); if (ancien) ancien.remove();
  document.querySelector('.feuille-tete').after(zone);
  const appliquer = () => {

function envoyer(canal) {
  const p = trouver(S.ouvert);

  else if (canal === 'sms') url = 'sms:+' + telInternational(p.telephone) + '?&body=' + encodeURIComponent(txt);
  else url = 'mailto:' + encodeURIComponent(p.email) + '?subject=' + encodeURIComponent(document.getElementById('msg-sujet').value) + '&body=' + encodeURIComponent(txt);
  window.open(url, '_blank');

// --- Message d'après-appel ------------------------------------------------
// Rappel convenu, RDV obtenu, Lien envoyé : chacun son texte (onglet Messages,
// colonne APRÈS). Sam ajuste le nom et l'heure, le texte suit.
const APRES = { modele: null, v: null, genere: '', id: '' };

// Nom, date ou lien changé : on remplace dans le texte, sans perdre ce que Sam a retouché à la main.
function majMessageApres() {
  const p = trouver(S.ouvert), zone = document.getElementById('msg-texte');
  const lienEl = document.getElementById('apres-lien');
  const v = { nom: document.getElementById('apres-nom').value.trim(),
    date: dateChoisie(),
    lien: lienEl ? lienEl.value.trim() : APRES.v.lien, attendue: APRES.v.attendue };
  if (!zone) return;
  const neuf = remplir(APRES.modele.texte, p, v);
  if (zone.value === APRES.genere) zone.value = neuf;
  else {
    let t = zone.value;
    if (APRES.v.nom !== v.nom) t = t.replace('Bonjour' + (APRES.v.nom ? ' ' + APRES.v.nom : '') + ',', 'Bonjour' + (v.nom ? ' ' + v.nom : '') + ',');
    if (APRES.v.date !== v.date) {
      const avant = APRES.v.date ? dateMessage(APRES.v.date) : (APRES.v.attendue ? '[date à choisir]' : '');
      if (avant && v.date) t = t.split(avant).join(dateMessage(v.date));
      else if (!avant || !v.date) t = neuf; // la phrase de relance apparaît ou disparaît : on repart du modèle
    }
    if (APRES.v.lien && APRES.v.lien !== v.lien) t = t.split(APRES.v.lien).join(v.lien);
    zone.value = t;
  }
  APRES.v = v; APRES.genere = neuf;
}

function urlMessage(canal, p, txt, titre) {
  if (canal === 'whatsapp') return 'https://wa.me/' + telInternational(p.telephone) + '?text=' + encodeURIComponent(txt);
  if (canal === 'sms') return 'sms:+' + telInternational(p.telephone) + '?&body=' + encodeURIComponent(txt);
  // Un mail porte toujours la signature complète de celui qui l'envoie, à la place du « Prénom, NS Development ».
  const corps = txt.replace(new RegExp('\\n*' + signataire().prenom + ', NS Development\\s*$'), '') + '\n\n' + signataire().texte;
  return 'mailto:' + encodeURIComponent(p.email) + '?subject=' + encodeURIComponent(p.entreprise + ' : ' + titre.toLowerCase()) + '&body=' + encodeURIComponent(corps);
}

// WhatsApp touché avec un message prêt : on ouvre tout de suite (sinon le
// téléphone bloque l'ouverture), puis le résultat s'enregistre avec la trace du message.
function envoyerDirect(canal) {
  const res = CHOIX.res, def = S.data.resultats[res], p = trouver(S.ouvert);
  const txt = document.getElementById('msg-texte').value;
  if ((def.rappelObligatoire && !dateChoisie()) || txt.includes('[date à choisir]')) {
    toast('Choisis d’abord la date, elle s’écrit dans le message.', true);
    const z = document.getElementById('zone-res'); if (z) z.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  window.open(urlMessage(canal, p, txt, APRES.modele.titre), '_blank');
  enregistrer(document.querySelector('[data-action="enregistrer"]'), (canal === 'sms' ? 'SMS' : canal === 'mail' ? 'Mail' : 'WhatsApp') + ' envoyé : ' + APRES.modele.titre);
}

async function enregistrer(btn, message) {
  const res = CHOIX.res, def = S.data.resultats[res];
  const precise = document.getElementById('date-precise');
  const rappel = (precise && precise.value ? precise.value.replace('T', ' ') : CHOIX.rappel) || '';
  const pr = trouver(S.ouvert);
  const garderRdv = pr && cle(pr) === 'rdv' && (res === 'pas_repondu' || res === 'absent');
  if (def.rappelObligatoire && !rappel && !garderRdv) return toast('Choisis une date.', true);
  const note = [(document.getElementById('note-res') || {}).value || '', message || ''].filter(Boolean).join(' · ');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const p = await appel('api_logger', S.pin, S.ouvert, res, note, rappel, S.par, res === 'rdv' ? CHOIX.duree : null);
    // majLocale efface les champs _ : on les lit avant.
    const perdu = p._perdu, agenda = p._agenda || '';
    majLocale(p, { resultat: def.label, note: perdu ? [note, '3e appel sans réponse : passé en Perdu'].filter(Boolean).join(' · ') : note, rappel: perdu ? '' : rappel });
    toast(perdu ? '3e appel sans réponse : passé en Perdu.' : '« ' + def.label + ' » enregistré.' + (agenda ? ' ' + agenda + '.' : ''), /NON/.test(agenda));
    rendre();
    fermerFiche();
  } catch (e) { btn.disabled = false; btn.textContent = 'Réessayer'; toast(e.message || String(e), true); }
}

function majLocale(p, entree) {
  delete p._ligne; delete p._agenda; delete p._perdu;
  const i = S.data.prospects.findIndex(x => x.id === p.id);
  const ancien = S.data.prospects[i] || {};
  const neuf = Object.assign({}, ancien, p); delete neuf._metier;
  if (i >= 0) S.data.prospects[i] = neuf; else S.data.prospects.push(neuf);
  if (entree) S.data.journal.push(Object.assign({ date: maintenant(), id: p.id, entreprise: p.entreprise, statut: neuf.statut, par: S.moi.nom }, entree));
}

async function noterMessage(titre) {
  // Un résultat est déjà choisi (Rappel, RDV…) : le message l'enregistre avec, la fiche se range au bon endroit.
  const btn = document.querySelector('[data-action="enregistrer"]');
  if (CHOIX.res && btn) return enregistrer(btn, titre);
  try {
    const p = await appel('api_logger', S.pin, S.ouvert, 'message', titre, '', S.par, null);
    majLocale(p, { resultat: 'Message envoyé', note: titre, rappel: '' });
    toast('Message noté.'); rendreFiche(); rendre();
    return true;
  } catch (e) { toast(e.message || String(e), true); return false; }
}

async function sauverEdition(form) {
  const champs = Object.fromEntries(new FormData(form).entries());
  champs.rappel = champs.rappel ? champs.rappel.replace('T', ' ') : '';
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const p = await appel('api_modifier', S.pin, S.ouvert, champs);
    const agenda = p._agenda || '';
    majLocale(p); toast('Fiche mise à jour.' + (agenda ? ' ' + agenda + '.' : '')); rendreFiche(); rendre();
  } catch (e) { btn.disabled = false; toast(e.message || String(e), true); }
}

async function ajouter(form, forcer) {
  const champs = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const r = await appel('api_ajouter', S.pin, champs, S.par, !!forcer);
    if (r.doublons) {
      btn.disabled = false;
      document.getElementById('zone-doublons').innerHTML = `<div class="doublon"><b>Déjà dans le Sheets ?</b><br>
        ${r.doublons.map(d => `<a href="#" data-ouvrir="${esc(d.id)}">${esc(d.entreprise)}</a> · ${esc(d.telephone || 'sans tél.')} · ${esc(d.statut)}`).join('<br>')}
        <p style="margin:10px 0 0"><button class="btn clair large" data-action="forcer-ajout">Ce n’est pas le même, ajouter quand même</button></p></div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    majLocale(r.prospect, { resultat: 'Ajout', note: champs.notes || '', rappel: '' });
    toast(r.prospect.entreprise + ' ajouté.');
    S.vue = 'jour'; rendre(); ouvrirFiche(r.prospect.id);
  } catch (e) { btn.disabled = false; toast(e.message || String(e), true); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-stop]'); if (t) { e.stopPropagation(); return; }
  const onglet = e.target.closest('#onglets button');
  if (onglet) { S.vue = onglet.dataset.vue; S.recherche = ''; document.getElementById('recherche').value = ''; window.scrollTo(0, 0); rendre();
    if (S.vue === 'factu') Factu.recharger(); return; }
  const ouvrir = e.target.closest('[data-ouvrir]'); if (ouvrir) { e.preventDefault(); ouvrirFiche(ouvrir.dataset.ouvrir); return; }
  const ac = e.target.closest('[data-action="carte-noter"], [data-action="carte-wa"]');
  if (ac) {
    ouvrirFiche(ac.dataset.id);
    // Les boutons de résultat sont le premier bloc de la fiche : rien à faire défiler.
    if (ac.dataset.action === 'carte-wa') ouvrirMessages('whatsapp');
    return;
  }

  if (e.target.id === 'fiche') { fermerFiche(); return; }
  const r = e.target.closest('[data-res]');
  if (r) { CHOIX.res = r.dataset.res === 'rappel' ? 'pas_repondu' : r.dataset.res;
    // Un rappel part par défaut le lendemain à la même heure : un tap et c'est posé.
    CHOIX.rappel = r.dataset.res === 'rappel' ? demainMemeHeure() : '';
    document.querySelectorAll('[data-res]').forEach(b => b.classList.toggle('choisi', b === r));
    const z = document.getElementById('zone-res'); z.innerHTML = zoneResultat(); rendreMessageHaut(); z.classList.remove('cache'); z.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
  const mo = e.target.closest('[data-motif]');
  if (mo) { CHOIX.res = mo.dataset.motif;
    const note = (document.getElementById('note-res') || {}).value || '', pr = (document.getElementById('date-precise') || {}).value || '';
    if (pr) CHOIX.rappel = pr.replace('T', ' ');
    const z = document.getElementById('zone-res'); z.innerHTML = zoneResultat(); rendreMessageHaut();
    const n = document.getElementById('note-res'); if (n) n.value = note; return; }
  const du = e.target.closest('[data-duree]');
  if (du) { CHOIX.duree = Number(du.dataset.duree); document.querySelectorAll('[data-duree]').forEach(b => b.classList.toggle('choisi', b === du)); return; }
  const d = e.target.closest('[data-date]');
  if (d) { CHOIX.rappel = d.dataset.date; document.querySelectorAll('[data-date]').forEach(b => b.classList.toggle('choisi', b === d));
    const p = document.getElementById('date-precise'); if (p) p.value = d.dataset.date.replace(' ', 'T');
    if (document.getElementById('apres-nom')) majMessageApres(); return; }
  const es = e.target.closest('[data-espace]');
  if (es) { S.espace = es.dataset.espace; stocker('espace', S.espace); S.plusJour = 25; window.scrollTo(0, 0); rendre(); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  if (act === 'deconnexion') {
    if (confirm('Changer de personne ? Il faudra entrer ton code.')) { stocker('pin', ''); stocker('espace', ''); location.reload(); }
    return;
  }
  if (act === 'fermer') fermerFiche();
  else if (act === 'plus') { S.plusJour += 25; rendre(); }
  else if (act === 'jour') { S.jour = decalerJour(S.jour || aujourdhui(), Number(a.dataset.n)); rendre(); }
  else if (act === 'jour-auj') { S.jour = aujourdhui(); rendre(); }
  else if (act === 'enregistrer') enregistrer(a);
  else if (act === 'editer') rendreFiche(true);
  else if (act === 'devis') { const p = trouver(S.ouvert); fermerFiche(); Factu.nouveauDevis(p); }
  else if (act === 'annuler-edit') rendreFiche();
  else if (act === 'msg') { if (APRES.modele && document.getElementById('apres-nom')) envoyerDirect(a.dataset.canal); else ouvrirMessages(a.dataset.canal); }
  else if (act === 'envoyer') envoyer(a.dataset.canal);
  else if (act === 'fermer-msg') document.getElementById('bloc-msg').remove();
  else if (act === 'noter-msg') noterMessage(a.dataset.titre);
  else if (act === 'forcer-ajout') ajouter(document.getElementById('form-ajout'), true);
  else if (act === 'reel-form') { S.formReel = !S.formReel; rendre(); window.scrollTo(0, 0); }
  else if (act === 'reel-ouvrir') {

  }
  else if (act === 'reel-noter') noterPartage(a, a.dataset.cible, a.dataset.pres);
});

// Connexion
document.getElementById('btn-connexion').addEventListener('click', connexion);

async function connexion() {
  const pin = document.getElementById('pin').value.trim();
  if (!pin) return toast('Entre le code.', true);
  try { const moi = await appel('api_connexion', pin); S.pin = pin; stocker('pin', pin); stocker('espace', ''); demarrer(); toast('Bonjour ' + moi.nom + '.'); }
  catch (e) { toast(e.message || String(e), true); }
}

let chargementEnCours = null;
function charger() {
  // Un seul rechargement à la fois ; celui qui revient après une écriture est périmé.
  if (chargementEnCours) return chargementEnCours;
  const avant = S.ecritures;
  chargementEnCours = appel('api_charger', S.pin).then(d => {
    if (S.data && S.ecritures !== avant) return;
    S.data = d; appliquerDonnees();
  }).finally(() => { chargementEnCours = null; });
  return chargementEnCours;
}
function appliquerDonnees() {
  S.data.prospects.forEach(p => delete p._ligne);
  ['reels', 'audience', 'partages'].forEach(k => { S.data[k] = S.data[k] || []; });
  S.data.partage = S.data.partage || { lotParJour: 25, joursEntreDeux: 14 };
  S.moi = S.data.moi; S.par = S.moi.nom;
  // On arrive toujours sur son propre espace, sauf si on en a choisi un autre.
  if (![...S.data.equipe, EQUIPE_VUE].includes(S.espace)) S.espace = S.moi.nom;
  rendre();
  Factu.init();
}

async function demarrer() {
  document.getElementById('ecran-connexion').classList.add('cache');
  document.getElementById('app').classList.remove('cache');
  try { await charger(); }
  catch (e) {
    if (/Code/.test(e.message || '')) { stocker('pin', ''); location.reload(); return; }
    document.getElementById('vue').innerHTML = `<div class="vide">Impossible de lire le Sheets : ${esc(e.message || e)}</div>`;
  }
}

// Recharge les données quand Sam revient sur l'appli (après un appel par exemple).
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.pin && S.data && !S.ouvert) charger().catch(() => {}); });
setInterval(() => { if (S.data && !S.ouvert && !document.hidden && S.vue !== 'ajouter') rendre(); }, 60000);

// Ouverte depuis script.google.com (et non la version installable) : on guide vers la bonne adresse.
if (!window.CRM_API) document.getElementById('bandeau-installer').classList.remove('cache');

S.pin = lire('pin');
S.espace = lire('espace');
if (S.pin) demarrer();
else document.getElementById('ecran-connexion').classList.remove('cache');
</script>
