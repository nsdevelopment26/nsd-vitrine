<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milea et MAWI · Maquette des deux boutiques</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="img/milea-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<style>
  :root{--encre:#1d1a17;--clair:#f5ece2}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--encre);color:var(--clair);font-family:"Jost","Helvetica Neue",Arial,sans-serif}
  main{display:flex;min-height:100%}
  .porte{position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:48px max(28px,env(safe-area-inset-left,0px)) 96px;color:#fff;text-decoration:none;overflow:hidden;transition:flex .8s cubic-bezier(.22,.7,.2,1);min-height:50vh}
  .porte:hover,.porte:focus-visible{flex:1.35}
  .porte img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.22,.7,.2,1);z-index:-2}
  .porte:hover img{transform:scale(1.05)}
  .porte::before{content:"";position:absolute;inset:0;z-index:-1}
  .milea::before{background:linear-gradient(180deg,rgba(74,18,28,.05) 30%,rgba(60,14,22,.86))}
  .mawi{background:radial-gradient(120% 90% at 70% 20%,#5b6239,#3a3f23 55%,#2a2e18)}
  .mawi::before{background:linear-gradient(180deg,transparent 40%,rgba(36,40,22,.6))}
  .feuillage{position:absolute;inset:-12%;z-index:-1;pointer-events:none;opacity:.5;filter:blur(9px);mix-blend-mode:multiply;animation:brise 9s ease-in-out infinite alternate;transform-origin:20% 0}
  .feuillage svg{width:100%;height:100%}
  @keyframes brise{0%{transform:rotate(-1.6deg)}50%{transform:rotate(.6deg) translate(1.2%,.6%)}100%{transform:rotate(1.8deg) translate(-.8%,1%)}}
  .logo{display:block;height:64px;width:min(260px,70%);background:#fff;-webkit-mask:var(--src) left center/contain no-repeat;mask:var(--src) left center/contain no-repeat}
  .milea .logo{--src:url(img/milea-logo.svg);background:#f5e7dc}
  .mawi .logo{--src:url(img/mawi-logo.svg);background:#f2d9cf}
  .porte p{margin:0;max-width:26em;font-size:17px;line-height:1.55;color:#f3e9e2}
  .porte span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid currentColor;align-self:flex-start;padding-bottom:3px}
  .porte:focus-visible{outline:2px solid #fff;outline-offset:-6px}
  .note{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--encre);color:var(--clair);font-size:13px;padding:10px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  @media (max-width:760px){main{flex-direction:column}.porte{min-height:52vh;padding-bottom:40px}.note{white-space:normal;text-align:center;width:calc(100% - 32px)}}
  @media (prefers-reduced-motion:reduce){.porte,.porte img{transition:none}.feuillage{animation:none}}
</style>
</head>
<body>
<main>
  <a class="porte milea" href="milea.html">
    <img src="img/milea-porte.webp" alt="" width="1122" height="1255">
    <span class="logo" role="img" aria-label="milea intimates"></span>
    <p>Lingerie pour les femmes réelles. Bordeaux intense, champagne, la pierre au soleil.</p>
    <span>Voir la boutique</span>
  </a>
  <a class="porte mawi" href="mawi.html">
    <div class="feuillage" aria-hidden="true"></div>
    <span class="logo" role="img" aria-label="MAWI jewelry"></span>
    <p>Bijoux en séries limitées. Vert militaire, rose poudré, six collections.</p>
    <span>Voir la boutique</span>
  </a>
</main>
<p class="note">Maquette NS Development · un seul thème Shopify, deux boutiques</p>
<script src="theme.js" defer></script>
</body>
</html>
